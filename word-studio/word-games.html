<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Word Studio | Kids Academy</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔤</text></svg>" />
  <style>
    /* Colors and font follow the Kids Academy hub (index.html on the live site). */
    :root {
      --bg-app: #fff8ec;
      --bg-card: #ffffff;
      --bg-subtle: #fdf1dc;
      --text-main: #2d2a3e;
      --text-muted: #6b6680;
      --primary: #4f46e5;
      --primary-dark: #3730a3;
      --primary-light: #e0e7ff;
      --accent-amber: #f59e0b;
      --accent-amber-dark: #b45309;
      --accent-amber-bg: #fef3c7;
      --accent-emerald: #10b981;
      --accent-emerald-dark: #047857;
      --accent-emerald-bg: #d1fae5;
      --accent-rose: #f43f5e;
      --border-soft: #eadfcb;
      --slot-border: #d6c9b3;
      --tile-border: #d6c9b3;
      --tile-edge: #b8a98f;
      --found-bg: #dcfce7;
      --found-text: #166534;
      --found-border: #86efac;
      --radius-lg: 22px;
      --radius-md: 14px;
      --shadow-card: 0 6px 18px rgba(45, 42, 62, 0.10);
      --font-sans: "Comic Sans MS", "Trebuchet MS", "Segoe UI", system-ui, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg-app: #1c1b29;
        --bg-card: #2a2840;
        --bg-subtle: #343150;
        --text-main: #f3f1ff;
        --text-muted: #b4afc9;
        --primary: #8b85ff;
        --primary-dark: #c7c3ff;
        --primary-light: #3b3870;
        --accent-amber-dark: #fbbf24;
        --accent-amber-bg: #4a3b1a;
        --accent-emerald-dark: #6ee7b7;
        --accent-emerald-bg: #134e3a;
        --border-soft: #403c5c;
        --slot-border: #5a5578;
        --tile-border: #5a5578;
        --tile-edge: #6f6a90;
        --found-bg: #134e3a;
        --found-text: #bbf7d0;
        --found-border: #15803d;
        --shadow-card: 0 6px 18px rgba(0, 0, 0, 0.35);
      }
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: var(--font-sans);
      background-color: var(--bg-app);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      transition: background-color 0.25s ease;
    }

    .topbar {
      background: var(--bg-card);
      border-bottom: 2px solid var(--border-soft);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      flex-wrap: wrap;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .app-title {
      font-size: 1.25rem;
      font-weight: 800;
      color: var(--primary);
    }

    .mode-tabs {
      display: flex;
      background: var(--bg-subtle);
      padding: 5px;
      border-radius: 14px;
      gap: 5px;
      flex-wrap: wrap;
    }

    .mode-tab {
      border: none;
      background: transparent;
      color: var(--text-muted);
      font-weight: 700;
      font-size: 0.9rem;
      padding: 8px 14px;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .mode-tab.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: 0 2px 6px rgba(15, 23, 42, 0.08);
    }

    .stats-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat-pill {
      background: var(--bg-subtle);
      padding: 7px 13px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.88rem;
      display: flex;
      align-items: center;
      gap: 5px;
      border: 1px solid var(--border-soft);
    }

    .select-pill {
      padding: 7px 10px;
      border-radius: 10px;
      border: 2px solid var(--border-soft);
      font-weight: 700;
      font-size: 0.88rem;
      background: var(--bg-card);
      color: var(--text-main);
      cursor: pointer;
    }

    .workspace {
      max-width: 980px;
      width: 100%;
      margin: 22px auto;
      padding: 0 20px 70px; /* room for the fixed Home button */
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    .game-card {
      background: var(--bg-card);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-card);
      border: 2px solid var(--border-soft);
      padding: 26px;
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .clue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .badge-group {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-wrap: wrap;
    }

    .badge {
      font-size: 0.78rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 6px 12px;
      border-radius: 8px;
      background: var(--primary-light);
      color: var(--primary-dark);
    }

    .clue-box {
      background: var(--bg-subtle);
      border-left: 5px solid var(--primary);
      padding: 16px 20px;
      border-radius: 12px;
    }

    .clue-text {
      font-size: 1.18rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .phonics-tip {
      margin-top: 6px;
      font-size: 0.95rem;
      color: var(--accent-amber-dark);
      font-weight: 600;
      display: none;
    }

    .phonics-tip.visible {
      display: block;
    }

    .board-section {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 22px;
      padding: 10px 0;
    }

    .slot-row, .rack-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      min-height: 68px;
    }

    .slot {
      min-width: 60px;
      height: 68px;
      padding: 0 14px;
      border-radius: var(--radius-md);
      border: 3px dashed var(--slot-border);
      background: var(--bg-app);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .slot.filled {
      border-style: solid;
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary-dark);
      border-bottom-width: 5px;
      transform: translateY(-2px);
    }

    .slot.locked {
      border-style: solid;
      border-color: var(--accent-emerald);
      background: var(--accent-emerald-bg);
      color: var(--accent-emerald-dark);
      cursor: default;
    }

    .slot.affix-slot {
      min-width: 130px;
      font-size: 1.35rem;
      position: relative;
    }

    .slot-label {
      position: absolute;
      top: -22px;
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      font-weight: 800;
    }

    .tile {
      min-width: 60px;
      height: 68px;
      padding: 0 16px;
      border-radius: var(--radius-md);
      background: var(--bg-card);
      border: 2px solid var(--tile-border);
      border-bottom: 6px solid var(--tile-edge);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.7rem;
      font-weight: 800;
      color: var(--text-main);
      cursor: pointer;
      transition: transform 0.1s, background-color 0.2s, border-color 0.2s;
    }

    .tile.affix-tile {
      font-size: 1.3rem;
      padding: 0 20px;
    }

    .tile:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }

    .tile:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .tile.used {
      opacity: 0.22;
      pointer-events: none;
      transform: scale(0.92);
    }

    .tile.vowel-glow {
      background: var(--accent-amber-bg);
      border-color: var(--accent-amber);
      border-bottom-color: var(--accent-amber-dark);
      color: var(--accent-amber-dark);
    }

    .controls-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      padding-top: 8px;
      border-top: 2px solid var(--bg-subtle);
    }

    .btn {
      border: 2px solid var(--border-soft);
      border-bottom-width: 5px;
      background: var(--bg-card);
      color: var(--text-main);
      font-weight: 800;
      font-size: 0.96rem;
      padding: 11px 18px;
      border-radius: 14px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      transition: all 0.1s;
    }

    .btn:active {
      transform: translateY(3px);
      border-bottom-width: 2px;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary-dark);
    }

    .btn-amber {
      background: var(--accent-amber-bg);
      color: var(--accent-amber-dark);
      border-color: var(--accent-amber);
    }

    .btn-emerald {
      background: var(--accent-emerald);
      color: #ffffff;
      border-color: var(--accent-emerald-dark);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
      transform: none;
      border-bottom-width: 5px;
    }

    .btn[hidden] {
      display: none;
    }

    .anagram-panel {
      display: none;
      flex-direction: column;
      gap: 14px;
      background: var(--bg-subtle);
      padding: 18px;
      border-radius: var(--radius-md);
    }

    .anagram-panel.active {
      display: flex;
    }

    .anagram-groups {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .anagram-col {
      background: var(--bg-card);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--border-soft);
    }

    .anagram-col h4 {
      font-size: 0.82rem;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 8px;
    }

    .word-chips {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
    }

    .word-chip {
      padding: 5px 10px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.86rem;
      letter-spacing: 0.06em;
      background: var(--bg-subtle);
      color: var(--text-muted);
      border: 1px dashed var(--slot-border);
      min-width: 52px;
      text-align: center;
    }

    .word-chip.found {
      background: var(--found-bg);
      color: var(--found-text);
      border: 1px solid var(--found-border);
    }

    .feedback-banner {
      text-align: center;
      font-weight: 800;
      font-size: 1.12rem;
      min-height: 28px;
      color: var(--primary);
    }

    .feedback-banner.success { color: var(--accent-emerald-dark); }
    .feedback-banner.error { color: var(--accent-rose); }

    .kbd-hint {
      text-align: center;
      font-size: 0.84rem;
      color: var(--text-muted);
      font-weight: 600;
    }
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand-group">
      <div class="app-title">🔤 Word Studio</div>
    </div>

    <nav class="mode-tabs" aria-label="Game Modes">
      <button class="mode-tab active" data-mode="scramble">1. Word Scramble</button>
      <button class="mode-tab" data-mode="anagram">2. Anagram Builder</button>
      <button class="mode-tab" data-mode="pattern">3. Missing Tiles</button>
      <button class="mode-tab" data-mode="affix">4. Prefix &amp; Suffix Snap</button>
    </nav>

    <div class="stats-bar">
      <select id="levelFilter" class="select-pill" aria-label="Difficulty Filter">
        <option value="all">All Levels</option>
        <option value="1">Level 1 (Easy)</option>
        <option value="2">Level 2 (Medium)</option>
        <option value="3">Level 3 (Challenge)</option>
      </select>
      <div class="stat-pill">🔥 <span id="streakVal">0</span></div>
      <div class="stat-pill">⭐ <span id="scoreVal">0</span></div>
    </div>
  </header>

  <main class="workspace">
    <section class="game-card">
      <div class="clue-header">
        <div class="badge-group">
          <span class="badge" id="categoryBadge">Category: Loading...</span>
          <span class="badge" id="wordCountBadge">Deck: 0 Words</span>
        </div>
        <button class="btn" id="speakBtn">🔊 Listen</button>
      </div>

      <div class="clue-box">
        <div class="clue-text" id="clueText">Loading puzzle...</div>
        <div class="phonics-tip" id="phonicsTip"></div>
      </div>

      <div class="feedback-banner" id="feedbackBanner">Tap tiles or type on your keyboard!</div>

      <div class="board-section">
        <div class="slot-row" id="slotRow"></div>
        <div class="rack-row" id="rackRow"></div>
      </div>

      <div class="anagram-panel" id="anagramPanel">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <strong>Discovered Words (<span id="anaFoundCount">0</span> / <span id="anaTotalCount">0</span>) · Bonus words: <span id="anaBonusCount">0</span></strong>
          <button class="btn" id="revealAnagramBtn" style="padding:6px 12px; font-size:0.84rem;">Reveal All</button>
        </div>
        <div class="anagram-groups" id="anagramGroups"></div>
      </div>

      <div class="controls-row">
        <button class="btn" id="shuffleBtn">🔀 Shuffle</button>
        <button class="btn btn-amber" id="vowelBtn">💡 Spot Vowels</button>
        <button class="btn btn-amber" id="hintBtn">🧩 Hint</button>
        <button class="btn" id="revealBtn" hidden>🙈 Show me</button>
        <button class="btn" id="clearBtn">↺ Clear</button>
        <button class="btn btn-primary" id="submitBtn">✔ Check Word</button>
        <button class="btn btn-emerald" id="nextBtn">Next Puzzle ➔</button>
      </div>

      <div class="kbd-hint">
        Keyboard Shortcuts: Type <strong>A-Z</strong> (or <strong>1-6</strong> in Prefix/Suffix mode) • <strong>Backspace</strong> to undo • <strong>Space</strong> to shuffle • <strong>Enter</strong> to submit
      </div>
    </section>
  </main>

  <script src="./data/word-banks-bundle.js"></script>
  <script>
    const FALLBACK_SCRAMBLE = [
      { id: "s1", word: "PLANET", category: "Space", level: 2, clue: "Earth is one of us. Mars and Jupiter are too. We all go round and round the Sun.", nudge: "There are eight of us in our solar system.", phonicsHint: "Starts with the blend PL and ends with ET." },
      { id: "s2", word: "DOLPHIN", category: "Animals", level: 3, clue: "I live in the sea but I am not a fish. I breathe air, click to my friends and love to jump.", nudge: "I am a smart sea animal with a big friendly smile.", phonicsHint: "Digraph PH makes the 'F' sound." },
      { id: "s3", word: "BRIDGE", category: "Engineering", level: 2, clue: "A river is in your way and you have no boat. Walk over me and keep your feet dry.", nudge: "Cars and trains can cross a river on me too.", phonicsHint: "Starts with BR and ends with DGE." }
    ];

    const FALLBACK_ANAGRAMS = [
      {
        id: "a1",
        rootWord: "PLANETS",
        category: "Space & Nature",
        clue: "Find 44 hidden words! The longest one uses every tile. Earth, Mars and Saturn are all one of us. We go around the Sun.",
        nudge: "There are eight of us in our solar system.",
        targets: {
          "3": ["ANT", "EAT", "LAP", "NET", "PAN", "PEA", "PEN", "PET", "SAT", "SEA", "SET", "TAP", "TEA", "TEN"],
          "4": ["EAST", "LATE", "LEAN", "LEAP", "NEAT", "NEST", "PALE", "PAST", "PLAN", "SALT", "SEAL", "SEAT", "SENT", "STEP", "TALE", "TAPE"],
          "5": ["LEAST", "PANEL", "PANTS", "PASTE", "PETAL", "PLANE", "PLANT", "PLATE", "SLATE", "STEAL"],
          "6": ["PLANET", "PLATES", "PETALS"],
          "7": ["PLANETS"]
        }
      }
    ];

    const FALLBACK_AFFIX = [
      {
        id: "af1",
        word: "REBUILD",
        parts: ["RE", "BUILD"],
        labels: ["Prefix", "Root Word"],
        decoyParts: ["UN", "PRE", "ING", "FUL"],
        category: "Prefix Builder",
        level: 1,
        clue: "Meaning: To build something again.",
        phonicsHint: "Prefix RE- means 'again'."
      },
      {
        id: "af2",
        word: "HOPEFUL",
        parts: ["HOPE", "FUL"],
        labels: ["Root Word", "Suffix"],
        decoyParts: ["LESS", "UN", "RE", "ING"],
        category: "Suffix Builder",
        level: 1,
        clue: "Meaning: Full of hope.",
        phonicsHint: "Suffix -FUL means 'full of'."
      }
    ];

    const JSON_PATHS = {
      scramble: './data/scramble-words.json',
      anagram: './data/anagram-racks.json',
      pattern: './data/pattern-words.json',
      affix: './data/affix-words.json',
      bonus: './data/bonus-words.json'
    };

    const state = {
      mode: 'scramble',
      level: 'all',
      datasets: { scramble: [], anagram: [], pattern: [], affix: [] },
      currentPuzzle: null,
      rack: [],
      slots: [],
      vowelsHighlighted: false,
      anagramFound: new Set(),
      bonusFound: new Set(),
      // Real words a kid may find in a rack that are not one of its target chips
      bonusWords: new Set(),
      solved: false,
      // Word Scramble hint ladder: 0 = riddle only, 1 = easier clue, 2 = first letter, 3 = last letter
      hintLevel: 0,
      wrongTries: 0,
      score: parseInt(localStorage.getItem('ka_word_score') || '0', 10),
      streak: parseInt(localStorage.getItem('ka_word_streak') || '0', 10)
    };

    const SCRAMBLE_MAX_HINTS = 3;
    const SCRAMBLE_POINTS = [15, 12, 9, 6]; // stars for a solve after 0, 1, 2 or 3 hints

    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, type = 'sine', duration = 0.12) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = type;
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + duration);
    }

    function playSuccessChime() {
      [523.25, 659.25, 783.99, 1046.5].forEach((f, idx) => {
        setTimeout(() => playTone(f, 'triangle', 0.18), idx * 75);
      });
    }

    // Track seen IDs in session so puzzles never repeat back-to-back
    const seenIds = { scramble: new Set(), anagram: new Set(), pattern: new Set(), affix: new Set() };

    async function loadWordBanks() {
      // 1. If opened directly via double-click (file://), window.KA_WORD_BANKS is already loaded from ./data/word-banks-bundle.js!
      if (window.KA_WORD_BANKS && window.KA_WORD_BANKS.scramble && window.KA_WORD_BANKS.scramble.length > 100) {
        state.datasets.scramble = window.KA_WORD_BANKS.scramble;
        state.datasets.anagram = window.KA_WORD_BANKS.anagram;
        state.datasets.pattern = window.KA_WORD_BANKS.pattern;
        state.datasets.affix = window.KA_WORD_BANKS.affix;
        state.bonusWords = new Set(window.KA_WORD_BANKS.bonus || []);
        updateScoreUI();
        loadNextPuzzle();
        return;
      }

      // 2. Otherwise fetch ./data/*.json over HTTP/HTTPS (GitHub Pages / Local Server)
      try {
        const [scrRes, anaRes, patRes, affRes] = await Promise.allSettled([
          fetch(JSON_PATHS.scramble),
          fetch(JSON_PATHS.anagram),
          fetch(JSON_PATHS.pattern),
          fetch(JSON_PATHS.affix)
        ]);
        try {
          const bonusRes = await fetch(JSON_PATHS.bonus);
          if (bonusRes.ok) state.bonusWords = new Set(await bonusRes.json());
        } catch (e) {
          // Bonus words are optional; target chips still work without them
        }

        state.datasets.scramble = (scrRes.status === 'fulfilled' && scrRes.value.ok) ? await scrRes.value.json() : FALLBACK_SCRAMBLE;
        state.datasets.anagram = (anaRes.status === 'fulfilled' && anaRes.value.ok) ? await anaRes.value.json() : FALLBACK_ANAGRAMS;
        state.datasets.pattern = (patRes.status === 'fulfilled' && patRes.value.ok) ? await patRes.value.json() : FALLBACK_SCRAMBLE;
        state.datasets.affix = (affRes.status === 'fulfilled' && affRes.value.ok) ? await affRes.value.json() : FALLBACK_AFFIX;
      } catch (e) {
        state.datasets.scramble = FALLBACK_SCRAMBLE;
        state.datasets.anagram = FALLBACK_ANAGRAMS;
        state.datasets.pattern = FALLBACK_SCRAMBLE;
        state.datasets.affix = FALLBACK_AFFIX;
      }
      updateScoreUI();
      loadNextPuzzle();
    }

    function shuffleArray(arr) {
      const copy = [...arr];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      return copy;
    }

    function getFilteredDeck() {
      const rawDeck = state.datasets[state.mode] || state.datasets.scramble;
      if (state.level === 'all' || state.mode === 'anagram') return rawDeck;
      const lvl = parseInt(state.level, 10);
      const filtered = rawDeck.filter(item => item.level === lvl);
      return filtered.length ? filtered : rawDeck;
    }

    function loadNextPuzzle() {
      const deck = getFilteredDeck();
      document.getElementById('wordCountBadge').textContent = `Deck: ${deck.length} Puzzles`;
      const modeSeen = seenIds[state.mode] || new Set();
      let unseen = deck.filter(x => !modeSeen.has(x.id));
      if (unseen.length === 0) {
        modeSeen.clear();
        unseen = deck;
      }
      const item = unseen[Math.floor(Math.random() * unseen.length)];
      modeSeen.add(item.id);
      state.currentPuzzle = item;
      state.vowelsHighlighted = false;
      state.solved = false;
      state.hintLevel = 0;
      state.wrongTries = 0;
      document.getElementById('phonicsTip').classList.remove('visible');
      setFeedback('Tap tiles or type on your keyboard!', '');

      if (state.mode === 'scramble') setupScrambleMode(item);
      else if (state.mode === 'anagram') setupAnagramMode(item);
      else if (state.mode === 'pattern') setupPatternMode(item);
      else if (state.mode === 'affix') setupAffixMode(item);

      updateHintButtons();
      renderBoard();
    }

    function setupScrambleMode(item) {
      document.getElementById('anagramPanel').classList.remove('active');
      document.getElementById('categoryBadge').textContent = `Category: ${item.category}`;
      document.getElementById('clueText').textContent = item.clue;
      document.getElementById('phonicsTip').textContent = '';

      const chars = item.word.toUpperCase().split('');
      let scrambled = shuffleArray(chars);
      if (scrambled.join('') === item.word && chars.length > 1) scrambled = shuffleArray(chars);

      state.rack = scrambled.map((char, idx) => ({ char, id: idx, used: false }));
      state.slots = chars.map(() => ({ char: '', rackId: null, locked: false, label: '' }));
    }

    function setupPatternMode(item) {
      document.getElementById('anagramPanel').classList.remove('active');
      document.getElementById('categoryBadge').textContent = `Missing Tiles: ${item.category}`;
      document.getElementById('clueText').textContent = item.clue;
      document.getElementById('phonicsTip').textContent = `💡 Hint: ${item.nudge || item.phonicsHint}`;

      const chars = item.word.toUpperCase().split('');
      const missingChars = [];
      state.slots = chars.map((ch, idx) => {
        const keepLocked = (idx === 0 || (idx === chars.length - 1 && chars.length > 4));
        if (keepLocked) return { char: ch, rackId: -1, locked: true, label: '' };
        missingChars.push(ch);
        return { char: '', rackId: null, locked: false, label: '' };
      });

      const alphabet = 'AEIOURSTLN';
      missingChars.push(alphabet[Math.floor(Math.random() * alphabet.length)]);
      missingChars.push(alphabet[Math.floor(Math.random() * alphabet.length)]);

      state.rack = shuffleArray(missingChars).map((char, idx) => ({ char, id: idx, used: false }));
    }

    function setupAnagramMode(item) {
      document.getElementById('anagramPanel').classList.add('active');
      document.getElementById('categoryBadge').textContent = `Anagram Studio: ${item.category}`;
      document.getElementById('clueText').textContent = item.clue;
      document.getElementById('phonicsTip').textContent = `💡 The longest word: ${item.nudge || 'Try using every letter!'}`;
      state.bonusFound = new Set();

      const chars = shuffleArray(item.rootWord.toUpperCase().split(''));
      state.rack = chars.map((char, idx) => ({ char, id: idx, used: false }));
      state.slots = chars.map(() => ({ char: '', rackId: null, locked: false, label: '' }));
      state.anagramFound = new Set();
      renderAnagramMatrix();
    }

    function setupAffixMode(item) {
      document.getElementById('anagramPanel').classList.remove('active');
      document.getElementById('categoryBadge').textContent = `Morphology Snap: ${item.category}`;
      document.getElementById('clueText').textContent = item.clue;
      document.getElementById('phonicsTip').textContent = `💡 Word Rule: ${item.phonicsHint}`;

      const pool = shuffleArray([...item.parts, ...(item.decoyParts || ['UN', 'RE', 'ING'])]);
      state.rack = pool.map((chunk, idx) => ({ char: chunk, id: idx, used: false }));
      state.slots = item.parts.map((_, idx) => ({
        char: '',
        rackId: null,
        locked: false,
        label: (item.labels && item.labels[idx]) ? item.labels[idx] : `Part ${idx + 1}`
      }));
    }

    function renderAnagramMatrix() {
      const container = document.getElementById('anagramGroups');
      container.innerHTML = '';
      const targets = state.currentPuzzle.targets || {};
      let total = 0;

      Object.keys(targets).sort().forEach(len => {
        const col = document.createElement('div');
        col.className = 'anagram-col';
        col.innerHTML = `<h4>${len}-Letter Words</h4>`;
        const chipWrap = document.createElement('div');
        chipWrap.className = 'word-chips';

        targets[len].forEach(w => {
          total++;
          const chip = document.createElement('span');
          const isFound = state.anagramFound.has(w);
          chip.className = `word-chip ${isFound ? 'found' : ''}`;
          chip.textContent = isFound ? w : '•'.repeat(w.length);
          chipWrap.appendChild(chip);
        });

        col.appendChild(chipWrap);
        container.appendChild(col);
      });

      document.getElementById('anaFoundCount').textContent = state.anagramFound.size;
      document.getElementById('anaTotalCount').textContent = total;
      document.getElementById('anaBonusCount').textContent = state.bonusFound.size;
    }

    function renderBoard() {
      const slotRow = document.getElementById('slotRow');
      const rackRow = document.getElementById('rackRow');
      slotRow.innerHTML = '';
      rackRow.innerHTML = '';

      const isAffix = state.mode === 'affix';

      state.slots.forEach((slot, sIdx) => {
        const el = document.createElement('div');
        el.className = `slot ${isAffix ? 'affix-slot' : ''} ${slot.char ? 'filled' : ''} ${slot.locked ? 'locked' : ''}`;
        el.textContent = slot.char;

        if (slot.label) {
          const lbl = document.createElement('span');
          lbl.className = 'slot-label';
          lbl.textContent = slot.label;
          el.appendChild(lbl);
        }

        if (!slot.locked && slot.char) {
          el.addEventListener('click', () => removeLetterFromSlot(sIdx));
        }
        slotRow.appendChild(el);
      });

      state.rack.forEach((tile, idx) => {
        const el = document.createElement('div');
        const isVowel = tile.char.length === 1 && 'AEIOU'.includes(tile.char);
        el.className = `tile ${isAffix ? 'affix-tile' : ''} ${tile.used ? 'used' : ''} ${state.vowelsHighlighted && isVowel ? 'vowel-glow' : ''}`;
        el.textContent = isAffix ? `${idx + 1}. ${tile.char}` : tile.char;
        el.addEventListener('click', () => placeTileInNextSlot(tile.id));
        rackRow.appendChild(el);
      });
    }

    function placeTileInNextSlot(rackId) {
      if (state.solved) return;
      const tile = state.rack.find(t => t.id === rackId && !t.used);
      if (!tile) return;
      const emptySlot = state.slots.find(s => !s.locked && s.char === '');
      if (!emptySlot) return;

      tile.used = true;
      emptySlot.char = tile.char;
      emptySlot.rackId = tile.id;
      playTone(440, 'sine', 0.07);
      renderBoard();

      if (state.mode !== 'anagram' && state.slots.every(s => s.char !== '')) {
        checkSubmission();
      }
    }

    function removeLetterFromSlot(slotIndex) {
      const slot = state.slots[slotIndex];
      if (state.solved || !slot || slot.locked || !slot.char) return;
      const tile = state.rack.find(t => t.id === slot.rackId);
      if (tile) tile.used = false;
      slot.char = '';
      slot.rackId = null;
      playTone(320, 'sine', 0.07);
      renderBoard();
    }

    function clearUnlockedSlots() {
      if (state.solved) return;
      state.slots.forEach(s => {
        if (!s.locked) {
          s.char = '';
          s.rackId = null;
        }
      });
      // Tiles sitting in a locked hint slot stay used
      state.rack.forEach(t => { t.used = state.slots.some(s => s.locked && s.rackId === t.id); });
      renderBoard();
    }

    // Puts the correct letter into slot idx and locks it, freeing a wrongly placed tile if needed.
    function lockCorrectLetter(idx) {
      const slot = state.slots[idx];
      if (!slot || slot.locked) return;
      const needed = state.currentPuzzle.word.toUpperCase()[idx];
      if (slot.char) {
        const placed = state.rack.find(t => t.id === slot.rackId);
        if (placed) placed.used = false;
        slot.char = '';
        slot.rackId = null;
      }
      let tile = state.rack.find(t => !t.used && t.char === needed);
      if (!tile) {
        const holder = state.slots.find(s => !s.locked && s.char === needed);
        if (holder) {
          tile = state.rack.find(t => t.id === holder.rackId);
          holder.char = '';
          holder.rackId = null;
        }
      }
      if (!tile) return;
      tile.used = true;
      slot.char = needed;
      slot.rackId = tile.id;
      slot.locked = true;
    }

    function updateHintButtons() {
      const hintBtn = document.getElementById('hintBtn');
      const revealBtn = document.getElementById('revealBtn');
      if (state.mode !== 'scramble') {
        hintBtn.disabled = false;
        hintBtn.textContent = '🧩 Hint';
        revealBtn.hidden = true;
        return;
      }
      const left = SCRAMBLE_MAX_HINTS - state.hintLevel;
      hintBtn.disabled = state.solved || left === 0;
      hintBtn.textContent = `🧩 Hint (${left} left)`;
      revealBtn.hidden = state.solved || (state.hintLevel === 0 && state.wrongTries === 0);
    }

    function useScrambleHint() {
      if (state.solved || state.hintLevel >= SCRAMBLE_MAX_HINTS) return;
      state.hintLevel++;
      const tip = document.getElementById('phonicsTip');
      const word = state.currentPuzzle.word.toUpperCase();
      if (state.hintLevel === 1) {
        tip.textContent = `💡 ${state.currentPuzzle.nudge || 'Say the riddle out loud and picture it.'}`;
        tip.classList.add('visible');
      } else if (state.hintLevel === 2) {
        lockCorrectLetter(0);
        setFeedback(`The first letter is ${word[0]}. It is locked in for you.`, '');
      } else {
        lockCorrectLetter(word.length - 1);
        setFeedback(`The last letter is ${word[word.length - 1]}. Can you do the middle?`, '');
      }
      playTone(520, 'triangle', 0.1);
      updateHintButtons();
      renderBoard();
      if (state.slots.every(s => s.char !== '')) checkSubmission();
    }

    function revealScrambleAnswer() {
      if (state.solved) return;
      const word = state.currentPuzzle.word.toUpperCase();
      word.split('').forEach((_, i) => lockCorrectLetter(i));
      state.solved = true;
      updateHintButtons();
      renderBoard();
      setFeedback(`The word was ${word}. Read the riddle again and see how it fits!`, '');
      speakText(`${state.currentPuzzle.clue} The answer is ${word}.`);
    }

    function checkSubmission() {
      if (state.solved) return;
      if (state.mode === 'affix') {
        const chosenParts = state.slots.map(s => s.char);
        const expectedParts = state.currentPuzzle.parts;
        const isMatch = chosenParts.length === expectedParts.length && chosenParts.every((p, i) => p === expectedParts[i]);
        if (isMatch) {
          state.solved = true;
          addPoints(20);
          state.streak++;
          updateScoreUI();
          playSuccessChime();
          speakText(state.currentPuzzle.word);
          setFeedback(`🎉 Snap Success! ${expectedParts.join(' + ')} ➔ ${state.currentPuzzle.word}!`, 'success');
        } else {
          state.streak = 0;
          updateScoreUI();
          playTone(190, 'sawtooth', 0.22);
          setFeedback(`Not quite! Check the Prefix and Suffix order.`, 'error');
        }
        return;
      }

      const attempt = state.slots.map(s => s.char).join('');
      if (!attempt) return;

      if (state.mode === 'anagram') {
        const allValid = Object.values(state.currentPuzzle.targets).flat();
        if (state.anagramFound.has(attempt) || state.bonusFound.has(attempt)) {
          setFeedback(`You already found "${attempt}"!`, 'error');
        } else if (attempt.length >= 3 && !allValid.includes(attempt) && state.bonusWords.has(attempt)) {
          state.bonusFound.add(attempt);
          addPoints(attempt.length * 2);
          playSuccessChime();
          setFeedback(`Bonus word! "${attempt}" is a real word too! (+${attempt.length * 2} ⭐)`, 'success');
          renderAnagramMatrix();
        } else if (allValid.includes(attempt)) {
          state.anagramFound.add(attempt);
          addPoints(attempt.length * 5);
          playSuccessChime();
          setFeedback(`Awesome! "${attempt}" is a valid word! (+${attempt.length * 5} ⭐)`, 'success');
          renderAnagramMatrix();
        } else {
          playTone(200, 'sawtooth', 0.18);
          setFeedback(`Hmm, "${attempt}" is not a word we know. Try another!`, 'error');
        }
        clearUnlockedSlots();
        return;
      }

      const target = state.currentPuzzle.word.toUpperCase();
      if (attempt === target) {
        const points = state.mode === 'scramble' ? SCRAMBLE_POINTS[state.hintLevel] : 15;
        state.solved = true;
        addPoints(points);
        state.streak++;
        updateScoreUI();
        playSuccessChime();
        speakText(target);
        setFeedback(`🎉 Correct! You unscrambled ${target}! (+${points} ⭐)`, 'success');
      } else {
        state.streak = 0;
        state.wrongTries++;
        updateScoreUI();
        playTone(190, 'sawtooth', 0.22);
        setFeedback(`Not quite "${attempt}". Try swapping a few letters!`, 'error');
      }
      updateHintButtons();
    }

    function addPoints(pts) {
      state.score += pts;
      updateScoreUI();
    }

    function updateScoreUI() {
      localStorage.setItem('ka_word_score', state.score);
      localStorage.setItem('ka_word_streak', state.streak);
      document.getElementById('scoreVal').textContent = state.score;
      document.getElementById('streakVal').textContent = state.streak;
    }

    function setFeedback(msg, type) {
      const el = document.getElementById('feedbackBanner');
      el.textContent = msg;
      el.className = `feedback-banner ${type}`;
    }

    // Calm, warm voices first. Each device has different ones, so the first match wins.
    // Edge "Natural" voices sound the most human; Chrome, Apple and older Windows voices follow.
    const PREFERRED_VOICES = [
      /Ava.*Natural/i, /Emma.*Natural/i, /Jenny.*Natural/i, /Aria.*Natural/i, /Neerja.*Natural/i,
      /Sonia.*Natural/i, /Libby.*Natural/i, /Natural/i,
      /Google UK English Female/i, /Google US English/i,
      /Samantha/i, /Ava/i, /Karen/i, /Moira/i, /Serena/i, /Allison/i,
      /Zira/i, /Heera/i, /Hazel/i
    ];
    // Old robotic default voices, used only when nothing else exists
    const AVOID_VOICES = /David|Mark|Ravi|George|Fred|Albert|Zarvox|Bad News|Bells|Boing|Bubbles|Cellos|Trinoids|Whisper/i;
    let chosenVoice = null;

    function pickVoice() {
      if (!('speechSynthesis' in window)) return null;
      const english = window.speechSynthesis.getVoices().filter(v => /^en/i.test(v.lang));
      for (const pattern of PREFERRED_VOICES) {
        const match = english.find(v => pattern.test(v.name) && !AVOID_VOICES.test(v.name));
        if (match) return match;
      }
      return english.find(v => !AVOID_VOICES.test(v.name)) || english[0] || null;
    }

    if ('speechSynthesis' in window) {
      chosenVoice = pickVoice();
      // Most browsers load their voice list a moment after the page opens
      window.speechSynthesis.addEventListener('voiceschanged', () => { chosenVoice = pickVoice(); });
    }

    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (!chosenVoice) chosenVoice = pickVoice();
      const utter = new SpeechSynthesisUtterance(text);
      try {
        if (chosenVoice) {
          utter.voice = chosenVoice;
          utter.lang = chosenVoice.lang;
        }
      } catch (e) {
        // A voice the browser refuses should never mean silence: fall back to the default voice
        chosenVoice = null;
      }
      utter.rate = 0.85; // a little slower than normal talking, easy to follow
      utter.pitch = 1.05; // slightly warm, same as Word Detective
      window.speechSynthesis.speak(utter);
    }

    document.querySelectorAll('.mode-tab').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.mode-tab').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.mode = btn.dataset.mode;
        loadNextPuzzle();
      });
    });

    document.getElementById('levelFilter').addEventListener('change', (e) => {
      state.level = e.target.value;
      loadNextPuzzle();
    });

    document.getElementById('shuffleBtn').addEventListener('click', () => {
      state.rack = shuffleArray(state.rack);
      playTone(380, 'triangle', 0.08);
      renderBoard();
    });

    document.getElementById('vowelBtn').addEventListener('click', () => {
      state.vowelsHighlighted = !state.vowelsHighlighted;
      renderBoard();
    });

    document.getElementById('hintBtn').addEventListener('click', () => {
      if (state.mode === 'scramble') {
        useScrambleHint();
        return;
      }
      document.getElementById('phonicsTip').classList.add('visible');
      if (state.mode === 'affix') {
        const firstEmptyIdx = state.slots.findIndex(s => !s.locked && s.char === '');
        if (firstEmptyIdx !== -1) {
          const neededPart = state.currentPuzzle.parts[firstEmptyIdx];
          const tile = state.rack.find(t => !t.used && t.char === neededPart);
          if (tile) placeTileInNextSlot(tile.id);
        }
      } else if (state.mode !== 'anagram' && state.currentPuzzle.word) {
        const target = state.currentPuzzle.word.toUpperCase();
        const firstEmptyIdx = state.slots.findIndex(s => !s.locked && s.char === '');
        if (firstEmptyIdx !== -1) {
          const neededChar = target[firstEmptyIdx];
          const tile = state.rack.find(t => !t.used && t.char === neededChar);
          if (tile) placeTileInNextSlot(tile.id);
        }
      }
    });

    document.getElementById('revealBtn').addEventListener('click', revealScrambleAnswer);
    document.getElementById('clearBtn').addEventListener('click', clearUnlockedSlots);
    document.getElementById('submitBtn').addEventListener('click', checkSubmission);
    document.getElementById('nextBtn').addEventListener('click', loadNextPuzzle);

    document.getElementById('speakBtn').addEventListener('click', () => {
      if (!state.currentPuzzle) return;
      // Read only the clue, never the answer
      speakText(state.currentPuzzle.clue);
    });

    document.getElementById('revealAnagramBtn').addEventListener('click', () => {
      if (!state.currentPuzzle || !state.currentPuzzle.targets) return;
      Object.values(state.currentPuzzle.targets).flat().forEach(w => state.anagramFound.add(w));
      renderAnagramMatrix();
    });

    window.addEventListener('keydown', (e) => {
      const key = e.key.toUpperCase();
      if (state.mode === 'affix' && /^[1-9]$/.test(key)) {
        const idx = parseInt(key, 10) - 1;
        if (state.rack[idx] && !state.rack[idx].used) {
          placeTileInNextSlot(state.rack[idx].id);
        }
      } else if (state.mode !== 'affix' && /^[A-Z]$/.test(key) && !e.ctrlKey && !e.metaKey) {
        const matchingTile = state.rack.find(t => !t.used && t.char === key);
        if (matchingTile) placeTileInNextSlot(matchingTile.id);
      } else if (e.key === 'Backspace') {
        e.preventDefault();
        for (let i = state.slots.length - 1; i >= 0; i--) {
          if (!state.slots[i].locked && state.slots[i].char !== '') {
            removeLetterFromSlot(i);
            break;
          }
        }
      } else if (e.key === 'Enter') {
        e.preventDefault();
        checkSubmission();
      } else if (e.key === ' ') {
        e.preventDefault();
        state.rack = shuffleArray(state.rack);
        renderBoard();
      } else if (e.key === 'Escape') {
        clearUnlockedSlots();
      }
    });

    loadWordBanks();
  </script>
