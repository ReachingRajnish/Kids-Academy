  // FR-02: the Start tap is also what the iPad needs before it allows speech.
  function startTap() {
    Speech.unlock();
    Sound.unlock();
    Sound.play('tap');
    map(true);
  }

  // ---- Learning map (FR-06 to FR-08) ----

  function map(greet) {
    const p = profile();
    const current = Engine.currentNode();
    const stops = Content.nodes().map((n, i) => {
      const v = Engine.nodeView(n.id);
      const stars = h('div', { class: 'stars', 'aria-label': `${v.stars} stars` },
        [0, 1, 2].map(k => h('span', { class: k < v.stars ? '' : 'off' }, '★')));
      const cls = ['stop', !v.unlocked && 'locked', n.id === current && 'current', v.due && v.unlocked && 'due'].filter(Boolean).join(' ');
      return h('button', {
        class: cls, 'aria-label': `${n.title}${v.unlocked ? '' : ', locked'}`,
        onclick: () => stopTap(n, v),
      },
      h('span', { class: 'num' }, n.warmup ? 'warm-up' : String(i - 2)),
      h('div', { class: 'pic', 'aria-hidden': 'true' }, v.unlocked ? n.pic : '🔒'),
      h('div', { class: 'lbl' }, n.short),
      stars);
    });
    mount(h('div', { class: 'screen' },
      h('div', { class: 'bar' },
        h('button', { class: 'icon-btn', 'aria-label': 'Home', onclick: () => home() }, '🏠'),
        h('h1', { class: 'grow' }, `${p.pic} ${p.name}`),
        h('button', { class: 'icon-btn', 'aria-label': 'Sticker book', onclick: () => stickerBook() }, '📒')),
      h('div', { class: 'map-wrap' }, h('div', { class: 'path' }, stops)),
      h('div', { class: 'play-dock' }, h('button', { class: 'btn big green', onclick: () => session({ mode: 'play' }) }, '▶ Play'))));
    if (greet) Speech.say(`Hello ${p.name}. Tap Play to start.`);
  }

  function stopTap(n, v) {
    Sound.play('tap');
    if (!v.unlocked) {
      const needs = n.needs.map(id => Content.node(id).title).join(' and ');
      Speech.say(`${n.title} is locked. First get ready at ${needs}.`);
      toast(`🔒 First get Ready at: ${needs}`);
      return;
    }
    Speech.say(n.title);
    const canChallenge = v.ready && App.settings.challenges;
    const s = sheet(
      h('div', { style: { fontSize: '72px' } }, n.pic),
      h('h2', null, n.title),
      h('div', { class: 'stars', style: { fontSize: '40px', color: '#e0a800' } }, [0, 1, 2].map(k => h('span', { style: { opacity: k < v.stars ? 1 : 0.25 } }, '★'))),
      h('p', null, v.ready ? 'Ready ✓' : v.played ? 'Keep going to get Ready.' : 'New stop.'),
      h('div', { class: 'row' },
        h('button', { class: 'btn green', onclick: () => { s.close(); session({ mode: 'stop', node: n.id }); } }, '▶ Play this'),
        canChallenge ? h('button', { class: 'btn purple', onclick: () => { s.close(); session({ mode: 'challenge', node: n.id }); } }, `⏱️ ${CONFIG.challengeSeconds}-second challenge`) : null),
      h('div', { class: 'row' }, h('button', { class: 'btn soft', onclick: () => { s.close(); Speech.stop(); } }, 'Close')));
  }

  // ---- Session ----

  async function session(opts) {
    const token = ++sessionToken;
    const s = Engine.start(App.settings, opts);
    if (!s.plan.total) {
      toast('There is nothing to play here yet.');
      return map();
    }
    let cur = { item: null, given: () => null, say: '' };
    let lastGiven = null;
    let exiting = false;
    const dots = h('div', { class: 'dots', 'aria-hidden': 'true' });
    const timer = h('b', { style: { color: '#fff', fontSize: '28px' } });
    const updateDots = () => {
      const pr = Engine.progress();
      dots.innerHTML = '';
      for (let i = 0; i < pr.total; i++) dots.append(h('i', { class: i < pr.done ? 'done' : i === pr.done ? 'now' : '' }));
    };
    const container = h('div', { class: 'game' });
    const screen = h('div', { class: 'screen' },
      h('div', { class: 'bar' },
        h('button', {
          class: 'icon-btn', 'aria-label': 'Stop playing', onclick: async () => {
            Speech.stop();
            if (await confirmSheet('Stop playing?', 'Your answers so far are saved.', 'Stop', 'Keep playing')) {
              exiting = true;
              sessionToken++;
              await Engine.abandon();
              map();
            }
          },
        }, '✕'),
        h('div', { class: 'grow' }, s.plan.mode === 'challenge' ? timer : dots),
        h('button', { class: 'icon-btn', 'aria-label': 'Say it again', onclick: () => Speech.say(cur.say) }, '🔊'),
        // FR-38: a small flag on every question.
        h('button', {
          class: 'icon-btn small', 'aria-label': 'Flag this question for a grown-up', onclick: async () => {
            if (!cur.item) return;
            const g = cur.given ? cur.given() : null;
            await Engine.flag(cur.item, g !== null && g !== undefined ? g : lastGiven);
            toast('🚩 Thanks. A grown-up will check this question.');
          },
        }, '🚩')),
      container);
    mount(screen);
    updateDots();
    let tick = 0;
    if (s.plan.mode === 'challenge') {
      const upd = () => {
        const left = Math.max(0, Math.ceil((Engine.session ? Engine.session.deadline - Date.now() : 0) / 1000));
        timer.textContent = `⏱️ ${left}`;
      };
      upd();
      tick = setInterval(upd, 250);
      await Speech.say(`You have ${CONFIG.challengeSeconds} seconds. Go.`);
    }
    const api = {
      answer: (q, given, ms, o) => {
        lastGiven = given;
        return Engine.answer(q, given, ms, o);
      },
      setCurrent: c => { cur = c; lastGiven = null; },
      progress: updateDots,
      shouldStop: () => exiting || token !== sessionToken || Engine.timeUp(),
    };
    let round;
    while (token === sessionToken && (round = Engine.nextRound())) {
      try {
        await Games[round.game](container, round, api);
      } catch (e) {
        console.error(e);
        toast('Something went wrong with that question. Skipping it.');
      }
      updateDots();
    }
    clearInterval(tick);
    if (token !== sessionToken || exiting) return;
    const result = await Engine.finish();
    end(result);
  }

  // ---- End of session (FR-05, FR-27) ----

  function end(result) {
    const p = profile();
    const events = result.events.map(e => {
      const n = Content.node(e.node);
      if (e.event === 'ready') return h('p', { style: { fontSize: '24px', fontWeight: 800 } }, `⭐ Ready at ${n.title}.`);
      if (e.event === 'three') return h('p', { style: { fontSize: '24px', fontWeight: 800 } }, `🏅 Three stars at ${n.title}.`);
      return null;
    });
    mount(h('div', { class: 'screen' }, h('div', { class: 'center' },
      h('h1', { class: 'title' }, result.mode === 'challenge' ? `${result.right} right` : 'Well done'),
      h('div', { class: 'stars-big', 'aria-label': `${result.stars} stars` },
        [0, 1, 2].map(i => h('span', { class: 's' + (i < result.stars ? '' : ' off'), style: { animationDelay: `${i * 0.25}s` } }, '⭐'))),
      h('div', { class: 'panel' },
        h('div', { class: 'sticker', 'aria-hidden': 'true' }, result.sticker),
        h('p', { style: { fontSize: '24px', fontWeight: 800, margin: '6px 0' } }, 'A new sticker for your book.'),
        h('p', { style: { fontSize: '22px', margin: '6px 0' } }, result.sentence),
        events),
      h('div', { class: 'row', style: { display: 'flex', gap: '16px' } },
        h('button', { class: 'btn soft', onclick: () => stickerBook() }, '📒 Stickers'),
        h('button', { class: 'btn green', onclick: () => map() }, '🗺️ Map')))));
    Sound.play('sticker');
    const extra = result.events.filter(e => e.event === 'ready').map(e => `You are ready at ${Content.node(e.node).title}.`).join(' ');
    Speech.say(`Well done, ${p.name}. You got ${result.stars} ${result.stars === 1 ? 'star' : 'stars'} and a new sticker. ${result.sentence} ${extra}`);
  }

  function stickerBook() {
    const r = Engine.ctx.rewards;
    const slots = r.stickers.map(s => h('div', { class: 'slot', title: s.day }, s.e));
    const empty = Math.max(0, 24 - slots.length);
    for (let i = 0; i < empty; i++) slots.push(h('div', { class: 'slot empty' }, '?'));
    mount(h('div', { class: 'screen' },
      h('div', { class: 'bar' },
        h('button', { class: 'icon-btn', 'aria-label': 'Back to the map', onclick: () => map() }, '🗺️'),
        h('h1', { class: 'grow' }, `📒 Sticker book: ${r.stickers.length}`)),
      h('div', { class: 'map-wrap' }, h('div', { class: 'book' }, slots))));
    Speech.say(`You have ${r.stickers.length} ${r.stickers.length === 1 ? 'sticker' : 'stickers'}.`);
  }

  // ---- Parent area (FR-31 to FR-39) ----

  function itemSummary(it) {
    if (!it) return '(item no longer in the app)';
    if (it.text) return it.text;
    if (it.after) return it.after;
    if (it.panels) return it.panels[it.bug.panel].text;
    return it.id;
  }

  async function parent(tab = 'progress', opts = {}) {
    App.profiles = await Store.getAll('profiles');
    App.meta = await Store.loadMeta();
    const tabs = [['progress', '📈 Progress'], ['players', '👧 Players'], ['settings', '⚙️ Settings'], ['backup', '💾 Backup'], ['flags', '🚩 Flags']];
    const body = h('div', { class: 'pbody' });
    const tabBar = h('div', { class: 'tabs', role: 'tablist' }, tabs.map(([k, label]) => h('button', {
      class: k === tab ? 'on' : '', role: 'tab', 'aria-selected': k === tab ? 'true' : 'false', onclick: () => parent(k),
    }, label)));
    mount(h('div', { class: 'parent' },
      h('div', { class: 'bar' },
        h('h1', { class: 'grow' }, '👪 Grown-ups'),
        h('button', { class: 'btn soft', onclick: () => (App.profiles.length ? home() : firstRun()) }, 'Done')),
      tabBar, body));
    if (backupOverdue()) {
      const d = daysSinceBackup();
      body.append(h('div', { class: 'banner' }, d === null
        ? '💾 No backup saved yet. Save one now in the Backup tab.'
        : `💾 The last backup was ${d} days ago. Save a new one in the Backup tab.`));
    }
    const views = { progress: progressTab, players: playersTab, settings: settingsTab, backup: backupTab, flags: flagsTab };
    await views[tab](body, opts);
  }

  async function progressTab(body) {
    if (!App.profiles.length) {
      body.append(h('p', null, 'No players yet. Add one in the Players tab.'));
      return;
    }
    if (!profile()) App.profileId = App.profiles[0].id;
    const p = profile();
    await Engine.loadProfile(p);
    const ctx = Engine.ctx;
    const chips = h('div', { class: 'pbtns' }, App.profiles.map(x => h('button', {
      class: 'btn ' + (x.id === p.id ? 'purple' : 'soft'), onclick: () => { App.profileId = x.id; parent('progress'); },
    }, `${x.pic} ${x.name}`)));
    const rows = Content.nodes().map(n => {
      const c = ctx.cards[n.id];
      const v = Engine.nodeView(n.id);
      const wrong = ctx.attempts.filter(a => a.node === n.id && !a.correct).slice(-3).reverse();
      const acc = c && c.total ? `${Math.round(100 * c.right / c.total)}% (${c.right}/${c.total})` : '-';
      const last10 = c && c.last10.length ? ` · last ${c.last10.length}: ${c.last10.filter(a => a.ok).length} right` : '';
      const status = v.ready ? 'Ready' : v.unlocked ? (v.played ? 'Learning' : 'Open') : 'Locked';
      return h('tr', null,
        h('td', null, h('b', null, `${n.pic} ${n.title}`), h('br'), h('small', null, `${n.id} · ${n.codes.join(', ')}`)),
        h('td', null, '★'.repeat(v.stars) + '☆'.repeat(3 - v.stars), h('br'), h('small', null, status)),
        h('td', null, acc, h('small', null, last10)),
        h('td', null, c ? prettyDate(c.lastPlayed) : '-'),
        h('td', null, c && c.fsrs.due ? `${prettyDate(c.fsrs.due)} (${relDay(c.fsrs.due)})` : '-'),
        h('td', { class: 'mist' }, wrong.length ? wrong.map(a => h('div', null, `“${itemSummary(Content.item(a.itemId))}”: chose ${a.given}`)) : '-'));
    });
    const week = Engine.weekDays().filter(d => d.played).length;
    body.append(chips,
      h('div', { class: 'pcard' },
        h('p', null, h('b', null, `${p.pic} ${p.name}`), ` · Stage ${p.stage} · ${ctx.rewards.stickers.length} stickers · played ${week} days this week · ${ctx.attempts.length} answers saved`),
        h('div', { style: { overflowX: 'auto' } }, h('table', { class: 'prog' },
          h('thead', null, h('tr', null, ['Topic', 'Stars', 'Accuracy', 'Last played', 'Next review', 'Recent mistakes'].map(t => h('th', null, t)))),
          h('tbody', null, rows)))));
  }

  function playersTab(body, opts) {
    const list = h('div');
    for (const p of App.profiles) {
      list.append(h('div', { class: 'pcard', style: { display: 'flex', alignItems: 'center', gap: '14px', flexWrap: 'wrap' } },
        h('span', { style: { fontSize: '48px' } }, p.pic),
        h('div', { style: { flex: 1 } }, h('b', { style: { fontSize: '22px' } }, p.name), h('br'), `Stage ${p.stage}`),
        h('button', { class: 'btn soft', onclick: () => editPlayer(body, p) }, 'Edit'),
        h('button', {
          class: 'btn soft', onclick: async () => {
            if (await confirmSheet(`Delete ${p.name}?`, 'This removes all of their progress and stickers on this device. A backup file keeps a copy.', 'Delete')) {
              await Store.deleteProfile(p.id);
              if (App.profileId === p.id) App.profileId = null;
              parent('players');
            }
          },
        }, 'Delete')));
    }
    body.append(h('h3', null, 'Players'), list);
    if (App.profiles.length < 4) {
      body.append(h('button', { class: 'btn', onclick: () => editPlayer(body, null) }, '➕ Add a player'));
    } else {
      body.append(h('p', null, 'Up to 4 players fit on one device.'));
    }
    if (opts.add) editPlayer(body, null);
  }

  function editPlayer(body, existing) {
    const p = existing ? Object.assign({}, existing) : { id: uid(), name: '', pic: AVATARS[App.profiles.length % AVATARS.length], stage: 2, created: Date.now() };
    const name = h('input', { type: 'text', maxlength: '20', value: p.name, autocomplete: 'off', 'aria-label': 'Name' });
    const avatars = h('div', { class: 'avatars' }, AVATARS.map(a => {
      const b = h('button', { class: a === p.pic ? 'on' : '', 'aria-label': `Picture ${a}` }, a);
      b.addEventListener('click', () => {
        p.pic = a;
        $$('button', avatars).forEach(x => x.classList.toggle('on', x === b));
      });
      return b;
    }));
    const stage = h('select', { 'aria-label': 'Stage' },
      h('option', { value: '2', selected: true }, 'Stage 2 (Grade 2)'),
      h('option', { value: '3', disabled: true }, 'Stage 3 (coming later)'),
      h('option', { value: '4', disabled: true }, 'Stage 4 (coming later)'));
    const s = sheet(
      h('h2', null, existing ? `Edit ${existing.name}` : 'New player'),
      h('div', { class: 'field', style: { textAlign: 'left' } }, 'Name', name),
      h('div', { class: 'field', style: { textAlign: 'left' } }, 'Picture', avatars),
      h('div', { class: 'field', style: { textAlign: 'left' } }, 'Stage', stage),
      h('div', { class: 'row' },
        h('button', { class: 'btn soft', onclick: () => s.close() }, 'Cancel'),
        h('button', {
          class: 'btn green', onclick: async () => {
            const n = name.value.trim();
            if (!n) { toast('Please type a name.'); return; }
            p.name = n;
            p.stage = Number(stage.value);
            await Store.put('profiles', p);
            if (!existing) {
              App.profileId = p.id;
              await Store.saveMeta({ lastProfile: p.id });
              if (!App.meta.persistAsked) {
                await Store.requestPersist();
                await Store.saveMeta({ persistAsked: true });
              }
            }
            s.close();
            parent('players');
          },
        }, 'Save')));
    setTimeout(() => name.focus(), 50);
    return s;
  }

  function settingsTab(body) {
    const st = App.settings;
    const save = async patch => {
      Object.assign(st, patch);
      await Store.put('settings', st);
      Speech.configure({ voiceURI: st.voiceURI, rate: st.rate });
      Sound.setOn(st.sounds);
    };
    const voices = Speech.list();
    const voiceSel = h('select', { 'aria-label': 'Voice' },
      h('option', { value: '' }, 'Automatic: best British voice'),
      voices.map(v => h('option', { value: v.uri, selected: v.uri === st.voiceURI }, `${v.name} (${v.lang})${v.offline ? ' · offline' : ''}`)));
    voiceSel.addEventListener('change', () => save({ voiceURI: voiceSel.value || null }));
    const rateLbl = h('span', null, st.rate.toFixed(2));
    const rate = h('input', { type: 'range', min: '0.6', max: '1.2', step: '0.05', value: String(st.rate), 'aria-label': 'Speech speed' });
    rate.addEventListener('input', () => { rateLbl.textContent = Number(rate.value).toFixed(2); });
    rate.addEventListener('change', () => save({ rate: Number(rate.value) }));
    const minLbl = h('span', null, `${st.minutes} minutes, about ${clamp(st.minutes * 2, 6, 20)} questions`);
    const mins = h('input', { type: 'range', min: '3', max: '10', step: '1', value: String(st.minutes), 'aria-label': 'Session length' });
    mins.addEventListener('input', () => { minLbl.textContent = `${mins.value} minutes, about ${clamp(Number(mins.value) * 2, 6, 20)} questions`; });
    mins.addEventListener('change', () => save({ minutes: Number(mins.value) }));
    const toggle = (label, key, hint) => {
      const box = h('input', { type: 'checkbox', checked: !!st[key] });
      box.addEventListener('change', () => save({ [key]: box.checked }));
      return h('label', { class: 'toggle' }, h('span', null, label, hint ? h('br') : null, hint ? h('small', { style: { fontWeight: 400 } }, hint) : null), box);
    };
    body.append(
      h('div', { class: 'pcard' },
        h('h3', { style: { marginTop: 0 } }, 'Voice'),
        h('p', null, `Now using: ${Speech.voiceName}`),
        Speech.available ? null : h('p', null, 'This browser has no speech. Prompts will be shown but not read.'),
        h('div', { class: 'field' }, voiceSel),
        h('div', { class: 'field' }, h('span', null, 'Speed: ', rateLbl), rate),
        h('button', { class: 'btn soft', onclick: () => { Speech.unlock(); Speech.say('There are three foxes. Mouse changes to mice, not mouses.'); } }, '🔊 Test the voice')),
      h('div', { class: 'pcard' },
        h('h3', { style: { marginTop: 0 } }, 'Play'),
        h('div', { class: 'field' }, h('span', null, 'Session length: ', minLbl), mins),
        toggle('Sounds', 'sounds'),
        toggle('Challenge rounds', 'challenges', 'A 60-second round the child can choose once a topic is Ready.'),
        toggle('Streak', 'streak', 'Counts days in a row, with one free day off each week. Off by default.')),
      h('div', { class: 'pcard' },
        h('h3', { style: { marginTop: 0 } }, 'About'),
        h('p', null, `Grammar Quest ${APP_VERSION} · data format ${Store.SCHEMA_VERSION} · ${Content.nodes().length} topics`),
        h('p', null, `Storage protected from clean-up: ${App.meta.persisted === true ? 'yes' : App.meta.persisted === false ? 'no (the browser said no, so keep backups)' : 'not asked yet'}`)));
  }

  function download(name, text) {
    const blob = new Blob([text], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: name, style: { display: 'none' } });
    document.body.append(a);
    a.click();
    setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 5000);
  }

  async function copyText(ta) {
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(ta.value);
        return true;
      }
    } catch (e) { /* fall through */ }
    ta.focus();
    ta.select();
    ta.setSelectionRange(0, ta.value.length);
    try { return document.execCommand('copy'); } catch (e) { return false; }
  }

  // Accepts a backup file's text or a pasted text code.
  function parseBackupText(text) {
    const t = String(text || '').trim();
    if (!t) throw new Error('Paste the code or choose the file first.');
    if (t.startsWith('{')) return JSON.parse(t);
    const code = t.replace(/^GQ\d*:/, '');
    try {
      return JSON.parse(fromBase64(code));
    } catch (e) {
      throw new Error('That code is not complete. Copy all of it and try again.');
    }
  }

  function backupTab(body) {
    const last = App.meta.lastBackup ? `${prettyDate(App.meta.lastBackup)} (${relDay(App.meta.lastBackup)})` : 'never';
    const codeBox = h('div');
    const markSaved = async () => {
      App.meta = await Store.saveMeta({ lastBackup: Date.now() });
    };
    const saveFile = async () => {
      const data = await Store.exportAll({ includeAttempts: true });
      download(`grammar-quest-backup-${dayKey()}.json`, JSON.stringify(data));
      await markSaved();
      toast('Backup file saved. If nothing appeared, use the backup code instead.', 4500);
    };
    // FR-34: the same backup as a text code, to paste into Notes.
    const showCode = async () => {
      const data = await Store.exportAll({ includeAttempts: false });
      const code = 'GQ1:' + toBase64(JSON.stringify(data));
      const ta = h('textarea', { readonly: true, 'aria-label': 'Backup code' }, code);
      codeBox.innerHTML = '';
      codeBox.append(h('div', { class: 'field' }, `Backup code (${Math.ceil(code.length / 1024)} KB). Copy it and paste it into Notes.`, ta),
        h('div', { class: 'pbtns' }, h('button', {
          class: 'btn', onclick: async () => {
            const ok = await copyText(ta);
            if (ok) await markSaved();
            toast(ok ? 'Copied. Paste it into Notes now.' : 'Select the code and copy it by hand.');
          },
        }, '📋 Copy')));
    };
    const fileIn = h('input', { type: 'file', accept: '.json,application/json,text/plain', 'aria-label': 'Choose a backup file' });
    const paste = h('textarea', { placeholder: 'Or paste a backup code here', 'aria-label': 'Paste a backup code' });
    const preview = h('div');
    const inspect = text => {
      preview.innerHTML = '';
      let data;
      let info;
      try {
        data = parseBackupText(text);
        info = Store.inspectBackup(data);
      } catch (e) {
        preview.append(h('div', { class: 'banner' }, e.message));
        return;
      }
      // FR-35: show what will come back and ask before replacing anything.
      preview.append(h('div', { class: 'pcard', style: { border: '3px solid var(--accent)' } },
        h('h3', { style: { marginTop: 0 } }, 'This backup holds'),
        h('p', null, `Saved ${prettyDate(info.exportedAt)} by Grammar Quest ${info.appVersion || '?'}${info.hasAttempts ? '' : ' (text code: answer history not included, the history on this device is kept)'}`),
        info.profiles.map(p => h('p', null, `${p.pic || ''} ${p.name}: last played ${p.lastPlayed || 'never'}, ${p.stars} stars, ${p.stickers} stickers`)),
        h('p', null, `${info.flags} flagged questions`),
        h('p', null, h('b', null, 'Restoring replaces everything on this device.')),
        h('div', { class: 'pbtns' },
          h('button', { class: 'btn soft', onclick: () => { preview.innerHTML = ''; } }, 'Cancel'),
          h('button', {
            class: 'btn purple', onclick: async () => {
              if (!(await confirmSheet('Replace everything?', 'The players and progress on this device will be replaced by the backup.', 'Restore'))) return;
              try {
                await Store.importAll(data);
                App.meta = await Store.loadMeta();
                App.settings = await Store.loadSettings();
                App.profiles = await Store.getAll('profiles');
                App.profileId = null;
                Speech.configure({ voiceURI: App.settings.voiceURI, rate: App.settings.rate });
                Sound.setOn(App.settings.sounds);
                toast('Restored.');
                home();
              } catch (e) {
                toast(`Restore failed: ${e.message}`, 5000);
              }
            },
          }, '📥 Restore'))));
    };
    fileIn.addEventListener('change', () => {
      const f = fileIn.files && fileIn.files[0];
      if (!f) return;
      const r = new FileReader();
      r.onload = () => inspect(r.result);
      r.onerror = () => toast('Could not read that file.');
      r.readAsText(f);
    });
    body.append(
      h('div', { class: 'pcard' },
        h('h3', { style: { marginTop: 0 } }, 'Save a backup'),
        h('p', null, `Last backup: ${last}. Save one at least once a week, and always before replacing the app file with a new version.`),
        h('div', { class: 'pbtns' },
          h('button', { class: 'btn', onclick: saveFile }, '💾 Save backup file'),
          h('button', { class: 'btn soft', onclick: showCode }, '🔤 Show backup code')),
        codeBox),
      h('div', { class: 'pcard' },
        h('h3', { style: { marginTop: 0 } }, 'Restore'),
        h('div', { class: 'field' }, 'Backup file', fileIn),
        h('div', { class: 'field' }, 'Backup code', paste),
        h('div', { class: 'pbtns' }, h('button', { class: 'btn soft', onclick: () => inspect(paste.value) }, 'Check the code')),
        preview));
  }

  async function flagsTab(body) {
    const flags = (await Store.getAll('flags')).sort((a, b) => b.ts - a.ts);
    const names = Object.fromEntries(App.profiles.map(p => [p.id, p.name]));
    body.append(h('h3', null, `Flagged questions: ${flags.length}`),
      h('p', null, 'The child tapped 🚩 on these. They are kept in backups, so wrong items can be fixed in the next version.'));
    if (!flags.length) {
      body.append(h('p', null, 'Nothing flagged.'));
      return;
    }
    body.append(h('div', { class: 'pcard', style: { overflowX: 'auto' } }, h('table', { class: 'prog' },
      h('thead', null, h('tr', null, ['Date', 'Player', 'Item', 'Question', 'Answer given'].map(t => h('th', null, t)))),
      h('tbody', null, flags.map(f => {
        const it = Content.item(f.itemId);
        return h('tr', null,
          h('td', null, prettyDate(f.ts)),
          h('td', null, names[f.profileId] || '-'),
          h('td', null, f.itemId),
          h('td', null, itemSummary(it), it ? h('div', null, h('small', null, `Accepted: ${it.answers.join(', ')}`)) : null),
          h('td', null, f.given === null ? '(none yet)' : String(f.given).replace(/^¶/, 'new line: ')));
      })))),
    h('div', { class: 'pbtns' }, h('button', {
      class: 'btn soft', onclick: async () => {
        if (!(await confirmSheet('Clear all flags?', 'Save a backup first if you still need them.', 'Clear'))) return;
        await Store.tx('flags', 'readwrite', s => { s.flags.clear(); });
        parent('flags');
      },
    }, 'Clear all flags')));
  }

  return { home, firstRun, map, fatal, parent };
})();

// ---- 08-main.js ----
// ---------------------------------------------------------------------------
// Boot: read the bank, open the database, run migrations, show the first screen.
// ---------------------------------------------------------------------------
(async function boot() {
  try {
    if (reducedMotion()) document.documentElement.classList.add('reduce-motion');
    Content.load();
    await Store.open();
    App.meta = await Store.loadMeta();
    App.settings = await Store.loadSettings();
    App.profiles = await Store.getAll('profiles');
    Speech.init(App.settings);
    Sound.setOn(App.settings.sounds);
    // Ask once for storage that the browser will not clean up (section 7).
    if (!App.meta.persistAsked) {
      Store.requestPersist().then(() => Store.saveMeta({ persistAsked: true })).then(m => { App.meta = m; });
    }
    if (App.profiles.length) await Screens.home();
    else Screens.firstRun();
  } catch (err) {
    console.error(err);
    Screens.fatal(err);
  }
})();

// Stop speech when the page is hidden, so it does not talk in the background.
document.addEventListener('visibilitychange', () => {
  if (document.hidden) Speech.stop();
});

})();
</script>
