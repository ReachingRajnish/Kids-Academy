<!doctype html>
<html lang="en-GB" data-band="primary">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data: blob:; media-src data: blob:; font-src data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#4fb3ff">
<title>Grammar Quest</title>
<style>
/* Grammar Quest. One bright theme for the primary band (NFR-11).
   Later bands set data-band on <html> and override these tokens. */
:root {
  --sky: #4fb3ff;
  --sky-2: #a8dcff;
  --grass: #7ed957;
  --sun: #ffd23f;
  --ink: #1d2340;
  --ink-soft: #4a5275;
  --card: #ffffff;
  --card-2: #f4f8ff;
  --line: #d5def0;
  --good: #1f9d55;
  --good-bg: #e2f8ea;
  --look: #b45309;
  --look-bg: #fff4dc;
  --accent: #7c4dff;
  --accent-2: #ede6ff;
  --btn: #ff8a3d;
  --btn-dark: #d9661c;
  --locked: #9aa3b8;
  --glow: #ffe066;
  --radius: 22px;
  --tap: 64px;
  --prompt: 32px;
  --font: ui-rounded, "SF Pro Rounded", "Arial Rounded MT Bold", "Segoe UI", system-ui, -apple-system, sans-serif;
}
[data-band="middle"] { --sky: #3a86ff; --btn: #8338ec; --btn-dark: #5f1fc4; }
[data-band="high"] { --sky: #264653; --btn: #2a9d8f; --btn-dark: #1d7168; }

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0; height: 100%;
  background: linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 70%, #dff3c9 100%);
  background-color: var(--sky-2);
  color: var(--ink);
  font-family: var(--font);
  font-size: 20px;
  -webkit-user-select: none; user-select: none;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior: none;
}
body { overflow: hidden; touch-action: manipulation; }
#app { position: fixed; inset: 0; display: flex; flex-direction: column; padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
input, textarea, select { -webkit-user-select: text; user-select: text; font: inherit; }
button { font: inherit; color: inherit; cursor: pointer; }
.hidden { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* Buttons. Every target is at least 56 px (FR-18). */
.btn {
  min-height: var(--tap); min-width: var(--tap);
  padding: 10px 26px;
  border: 0; border-radius: 999px;
  background: var(--btn); color: #fff;
  font-size: 26px; font-weight: 800; letter-spacing: .3px;
  box-shadow: 0 6px 0 var(--btn-dark), 0 10px 18px rgba(0,0,0,.18);
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  transition: transform .08s ease, box-shadow .08s ease;
}
.btn:active, .btn.pressed { transform: translateY(4px); box-shadow: 0 2px 0 var(--btn-dark), 0 4px 10px rgba(0,0,0,.18); }
.btn.big { font-size: 40px; min-height: 104px; padding: 16px 56px; }
.btn.soft { background: var(--card); color: var(--ink); box-shadow: 0 5px 0 var(--line), 0 8px 14px rgba(0,0,0,.12); }
.btn.green { background: var(--good); box-shadow: 0 6px 0 #156b3a, 0 10px 18px rgba(0,0,0,.18); }
.btn.purple { background: var(--accent); box-shadow: 0 6px 0 #5530b8, 0 10px 18px rgba(0,0,0,.18); }
.btn[disabled] { opacity: .45; pointer-events: none; }
.icon-btn {
  width: 60px; height: 60px; min-width: 60px;
  border-radius: 50%; border: 0;
  background: rgba(255,255,255,.92); color: var(--ink);
  font-size: 28px; display: inline-flex; align-items: center; justify-content: center;
  box-shadow: 0 4px 0 rgba(0,0,0,.12);
}
.icon-btn:active { transform: translateY(3px); box-shadow: none; }
.icon-btn.small { width: 56px; height: 56px; min-width: 56px; font-size: 24px; }

/* Top bar */
.bar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; min-height: 84px; }
.bar .grow { flex: 1; }
.bar h1 { margin: 0; font-size: 30px; color: #fff; text-shadow: 0 2px 0 rgba(0,0,0,.15); }
.dots { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
.dots i { width: 18px; height: 18px; border-radius: 50%; background: rgba(255,255,255,.55); border: 2px solid rgba(255,255,255,.9); display: inline-block; }
.dots i.done { background: var(--sun); }
.dots i.now { background: #fff; transform: scale(1.25); }

.screen { flex: 1; display: flex; flex-direction: column; min-height: 0; position: relative; }
.center { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 24px; padding: 16px; text-align: center; }
.panel { background: var(--card); border-radius: var(--radius); box-shadow: 0 8px 24px rgba(20,40,90,.15); padding: 20px; }
.title { font-size: 56px; font-weight: 900; color: #fff; margin: 0; text-shadow: 0 4px 0 rgba(0,0,0,.15); letter-spacing: .5px; }
.subtitle { font-size: 26px; color: #fff; margin: 0; text-shadow: 0 2px 0 rgba(0,0,0,.12); }

/* Home */
.profiles { display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
.profile {
  width: 150px; min-height: 170px; border: 4px solid transparent; border-radius: var(--radius);
  background: var(--card); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px;
  box-shadow: 0 6px 0 var(--line);
}
.profile .face { font-size: 72px; line-height: 1; }
.profile .name { font-size: 24px; font-weight: 800; }
.profile.on { border-color: var(--btn); transform: translateY(-4px); }
.week { display: flex; gap: 10px; align-items: center; background: rgba(255,255,255,.85); padding: 10px 18px; border-radius: 999px; font-size: 20px; font-weight: 700; }
.week span { width: 36px; height: 36px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; background: #eef2fa; font-size: 16px; color: var(--ink-soft); }
.week span.played { background: var(--sun); color: var(--ink); }
.week span.today { outline: 3px solid var(--btn); }
.badge { position: absolute; top: 14px; right: 18px; background: var(--look-bg); color: var(--look); border-radius: 999px; padding: 6px 14px; font-size: 18px; font-weight: 800; box-shadow: 0 3px 0 rgba(0,0,0,.1); }
.parent-corner { position: absolute; left: 16px; bottom: 16px; }

/* Hold-to-open parent button */
.hold { position: relative; overflow: hidden; }
.hold .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: rgba(124,77,255,.25); }
.hold.holding .fill { width: 100%; transition: width 3s linear; }

/* Map */
.map-wrap { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 8px 16px 140px; }
.path { position: relative; max-width: 900px; margin: 0 auto; display: grid; grid-template-columns: repeat(5, 1fr); gap: 18px 14px; }
.stop {
  position: relative; border: 0; background: var(--card); border-radius: var(--radius); padding: 10px 6px 8px;
  min-height: 150px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  box-shadow: 0 6px 0 var(--line), 0 10px 16px rgba(0,0,0,.08);
}
.stop .pic { font-size: 46px; line-height: 1.1; }
.stop .lbl { font-size: 17px; font-weight: 800; line-height: 1.15; }
.stop .stars { font-size: 20px; letter-spacing: 1px; color: #e0a800; }
.stop .stars .off { color: #cfd6e6; }
.stop .num { position: absolute; top: 6px; left: 10px; font-size: 14px; font-weight: 800; color: var(--ink-soft); }
.stop.locked { background: #e9edf5; color: var(--locked); box-shadow: 0 6px 0 #cfd6e6; }
.stop.locked .pic { filter: grayscale(1); opacity: .5; }
.stop.current { outline: 5px solid var(--btn); animation: bob 1.6s ease-in-out infinite; }
.stop.due::after { content: "↻ review"; position: absolute; top: -10px; right: -6px; background: var(--accent); color: #fff; font-size: 13px; font-weight: 800; padding: 3px 8px; border-radius: 999px; }
.play-dock { position: absolute; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; gap: 18px; padding: 16px 16px calc(16px + env(safe-area-inset-bottom)); background: linear-gradient(180deg, rgba(223,243,201,0) 0%, rgba(223,243,201,.95) 40%); }
@keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }

/* Modal sheet */
.sheet-bg { position: fixed; inset: 0; background: rgba(20,30,60,.45); display: flex; align-items: center; justify-content: center; z-index: 50; padding: 16px; }
.sheet { background: var(--card); border-radius: 28px; padding: 24px; max-width: 640px; width: 100%; max-height: 92vh; overflow: auto; text-align: center; box-shadow: 0 20px 50px rgba(0,0,0,.3); }
.sheet h2 { margin: 6px 0 12px; font-size: 32px; }
.sheet .row { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; margin-top: 16px; }

/* Game shell */
.game { flex: 1; display: flex; flex-direction: column; min-height: 0; padding: 0 16px 16px; gap: 14px; }
.prompt { font-size: var(--prompt); font-weight: 800; color: var(--ink); background: rgba(255,255,255,.92); border-radius: var(--radius); padding: 12px 20px; text-align: center; line-height: 1.3; }
.choices { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
.tile {
  min-height: 72px; min-width: 110px; padding: 10px 24px; border-radius: 18px; border: 4px solid var(--line);
  background: var(--card); font-size: 32px; font-weight: 800; color: var(--ink);
  box-shadow: 0 6px 0 var(--line); touch-action: none;
}
.tile.picked { border-color: var(--accent); background: var(--accent-2); }
.tile.dragging { position: fixed; z-index: 60; pointer-events: none; transform: scale(1.08); box-shadow: 0 14px 24px rgba(0,0,0,.25); }
.tile:active { transform: translateY(3px); box-shadow: 0 3px 0 var(--line); }
.blank { display: inline-block; min-width: 120px; border-bottom: 5px dashed var(--accent); color: var(--accent); padding: 0 6px; animation: pulse 1.4s ease-in-out infinite; }
.blank.filled { border-bottom-style: solid; animation: none; }
.glow { background: var(--glow); border-radius: 10px; padding: 0 6px; box-shadow: 0 0 0 4px rgba(255,224,102,.5); animation: glowIn .6s ease; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .55; } }
@keyframes glowIn { from { box-shadow: 0 0 0 14px rgba(255,224,102,.0); } to { box-shadow: 0 0 0 4px rgba(255,224,102,.5); } }

/* Feedback (FR-09 to FR-12). No red, no crosses. */
.feedback { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); width: min(820px, calc(100% - 32px)); border-radius: 26px; padding: 18px 22px; display: flex; gap: 16px; align-items: center; z-index: 30; box-shadow: 0 14px 30px rgba(0,0,0,.2); animation: rise .25s ease; }
.feedback.good { background: var(--good-bg); border: 4px solid var(--good); }
.feedback.look { background: var(--look-bg); border: 4px solid #f0b44c; }
.feedback .big { font-size: 56px; line-height: 1; }
.feedback .msg { flex: 1; text-align: left; font-size: 26px; font-weight: 700; line-height: 1.3; }
.feedback .msg b { font-size: 30px; }
@keyframes rise { from { transform: translate(-50%, 30px); opacity: 0; } to { transform: translate(-50%, 0); opacity: 1; } }

/* G1 Conveyor-Belt Sorter */
.belt-zone { position: relative; height: 210px; margin-top: 6px; }
.belt { position: absolute; left: 0; right: 0; bottom: 18px; height: 54px; border-radius: 30px; background: repeating-linear-gradient(90deg, #5b6787 0 34px, #4b5674 34px 68px); box-shadow: inset 0 -6px 0 rgba(0,0,0,.25), 0 6px 0 #343c55; }
.belt.run { animation: belt 1.2s linear infinite; }
@keyframes belt { from { background-position: 0 0; } to { background-position: 68px 0; } }
.belt-end { position: absolute; right: 6px; bottom: 80px; font-size: 32px; opacity: .6; }
.card {
  position: absolute; bottom: 64px; left: 0; min-width: 170px; max-width: 460px; padding: 10px 22px; border-radius: 20px; border: 4px solid var(--line);
  background: var(--card); text-align: center; touch-action: none; box-shadow: 0 8px 0 var(--line), 0 12px 20px rgba(0,0,0,.15);
  will-change: transform;
}
.card .pic { font-size: 50px; line-height: 1.1; }
.card .txt { font-size: 34px; font-weight: 800; line-height: 1.2; }
.card.picked { border-color: var(--accent); background: var(--accent-2); }
.card.dragging { z-index: 60; box-shadow: 0 18px 28px rgba(0,0,0,.25); }
.buckets { flex: 1; display: flex; gap: 18px; justify-content: center; align-items: stretch; min-height: 180px; }
.bucket {
  flex: 1; max-width: 300px; min-height: 170px; border-radius: 26px 26px 40px 40px; border: 5px dashed rgba(255,255,255,.95);
  background: rgba(255,255,255,.55); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
  font-weight: 900; color: var(--ink); padding: 8px;
}
.bucket .sym { font-size: 64px; line-height: 1; }
.bucket .name { font-size: 24px; }
.bucket.over { background: rgba(255,255,255,.95); border-style: solid; border-color: var(--accent); transform: scale(1.04); }
.bucket.gulp { animation: gulp .4s ease; }
@keyframes gulp { 40% { transform: scale(1.1); } }
.speed { color: #fff; font-weight: 800; font-size: 20px; text-align: center; }

/* G2 Picture-Mutator */
.mutator { flex: 1; display: grid; grid-template-columns: 1.1fr 1fr; gap: 16px; min-height: 0; }
.stage { position: relative; background: var(--card); border-radius: 28px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; padding: 14px; overflow: hidden; box-shadow: 0 8px 20px rgba(20,40,90,.12); }
.scene { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; min-height: 160px; }
.scene .e { font-size: 64px; line-height: 1.1; display: inline-block; transition: transform .45s cubic-bezier(.3,1.5,.6,1), opacity .35s; }
.scene .e.pop { animation: pop .45s cubic-bezier(.3,1.5,.6,1); }
@keyframes pop { from { transform: scale(0); } to { transform: scale(1); } }
.scene.count { align-content: center; }
.scene.count .e { font-size: 70px; }
.grid10 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px 10px; }
.grid10 .e { font-size: 54px; }
.counter { font-size: 24px; font-weight: 800; color: var(--ink-soft); }
.timeline { display: flex; gap: 8px; width: 100%; justify-content: center; }
.timeline span { flex: 1; max-width: 170px; text-align: center; padding: 8px 6px; border-radius: 14px; background: #eef2fa; font-size: 18px; font-weight: 800; color: var(--ink-soft); border: 3px solid transparent; }
.timeline span.on { background: var(--accent-2); color: var(--accent); border-color: var(--accent); }
.scene.time .who { font-size: 90px; }
.scene.time .act { font-size: 70px; }
.scene.time.past { filter: sepia(.6); }
.scene.time.now .act { animation: wiggle .8s ease-in-out infinite; }
@keyframes wiggle { 0%,100% { transform: rotate(-8deg); } 50% { transform: rotate(8deg); } }
.row3 { display: flex; align-items: flex-end; justify-content: center; gap: 22px; min-height: 200px; width: 100%; }
.row3 .thing { display: flex; flex-direction: column; align-items: center; gap: 4px; transition: opacity .4s; }
.row3 .e { font-size: 84px; }
.row3 .thing .tag { font-size: 16px; font-weight: 800; color: var(--ink-soft); background: #eef2fa; border-radius: 999px; padding: 2px 10px; }
.row3 .thing.hide { opacity: 0; }
.flipcard { width: 180px; height: 180px; perspective: 600px; }
.flipcard .in { position: relative; width: 100%; height: 100%; transition: transform .6s; transform-style: preserve-3d; }
.flipcard.flipped .in { transform: rotateY(180deg); }
.flipcard .side { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 110px; background: var(--card-2); border-radius: 26px; backface-visibility: hidden; -webkit-backface-visibility: hidden; border: 4px solid var(--line); }
.flipcard .side.back { transform: rotateY(180deg); background: var(--accent-2); }
.control { min-height: 72px; font-size: 28px; }
.control.nudge { animation: nudge 1.4s ease-in-out infinite; }
@keyframes nudge { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
.sentence-box { display: flex; flex-direction: column; gap: 16px; justify-content: center; min-height: 0; }
.sentence { font-size: 38px; font-weight: 800; line-height: 1.45; background: var(--card); border-radius: 24px; padding: 18px 22px; text-align: center; box-shadow: 0 6px 0 var(--line); }
.sentence.old { font-size: 24px; font-weight: 700; color: var(--ink-soft); background: rgba(255,255,255,.7); box-shadow: none; }
.check-row { display: flex; justify-content: center; min-height: 72px; }

/* G3 Bug-Zapper Comic */
.comic { flex: 1; display: grid; gap: 14px; min-height: 0; grid-auto-rows: 1fr; }
.comic.n2 { grid-template-columns: repeat(2, 1fr); }
.comic.n3 { grid-template-columns: repeat(3, 1fr); }
.comic.n4 { grid-template-columns: repeat(2, 1fr); }
.cpanel { background: var(--card); border: 5px solid var(--ink); border-radius: 18px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; box-shadow: 6px 6px 0 rgba(29,35,64,.25); min-height: 0; overflow: hidden; }
.cpanel .art { flex: 1; display: flex; align-items: center; justify-content: center; font-size: clamp(64px, 12vh, 120px); min-height: 70px; }
.cpanel .cap { font-size: 28px; font-weight: 700; line-height: 1.5; display: flex; flex-wrap: wrap; gap: 2px 4px; align-content: flex-start; }
.cpanel .cap .line { flex-basis: 100%; height: 0; }
.cpanel.hint { animation: shake .5s ease 2; }
.tok { border: 0; background: transparent; border-radius: 10px; padding: 2px 5px; min-height: 48px; font-size: 28px; font-weight: 700; color: var(--ink); }
.tok:active { background: #eef2fa; }
.tok.fine { background: var(--good-bg); }
.tok.zapped { background: var(--glow); outline: 3px solid #f0b44c; }
.zap { position: absolute; font-size: 54px; pointer-events: none; animation: zap .6s ease forwards; z-index: 40; }
@keyframes zap { from { transform: scale(.4) rotate(-20deg); opacity: 1; } to { transform: scale(1.6) rotate(10deg); opacity: 0; } }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
.fixes { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; align-items: center; min-height: 90px; }
.fixes .label { font-size: 24px; font-weight: 800; color: var(--ink); background: rgba(255,255,255,.92); border-radius: 999px; padding: 8px 16px; }

/* End of session */
.stars-big { font-size: 84px; letter-spacing: 8px; }
.stars-big .s { display: inline-block; animation: pop .5s cubic-bezier(.3,1.5,.6,1) both; }
.stars-big .off { filter: grayscale(1); opacity: .35; }
.sticker { font-size: 130px; animation: spin .9s cubic-bezier(.3,1.5,.6,1); }
@keyframes spin { from { transform: scale(0) rotate(-180deg); } to { transform: scale(1) rotate(0); } }
.book { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 14px; padding: 16px; max-width: 900px; margin: 0 auto; width: 100%; }
.book .slot { aspect-ratio: 1; background: rgba(255,255,255,.9); border-radius: 20px; display: flex; align-items: center; justify-content: center; font-size: 58px; box-shadow: 0 5px 0 var(--line); }
.book .slot.empty { background: rgba(255,255,255,.35); box-shadow: none; font-size: 30px; color: rgba(255,255,255,.9); }

/* Parent area */
.parent { flex: 1; display: flex; flex-direction: column; min-height: 0; background: #f6f8fc; color: var(--ink); }
.parent .bar { background: var(--accent); }
.tabs { display: flex; gap: 6px; padding: 8px 12px 0; background: var(--accent); flex-wrap: wrap; }
.tabs button { border: 0; border-radius: 14px 14px 0 0; padding: 12px 18px; min-height: 56px; font-size: 19px; font-weight: 800; background: rgba(255,255,255,.25); color: #fff; }
.tabs button.on { background: #f6f8fc; color: var(--ink); }
.pbody { flex: 1; overflow: auto; -webkit-overflow-scrolling: touch; padding: 18px; }
.pbody h3 { margin: 18px 0 8px; font-size: 22px; }
.pbody p { margin: 6px 0; font-size: 18px; line-height: 1.4; }
.pcard { background: #fff; border-radius: 16px; padding: 16px; margin-bottom: 14px; box-shadow: 0 2px 8px rgba(0,0,0,.06); }
.banner { background: var(--look-bg); color: var(--look); border: 2px solid #f0b44c; border-radius: 14px; padding: 12px 16px; font-weight: 800; margin-bottom: 14px; font-size: 18px; }
table.prog { width: 100%; border-collapse: collapse; font-size: 16px; }
table.prog th, table.prog td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #e4e9f3; vertical-align: top; }
table.prog th { font-size: 14px; color: var(--ink-soft); text-transform: uppercase; letter-spacing: .4px; }
table.prog td.mist { font-size: 14px; color: var(--ink-soft); max-width: 260px; }
.field { display: flex; flex-direction: column; gap: 6px; margin: 12px 0; font-size: 18px; font-weight: 700; }
.field input[type=text], .field select, .field textarea { min-height: 56px; border-radius: 12px; border: 2px solid #cfd8ea; padding: 10px 12px; font-size: 18px; background: #fff; color: var(--ink); }
.field textarea { min-height: 120px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 13px; }
.field input[type=range] { width: 100%; min-height: 44px; }
.toggle { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 60px; font-size: 18px; font-weight: 700; border-bottom: 1px solid #e8edf6; }
.toggle input { width: 30px; height: 30px; }
.avatars { display: flex; gap: 8px; flex-wrap: wrap; }
.avatars button { width: 60px; height: 60px; font-size: 36px; border-radius: 14px; border: 3px solid transparent; background: #eef2fa; }
.avatars button.on { border-color: var(--accent); background: var(--accent-2); }
.pbtns { display: flex; gap: 12px; flex-wrap: wrap; margin: 10px 0; }
.pbtns .btn { font-size: 19px; min-height: 56px; padding: 8px 20px; }
.lock-ring { width: 120px; height: 120px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; font-size: 54px; background: conic-gradient(var(--accent) calc(var(--p, 0) * 1%), #e4e9f3 0); }
.lock-ring .inner { width: 96px; height: 96px; border-radius: 50%; background: #fff; display: flex; align-items: center; justify-content: center; }

#toast { position: fixed; left: 50%; top: 18px; transform: translateX(-50%) translateY(-120px); background: var(--ink); color: #fff; padding: 12px 22px; border-radius: 999px; font-size: 20px; font-weight: 700; z-index: 100; transition: transform .25s ease; max-width: calc(100% - 32px); text-align: center; }
#toast.show { transform: translateX(-50%) translateY(0); }

/* Portrait and smaller windows (NFR-10) */
@media (max-width: 900px), (orientation: portrait) {
  .mutator { grid-template-columns: 1fr; grid-template-rows: auto 1fr; overflow-y: auto; }
  .stage { height: 42vh; min-height: 260px; }
  .sentence-box { justify-content: flex-start; }
  .path { grid-template-columns: repeat(3, 1fr); }
  .comic.n3 { grid-template-columns: repeat(2, 1fr); }
  .sentence { font-size: 32px; }
  .title { font-size: 44px; }
}
@media (max-height: 700px) {
  :root { --prompt: 28px; }
  .belt-zone { height: 180px; }
  .scene .e { font-size: 54px; }
  .cpanel .art { font-size: 48px; min-height: 52px; }
  .btn.big { min-height: 88px; font-size: 34px; }
}
@media (max-width: 560px) {
  .path { grid-template-columns: repeat(2, 1fr); }
  .comic.n2, .comic.n3, .comic.n4 { grid-template-columns: 1fr; }
  .buckets { gap: 10px; }
  .bucket .sym { font-size: 44px; }
}

/* NFR-08: respect reduced motion */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; }
}
.reduce-motion *, .reduce-motion *::before, .reduce-motion *::after { animation: none !important; transition: none !important; }

// Small element builder: h('div', {class: 'x', onclick: fn}, 'text', child)
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v === undefined || v === null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else if (k === 'html') el.innerHTML = v;
      else if (v === true) el.setAttribute(k, '');
      else el.setAttribute(k, v);

    if (kid === null || kid === undefined || kid === false) continue;
    el.appendChild(kid instanceof Node ? kid : document.createTextNode(String(kid)));
