  return el;
}

function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pick(arr) {
  return arr[Math.floor(Math.random() * arr.length)];
}

function clamp(n, lo, hi) {
  return Math.max(lo, Math.min(hi, n));
}

function median(arr) {
  if (!arr.length) return null;
  const s = arr.slice().sort((a, b) => a - b);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}

// Local calendar day as YYYY-MM-DD. Days, not UTC, decide "played today".
function dayKey(t = Date.now()) {
  const d = new Date(t);
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}

function dayStart(t = Date.now()) {
  const d = new Date(t);
  d.setHours(0, 0, 0, 0);
  return d.getTime();
}

function daysBetween(a, b) {
  return Math.round((dayStart(b) - dayStart(a)) / DAY_MS);
}

function prettyDate(t) {
  if (!t) return 'never';
  const d = new Date(t);
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' });
}

function relDay(t) {
  if (!t) return '-';
  const n = daysBetween(Date.now(), t);
  if (n === 0) return 'today';
  if (n === 1) return 'tomorrow';
  if (n === -1) return 'yesterday';
  return n > 0 ? `in ${n} days` : `${-n} days ago`;
}

function sleep(ms) {
  return new Promise(r => setTimeout(r, ms));
}

function cap(s) {
  return s ? s[0].toUpperCase() + s.slice(1) : s;
}

function uid() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
}

function reducedMotion() {
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
}

let toastTimer = 0;
function toast(msg, ms = 2600) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.remove('show'), ms);
}

// UTF-8 safe base64, for the text-code backup.
function toBase64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}

function fromBase64(b64) {
  const bin = atob(b64.replace(/\s+/g, ''));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}

// Pointer helper: calls onTap for a short press without much movement.
// Mouse and finger share this one path (FR-16).
function onTap(el, fn) {
  let sx = 0;
  let sy = 0;
  let down = false;
  el.addEventListener('pointerdown', e => {
    down = true;
    sx = e.clientX;
    sy = e.clientY;
  });
  el.addEventListener('pointerup', e => {
    if (!down) return;
    down = false;
    if (Math.hypot(e.clientX - sx, e.clientY - sy) < 14) fn(e);
  });
  el.addEventListener('pointercancel', () => { down = false; });
  // Keyboard users (laptop) can press Enter or Space on a focused button.
  el.addEventListener('keydown', e => {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      fn(e);
    }
  });
  return el;
}

// ---- 01-store.js ----
// ---------------------------------------------------------------------------
// Store: one IndexedDB database on the device (section 7).
// ---------------------------------------------------------------------------
const Store = (() => {
  const DB_NAME = 'GrammarQuestDB';
  // Bump SCHEMA_VERSION and add a step to MIGRATIONS for every schema change.
  const SCHEMA_VERSION = 1;
  const STORES = ['meta', 'profiles', 'cards', 'attempts', 'rewards', 'flags', 'settings'];
  const BACKUP_FORMAT = 'grammar-quest-backup';
  const BACKUP_VERSION = 1;

  // Each step moves the database from version (index) to version (index + 1).
  // A step only adds. It never deletes data it does not understand.
  const MIGRATIONS = [
    (db) => {
      db.createObjectStore('meta', { keyPath: 'key' });
      db.createObjectStore('profiles', { keyPath: 'id' });
      db.createObjectStore('cards', { keyPath: ['profileId', 'node'] }).createIndex('profile', 'profileId');
      const at = db.createObjectStore('attempts', { keyPath: 'id', autoIncrement: true });
      at.createIndex('profile', 'profileId');
      at.createIndex('profileTime', ['profileId', 'ts']);
      db.createObjectStore('rewards', { keyPath: 'profileId' });
      db.createObjectStore('flags', { keyPath: 'id', autoIncrement: true });
      db.createObjectStore('settings', { keyPath: 'key' });
    },
  ];

  const DEFAULT_SETTINGS = {
    key: 'settings',
    voiceURI: null,
    rate: 0.85,          // FR-14
    minutes: 5,          // FR-03
    sounds: true,
    challenges: true,    // FR-29: the round is still only offered once a topic is Ready
    streak: false,       // FR-28
  };

  let db = null;
  let saveCount = 0;

  function req(r) {
    return new Promise((resolve, reject) => {
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  function open() {
    return new Promise((resolve, reject) => {
      if (!window.indexedDB) {
        reject(new Error('This browser has no IndexedDB, so progress cannot be saved.'));
        return;
      }
      const r = indexedDB.open(DB_NAME, SCHEMA_VERSION);
      r.onupgradeneeded = (e) => {
        const d = r.result;
        for (let v = e.oldVersion; v < SCHEMA_VERSION; v++) MIGRATIONS[v](d, r.transaction);
      };
      r.onsuccess = () => {
        db = r.result;
        db.onversionchange = () => db.close();
        resolve(db);
      };
      r.onerror = () => reject(r.error);
      r.onblocked = () => reject(new Error('Close other Grammar Quest tabs and try again.'));
    });
  }

  // Runs fn inside one transaction and resolves when it commits.
  function tx(names, mode, fn) {
    return new Promise((resolve, reject) => {
      const t = db.transaction(names, mode);
      let out;
      t.oncomplete = () => resolve(out);
      t.onerror = () => reject(t.error);
      t.onabort = () => reject(t.error || new Error('Save was cancelled'));
      const stores = {};
      for (const n of [].concat(names)) stores[n] = t.objectStore(n);
      out = fn(stores, t);
    });
  }

  async function get(store, key) {
    return tx(store, 'readonly', s => req(s[store].get(key))).then(r => r);
  }

  function getOne(store, key) {
    return new Promise((resolve, reject) => {
      const r = db.transaction(store).objectStore(store).get(key);
      r.onsuccess = () => resolve(r.result);
      r.onerror = () => reject(r.error);
    });
  }

  function getAll(store, index, query) {
    return new Promise((resolve, reject) => {
      const s = db.transaction(store).objectStore(store);
      const r = index ? s.index(index).getAll(query) : s.getAll();
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
  }

  function put(store, value) {
    return tx(store, 'readwrite', s => { s[store].put(value); });
  }

  function del(store, key) {
    return tx(store, 'readwrite', s => { s[store].delete(key); });
  }

  // App-level meta record. Runs data migrations when the stored schema is older.
  async function loadMeta() {
    let meta = await getOne('meta', 'meta');
    const now = Date.now();
    if (!meta) {
      meta = { key: 'meta', schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, firstRun: now, lastBackup: null, persisted: null };
      await put('meta', meta);
    } else if (meta.schemaVersion < SCHEMA_VERSION || meta.appVersion !== APP_VERSION) {
      meta.schemaVersion = SCHEMA_VERSION;
      meta.appVersion = APP_VERSION;
      await put('meta', meta);
    }
    return meta;
  }

  async function saveMeta(patch) {
    const meta = Object.assign(await getOne('meta', 'meta') || { key: 'meta' }, patch);
    await put('meta', meta);
    return meta;
  }

  async function loadSettings() {
    const s = await getOne('settings', 'settings');
    return Object.assign({}, DEFAULT_SETTINGS, s || {});
  }

  // Asks the browser to protect the data from clean-up. The iPad refused in
  // the device check, but asking costs nothing (section 7).
  async function requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) {
        const ok = await navigator.storage.persist();
        await saveMeta({ persisted: ok });
        return ok;
      }
    } catch (e) { /* not supported here */ }
    return false;
  }

  // One transaction per answer: the attempt and the topic card together.
  async function saveAnswer(attempt, card) {
    const id = await tx(['attempts', 'cards'], 'readwrite', s => {
      s.cards.put(card);
      return req(s.attempts.add(attempt));
    });
    saveCount++;
    if (saveCount % 50 === 0) trimAttempts(attempt.profileId).catch(() => {});
    return id;
  }

  // Keeps only the newest attempts per profile (section 7).
  async function trimAttempts(profileId) {
    const keys = await new Promise((resolve, reject) => {
      const r = db.transaction('attempts').objectStore('attempts').index('profile').getAllKeys(profileId);
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
    const extra = keys.length - CONFIG.attemptCap;
    if (extra <= 0) return 0;
    keys.sort((a, b) => a - b);
    await tx('attempts', 'readwrite', s => {
      for (const k of keys.slice(0, extra)) s.attempts.delete(k);
    });
    return extra;
  }

  async function deleteProfile(profileId) {
    const cards = await getAll('cards', 'profile', profileId);
    const attemptKeys = await new Promise((resolve, reject) => {
      const r = db.transaction('attempts').objectStore('attempts').index('profile').getAllKeys(profileId);
      r.onsuccess = () => resolve(r.result || []);
      r.onerror = () => reject(r.error);
    });
    await tx(['profiles', 'cards', 'attempts', 'rewards'], 'readwrite', s => {
      s.profiles.delete(profileId);
      s.rewards.delete(profileId);
      for (const c of cards) s.cards.delete([c.profileId, c.node]);
      for (const k of attemptKeys) s.attempts.delete(k);
    });
  }

  // ---- Backup and restore (FR-33 to FR-35) ----

  async function exportAll({ includeAttempts = true } = {}) {
    const stores = {};
    for (const n of STORES) {
      if (n === 'attempts' && !includeAttempts) continue;
      stores[n] = await getAll(n);
    }
    return {
      format: BACKUP_FORMAT,
      formatVersion: BACKUP_VERSION,
      appVersion: APP_VERSION,
      schemaVersion: SCHEMA_VERSION,
      exportedAt: new Date().toISOString(),
      hasAttempts: includeAttempts,
      stores,
    };
  }

  // Checks a backup and returns a summary to show before replacing anything.
  function inspectBackup(data) {
    if (!data || typeof data !== 'object') throw new Error('This is not a Grammar Quest backup.');
    if (data.format !== BACKUP_FORMAT) throw new Error('This is not a Grammar Quest backup.');
    if (typeof data.formatVersion !== 'number' || data.formatVersion > BACKUP_VERSION) {
      throw new Error('This backup comes from a newer version of Grammar Quest. Update the app first.');
    }
    const s = data.stores || {};
    if (!Array.isArray(s.profiles)) throw new Error('The backup has no players in it.');
    for (const n of ['cards', 'rewards', 'flags']) {
      if (s[n] !== undefined && !Array.isArray(s[n])) throw new Error(`The backup part "${n}" is damaged.`);
    }
    const lastPlayed = {};
    for (const r of s.rewards || []) {
      const days = (r.days || []).slice().sort();
      lastPlayed[r.profileId] = days[days.length - 1] || null;
    }
    return {
      exportedAt: data.exportedAt,
      appVersion: data.appVersion,
      hasAttempts: !!data.hasAttempts && Array.isArray(s.attempts),
      profiles: s.profiles.map(p => ({
        name: p.name,
        pic: p.pic,
        lastPlayed: lastPlayed[p.id] || null,
        stickers: ((s.rewards || []).find(r => r.profileId === p.id) || { stickers: [] }).stickers.length,
        stars: (s.cards || []).filter(c => c.profileId === p.id).reduce((n, c) => n + (c.stars || 0), 0),
      })),
      flags: (s.flags || []).length,
    };
  }

  // Replaces everything with the backup, in one transaction. A backup made
  // without the attempts log (the text code) keeps the attempts already here
  // for profiles that still exist.
  async function importAll(data) {
    inspectBackup(data);
    const s = data.stores;
    const keepAttempts = !(data.hasAttempts && Array.isArray(s.attempts));
    const keptAttempts = keepAttempts ? await getAll('attempts') : [];
    const profileIds = new Set(s.profiles.map(p => p.id));
    await tx(STORES, 'readwrite', st => {
      for (const n of STORES) st[n].clear();
      for (const n of STORES) {
        let rows = s[n] || [];
        if (n === 'attempts') rows = keepAttempts ? keptAttempts.filter(a => profileIds.has(a.profileId)) : rows;
        for (const row of rows) st[n].put(row);
      }
    });
    await saveMeta({ schemaVersion: SCHEMA_VERSION, appVersion: APP_VERSION, restoredAt: Date.now() });
  }

  return {
    open, get, getOne, getAll, put, del, tx, loadMeta, saveMeta, loadSettings, requestPersist,
    saveAnswer, trimAttempts, deleteProfile, exportAll, inspectBackup, importAll,
    SCHEMA_VERSION, BACKUP_FORMAT, DEFAULT_SETTINGS,
  };
})();

// ---- 02-scheduler.js ----
// ---------------------------------------------------------------------------
// Scheduler: FSRS-6 with its default parameters, one card per topic per
// profile (FR-20), plus Ready and stars (FR-25, FR-26).
// ---------------------------------------------------------------------------
const Scheduler = (() => {
  const W = [0.212, 1.2931, 2.3065, 8.2956, 6.4133, 0.8334, 3.0194, 0.001, 1.8722, 0.1666, 0.796,
    1.4835, 0.0614, 0.2629, 1.6483, 0.6014, 1.8729, 0.5425, 0.0912, 0.0658, 0.1542];
  const DECAY = -W[20];
  const FACTOR = Math.pow(0.9, 1 / DECAY) - 1;
  const RETENTION = 0.9;
  const MAX_INTERVAL = 365;
  const AGAIN = 1, HARD = 2, GOOD = 3, EASY = 4;
  const NAMES = { 1: 'Again', 2: 'Hard', 3: 'Good', 4: 'Easy' };

  const clampD = d => clamp(d, 1, 10);

  function retrievability(elapsedDays, s) {
    return Math.pow(1 + FACTOR * elapsedDays / s, DECAY);
  }

  function initStability(g) {
    return Math.max(W[g - 1], 0.1);
  }

  function initDifficulty(g) {
    return clampD(W[4] - Math.exp(W[5] * (g - 1)) + 1);
  }

  function nextDifficulty(d, g) {
    const delta = -W[6] * (g - 3);
    const damped = d + delta * (10 - d) / 9;
    return clampD(W[7] * initDifficulty(EASY) + (1 - W[7]) * damped);
  }

  function recallStability(d, s, r, g) {
    const hard = g === HARD ? W[15] : 1;
    const easy = g === EASY ? W[16] : 1;
    return s * (1 + Math.exp(W[8]) * (11 - d) * Math.pow(s, -W[9]) * (Math.exp((1 - r) * W[10]) - 1) * hard * easy);
  }

  function forgetStability(d, s, r) {
    const long = W[11] * Math.pow(d, -W[12]) * (Math.pow(s + 1, W[13]) - 1) * Math.exp((1 - r) * W[14]);
    const short = s / Math.exp(W[17] * W[18]);
    return Math.min(long, short);
  }

  // Same-day reviews use the short-term formula.
  function shortTermStability(s, g) {
    let inc = Math.exp(W[17] * (g - 3 + W[18])) * Math.pow(s, -W[19]);
    if (g >= GOOD) inc = Math.max(inc, 1);
    return s * inc;
  }

  function intervalDays(s) {
    const days = s / FACTOR * (Math.pow(RETENTION, 1 / DECAY) - 1);
    return clamp(Math.round(days), 1, MAX_INTERVAL);
  }

  function newFsrs() {
    return { due: null, stability: 0, difficulty: 0, reps: 0, lapses: 0, last: null };
  }

  // Returns a new FSRS state after one rating at time now.
  function review(f, g, now = Date.now()) {
    const out = Object.assign({}, f);
    if (!f.reps) {
      out.stability = initStability(g);
      out.difficulty = initDifficulty(g);
    } else {
      const elapsed = Math.max(0, (now - f.last) / DAY_MS);
      if (dayKey(now) === dayKey(f.last)) {
        out.stability = shortTermStability(f.stability, g);
      } else {
        const r = retrievability(elapsed, f.stability);
        out.stability = g === AGAIN ? forgetStability(f.difficulty, f.stability, r) : recallStability(f.difficulty, f.stability, r, g);
      }
      out.difficulty = nextDifficulty(f.difficulty, g);
    }
    out.stability = clamp(out.stability, 0.1, 36500);
    out.reps = (f.reps || 0) + 1;
    if (g === AGAIN && f.reps) out.lapses = (f.lapses || 0) + 1;
    out.last = now;
    out.due = dayStart(now) + intervalDays(out.stability) * DAY_MS;
    return out;
  }

  // FR-21: the rating comes from right or wrong plus time taken.
  function rate({ correct, ms, usualMs, streak, hinted }) {
    if (!correct) return AGAIN;
    if (hinted || ms > CONFIG.hardFactor * usualMs) return HARD;
    if (ms <= CONFIG.quickFactor * usualMs && streak >= CONFIG.easyStreak) return EASY;
    return GOOD;
  }

  function newCard(profileId, node) {
    return {
      profileId, node,
      fsrs: newFsrs(),
      stars: 0, ready: false, readyAt: null,
      last10: [],        // [{ok: 1 or 0, day: 'YYYY-MM-DD'}], newest last
      total: 0, right: 0, lastPlayed: null,
    };
  }

  // FR-25: 8 of the last 10 right, spread over at least 2 days.
  function isReadyNow(last10) {
    if (last10.length < CONFIG.readyWindow) return false;
    const right = last10.filter(a => a.ok).length;
    const days = new Set(last10.map(a => a.day)).size;
    return right >= CONFIG.readyNeed && days >= CONFIG.readyDays;
  }

  // Applies one answer to a card. Retries inside a session update the
  // answer history but not the FSRS schedule.
  function applyAnswer(card, { correct, rating, now = Date.now(), retry = false }) {
    const c = JSON.parse(JSON.stringify(card));
    if (!retry) c.fsrs = review(c.fsrs, rating, now);
    c.last10 = c.last10.concat([{ ok: correct ? 1 : 0, day: dayKey(now) }]).slice(-CONFIG.readyWindow);
    c.total += 1;
    if (correct) c.right += 1;
    c.lastPlayed = now;
    let event = null;
    if (!c.ready && isReadyNow(c.last10)) {
      c.ready = true;
      c.readyAt = now;
      event = 'ready';
    }
    let stars = Math.max(c.stars, 1);
    if (c.ready) stars = Math.max(stars, 2);
    // FR-26: three stars when still right at a review at least 7 days later.
    if (c.ready && correct && !retry && now - c.readyAt >= CONFIG.threeStarDays * DAY_MS) stars = 3;
    if (stars > c.stars && stars === 3) event = 'three';
    c.stars = stars;
    return { card: c, event };
  }

  function isDue(card, now = Date.now()) {
    return !!(card && card.fsrs && card.fsrs.reps && card.fsrs.due !== null && card.fsrs.due <= dayStart(now));
  }

  return { review, rate, newCard, applyAnswer, isDue, isReadyNow, intervalDays, NAMES, AGAIN, HARD, GOOD, EASY };
})();

// ---- 03-content.js ----
// ---------------------------------------------------------------------------
// Content: the item bank, read once at start-up (section 9), and the rules
// for picking items and building what the child sees and hears.
// ---------------------------------------------------------------------------
const Content = (() => {
  let bank = null;
  const byId = new Map();
  const byNode = new Map();

  const BUCKET_LOOK = {
    '.': { sym: '.', name: 'full stop' },
    '?': { sym: '?', name: 'question mark' },
    a: { sym: 'a', name: 'a' },
    an: { sym: 'an', name: 'an' },
    Statement: { sym: '💬', name: 'Statement' },
    Command: { sym: '📢', name: 'Command' },
    Question: { sym: '❓', name: 'Question' },
    One: { sym: '1️⃣', name: 'One' },
    'More than one': { sym: '🔢', name: 'More than one' },
    'Not right': { sym: '🗑️', name: 'Not right' },
  };

  // What the child hears for a sorter item (FR-13).
  const SORT_SAY = {
    W2: t => `${t}. A, or an?`,
    'S2-01': t => `${t}. Is it one, more than one, or not right?`,
    'S2-03': t => `${t}. Does it need a full stop, or a question mark?`,
    'S2-04': t => `${t} Is it a statement, a command, or a question?`,
  };
  const SORT_PROMPT = {
    W2: 'a or an?',
    'S2-01': 'One, more than one, or not right?',
    'S2-03': 'Full stop or question mark?',
    'S2-04': 'Statement, command or question?',
  };

  function load() {
    const el = document.getElementById('gq-bank');
    bank = JSON.parse(el.textContent);
    for (const n of bank.nodes) byNode.set(n.id, []);
    for (const it of bank.items) {
      byId.set(it.id, it);
      if (byNode.has(it.node)) byNode.get(it.node).push(it);
    }
    return bank;
  }

  const nodes = () => bank.nodes;
  const node = id => bank.nodes.find(n => n.id === id);
  const item = id => byId.get(id);
  const itemsFor = id => byNode.get(id) || [];

  function bucketLook(label) {
    return BUCKET_LOOK[label] || { sym: label, name: label };
  }

  function sortPrompt(it) {
    return it.prompt || SORT_PROMPT[it.node] || 'Where does it go?';
  }

  function sortSay(it) {
    if (it.say) return it.say;
    const f = SORT_SAY[it.node];
    return f ? f(it.text) : `${it.text}. Where does it go?`;
  }

  // The words a screen reader or the speech engine should say for a blank.
  function speakable(text) {
    return text.replace(/___/g, ', blank,').replace(/¶/g, '').replace(/[“”]/g, '');
  }

  // Stage gate (FR-06): a topic unlocks when every topic it needs is Ready.
  function isUnlocked(nodeId, cards) {
    const n = node(nodeId);
    return n.needs.every(dep => cards[dep] && cards[dep].ready);
  }

  // The current topic: the first unlocked stop on the path that is not Ready.
  function currentNode(cards) {
    for (const n of bank.nodes) {
      if (isUnlocked(n.id, cards) && !(cards[n.id] && cards[n.id].ready)) return n.id;
    }
    return null;
  }

  // Highest level a child should see for a topic right now.
  function levelCap(card) {
    if (!card || card.total < 4) return 1;
    if (card.ready) return 3;
    const recent = card.last10;
    const acc = recent.length ? recent.filter(a => a.ok).length / recent.length : 0;
    if (card.total >= 12 && acc >= 0.8) return 3;
    if (acc >= 0.6) return 2;
    return 1;
  }

  // Picks count items from a topic. Prefers items seen least and longest ago,
  // and never repeats an item inside one session.
  function pickItems(nodeId, count, { card, seen, used, game }) {
    const all = itemsFor(nodeId).filter(it => !used.has(it.id) && (!game || it.game === game));
    const cap = levelCap(card);
    let pool = all.filter(it => it.level <= cap);
    if (pool.length < count) pool = all;
    const scored = shuffle(pool).map(it => {
      const s = seen.get(it.id) || { n: 0, last: 0 };
      return { it, n: s.n, last: s.last, lvl: it.level };
    });
    // Fewest views first, then oldest view, then the higher allowed level
    // so the round stretches the child a little.
    scored.sort((a, b) => a.n - b.n || a.last - b.last || b.lvl - a.lvl);
    const picked = scored.slice(0, count).map(s => s.it);
    // Topics with two games mix both.
    const games = node(nodeId).games;
    if (!game && games.length > 1 && count >= 4) {
      const out = [];
      const half = Math.ceil(count / 2);
      for (const g of games) {
        out.push(...scored.filter(s => s.it.game === g).slice(0, g === games[0] ? half : count - half).map(s => s.it));
      }
      if (out.length === count) return out;
    }
    return picked;
  }

  return { load, nodes, node, item, itemsFor, bucketLook, sortPrompt, sortSay, speakable, isUnlocked, currentNode, levelCap, pickItems };
})();

// ---------------------------------------------------------------------------
// Checker: decides right or wrong. Every accepted answer is listed in the
// item, so checking is exact (section 3, answer input).
// ---------------------------------------------------------------------------
const Checker = (() => {
  function check(item, given) {
    if (item.answers.includes(given)) return { correct: true, note: null };
    const also = (item.alsoRight || []).find(a => a.answer === given);
    if (also) return { correct: true, note: also.note };
    return { correct: false, note: null };
  }

  // The answer to show after a wrong try.
  function rightAnswer(item) {
    return item.answers[0];
  }

  // A one-line note for the child when two answers are both fine (FR-11).
  function bothNote(item, given) {
    const also = (item.alsoRight || []).find(a => a.answer === given);
    return also ? also.note : null;
  }

  return { check, rightAnswer, bothNote };
})();

// ---- 04-speech.js ----
// ---------------------------------------------------------------------------
// Speech: read-aloud for every prompt (FR-13 to FR-15).
// ---------------------------------------------------------------------------
const Speech = (() => {
  const synth = window.speechSynthesis || null;
  let voices = [];
  let voice = null;
  let rate = 0.85;
  let chosenURI = null;
  let token = 0;
  let unlocked = false;
  let lastText = '';

  function loadVoices() {
    if (!synth) return [];
    voices = synth.getVoices().filter(v => /^en([-_]|$)/i.test(v.lang));
    voice = pickVoice(chosenURI);
    return voices;
  }

  // FR-14: offline British voice (Daniel on the iPad), then any British voice,
  // then any English voice. A voice the parent picked wins.
  function pickVoice(uri) {
    if (!voices.length) return null;
    if (uri) {
      const v = voices.find(x => x.voiceURI === uri);
      if (v) return v;
    }
    const gb = voices.filter(v => /en[-_]GB/i.test(v.lang));
    return gb.find(v => v.localService && /daniel/i.test(v.name))
      || gb.find(v => v.localService)
      || gb[0]
      || voices.find(v => v.localService)
      || voices[0];
  }

  function init(settings) {
    rate = settings.rate || 0.85;
    chosenURI = settings.voiceURI || null;
    if (!synth) return;
    loadVoices();
    if ('onvoiceschanged' in synth) synth.onvoiceschanged = loadVoices;
    // Some browsers fill the list late without firing the event.
    setTimeout(loadVoices, 600);
    setTimeout(loadVoices, 2000);
  }

  function configure({ voiceURI, rate: r }) {
    if (voiceURI !== undefined) chosenURI = voiceURI;
    if (r) rate = r;
    voice = pickVoice(chosenURI);
  }

  // Must run inside a tap the first time, for the iPad (FR-02).
  function unlock() {
    if (!synth || unlocked) return;
    unlocked = true;
    try {
      const u = new SpeechSynthesisUtterance(' ');
      u.volume = 0;
      synth.speak(u);
    } catch (e) { /* ignore */ }
  }

  function stop() {
    token++;
    if (synth) synth.cancel();
  }

  // Resolves when speech ends, or when a timer says it should have ended
  // (FR-15). The game never waits on the end event alone.
  function say(text, { interrupt = true } = {}) {
    const clean = Content.speakable(String(text || '')).trim();
    if (!clean) return Promise.resolve();
    lastText = clean;
    if (!synth) return sleep(Math.min(1500, clean.split(/\s+/).length * 200));
    const my = ++token;
    if (interrupt) synth.cancel();
    const words = clean.split(/\s+/).length;
    const budget = (words * CONFIG.speechMsPerWord) / rate + 1400;
    return new Promise(resolve => {
      let done = false;
      const finish = () => {
        if (done) return;
        done = true;
        resolve();
      };
      const u = new SpeechSynthesisUtterance(clean);
      if (voice) {
        u.voice = voice;
        u.lang = voice.lang;
      } else {
        u.lang = 'en-GB';
      }
      u.rate = rate;
      u.onend = finish;
      u.onerror = finish;
      setTimeout(finish, budget);
      // On iPad a cancel right before speak can swallow the new utterance.
      setTimeout(() => {
        if (my !== token) return finish();
        try { synth.speak(u); } catch (e) { finish(); }
      }, interrupt ? 60 : 0);
    });
  }

  function replay() {
    return say(lastText);
  }

  function list() {
    return voices.map(v => ({ uri: v.voiceURI, name: v.name, lang: v.lang, offline: v.localService }));
  }

  return {
    init, configure, unlock, say, stop, replay, list,
    get voiceName() { return voice ? `${voice.name} (${voice.lang})` : 'browser default'; },
    available: !!synth,
  };
})();

// ---------------------------------------------------------------------------
// Sound: short effects made with Web Audio, so no files are needed.
// ---------------------------------------------------------------------------
const Sound = (() => {
  let ctx = null;
  let on = true;

  function setOn(v) {
    on = !!v;
  }

  function ensure() {
    if (!ctx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return null;
      ctx = new AC();
    }
    if (ctx.state === 'suspended') ctx.resume();
    return ctx;
  }

  function tone(freq, start, dur, type = 'sine', gain = 0.18) {
    const c = ensure();
    if (!c) return;
    const o = c.createOscillator();
    const g = c.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, c.currentTime + start);
    g.gain.setValueAtTime(0.0001, c.currentTime + start);
    g.gain.exponentialRampToValueAtTime(gain, c.currentTime + start + 0.02);
    g.gain.exponentialRampToValueAtTime(0.0001, c.currentTime + start + dur);
    o.connect(g).connect(c.destination);
    o.start(c.currentTime + start);
    o.stop(c.currentTime + start + dur + 0.05);
  }

  const effects = {
    tap: () => tone(660, 0, 0.07, 'triangle', 0.12),
    right: () => { tone(523, 0, 0.14); tone(784, 0.11, 0.22); },
    // Gentle, low and soft. Never a buzzer (FR-12).
    look: () => { tone(392, 0, 0.16, 'sine', 0.12); tone(330, 0.14, 0.22, 'sine', 0.1); },
    zap: () => { tone(1200, 0, 0.06, 'square', 0.06); tone(900, 0.05, 0.08, 'square', 0.05); },
    whoosh: () => tone(300, 0, 0.18, 'triangle', 0.08),
    pop: () => tone(880, 0, 0.06, 'sine', 0.1),
    sticker: () => [523, 659, 784, 1047].forEach((f, i) => tone(f, i * 0.1, 0.25)),
    star: () => tone(1047, 0, 0.18, 'triangle', 0.12),
  };

  function play(name) {
    if (!on) return;
    try { effects[name] && effects[name](); } catch (e) { /* audio is optional */ }
  }

  return { play, setOn, unlock: ensure };
})();

// ---- 05-engine.js ----
// ---------------------------------------------------------------------------
// Session engine. Screens and games talk only to this module, and only this
// module talks to content, the checker and the scheduler (section 9).
// ---------------------------------------------------------------------------
const STICKERS = ['🦁', '🐯', '🐼', '🐨', '🦊', '🐸', '🐙', '🦄', '🐳', '🦋', '🐝', '🐞', '🦖', '🐢', '🦉', '🐧',
  '🐬', '🦩', '🌈', '⭐', '🌟', '☀️', '🌙', '🍀', '🌻', '🌸', '🍉', '🍓', '🍩', '🧁', '🍦', '🎈', '🎁', '🎨',
  '🎸', '🥁', '🚀', '🛸', '⚽', '🏀', '🎯', '🪁', '🧸', '🪀', '🏆', '👑', '💎', '🎠', '🎡', '🚂', '🚁', '⛵',
  '🏰', '🗺️', '🦕', '🐉', '🐠', '🦜', '🐿️', '🦔'];

const Engine = (() => {
  let ctx = null;   // the loaded profile: cards, attempts, rewards
  let S = null;     // the running session

  // ---- Profile state ----

  async function loadProfile(profile) {
    const [cardRows, attempts, rewards] = await Promise.all([
      Store.getAll('cards', 'profile', profile.id),
      Store.getAll('attempts', 'profile', profile.id),
      Store.getOne('rewards', profile.id),
    ]);
    const cards = {};
    for (const c of cardRows) cards[c.node] = c;
    attempts.sort((a, b) => a.ts - b.ts);
    ctx = {
      profile,
      cards,
      attempts,
      rewards: rewards || { profileId: profile.id, stickers: [], days: [] },
      seen: new Map(),
      usual: {},
    };
    for (const a of attempts) noteSeen(a);
    for (const g of ['G1', 'G2', 'G3']) ctx.usual[g] = usualTime(g);
    return ctx;
  }

  function noteSeen(a) {
    const s = ctx.seen.get(a.itemId) || { n: 0, last: 0 };
    s.n += 1;
    s.last = Math.max(s.last, a.ts);
    ctx.seen.set(a.itemId, s);
  }

  // The child's usual time for a game: the median of recent right answers.
  function usualTime(game) {
    const times = ctx.attempts.filter(a => a.game === game && a.correct && !a.retry).slice(-20).map(a => a.ms);
    return times.length >= 5 ? median(times) : CONFIG.defaultUsualMs[game];
  }

  function cardFor(node) {
    return ctx.cards[node] || null;
  }

  function dueNodes(exclude) {
    return Content.nodes()
      .map(n => n.id)
      .filter(id => id !== exclude && Scheduler.isDue(ctx.cards[id]))
      .sort((a, b) => ctx.cards[a].fsrs.due - ctx.cards[b].fsrs.due);
  }

  // ---- Planning a session (FR-03, FR-04, FR-08, FR-23, FR-24) ----

  function sessionSize(settings) {
    return clamp(Math.round((settings.minutes || 5) * 2), 6, 20);
  }

  function itemsToRounds(items, review) {
    const rounds = [];
    for (const it of items) {
      const last = rounds[rounds.length - 1];
      if (it.game === 'G1' && last && last.game === 'G1' && last.node === it.node && last.review === review) {
        last.questions.push({ item: it, review, retry: false });
      } else {
        rounds.push({ game: it.game, node: it.node, review, questions: [{ item: it, review, retry: false }] });
      }
    }
    return rounds;
  }

  function plan(settings, { mode = 'play', node = null } = {}) {
    const used = new Set();
    const pickOpts = n => ({ card: ctx.cards[n], seen: ctx.seen, used });
    const take = (n, count) => {
      const items = Content.pickItems(n, count, pickOpts(n));
      items.forEach(it => used.add(it.id));
      return items;
    };

    if (mode === 'challenge') {
      const items = take(node, 20);
      return { mode, mainNode: node, total: items.length, rounds: itemsToRounds(items, false) };
    }

    const N = sessionSize(settings);
    const current = mode === 'stop' ? node : Content.currentNode(ctx.cards);
    const due = dueNodes(current);
    const reviewBudget = due.length ? (current ? Math.round(N * CONFIG.reviewShare) : N) : 0;
    const bursts = [];
    if (reviewBudget) {
      const topicCount = Math.min(due.length, CONFIG.maxReviewTopics, Math.max(1, Math.floor(reviewBudget / 3)));
      let left = reviewBudget;
      for (let i = 0; i < topicCount; i++) {
        const size = clamp(Math.round(left / (topicCount - i)), 3, 4);
        bursts.push({ node: due[i], size });
        left -= size;
      }
    }
    const rounds = [];
    let total = 0;
    // Due reviews come first (FR-08).
    for (const b of bursts) {
      const items = take(b.node, b.size);
      total += items.length;
      rounds.push(...itemsToRounds(items, true));
    }
    let mainNode = current;
    let left = N - total;
    if (!current && left > 0) {
      // Everything unlocked is Ready and nothing is due: free practice on the
      // Ready topic played least recently.
      const ready = Content.nodes().map(n => n.id).filter(id => ctx.cards[id] && ctx.cards[id].ready)
        .sort((a, b) => (ctx.cards[a].lastPlayed || 0) - (ctx.cards[b].lastPlayed || 0));
      mainNode = ready[0] || Content.nodes()[0].id;
    }
    if (left > 0 && mainNode) {
      const items = take(mainNode, left);
      total += items.length;
      rounds.push(...itemsToRounds(items, false));
    }
    if (!mainNode && bursts.length) mainNode = bursts[0].node;
    return { mode, mainNode, total, rounds, reviewNodes: bursts.map(b => b.node) };
  }

  // ---- Running a session ----

  function start(settings, opts) {
    const p = plan(settings, opts);
    S = {
      id: uid(),
      startedAt: Date.now(),
      plan: p,
      queue: p.rounds.slice(),
      results: [],
      pending: [],
      streak: {},
      retried: new Set(),
      events: [],
      deadline: p.mode === 'challenge' ? Date.now() + CONFIG.challengeSeconds * 1000 : null,
    };
    return S;
  }

  function nextRound() {
    if (!S) return null;
    if (timeUp()) return null;
    return S.queue.shift() || null;
  }

  function timeUp() {
    return !!(S && S.deadline && Date.now() >= S.deadline);
  }

  function progress() {
    if (!S) return { done: 0, total: 0 };
    const done = S.results.filter(r => !r.retry).length;
    return { done, total: S.plan.total };
  }

  // Records one answer. Feedback can start at once: the check and the new
  // schedule are worked out here, and the save runs in the background.
  function answer(q, given, ms, { hinted = false } = {}) {
    const it = q.item;
    const res = Checker.check(it, given);
    const now = Date.now();
    const node = it.node;
    if (!q.retry) S.streak[node] = res.correct ? (S.streak[node] || 0) + 1 : 0;
    const rating = Scheduler.rate({
      correct: res.correct, ms, usualMs: ctx.usual[it.game] || CONFIG.defaultUsualMs[it.game],
      streak: S.streak[node] || 0, hinted,
    });
    const before = ctx.cards[node] || Scheduler.newCard(ctx.profile.id, node);
    const { card, event } = Scheduler.applyAnswer(before, { correct: res.correct, rating, now, retry: q.retry });
    ctx.cards[node] = card;
    const attempt = {
      profileId: ctx.profile.id, itemId: it.id, node, game: it.game, given,
      correct: res.correct, ms: Math.round(ms), ts: now,
      rating: q.retry ? null : rating, retry: !!q.retry, review: !!q.review, session: S.id,
    };
    ctx.attempts.push(attempt);
    noteSeen(attempt);
    if (res.correct && !q.retry) ctx.usual[it.game] = usualTime(it.game);
    S.results.push({ itemId: it.id, node, correct: res.correct, retry: !!q.retry, rating });
    if (event) S.events.push({ event, node });
    const save = Store.saveAnswer(attempt, card).catch(err => {
      console.error(err);
      toast('Could not save that answer. Check the storage space on this device.');
    });
    S.pending.push(save);
    // A wrong item comes back later in the session (FR-12). The sorter
    // brings its own items back inside the belt round.
    if (!res.correct && !q.retry && it.game !== 'G1' && !S.retried.has(it.id) && !S.deadline) {
      S.retried.add(it.id);
      S.queue.push({ game: it.game, node, review: q.review, questions: [{ item: it, review: q.review, retry: true }] });
    }
    return {
      correct: res.correct,
      note: res.note,
      rating,
      event,
      right: Checker.rightAnswer(it),
      explain: it.explain,
    };
  }

  // FR-38: saves the question id, the answer given and the date.
  async function flag(item, given) {
    await Store.put('flags', {
      itemId: item.id, node: item.node, given: given === undefined ? null : given,
      ts: Date.now(), profileId: ctx ? ctx.profile.id : null,
    }).catch(() => {});
  }

  // ---- Ending a session (FR-05, FR-27) ----

  async function finish() {
    await Promise.all(S.pending);
    const first = S.results.filter(r => !r.retry);
    const right = first.filter(r => r.correct).length;
    const ratio = first.length ? right / first.length : 0;
    const stars = ratio >= 0.9 ? 3 : ratio >= 0.6 ? 2 : 1;
    const r = ctx.rewards;
    const owned = new Set(r.stickers.map(s => s.e));
    const fresh = STICKERS.filter(s => !owned.has(s));
    const sticker = pick(fresh.length ? fresh : STICKERS);
    const today = dayKey();
    r.stickers.push({ e: sticker, day: today, stars });
    if (!r.days.includes(today)) r.days.push(today);
    r.days = r.days.slice(-400);
    await Store.put('rewards', r);
    const nodes = [S.plan.mainNode].concat(S.plan.reviewNodes || []).filter(Boolean);
    const main = Content.node(nodes[0]);
    let sentence = main ? main.practised : 'Well done today.';
    if (S.plan.reviewNodes && S.plan.reviewNodes.length && main) {
      const other = Content.node(S.plan.reviewNodes[0]);
      if (other && other.id !== main.id) sentence += ` You also looked again at ${other.title.toLowerCase()}.`;
    }
    const result = { stars, sticker, sentence, right, total: first.length, events: S.events.slice(), mode: S.plan.mode };
    S = null;
    return result;
  }

  function abandon() {
    const pending = S ? S.pending : [];
    S = null;
    return Promise.all(pending);
  }

  // ---- Read-only views for screens ----

  function weekDays() {
    const days = new Set(ctx.rewards.days);
    const now = new Date();
    const monday = new Date(now);
    monday.setHours(0, 0, 0, 0);
    monday.setDate(now.getDate() - ((now.getDay() + 6) % 7));
    const out = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(monday.getTime());
      d.setDate(monday.getDate() + i);
      const key = dayKey(d.getTime());
      out.push({ key, label: 'MTWTFSS'[i], played: days.has(key), today: key === dayKey() });
    }
    return out;
  }

  // FR-28: a streak with one free day off in each Monday-to-Sunday week.
  function streak() {
    const days = new Set(ctx.rewards.days);
    let count = 0;
    const freeUsed = new Set();
    const d = new Date();
    d.setHours(12, 0, 0, 0);
    if (!days.has(dayKey(d.getTime()))) d.setDate(d.getDate() - 1);
    for (let i = 0; i < 800; i++) {
      const key = dayKey(d.getTime());
      if (days.has(key)) count++;
      else {
        const monday = new Date(d);
        monday.setDate(d.getDate() - ((d.getDay() + 6) % 7));
        const wk = dayKey(monday.getTime());
        if (freeUsed.has(wk)) break;
        freeUsed.add(wk);
      }
      d.setDate(d.getDate() - 1);
    }
    return count;
  }

  function nodeView(id) {
    const c = ctx.cards[id];
    return {
      id,
      stars: c ? c.stars : 0,
      ready: !!(c && c.ready),
      unlocked: Content.isUnlocked(id, ctx.cards),
      due: Scheduler.isDue(c),
      played: !!(c && c.total),
    };
  }

  return {
    loadProfile, plan, start, nextRound, answer, flag, finish, abandon, progress, timeUp,
    weekDays, streak, nodeView, cardFor,
    get ctx() { return ctx; },
    get session() { return S; },
    currentNode: () => Content.currentNode(ctx.cards),
    dueNodes,
  };
})();

// ---- 06-games.js ----
// ---------------------------------------------------------------------------
// Games: G1 Conveyor-Belt Sorter, G2 Picture-Mutator Sandbox, G3 Bug-Zapper
// Comic (section 5.3). Each game gets a container, a round and an api from
// the session screen, and resolves when the round is over.
// ---------------------------------------------------------------------------
const Games = (() => {
  const PRAISE = ['Yes, well done.', 'Great job.', 'That is right.', 'Brilliant.', 'Super.', 'You got it.', 'Well spotted.'];

  // Instant feedback (FR-09 to FR-12): a sound, a short animation and one
  // spoken sentence. After a wrong answer the right one is shown and said
  // with its rule, and the child taps Next.
  function feedback(root, res, { right, spoken }) {
    return new Promise(resolve => {
      const good = res.correct;
      Sound.play(good ? 'right' : 'look');
      const msg = h('div', { class: 'msg' });
      const praise = pick(PRAISE);
      if (good) {
        msg.append(h('b', null, praise));
        if (res.note) msg.append(h('br'), res.note);
      } else {
        msg.append('The answer is ', h('b', null, right), '.', h('br'), res.explain);
      }
      const panel = h('div', { class: `feedback ${good ? 'good' : 'look'}`, role: 'status' },
        h('div', { class: 'big', 'aria-hidden': 'true' }, good ? '🌟' : '💡'), msg);
      let closed = false;
      const close = () => {
        if (closed) return;
        closed = true;
        panel.remove();
        resolve();
      };
      const speech = Speech.say(good ? [praise, res.note, spoken].filter(Boolean).join(' ') : spoken);
      if (good) {
        Promise.all([speech, sleep(1000)]).then(close);
        panel.addEventListener('click', () => { Speech.stop(); close(); });
      } else {
        const next = h('button', { class: 'btn green' }, 'Next ▶');
        next.addEventListener('click', () => { Speech.stop(); close(); });
        panel.append(next);
      }
      root.appendChild(panel);
    });
  }

  // The changed words glow, so the child sees the link (G2 rules).
  function glowDiff(before, after) {
    const norm = w => w.toLowerCase().replace(/[^a-z0-9]/g, '');
    const old = new Set(before.split(' ').map(norm));
    const out = [];
    after.split(' ').forEach((w, i) => {
      if (i) out.push(' ');
      out.push(old.has(norm(w)) ? w : h('span', { class: 'glow' }, w));
    });
    return out;
  }

  // ===================== G1 Conveyor-Belt Sorter =====================
  // The belt starts slow and speeds up after 3 right in a row. A missed or
  // wrong item comes back later in the round. No game over.
  async function sorter(root, round, api) {
    const node = Content.node(round.node);
    const queue = round.questions.map(q => Object.assign({ misses: 0 }, q));
    const reduce = reducedMotion();
    let speedLevel = 0;
    let run = 0;
    let active = null;

    root.innerHTML = '';
    const prompt = h('div', { class: 'prompt' }, Content.sortPrompt(queue[0].item));
    const zone = h('div', { class: 'belt-zone' });
    zone.append(h('div', { class: 'belt' + (reduce ? '' : ' run') }), h('div', { class: 'belt-end', 'aria-hidden': 'true' }, '↩️'));
    const speedEl = h('div', { class: 'speed', 'aria-live': 'polite' }, '');
    const bucketEls = node.buckets.map(b => {
      const look = Content.bucketLook(b);
      const el = h('button', { class: 'bucket', 'data-b': b, 'aria-label': look.name },
        h('div', { class: 'sym', 'aria-hidden': 'true' }, look.sym),
        look.sym !== look.name ? h('div', { class: 'name' }, look.name) : null);
      el.addEventListener('click', () => {
        if (!active || active.done) return;
        if (active.picked) active.drop(b);
        else {
          Sound.play('tap');
          Speech.say(`${look.name}. Tap the card first, then tap where it goes.`);
        }
      });
      return el;
    });
    root.append(prompt, zone, speedEl, h('div', { class: 'buckets' }, bucketEls));

    const bucketAt = (x, y) => bucketEls.find(el => {
      const r = el.getBoundingClientRect();
      return x >= r.left && x <= r.right && y >= r.top && y <= r.bottom;
    });
    const lit = el => bucketEls.forEach(b => b.classList.toggle('over', b === el));

    function present(q) {
      return new Promise(resolve => {
        const it = q.item;
        const card = h('div', { class: 'card', role: 'button', tabindex: '0', 'aria-label': it.text },
          it.pic ? h('div', { class: 'pic', 'aria-hidden': 'true' }, it.pic) : null,
          h('div', { class: 'txt' }, it.text));
        zone.appendChild(card);
        const st = { picked: false, dragging: false, done: false, x: 0, t0: performance.now(), last: 0, moving: !reduce && q.misses < 2 };
        active = st;
        const sayText = Content.sortSay(it);
        prompt.textContent = Content.sortPrompt(it);
        api.setCurrent({ item: it, given: () => null, say: sayText });
        Speech.say(sayText);
        const maxX = () => Math.max(0, zone.clientWidth - card.offsetWidth - 8);
        if (!st.moving) st.x = maxX() / 2;
        const place = (dx = 0, dy = 0) => { card.style.transform = `translate(${st.x + dx}px, ${dy}px)`; };
        place();
        const duration = clamp(16000 * Math.pow(0.85, speedLevel), 7000, 16000);

        const tick = now => {
          if (st.done) return;
          const dt = st.last ? now - st.last : 0;
          st.last = now;
          if (st.moving && !st.picked && !st.dragging) {
            st.x += (maxX() / duration) * dt;
            if (st.x >= maxX()) {
              st.x = maxX();
              place();
              missed();
              return;
            }
            place();
          }
          requestAnimationFrame(tick);
        };
        requestAnimationFrame(tick);

        function finish(outcome) {
          st.done = true;
          active = null;
          card.remove();
          resolve(outcome);
        }

        function missed() {
          st.done = true;
          Sound.play('whoosh');
          speedEl.textContent = 'That one comes back later.';
          card.style.transition = 'opacity .4s';
          card.style.opacity = '0';
          setTimeout(() => finish('missed'), 450);
        }

        function togglePick() {
          st.picked = !st.picked;
          card.classList.toggle('picked', st.picked);
          Sound.play('tap');
          if (st.picked) Speech.say(`${it.text}. Now tap where it goes.`);
        }

        st.drop = async (b) => {
          if (st.done) return;
          st.done = true;
          const res = api.answer(q, b, performance.now() - st.t0);
          const target = bucketEls.find(el => el.dataset.b === b);
          if (res.correct) {
            if (!q.retry) run++;
            if (!q.retry && run % 3 === 0) {
              speedLevel++;
              speedEl.textContent = '⚡ The belt goes faster now.';
            } else speedEl.textContent = '';
            const c = card.getBoundingClientRect();
            const t = target.getBoundingClientRect();
            const dx = t.left + t.width / 2 - (c.left + c.width / 2);
            const dy = t.top + t.height / 2 - (c.top + c.height / 2);
            card.style.transition = 'transform .35s ease-in, opacity .35s ease-in';
            card.style.transform = `translate(${st.x + dx}px, ${dy}px) scale(.3)`;
            card.style.opacity = '0';
            target.classList.add('gulp');
            setTimeout(() => target.classList.remove('gulp'), 450);
            await feedback(root.parentNode, res, {});
            finish('right');
          } else {
            run = 0;
            speedEl.textContent = '';
            card.classList.remove('picked');
            card.animate && card.animate([{ marginLeft: '0' }, { marginLeft: '-10px' }, { marginLeft: '10px' }, { marginLeft: '0' }], { duration: 300 });
            const look = Content.bucketLook(res.right);
            await feedback(root.parentNode, res, { right: look.name, spoken: `It goes in ${look.name}. ${res.explain}` });
            finish('wrong');
          }
          api.progress();
        };

        // One pointer path for mouse and finger (FR-16). A short press is a
        // tap that picks the card (FR-17), a longer move is a drag.
        let pid = null;
        let sx = 0;
        let sy = 0;
        let moved = false;
        card.addEventListener('pointerdown', e => {
          if (st.done) return;
          pid = e.pointerId;
          sx = e.clientX;
          sy = e.clientY;
          moved = false;
          try { card.setPointerCapture(pid); } catch (err) { /* old browsers */ }
          e.preventDefault();
        });
        card.addEventListener('pointermove', e => {
          if (pid !== e.pointerId || st.done) return;
          const dx = e.clientX - sx;
          const dy = e.clientY - sy;
          if (!moved && Math.hypot(dx, dy) > 12) {
            moved = true;
            st.dragging = true;
            card.classList.add('dragging');
          }
          if (moved) {
            place(dx, dy);
            lit(bucketAt(e.clientX, e.clientY));
          }
        });
        const up = e => {
          if (pid !== e.pointerId) return;
          pid = null;
          if (st.done) return;
          if (moved) {
            st.dragging = false;
            card.classList.remove('dragging');
            const b = e.type === 'pointerup' ? bucketAt(e.clientX, e.clientY) : null;
            lit(null);
            if (b) st.drop(b.dataset.b);
            else place();
          } else if (e.type === 'pointerup') {
            togglePick();
          }
        };
        card.addEventListener('pointerup', up);
        card.addEventListener('pointercancel', up);
        card.addEventListener('keydown', e => {
          if (e.key === 'Enter' || e.key === ' ') {
            e.preventDefault();
            togglePick();
          }
        });
      });
    }

    while (queue.length && !api.shouldStop()) {
      const q = queue.shift();
      const outcome = await present(q);
      if (outcome === 'missed') {
        q.misses++;
        queue.splice(Math.min(2, queue.length), 0, q);
      } else if (outcome === 'wrong' && !q.retry && !api.shouldStop()) {
        queue.splice(Math.min(2, queue.length), 0, Object.assign({}, q, { retry: true, misses: 0 }));
      }
    }
  }

  // ===================== G2 Picture-Mutator Sandbox =====================
  const Scenes = {
    render(el, sc, state) {
      const at = state === 'to' ? sc.to : sc.from;
      el.className = `scene ${sc.type}`;
      if (sc.type === 'count') {
        if (!el.dataset.ready) {
          el.innerHTML = '';
          el.dataset.ready = '1';
        }
        let n = $$('.e', el).length;
        while (n < at) {
          el.append(h('span', { class: 'e pop', 'aria-hidden': 'true' }, sc.e));
          n++;
        }
        while (n > at) {
          el.lastChild.remove();
          n--;
        }
        $$('.e', el).forEach(e => { e.style.fontSize = at > 4 ? '56px' : ''; });
        el.setAttribute('aria-label', `${at}`);
        return null;
      }
      el.innerHTML = '';
      if (sc.type === 'time') {
        const labels = [['everyday', '📅 Every day'], ['yesterday', '⏪ Yesterday'], ['now', '⏱️ Right now']];
        el.append(
          h('div', { style: { display: 'flex', alignItems: 'center', gap: '10px' } },
            h('span', { class: 'who', 'aria-hidden': 'true' }, sc.who),
            h('span', { class: 'act', 'aria-hidden': 'true' }, sc.e)),
          h('div', { class: 'timeline' }, labels.map(([k, t]) => h('span', { class: k === at ? 'on' : '' }, t))));
        el.style.flexDirection = 'column';
        if (at === 'yesterday') el.classList.add('past');
        if (at === 'now') el.classList.add('now');
      } else if (sc.type === 'compare') {
        const scales = {
          grow: i => `scale(${[1, 1.35, 1.75][i]})`,
          shrink: i => `scale(${[1.75, 1.3, 0.85][i]})`,
          wide: i => `scaleX(${[1, 1.5, 2.1][i]})`,
          narrow: i => `scaleX(${[2.1, 1.5, 1][i]})`,
          up: i => `translateY(${[0, -40, -80][i]}px)`,
          down: i => `translateY(${[-80, -40, 0][i]}px)`,
          row: () => '',
        };
        const row = h('div', { class: 'row3' });
        sc.things.forEach((t, i) => {
          const e = h('span', { class: 'e', 'aria-hidden': 'true', style: { transform: scales[sc.mode](i), transformOrigin: 'bottom center' } }, t.e);
          const meter = sc.mode === 'row' ? h('div', { class: 'tag', 'aria-hidden': 'true' }, '●'.repeat(i + 1) + '○'.repeat(2 - i)) : null;
          row.append(h('div', { class: 'thing' + (i < at ? '' : ' hide') }, e, meter, h('div', { class: 'tag' }, t.n)));
        });
        el.append(row);
      } else if (sc.type === 'amount') {
        const grid = h('div', { class: 'grid10', 'aria-hidden': 'true' });
        for (let i = 0; i < sc.total; i++) grid.append(h('span', { class: 'e' + (i < at ? ' pop' : '') }, i < at ? sc.on : sc.off));
        el.style.flexDirection = 'column';
        el.append(grid, h('div', { class: 'counter' }, `${sc.on} ${at} out of ${sc.total}`));
      } else if (sc.type === 'flip') {
        // Fit one to four emoji inside the card.
        const fit = e => ({ fontSize: ['110px', '110px', '72px', '52px', '40px'][Math.min(4, emojiCount(e))] });
        const card = h('div', { class: 'flipcard' + (state === 'to' ? ' flipped' : ''), 'aria-hidden': 'true' },
          h('div', { class: 'in' }, h('div', { class: 'side', style: fit(sc.from) }, sc.from), h('div', { class: 'side back', style: fit(sc.to) }, sc.to)));
        el.append(card);
      }
      return null;
    },
  };

  function emojiCount(text) {
    if (window.Intl && Intl.Segmenter) return Array.from(new Intl.Segmenter('en', { granularity: 'grapheme' }).segment(text)).length;
    return Array.from(text.replace(/️|‍/g, '')).length;
  }

  const CONTROL_ICON = { count: '🔢', time: '⏳', compare: '➡️', amount: '🎨', flip: '🔄' };

  function mutate(root, q, api) {
    return new Promise(resolve => {
      const it = q.item;
      let state = 'from';
      let picked = null;
      let tStart = null;
      let done = false;
      root.innerHTML = '';
      const scene = h('div', { class: 'scene' });
      const control = h('button', { class: 'btn purple control nudge' }, `${CONTROL_ICON[it.scene.type] || '👆'} ${it.control}`);
      const stage = h('div', { class: 'stage' }, scene, control);
      const oldS = h('div', { class: 'sentence old hidden' });
      const sent = h('div', { class: 'sentence', 'aria-live': 'polite' }, it.before);
      const choices = h('div', { class: 'choices hidden' });
      const checkBtn = h('button', { class: 'btn green hidden' }, '✓ Check');
      root.append(h('div', { class: 'mutator' }, stage,
        h('div', { class: 'sentence-box' }, oldS, sent, choices, h('div', { class: 'check-row' }, checkBtn))));
      Scenes.render(scene, it.scene, 'from');

      const intro = `${it.before} Tap the button: ${it.control}.`;
      api.setCurrent({ item: it, given: () => picked, say: intro });
      Speech.say(intro);

      const renderBlank = () => {
        sent.innerHTML = '';
        const [a, b] = it.after.split('___');
        sent.append(a, h('span', { class: 'blank' + (picked ? ' filled' : '') }, picked || ' '), b);
      };

      // One control per screen. It can be flipped back and forth.
      control.addEventListener('click', () => {
        if (done) return;
        Sound.play('whoosh');
        control.classList.remove('nudge');
        state = state === 'from' ? 'to' : 'from';
        Scenes.render(scene, it.scene, state);
        control.textContent = state === 'to' ? '↩️ Back' : `${CONTROL_ICON[it.scene.type] || '👆'} ${it.control}`;
        if (state === 'to') {
          if (!tStart) tStart = performance.now();
          oldS.textContent = it.before;
          oldS.classList.remove('hidden');
          renderBlank();
          choices.classList.remove('hidden');
          if (picked) checkBtn.classList.remove('hidden');
          const say = `${it.after} Which word fits?`;
          api.setCurrent({ item: it, given: () => picked, say });
          Speech.say(say);
        } else {
          oldS.classList.add('hidden');
          sent.textContent = it.before;
          choices.classList.add('hidden');
          checkBtn.classList.add('hidden');
          api.setCurrent({ item: it, given: () => picked, say: intro });
          Speech.say(it.before);
        }
      });

      // Every word tile is read aloud when tapped (FR-13).
      const tiles = shuffle(it.choices).map(c => {
        const t = h('button', { class: 'tile' }, c);
        t.addEventListener('click', () => {
          if (done) return;
          picked = c;
          tiles.forEach(x => x.classList.toggle('picked', x === t));
          Sound.play('tap');
          Speech.say(c);
          renderBlank();
          checkBtn.classList.remove('hidden');
        });
        return t;
      });
      choices.append(...tiles);

      checkBtn.addEventListener('click', async () => {
        if (!picked || done) return;
        done = true;
        const res = api.answer(q, picked, performance.now() - (tStart || performance.now()));
        control.disabled = true;
        choices.classList.add('hidden');
        checkBtn.classList.add('hidden');
        const shown = res.correct ? picked : res.right;
        const full = it.after.replace('___', shown);
        sent.innerHTML = '';
        sent.append(...glowDiff(it.before, full));
        if (res.correct) await feedback(root.parentNode, res, { spoken: full });
        else await feedback(root.parentNode, res, { right: shown, spoken: `The answer is ${shown}. ${full} ${res.explain}` });
        api.progress();
        resolve();
      });
    });
  }

  async function mutator(root, round, api) {
    for (const q of round.questions) {
      if (api.shouldStop()) break;
      await mutate(root, q, api);
    }
  }

  // ===================== G3 Bug-Zapper Comic =====================
  const NEW_LINE = '¶';

  function fixLabel(choice, bugTok) {
    if (choice.startsWith(NEW_LINE)) return `⏎ New line: ${choice.slice(1)}`;
    if (choice === bugTok) return '↔ Same line';
    return choice;
  }

  function fixSay(choice, bugTok) {
    if (choice.startsWith(NEW_LINE)) return 'Start a new line here.';
    if (choice === bugTok) return 'Keep it on the same line.';
    if (choice === '___') return 'blank';
    return choice;
  }

  function fixedText(text, tokenIndex, fix) {
    const t = text.split(' ');
    t[tokenIndex] = fix.startsWith(NEW_LINE) ? fix.slice(1) : fix;
    return t.join(' ');
  }

  function zap(root, q, api) {
    return new Promise(resolve => {
      const it = q.item;
      const bug = it.bug;
      const bugTok = it.panels[bug.panel].text.split(' ')[bug.token];
      let zapped = false;
      let picked = null;
      let misTaps = 0;
      let hinted = false;
      let done = false;
      const t0 = performance.now();

      root.innerHTML = '';
      const prompt = h('div', { class: 'prompt' }, 'Find the bug and zap it ⚡');
      const comic = h('div', { class: `comic n${it.panels.length}` });
      const fixes = h('div', { class: 'fixes' });
      root.append(prompt, comic, fixes);

      const panels = it.panels.map((p, pi) => {
        const cap = h('div', { class: 'cap' });
        const el = h('div', { class: 'cpanel' }, h('div', { class: 'art', 'aria-hidden': 'true' }, p.pic), cap);
        comic.append(el);
        return { el, cap, text: p.text };
      });

      function caption(pi, fix, glow) {
        const p = panels[pi];
        p.cap.innerHTML = '';
        p.text.split(' ').forEach((tok, ti) => {
          const isBug = pi === bug.panel && ti === bug.token;
          let shown = tok;
          let cls = 'tok';
          if (isBug && fix !== undefined) {
            if (fix.startsWith(NEW_LINE)) {
              p.cap.append(h('span', { class: 'line' }));
              shown = fix.slice(1);
            } else shown = fix;
            cls += glow ? ' glow' : ' zapped';
          } else if (isBug && zapped) cls += ' zapped';
          const b = h('button', { class: cls, 'aria-label': Content.speakable(shown) || shown }, shown);
          b.addEventListener('click', () => tapToken(pi, ti, b, tok));
          p.cap.append(b);
        });
      }
      panels.forEach((p, i) => caption(i));

      const say = `${it.panels.map(p => p.text).join(' ')} Find the mistake and tap it.`;
      api.setCurrent({ item: it, given: () => picked, say });
      Speech.say(say);

      function tapToken(pi, ti, b, tok) {
        if (done) return;
        const word = Content.speakable(tok) || 'blank';
        if (pi === bug.panel && ti === bug.token) {
          if (zapped) { Speech.say(word); return; }
          zapped = true;
          Sound.play('zap');
          const r = b.getBoundingClientRect();
          const boom = h('div', { class: 'zap', 'aria-hidden': 'true', style: { left: `${r.left + r.width / 2 - 27}px`, top: `${r.top - 20}px`, position: 'fixed' } }, '⚡');
          document.body.append(boom);
          setTimeout(() => boom.remove(), 700);
          panels[bug.panel].el.classList.remove('hint');
          caption(pi);
          prompt.textContent = 'You found it. Now pick the fix.';
          showFixes();
          Speech.say(`${word}. Yes, that one. Now pick the fix.`);
          return;
        }
        Sound.play('tap');
        b.classList.add('fine');
        setTimeout(() => b.classList.remove('fine'), 900);
        if (zapped) { Speech.say(word); return; }
        misTaps++;
        if (misTaps >= 3 && !hinted) {
          hinted = true;
          panels[bug.panel].el.classList.add('hint');
          Speech.say(`${word}. That one is fine. Look in the picture that wiggles.`);
        } else {
          Speech.say(`${word}. That one is fine.`);
        }
      }

      function showFixes() {
        fixes.innerHTML = '';
        const checkBtn = h('button', { class: 'btn green hidden' }, '✓ Check');
        const tiles = shuffle(it.choices).map(c => {
          const t = h('button', { class: 'tile' }, fixLabel(c, bugTok));
          t.addEventListener('click', () => {
            if (done) return;
            picked = c;
            tiles.forEach(x => x.classList.toggle('picked', x === t));
            Sound.play('tap');
            Speech.say(fixSay(c, bugTok));
            caption(bug.panel, c);
            checkBtn.classList.remove('hidden');
          });
          return t;
        });
        fixes.append(h('span', { class: 'label' }, 'Pick the fix:'), ...tiles, checkBtn);
        checkBtn.addEventListener('click', async () => {
          if (!picked || done) return;
          done = true;
          const res = api.answer(q, picked, performance.now() - t0, { hinted });
          fixes.innerHTML = '';
          const shown = res.correct ? picked : res.right;
          caption(bug.panel, shown, true);
          const fixed = fixedText(it.panels[bug.panel].text, bug.token, shown);
          if (res.correct) {
            await feedback(root.parentNode, res, { spoken: fixed });
          } else {
            await feedback(root.parentNode, res, { right: fixLabel(shown, bugTok), spoken: `The fix is ${fixSay(shown, bugTok)}. ${fixed} ${res.explain}` });
          }
          api.progress();
          resolve();
        });
      }
    });
  }

  async function zapper(root, round, api) {
    for (const q of round.questions) {
      if (api.shouldStop()) break;
      await zap(root, q, api);
    }
  }

  return { G1: sorter, G2: mutator, G3: zapper, Scenes, glowDiff };
})();

// ---- 07-screens.js ----
// ---------------------------------------------------------------------------
// Screens: home, map, session, end, sticker book, parent lock and the parent
// area. Screens talk to the session engine, never to the scheduler directly.
// ---------------------------------------------------------------------------
const App = { meta: null, settings: null, profiles: [], profileId: null };
const AVATARS = ['🦁', '🐯', '🐼', '🐨', '🦊', '🐸', '🐙', '🦄', '🐳', '🦋', '🐝', '🐢', '🦉', '🐧', '🐬', '🦖'];

const Screens = (() => {
  const root = () => $('#app');
  let sessionToken = 0;

  function mount(...kids) {
    Speech.stop();
    const r = root();
    r.innerHTML = '';
    r.append(...kids);
    return r;
  }

  function sheet(...kids) {
    const bg = h('div', { class: 'sheet-bg', role: 'dialog', 'aria-modal': 'true' }, h('div', { class: 'sheet' }, ...kids));
    document.body.append(bg);
    return { close: () => bg.remove(), el: bg };
  }

  function confirmSheet(title, text, yes, no = 'Cancel') {
    return new Promise(resolve => {
      const s = sheet(h('h2', null, title), text ? h('p', null, text) : null,
        h('div', { class: 'row' },
          h('button', { class: 'btn soft', onclick: () => { s.close(); resolve(false); } }, no),
          h('button', { class: 'btn', onclick: () => { s.close(); resolve(true); } }, yes)));
    });
  }

  function profile() {
    return App.profiles.find(p => p.id === App.profileId) || null;
  }

  function backupOverdue() {
    if (!App.profiles.length) return false;
    const since = App.meta.lastBackup || App.meta.firstRun;
    return daysBetween(since, Date.now()) >= CONFIG.backupNagDays;
  }

  function daysSinceBackup() {
    return App.meta.lastBackup ? daysBetween(App.meta.lastBackup, Date.now()) : null;
  }

  // ---- Parent lock (FR-30): hold for 3 seconds, then a times-table question ----

  function holdButton(label, onOpen, cls = 'btn soft') {
    const fill = h('span', { class: 'fill' });
    const b = h('button', { class: `${cls} hold`, 'aria-label': `${label}. Hold for 3 seconds.` }, fill, h('span', { style: { position: 'relative' } }, label));
    let timer = 0;
    const startHold = e => {
      e.preventDefault();
      b.classList.add('holding');
      timer = setTimeout(() => {
        b.classList.remove('holding');
        timesQuestion(onOpen);
      }, 3000);
    };
    const cancel = () => {
      clearTimeout(timer);
      b.classList.remove('holding');
    };
    b.addEventListener('pointerdown', startHold);
    b.addEventListener('pointerup', cancel);
    b.addEventListener('pointerleave', cancel);
    b.addEventListener('pointercancel', cancel);
    b.addEventListener('contextmenu', e => e.preventDefault());
    b.addEventListener('click', () => toast('Grown-ups: press and hold for 3 seconds.'));
    return b;
  }

  function timesQuestion(onOpen) {
    const a = 3 + Math.floor(Math.random() * 7);
    const b = 3 + Math.floor(Math.random() * 7);
    const right = a * b;
    const opts = new Set([right]);
    for (const d of shuffle([a, b, -a, -b, 1, -1, 2, 10])) {
      if (opts.size >= 4) break;
      if (right + d > 0) opts.add(right + d);
    }
    const s = sheet(
      h('div', { style: { fontSize: '54px' } }, '🔒'),
      h('h2', null, 'Grown-ups only'),
      h('p', { style: { fontSize: '30px', fontWeight: 800 } }, `${a} × ${b} = ?`),
      h('div', { class: 'row' }, shuffle([...opts]).map(n => h('button', {
        class: 'btn soft', onclick: () => {
          s.close();
          if (n === right) onOpen();
          else toast('Not quite. Try again.');
        },
      }, String(n)))),
      h('div', { class: 'row' }, h('button', { class: 'btn soft', onclick: () => s.close() }, 'Cancel')));
  }
