<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Circuit Lab</title>
  <meta name="description" content="Build circuits and learn how electricity works. For children aged about 7.">
  <meta name="theme-color" content="#E3DFD7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2A2019" media="(prefers-color-scheme: dark)">
  <!-- Fonts are the only outside request. The app works with the fallback fonts if they don't load. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@500;600;700;800&display=swap">
  <style>
/* Circuit Lab, Workbench direction.
   A real school kit on a sunlit table: plain white paper panels, a clipboard goal,
   a wooden parts drawer and a light wood pegboard. Panels change in dark mode; the board stays wood. */

:root {
  --bg: #E3DFD7;
  --ink: #1C2D47;
  --sub: #52617A;
  --panel: #FFFFFF;
  --line: #CFC8BC;
  --sky: #2A86D3;
  --sky-ink: #FFFFFF;
  --go: #2D9653;
  --go-edge: #1E6B3A;
  --hint: #E8941A;
  --hint-edge: #B86E07;
  --red: #D6433A;
  --tape: rgba(240, 226, 182, .92);
  --clip: #B98A57;
  --off: #C9C3B8;
  --note: #FFF6D8;
  --note-ink: #4A3A12;
  --shadow: 0 12px 20px -10px rgba(60, 40, 20, .45), 0 2px 5px rgba(60, 40, 20, .18);
  --f-kid: 'Andika', Verdana, 'Trebuchet MS', system-ui, sans-serif;
  --f-head: 'Baloo 2', 'Trebuchet MS', Verdana, system-ui, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #2A2019;
    --ink: #F3ECE1;
    --sub: #C7B9A6;
    --panel: #3A3029;
    --line: #56483C;
    --sky: #63AEEE;
    --sky-ink: #0F1B2B;
    --go: #3FAE68;
    --tape: rgba(205, 186, 140, .6);
    --clip: #5C4330;
    --off: #5F5348;
    --note: #4A3C22;
    --note-ink: #F7E6B6;
    --shadow: 0 14px 24px -10px rgba(0, 0, 0, .7), 0 2px 5px rgba(0, 0, 0, .4);
    color-scheme: dark;
  }
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg) var(--tex-ash) center / cover fixed;
  color: var(--ink);
  font-family: var(--f-kid);
  font-size: 18px;
  line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
  -webkit-font-smoothing: antialiased;
}
@media (prefers-color-scheme: dark) { body { background-image: var(--tex-walnut); } }
h1, h2, h3 { margin: 0; text-wrap: balance; }
p { margin: 0; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; padding: 0; }
button:focus-visible, .gu-row:focus-within, .board:focus-visible { outline: 3px solid var(--sky); outline-offset: 3px; }
svg { display: block; }
[hidden] { display: none !important; }
.noscript { padding: 24px; font-size: 20px; }

/* ---------- shared controls ---------- */
.ib, .adultbtn, .jar, .tb-back {
  background: var(--panel);
  box-shadow: var(--shadow);
}
.ib { width: 56px; height: 56px; border-radius: 50%; display: grid; place-items: center; flex: none; }
.ib svg { width: 26px; height: 26px; }
.adult-ic { display: none; }
.adult-ic svg { width: 24px; height: 24px; }
.adultbtn { display: flex; align-items: center; gap: 10px; height: 56px; padding: 0 18px 0 10px; border-radius: 28px; font-size: 16px; font-weight: 700; flex: none; }
.jar { display: flex; align-items: center; gap: 6px; height: 56px; padding: 0 16px 0 6px; border-radius: 28px; flex: none; }
.jar svg { width: 40px; height: 48px; }
.jar b { font-family: var(--f-head); font-size: 28px; font-weight: 800; line-height: 1; font-variant-numeric: tabular-nums; }
.jar span { font-size: 15px; font-weight: 700; color: var(--sub); }
.jar.bump { animation: bump .5s ease-out; }
@keyframes bump { 40% { transform: scale(1.15); } }
.tgl { width: 46px; height: 28px; border-radius: 14px; background: var(--off); position: relative; flex: none; transition: background .2s; }
.tgl i { position: absolute; top: 3px; left: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: left .2s; }
.on > .tgl, .sw-input:checked + .tgl { background: var(--go); }
.on > .tgl i, .sw-input:checked + .tgl i { left: 21px; }
.sw-input { position: absolute; opacity: 0; width: 1px; height: 1px; pointer-events: none; }
.toast { margin: 0 0 16px; padding: 12px 18px; border-radius: 6px; background: var(--note); color: var(--note-ink); font-weight: 700; box-shadow: var(--shadow); }

/* ---------- home: the kit shelf ---------- */
.home {
  max-width: 1240px; margin: 0 auto;
  padding: max(14px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(32px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.h-top { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; padding-block: 12px 22px; }
.logo { display: flex; align-items: center; gap: 12px; margin-right: auto; background: var(--panel); padding: 8px 24px 6px 12px; box-shadow: var(--shadow); transform: rotate(-1deg); border-radius: 3px; position: relative; }
.logo::before { content: ""; position: absolute; width: 64px; height: 22px; background: var(--tape); top: -10px; left: 40%; transform: rotate(-4deg); }
.logo svg { width: 44px; height: 50px; }
.logo h1 { font-family: var(--f-head); font-weight: 800; font-size: clamp(28px, 4vw, 40px); line-height: 1; }
.logo h1 span { color: var(--sky); }
.rows { display: flex; flex-direction: column; gap: 18px; }
.row { display: flex; gap: 18px; align-items: stretch; }
.row-label { width: 300px; flex: none; display: flex; align-items: center; gap: 12px; background: var(--panel); padding: 12px 14px 12px 10px; box-shadow: var(--shadow); border-radius: 4px; }
.row-n { width: 42px; height: 42px; border-radius: 50%; flex: none; display: grid; place-items: center; font-family: var(--f-head); font-weight: 800; font-size: 22px; background: radial-gradient(circle at 35% 30%, #FFF0B8, #D9A440 55%, #9E6E1D); color: #3B2504; box-shadow: 0 2px 3px rgba(0, 0, 0, .25); }
.row-n svg { width: 22px; height: 22px; }
.row-ic svg { width: 58px; height: 54px; }
.row-label h2 { font-family: var(--f-head); font-size: 23px; line-height: 1.05; }
.row-label small { display: block; color: var(--sub); font-size: 15px; margin-top: 2px; }
.shelf { flex: 1; display: flex; flex-wrap: wrap; gap: 16px 18px; padding: 16px 16px 12px; border-radius: 12px; background: rgba(90, 60, 30, .12); box-shadow: inset 0 3px 6px rgba(70, 40, 10, .22), 0 1px 0 rgba(255, 255, 255, .6); }
@media (prefers-color-scheme: dark) { .shelf { background: rgba(0, 0, 0, .25); box-shadow: inset 0 3px 6px rgba(0, 0, 0, .5); } }
.tok { width: 108px; display: flex; flex-direction: column; align-items: center; gap: 4px; border-radius: 14px; padding: 4px 2px 6px; }
.tok-disc { width: 78px; height: 78px; border-radius: 50%; position: relative; display: grid; place-items: center; background: radial-gradient(circle at 40% 32%, #fff, #EEF2F6 60%, #C7D0DA); box-shadow: 0 0 0 4px var(--sky), 0 4px 8px rgba(0, 0, 0, .25); transition: transform .15s ease; }
.tok:hover .tok-disc { transform: translateY(-3px); }
.tok:active .tok-disc { transform: translateY(1px); }
.tok.done .tok-disc { box-shadow: 0 0 0 4px #D9A440, 0 4px 8px rgba(0, 0, 0, .25); }
.tok.next .tok-disc { box-shadow: 0 0 0 5px var(--sky), 0 0 0 14px rgba(255, 214, 110, .45), 0 0 40px 18px rgba(255, 205, 90, .55); animation: glow 2.8s ease-in-out infinite; }
@keyframes glow { 50% { box-shadow: 0 0 0 5px var(--sky), 0 0 0 10px rgba(255, 214, 110, .3), 0 0 30px 10px rgba(255, 205, 90, .35); } }
.tok-pic svg { width: 54px; height: 48px; }
.tok-n { font-size: 13px; font-weight: 700; padding: 0 7px; border-radius: 7px; line-height: 18px; background: var(--ink); color: var(--panel); margin-top: -12px; position: relative; z-index: 1; font-variant-numeric: tabular-nums; }
.tok-name { font-size: 15px; font-weight: 700; text-align: center; line-height: 1.15; }
.tok-st { position: absolute; top: -8px; right: -10px; display: flex; }
.tok-st svg { width: 28px; height: 28px; margin-left: -10px; filter: drop-shadow(0 1px 1px rgba(0, 0, 0, .3)); }
.tok-big { position: absolute; top: -6px; left: -6px; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; color: #fff; background: #6B57C9; box-shadow: 0 1px 2px rgba(0, 0, 0, .3); }
.tok-big svg { width: 16px; height: 16px; }
.tok-next { position: absolute; top: -30px; left: 50%; transform: translateX(-50%); font-family: var(--f-head); font-weight: 800; font-size: 15px; padding: 1px 10px; border-radius: 9px; white-space: nowrap; background: var(--sky); color: #fff; }
.row.soon .row-label { width: auto; flex: 1; opacity: .8; }
@media (max-width: 820px) {
  .row { flex-direction: column; gap: 10px; }
  .row-label { width: auto; }
  .shelf { justify-content: flex-start; }
}
@media (max-width: 520px) {
  .logo { flex-basis: 100%; margin-right: 0; justify-content: center; }
  .h-top .jar { margin-right: auto; }
  .tok { width: 92px; }
  .tok-disc { width: 68px; height: 68px; }
  .adultbtn .lbl, .jar span { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .adultbtn { padding: 0 10px; }
  .adult-ic { display: block; }
}

/* ---------- activity layout ---------- */
.act {
  --bw: min(calc(66vw - 30px), calc((100vh - 262px) * 1.32), 980px);
  min-height: 100%;
  max-width: 1500px; margin: 0 auto;
  display: grid; gap: 12px 22px; align-content: start; justify-content: center;
  grid-template-columns: var(--bw) minmax(290px, 470px);
  grid-template-rows: auto auto auto auto 1fr auto;
  grid-template-areas: "tip tip" "head head" "board goal" "board helper" "board extra" "board end";
  padding: max(10px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(14px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}

.act > * { min-width: 0; }
.tb { grid-area: head; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.tb-back { display: flex; align-items: center; gap: 8px; height: 52px; padding: 0 18px 0 14px; font-weight: 700; font-size: 17px; border-radius: 26px; }
.tb-back svg { width: 26px; height: 26px; }
.tb-title { display: flex; align-items: center; gap: 12px; margin-right: auto; background: var(--panel); padding: 8px 22px 6px; box-shadow: var(--shadow); transform: rotate(-.7deg); border-radius: 3px; position: relative; min-width: 0; }
.tb-title::before, .tb-title::after { content: ""; position: absolute; width: 56px; height: 20px; background: var(--tape); top: -9px; box-shadow: 0 1px 2px rgba(0, 0, 0, .12); }
.tb-title::before { left: -16px; transform: rotate(-14deg); }
.tb-title::after { right: -16px; transform: rotate(12deg); }
.tb-num { font-family: var(--f-head); font-weight: 800; font-size: 20px; color: var(--sky); }
.tb-name { font-family: var(--f-head); font-weight: 700; font-size: 26px; line-height: 1.1; }
.tb-big { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; font-weight: 700; padding: 4px 10px; border-radius: 999px; background: #EAF3FB; color: #1E5D93; white-space: nowrap; }
.tb-big svg { width: 18px; height: 18px; }
@media (prefers-color-scheme: dark) { .tb-big { background: #22364C; color: #A9D3FF; } }
.tb-right { display: flex; align-items: center; gap: 10px; }
.tb .jar, .tb .adultbtn { height: 52px; }
.tb .ib { width: 52px; height: 52px; }

/* the goal sheet on its clipboard */
.goal { grid-area: goal; position: relative; background: var(--panel); border-radius: 5px; padding: 30px 20px 16px; margin: 24px 12px 12px; box-shadow: 0 0 0 12px var(--clip), 0 0 0 13px rgba(0, 0, 0, .18), 0 22px 30px -12px rgba(60, 35, 10, .6); }
.goal::before { content: ""; position: absolute; top: -24px; left: 50%; width: 118px; height: 34px; margin-left: -59px; border-radius: 9px 9px 5px 5px; background: linear-gradient(#FBFCFD, #C5CBD2 55%, #9AA2AB); box-shadow: 0 3px 5px rgba(0, 0, 0, .3), inset 0 1px 0 #fff; }
.goal::after { content: ""; position: absolute; top: -14px; left: 50%; width: 38px; height: 12px; margin-left: -19px; border-radius: 6px; background: #7E8690; box-shadow: inset 0 2px 3px rgba(0, 0, 0, .4); }
.goal-k { font-family: var(--f-head); font-weight: 700; font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--sub); display: flex; align-items: center; gap: 8px; }
.goal-done { display: inline-flex; align-items: center; gap: 4px; background: var(--go); color: #fff; border-radius: 999px; padding: 1px 10px 1px 6px; font-size: 14px; letter-spacing: 0; text-transform: none; }
.goal-done svg { width: 16px; height: 16px; }
.goal-t { font-size: 23px; font-weight: 700; line-height: 1.32; margin: 6px 0 12px; text-wrap: balance; }
.goal.done .goal-t { font-size: 19px; color: var(--sub); }
.goal-c { font-size: 17px; font-weight: 700; color: var(--sky); margin: -4px 0 12px; }
.goal-pic svg { width: 100%; max-width: 280px; height: auto; border-radius: 10px; margin-bottom: 12px; }
.goal-row { display: flex; align-items: center; gap: 8px; }
.read { display: inline-flex; align-items: center; gap: 10px; height: 50px; padding: 0 20px 0 14px; border-radius: 25px; font-weight: 700; font-size: 17px; background: var(--sky); color: var(--sky-ink); }
.read svg { width: 24px; height: 24px; }
.goal-more { display: none; }

/* Flick and the speech bubble */
.helper { grid-area: helper; display: flex; gap: 4px; align-items: flex-end; padding: 0 4px; position: relative; z-index: 3; }
.fl { flex: none; }
.bubble { flex: 1; text-align: left; padding: 14px 18px; font-size: 20px; line-height: 1.35; position: relative; background: var(--panel); border-radius: 6px; box-shadow: var(--shadow); min-height: 64px; cursor: pointer; }
.bubble::before { content: ""; position: absolute; left: -10px; bottom: 22px; border: 11px solid transparent; border-right-color: var(--panel); border-left: 0; }
.bt { display: block; }
.why-k { display: block; font-family: var(--f-head); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; color: var(--go); }
.tone-gap .bubble { box-shadow: var(--shadow), inset 0 0 0 3px var(--red); }
.tone-hint .bubble { box-shadow: var(--shadow), inset 0 0 0 3px var(--hint); }
.tone-why .bubble { box-shadow: var(--shadow), inset 0 0 0 3px var(--go); }

/* the board */
.leftcol { grid-area: board; display: flex; flex-direction: column; gap: 12px; align-self: start; min-width: 0; }
.bwrap { grid-area: board; position: relative; align-self: start; width: var(--bw); }
.board-box { position: relative; width: 100%; aspect-ratio: 660 / 500; border-radius: 22px; box-shadow: 0 22px 40px -14px rgba(50, 25, 5, .55), 0 5px 12px rgba(50, 25, 5, .25); }
.board-box::after { content: ""; position: absolute; inset: 0; border-radius: inherit; box-shadow: inset 0 0 0 3px rgba(120, 66, 20, .35), inset 0 -16px 30px rgba(70, 35, 8, .30), inset 0 12px 20px rgba(255, 236, 200, .20); pointer-events: none; }
.board { width: 100%; height: 100%; border-radius: 22px; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.board:focus { outline: none; }
.board:focus-visible { outline: 3px solid var(--sky); outline-offset: 4px; }
.pt { cursor: grab; outline: none; }
.pt:focus-visible { filter: drop-shadow(0 0 3px #fff) drop-shadow(0 0 6px #2A86D3); }
.pt.lifted { opacity: .3; }
.peg.on circle:nth-child(2) { fill: #FFE27A; }
.peg.on circle:first-child { r: 15; fill: #FFD24A; opacity: .5; }
.fade { transition: opacity .15s linear; }
.glows > *, .L-glow > * { mix-blend-mode: screen; }
.flow { fill: none; stroke: #FFE48A; stroke-width: 6.5; stroke-linecap: round; stroke-dasharray: 0 24; animation: flow 1.6s linear infinite; filter: drop-shadow(0 0 3px rgba(255, 196, 70, .95)); transition: opacity .2s linear; pointer-events: none; }
@keyframes flow { to { stroke-dashoffset: -24; } }
.L-flow, .L-top, .L-ring, .L-fx, .L-prev, .L-ghost, .L-glow, .L-deco { pointer-events: none; }
.ring circle { fill: none; stroke-width: 4.5; }
.ring-red circle { stroke: #FF4B3E; }
.ring-amber circle { stroke: #FFB020; }
.ring-a { filter: drop-shadow(0 0 4px rgba(255, 255, 255, .8)); }
.ring-b { animation: ringp 1.6s ease-out infinite; transform-box: fill-box; transform-origin: center; }
@keyframes ringp { from { transform: scale(1); opacity: .9; } to { transform: scale(2.2); opacity: 0; } }
.sel { fill: rgba(42, 134, 211, .12); stroke: #2A86D3; stroke-width: 3; stroke-dasharray: 8 6; }
.ghosts { opacity: .42; filter: saturate(.5) brightness(1.2); animation: ghost 2.4s ease-in-out infinite; }
@keyframes ghost { 50% { opacity: .62; } }
.prev { opacity: .85; }
.prev-spot { fill: rgba(255, 255, 255, .22); stroke: #fff; stroke-width: 3; stroke-dasharray: 8 6; }
.prev.swap .prev-spot { stroke: #FFC93C; fill: rgba(255, 201, 60, .2); }
.wire-prev { stroke: #C62B22; stroke-width: 7; stroke-linecap: round; opacity: .55; stroke-dasharray: 2 11; }
.cell-v { font: 700 9.5px var(--f-kid); fill: #fff; letter-spacing: .02em; }
.cell-pm { font: 800 13px var(--f-head); fill: #fff; }
.meter-n { font: 800 15px var(--f-head); fill: #1D2B45; }
.hot-t { font: 800 14px var(--f-head); fill: #fff; }
.fan.spin { animation: spin .45s linear infinite; transform-box: fill-box; transform-origin: center; }
.fan.spin.rev { animation-direction: reverse; }
@keyframes spin { to { transform: rotate(360deg); } }
.heat { animation: heat 1.2s ease-in-out infinite; }
@keyframes heat { 50% { opacity: .25; } }
.waves { animation: waves .5s ease-in-out infinite alternate; }
@keyframes waves { to { opacity: .45; } }
.sparkle { animation: twinkle 1.4s ease-in-out 1 both; transform-box: fill-box; transform-origin: center; filter: drop-shadow(0 0 4px #FFD24A); }
.sparkle:nth-child(2n) { animation-delay: .15s; }
.sparkle:nth-child(3n) { animation-delay: .3s; }
@keyframes twinkle { 0% { transform: scale(0); opacity: 0; } 30% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(.4); opacity: 0; } }

.ptools { position: absolute; z-index: 5; transform: translate(-50%, calc(-100% - 42px)); display: flex; gap: 6px; background: var(--panel); padding: 6px; border-radius: 16px; box-shadow: var(--shadow); white-space: nowrap; }
.ptools.below { transform: translate(-50%, 42px); }
.ptools[hidden] { display: none; }
.ptools button { display: flex; align-items: center; gap: 6px; height: 48px; padding: 0 14px; border-radius: 12px; font-weight: 700; font-size: 16px; background: var(--bg); }
.ptools button[hidden] { display: none; }
.ptools svg { width: 22px; height: 22px; }
.ptools .pt-bin { color: var(--red); }

/* the parts drawer */
.tr { grid-area: tray; width: var(--bw); display: flex; gap: 10px; align-items: stretch; min-height: 118px; background: var(--clip) var(--tex-drawer) center / cover; border-radius: 14px; padding: 10px; box-shadow: inset 0 4px 10px rgba(0, 0, 0, .45), 0 1px 0 rgba(255, 255, 255, .4), var(--shadow); }
.tray { flex: 1; display: flex; gap: 10px; align-items: stretch; overflow-x: auto; min-width: 0; scrollbar-width: thin; }
.ti { width: 94px; flex: none; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; position: relative; border-radius: 14px; padding: 6px 4px; background: rgba(255, 250, 240, .95); box-shadow: inset 0 3px 6px rgba(90, 50, 15, .28); touch-action: none; color: #1C2D47; user-select: none; -webkit-user-select: none; }
.ti-pic svg { width: 72px; height: 56px; pointer-events: none; }
.ti-name { font-size: 15px; font-weight: 700; line-height: 1.1; text-align: center; }
.ti-n { position: absolute; top: 5px; right: 5px; min-width: 26px; height: 26px; border-radius: 13px; font-size: 14px; font-weight: 700; display: grid; place-items: center; padding: 0 6px; background: radial-gradient(circle at 35% 30%, #FFF0B8, #D9A440 55%, #9E6E1D); color: #3B2504; font-variant-numeric: tabular-nums; }
.ti.sel { outline: 4px solid var(--sky); outline-offset: -4px; }
.ti.empty { opacity: .5; }
.tray-note { align-self: center; max-width: 190px; font-size: 15px; font-weight: 700; color: #FFF6E6; text-shadow: 0 1px 2px rgba(0, 0, 0, .5); margin: 0 6px; }
.tr-acts { display: grid; grid-template-columns: repeat(2, 114px); grid-auto-rows: minmax(48px, 1fr); gap: 6px; flex: none; }
.tr-acts > * { display: flex; align-items: center; justify-content: flex-start; gap: 5px; font-size: 13px; font-weight: 700; border-radius: 12px; background: var(--panel); box-shadow: 0 3px 6px rgba(0, 0, 0, .25); text-align: left; line-height: 1.05; padding: 4px 8px; }
.tr-acts svg { width: 24px; height: 24px; flex: none; }
.flowbtn svg { color: #E8A01A; }
.flowbtn.off { opacity: .65; }

<body>

  <noscript><p class="noscript">Circuit Lab needs JavaScript to run. Please turn it on and reload the page.</p></noscript>
  <script>
/* Circuit Lab: drawing. Wood textures, SVG paint, the parts, Flick and icons.
   Everything is drawn in code. No image files. */
'use strict';
window.CL = window.CL || {};

(function (CL) {
  /* Board geometry: 8 columns x 6 rows of pegs. */
  const P = 80, M = 50, BW = 660, BH = 500, COLS = 8, ROWS = 6;
  const pg = (c, r) => [M + c * P, M + r * P];
  const f1 = n => (+n).toFixed(1);

  /* ---------- wood textures, drawn once on a canvas ---------- */
  function rng(seed) {
    return function () {
      seed |= 0; seed = seed + 0x6D2B79F5 | 0;
      let t = Math.imul(seed ^ seed >>> 15, 1 | seed);

    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const g = cv.getContext('2d'); const R = rng(seed);
    const gr = g.createLinearGradient(0, 0, w * .25, h);
    base.forEach((c, i) => gr.addColorStop(i / (base.length - 1), c));
    g.fillStyle = gr; g.fillRect(0, 0, w, h);

    for (let i = 0; i < n; i++) {
      const y0 = R() * h * 1.1 - h * .05, amp = 3 + R() * (o.amp || 16), fr = .0015 + R() * .005, ph = R() * 6.3;
      g.beginPath();
      for (let x = -10; x <= w + 10; x += 10) {
        const y = y0 + Math.sin(x * fr + ph) * amp + Math.sin(x * fr * 2.7 + ph * 1.7) * amp * .3;
        x < 0 ? g.moveTo(x, y) : g.lineTo(x, y);

      g.lineWidth = .5 + R() * 2.4; g.stroke();

      g.fillStyle = `rgba(${grain},${(R() * .07).toFixed(3)})`;
      g.fillRect(R() * w, R() * h, 1 + R() * 5, 1);
    }
    if (o.planks) {
      for (let y = o.planks; y < h; y += o.planks) {
        g.fillStyle = `rgba(${grain},.28)`; g.fillRect(0, y, w, 2);
        g.fillStyle = 'rgba(255,255,255,.14)'; g.fillRect(0, y + 2, w, 1);

    }

    v.addColorStop(0, 'rgba(255,244,220,.10)'); v.addColorStop(1, `rgba(${grain},.22)`);

  }
  const TEX = {};
  function makeTextures() {
    TEX.oak = woodTex(1320, 1000, ['#E4B77C', '#D7A367', '#C98F52'], '118,64,22', 7);
    TEX.ash = woodTex(1200, 840, ['#ECE8E0', '#E3DED4', '#D8D2C6'], '125,108,85', 11, { planks: 210, k: .07, amp: 10 });
    TEX.walnut = woodTex(1200, 840, ['#3D2E23', '#34271E', '#2A1F18'], '10,5,2', 13, { planks: 210, k: .25 });
    TEX.drawer = woodTex(900, 180, ['#B88350', '#A7723E', '#946231'], '70,35,8', 5, { amp: 6 });

    r.setProperty('--tex-ash', `url(${TEX.ash})`);
    r.setProperty('--tex-walnut', `url(${TEX.walnut})`);
    r.setProperty('--tex-drawer', `url(${TEX.drawer})`);

  }

  const lg = (id, s, h) => `<linearGradient id="${id}" x1="0" y1="0" x2="${h ? 1 : 0}" y2="${h ? 0 : 1}">${s}</linearGradient>`;

  const DEFS = `<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
${lg('gSilver', st(0, '#F7F9FB') + st(.45, '#C4CAD1') + st(.56, '#A3AAB3') + st(1, '#E3E7EB'))}
${rg('gBrass', st(0, '#FFF3C2') + st(.35, '#E2B14A') + st(.8, '#A87422') + st(1, '#7A4F12'), .35, .3, .75)}

${rg('gGlass', st(0, '#FFFFFF', .92) + st(.5, '#EAF3F9', .42) + st(1, '#B8CDDD', .6), .38, .35, .7)}

${rg('gLit', st(0, '#FFFEF2') + st(.45, '#FFF0A8') + st(1, '#FFD46E', .75))}
${rg('gCore', st(0, '#FFFFEE') + st(.4, '#FFEDA0', .7) + st(1, '#FFD06E', 0))}

${rg('gGlowGreen', st(0, '#7DFF9A', .9) + st(.35, '#3BE070', .4) + st(1, '#20C050', 0))}
${rg('gGlowHot', st(0, '#FF7A2E', .9) + st(.4, '#FF5A1E', .4) + st(1, '#FF3A10', 0))}
${lg('gPly', st(0, '#F2D3A0') + st(1, '#D3A464'))}
${rg('gRed', st(0, '#FF9C8A') + st(.5, '#E0392B') + st(1, '#94170E'), .35, .3, .8)}
${lg('gDarkBox', st(0, '#4C515A') + st(1, '#22252B'))}
${rg('gBlack', st(0, '#60636B') + st(.6, '#1F2126') + st(1, '#0B0C0E'), .38, .32, .8)}
${lg('gCan', st(0, '#F2F5F8') + st(.35, '#BFC6CE') + st(.7, '#7F8892') + st(1, '#AEB5BD'))}
${lg('gFan', st(0, '#FFC66E') + st(1, '#E5741C'), true)}
${rg('gLedR', st(0, '#FFB6AA') + st(.5, '#F0392B') + st(1, '#9C140B'), .35, .3, .8)}
${rg('gLedG', st(0, '#C4FFD0') + st(.5, '#25B44E') + st(1, '#0B6427'), .35, .3, .8)}
${lg('gStar', st(0, '#FFE47E') + st(1, '#F4A511'))}
${rg('gFlickHead', st(0, '#8086CF') + st(1, '#33387A'), .4, .35, .75)}
${rg('gFlickTail', st(0, '#FFFCE6') + st(.5, '#FFE36B') + st(1, '#F2AD22'), .45, .4, .7)}
${rg('gFlickHalo', st(0, '#FFE478', .75) + st(.5, '#FFD65A', .25) + st(1, '#FFD65A', 0))}
${lg('gChest', st(0, '#B5753A') + st(1, '#7A4A20'))}
${lg('gHouse', st(0, '#FFFFFF') + st(1, '#E9EEF3'))}
<filter id="fShadow" x="-10%" y="-10%" width="120%" height="125%"><feDropShadow dx="0" dy="3.5" stdDeviation="2.6" flood-color="#3A1D06" flood-opacity=".42"/></filter>
</defs></svg>`;

  /* ---------- placing a part between two pegs ---------- */
  /* Parts drawn in board coordinates rather than between two pegs. */
  const ABS = { wand: 1, probe: 1, hid: 1 };
  function place(p) {
    if (ABS[p.t]) { const c = pg(...p.a); return { ang: 0, m: 1, tf: '', pt: (x, y) => [x, y], mid: c, len: 0 }; }
    const A0 = p.t === 'sw2' ? p.b : p.a, B0 = p.t === 'sw2' ? p.c : p.b;
    const [x1, y1] = pg(...A0), [x2, y2] = pg(...B0);
    const ang = Math.round(Math.atan2(y2 - y1, x2 - x1) * 180 / Math.PI);
    const m = p.mir ? -1 : 1; const a = ang * Math.PI / 180;

      ang, m,
      tf: `translate(${x1} ${y1}) rotate(${ang})${m < 0 ? ' scale(1 -1)' : ''}`,
      pt: (lx, ly) => { ly *= m; return [x1 + lx * Math.cos(a) - ly * Math.sin(a), y1 + lx * Math.sin(a) + ly * Math.cos(a)]; },
      mid: [(x1 + x2) / 2, (y1 + y2) / 2],
      len: Math.hypot(x2 - x1, y2 - y1),

  }
  const T0 = { ang: 0, m: 1, tf: '', pt: (x, y) => [x, y], mid: [40, 0], len: 80 };
  const upr = (T, x, y, s, cls) => `<text x="${x}" y="${y}" class="${cls}" text-anchor="middle" dominant-baseline="central"${Math.abs(T.ang) > 90 ? ` transform="rotate(180 ${x} ${y})"` : ''}>${s}</text>`;
  const lead = (x1, x2) => `<line x1="${x1}" y1="0" x2="${x2}" y2="0" stroke="#98A0A9" stroke-width="4" stroke-linecap="round"/><line x1="${x1}" y1="-.9" x2="${x2}" y2="-.9" stroke="#F0F3F6" stroke-width="1.2" stroke-linecap="round"/>`;
  const clipE = x => {
    const x0 = x ? 66 : 0;
    return `<rect x="${x0}" y="-6" width="14" height="12" rx="3.5" fill="url(#gSilver)" stroke="#7B828B" stroke-width=".7"/><path d="M${x0 + 4.5} -5.5v11M${x0 + 9.5} -5.5v11" stroke="#8C939C" stroke-width=".8"/>`;
  };

  /* Each part is drawn in a local frame from (0,0) to (80,0).
     v = live visual state from the solver: {on, spin, rev, hot, short}. */
  const PARTS = {
    wire(p, v) {
      const k = p.c === 'k', hot = v.hot;
      const base = hot ? '#E5521E' : k ? '#24262C' : '#C62B22', hi = hot ? '#FFC27A' : k ? '#6C7079' : '#FF7A6C';
      const b = p.bend ?? 5;
      let s = '';
      if (hot) s += `<path class="heat" d="M6 0 Q40 ${b} 74 0" fill="none" stroke="#FF6A2B" stroke-width="20" stroke-linecap="round" opacity=".5"/>`;
      s += `<path d="M10 0 Q40 ${b} 70 0" fill="none" stroke="${base}" stroke-width="8" stroke-linecap="round"/><path d="M12 -1.8 Q40 ${b - 1.8} 68 -1.8" fill="none" stroke="${hi}" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>${clipE(0)}${clipE(80)}`;

    },

      let s = lead(0, 8) + lead(74, 80) + (v.short ? `<rect x="2" y="-24" width="76" height="48" rx="20" fill="#FF5A2A" opacity=".35" class="heat"/>` : '') +
        `<rect x="6.5" y="-13" width="4" height="26" rx="1.5" fill="url(#gSilver)"/><rect x="9" y="-15" width="57" height="30" rx="6" fill="url(#${flat ? 'gBlueFlat' : 'gBlue'})"/><rect x="11" y="-13" width="50" height="6" rx="3" fill="#fff" opacity=".2"/><rect x="62" y="-15" width="9" height="30" rx="3" fill="url(#gGold)"/><rect x="70" y="-6" width="5.5" height="12" rx="2" fill="url(#gGold)" stroke="#8A5F12" stroke-width=".5"/>` +

    },

        `<circle cx="40" cy="-46" r="20" fill="url(#${br ? 'gGlassBroken' : 'gGlass'})" stroke="#fff" stroke-opacity=".85" stroke-width="1.2"/>` +
        `<path d="M35 -27L35.5 -44M45 -27L44.5 -44" stroke="#8D8F92" stroke-width="1.1" fill="none"/>` +
        (br ? `<path d="M35.5 -44l2 -4 2 3M44.5 -44l-2 -3" stroke="#555" stroke-width="1.3" fill="none"/><circle cx="46" cy="-58" r="6" fill="#777" opacity=".3"/><circle cx="52" cy="-66" r="4" fill="#777" opacity=".22"/>`
          : `<path d="M35.5 -44l1.5 -4 1.5 4 1.5 -4 1.5 4 1.5 -4 1.5 4" stroke="${on ? '#FFF6C8' : '#6A5848'}" stroke-width="${on ? 1.9 : 1.3}" fill="none" stroke-linejoin="round"/>`) +
        `<ellipse cx="32.5" cy="-54" rx="4.5" ry="7" fill="#fff" opacity=".55" transform="rotate(25 32.5 -54)"/>`;
    },
    switch(p) {
      return `<rect x="2" y="-15" width="76" height="30" rx="5" fill="url(#gPly)" stroke="#9A6A38"/><circle cx="12" cy="0" r="6.5" fill="url(#gBrassS)"/><circle cx="68" cy="0" r="6.5" fill="url(#gBrassS)"/><path d="M61 -7h9a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-9z" fill="url(#gSilver)" stroke="#7B828B" stroke-width=".6"/>` +
        `<g transform="rotate(${p.open ? -26 : 0} 12 0)"><rect x="9" y="-3.2" width="62" height="6.4" rx="3" fill="url(#gSilver)" stroke="#7B828B" stroke-width=".6"/><rect x="37" y="-8.5" width="22" height="17" rx="6" fill="url(#gRed)"/><rect x="40" y="-6.5" width="15" height="4" rx="2" fill="#fff" opacity=".38"/></g><circle cx="12" cy="0" r="3" fill="#6B4A12"/>`;
    },
    button(p) {
      const pr = p.pressed;
      return lead(0, 12) + lead(68, 80) + `<rect x="11" y="-18" width="58" height="36" rx="9" fill="url(#gDarkBox)" stroke="#15171B"/><rect x="14" y="-16" width="52" height="8" rx="5" fill="#fff" opacity=".08"/><circle cx="40" cy="0" r="13" fill="#17191D"/><circle cx="40" cy="${pr ? 1 : 0}" r="${pr ? 9.5 : 10.5}" fill="url(#gRed)"/><ellipse cx="37" cy="-4" rx="4" ry="2.5" fill="#fff" opacity="${pr ? .25 : .45}"/>`;

      if (v.on) s += `<g class="waves" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round"><path d="M28 -27q12 -8 24 0"/><path d="M21 -34q19 -13 38 0" opacity=".6"/></g>`;

        (v.spin ? `<circle cx="40" cy="-44" r="23" fill="#F6A43A" opacity="${(.12 + v.speed * .25).toFixed(2)}"/>` : '') +
        `<g transform="translate(40 -44)"><g class="fan${v.spin ? ' spin' : ''}${v.rev ? ' rev' : ''}"${v.spin ? ` style="animation-duration:${dur}s"` : ''}><circle r="24" fill="#000" opacity="0"/>${[0, 120, 240].map(a => `<path d="M0 0C7 -6 9 -19 2 -23C-5 -21 -6 -8 0 0Z" transform="rotate(${a})" fill="url(#gFan)" stroke="#C25E12" stroke-width=".6"/>`).join('')}</g><circle r="4.5" fill="#E9EDF1" stroke="#7D848D"/></g>`;
    },
    led(p, v) {
      const g = p.col === 'g';
      return `<path d="M0 0H33V-10" stroke="#A7AEB6" stroke-width="2.6" fill="none" stroke-linejoin="round"/><path d="M80 0H54L48 -6V-10" stroke="#A7AEB6" stroke-width="2.6" fill="none" stroke-linejoin="round"/><rect x="29" y="-14" width="22" height="5" rx="2" fill="${g ? '#22A34A' : '#D8291C'}"/><path d="M31 -12V-26a9 9 0 0 1 18 0V-12Z" fill="${p.broken ? '#8E8C87' : `url(#${g ? 'gLedG' : 'gLedR'})`}" stroke="#fff" stroke-opacity=".5"/>` + (v.on ? `<path d="M31 -12V-26a9 9 0 0 1 18 0V-12Z" fill="#fff" opacity="${(v.b * .45).toFixed(2)}"/>` : '') + `<ellipse cx="36" cy="-25" rx="2.5" ry="5" fill="#fff" opacity=".55"/>`;
    },

      }
      return lead(0, 16) + lead(64, 80) + `<g transform="rotate(${-T.ang * T.m} 40 0)"><circle cx="40" cy="0" r="26" fill="url(#gBrassS)"/><circle cx="40" cy="0" r="22" fill="#FBF7EE"/>${t}<line x1="40" y1="0" x2="40" y2="-17" stroke="#D6433A" stroke-width="2.2" stroke-linecap="round" transform="rotate(${-120 + Math.min(10, n) * 24} 40 0)"/><circle cx="40" cy="0" r="2.6" fill="#1d2b45"/><text x="40" y="11" text-anchor="middle" dominant-baseline="central" class="meter-n">${n}</text></g>`;
    },
  };
  /* Where light comes from, in board coordinates. */
  function lightPoint(p) {
    const T = place(p);
    if (p.t === 'bulb') return T.pt(40, -46);
    if (p.t === 'led') return T.pt(40, -22);
    return T.mid;
  }
  function partSVG(p, v = {}) { const T = place(p); return { T, inner: PARTS[p.t](p, v, T) }; }
  function mini(t, props = {}, v = {}) {
    const VB = { bulb: '-2 -70 84 84', motor: '-2 -70 84 88', led: '-2 -40 84 50', meter: '-2 -30 84 60', cell: '-2 -24 84 48', wire: '-2 -22 84 44', switch: '-2 -24 84 48', button: '-2 -24 84 48', buzzer: '-2 -40 84 64' };
    let halo = '', core = '';
    if (t === 'bulb' && v.b) {
      halo = `<circle cx="40" cy="-46" r="${30 + 12 * v.b}" fill="url(#gGlowWarm)" opacity="${Math.min(1, v.b * 1.2)}"/>`;
      core = `<circle cx="40" cy="-46" r="20" fill="url(#gLit)" opacity="${Math.min(1, v.b * 1.15)}"/><circle cx="40" cy="-46" r="${16 + 14 * v.b}" fill="url(#gCore)" opacity="${Math.min(1, v.b * 1.3)}"/>`;
    }

  }

  /* ---------- Flick, the firefly helper ---------- */
  function flick(size = 90, mood = 'happy') {
    const mouth = mood === 'think' ? '<path d="M52 66.5q4 -2 8 0" stroke="#1B1F3A" stroke-width="2.2" fill="none" stroke-linecap="round"/>'
      : mood === 'wow' ? '<ellipse cx="56" cy="66" rx="3.2" ry="3.8" fill="#1B1F3A"/>'

    return { kind: 'trace', say: 'Follow the loop with your finger, from plus all the way round to minus. Is there a gap?', tone: 'hint' };

/* Circuit Lab: saving progress in localStorage under "circuit-lab-v1".
   Every read and write is wrapped, so the app works fully when storage is blocked. */
'use strict';
window.CL = window.CL || {};

(function (CL) {
  const KEY = 'circuit-lab-v1';
  const fresh = () => ({ stars: {}, sound: true, grown: false, unlockAll: false, circuits: [], seen: {} });
  let data = fresh();
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || 'null');
    if (s && typeof s === 'object') data = { ...fresh(), ...s, stars: { ...(s.stars || {}) }, seen: { ...(s.seen || {}) } };
  } catch (e) { /* storage blocked or broken: start fresh */ }

  function save() { try { localStorage.setItem(KEY, JSON.stringify(data)); } catch (e) { /* ignore */ } }

  CL.Store = {
    get: k => data[k],
    set(k, v) { data[k] = v; save(); },
    seen(k) { return !!data.seen[k]; },

    award(id, kind) {

      if (cur[kind]) return false;

    reset() { const keep = { sound: data.sound }; data = { ...fresh(), ...keep }; save(); },

/* Circuit Lab: chapters and activities (brief section 9).
   Phase 1 builds chapters 1-3. Later chapters are listed but hidden until built.

   An activity can define:
     start()        the parts on the board at the start (or per stage)
     tray           how many of each part the tray offers (Infinity = as many as you like)
     goalTypes      which parts should be working (used by the helper and the sparkle)
     check(A)       true when the goal is met. It must stay true for 1 second.
     bonus          { goal, check(A), say }
     solution       parts for hint level 3 ("Show me"). Must really work when copied.

(function (CL) {
  const { edgeKey } = CL.Solver;
  const INF = Infinity;

  /* ---------- part builders. For a cell, a is minus and b is plus. ---------- */
  const W = (a, b, c = 'r', bend) => ({ t: 'wire', a, b, c, bend });
  const cell = (a, b, o) => ({ t: 'cell', a, b, ...o });

  const sw = (a, b, o) => ({ t: 'switch', a, b, ...o });

    {

      why: 'Electricity flows out of the cell, through the bulb, and back to the cell. A full loop is called a circuit.',

  /* The grid edges a part covers. Most parts cover one; long parts cover two or more. */
  function edgesOf(p) {
    if (p.t === 'probe' || p.t === 'hid' || p.t === 'wand') return [];
    if (p.t === 'sw2') return [edgeKey(p.b, p.a), edgeKey(p.a, p.c)];
    const dx = Math.sign(p.b[0] - p.a[0]), dy = Math.sign(p.b[1] - p.a[1]), out = [];
    let q = p.a;
    for (let i = 0; i < 8 && !(q[0] === p.b[0] && q[1] === p.b[1]); i++) { const n = [q[0] + dx, q[1] + dy]; out.push(edgeKey(q, n)); q = n; }
    return out;
  }
  const overlaps = (p, q) => { const e = new Set(edgesOf(p)); return edgesOf(q).some(k => e.has(k)); };
  /* Put solution parts onto a board: anything already on the same spot is replaced. */
  function applySolution(parts, sol) {
    const out = parts.filter(p => !sol.some(s => overlaps(s, p)));
    return out.concat(sol.map(s => ({ id: 'g' + (++uid), origin: 'tray', ...s })));
  }
  /* Ghost parts: solution parts that are not yet on the board the same way. */
  const POLAR = { cell: 1, motor: 1, led: 1 };
  function ghostsFor(parts, sol) {
    return sol.filter(s => {
      if (s.t === 'probe') return false;
      const on = parts.find(p => overlaps(p, s) && (s.t !== 'sw2' || p.t === 'sw2'));
      if (!on || on.t !== s.t) return true;
      if (POLAR[s.t] && CL.Solver.key(on.a) !== CL.Solver.key(s.a)) return true;
      return !!on.open !== !!s.open || !!on.broken !== !!s.broken || !!on.flat !== !!s.flat || (s.t === 'led' && (on.col || 'r') !== (s.col || 'r'));
    });
  }
  function verifySolutions() {
    const S = CL.Solver, out = [];
    for (const a of ACTS) {
      if (a.kind === 'sort') continue;
      const boards = a.stages ? a.stages.map(s => [s.start(), s.solution]) : a.solution ? [[a.start(), a.solution]] : [];
      if (a.id === '1.5') boards.push([a.start(), []]);
      boards.forEach(([start, sol], i) => {
        const parts = applySolution(start, sol);
        const { res } = S.run(parts);
        const ok = a.verify ? a.verify(parts, S) : parts.filter(p => a.goalTypes.includes(p.t)).every(p => S.working(res, p));
        out.push({ id: a.id + (boards.length > 1 ? ` (${i + 1})` : ''), title: a.title, ok });
      });
    }
    return out;
  }

  CL.Acts = {
    ACTS, CHAPTERS, byId: id => ACTS.find(a => a.id === id), applySolution, ghostsFor, verifySolutions, ids, register, edgesOf, overlaps,
    B: { W, cell, bulb, sw, btn, buzz, motor, chain, ids, stdLoop, tallLoop, lit, BIG, INF, CELLS_SAFE },
  };
})(window.CL);

  <script>
/* Circuit Lab: chapters 4-8 (brief section 9).
   Same shape as activities.js, plus a few extra hooks used by these chapters:
     objTray(A) / onObj(A, id)    a tray of test objects instead of parts
     panel(A) / onDo(A, name, x)  extra content in the side column (baskets, boxes, save slots)
     actions(A)                   extra buttons above the hint button (Play, Let the cat in)
     deco(A)                      board decoration (lighthouse, quiz card, fish)
     studs(A)                     points a probe tip can clip onto
     blocked(edges)               spots on the board where parts can't go
     kind: 'sort'                 a card sorting game instead of a board */
'use strict';
window.CL = window.CL || {};

(function (CL) {
  const { W, cell, bulb, sw, btn, buzz, motor, chain, ids, stdLoop, lit, BIG, INF } = CL.Acts.B;
  const S = CL.Solver, { edgeKey, key } = S;
  const OBJN = CL.OBJN;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const led = (a, b, col = 'r') => ({ t: 'led', a, b, col });
  const meter = (a, b) => ({ t: 'meter', a, b });
  const shuffle = list => { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const one = (A, t) => A.of(t)[0];
  const bright = (A, p) => (p && A.res.el[p.id] && A.res.el[p.id].b) || 0;
  const series = (A, p, q) => p && q && Math.abs(Math.abs(A.res.el[p.id].I) - Math.abs(A.res.el[q.id].I)) < 1e-6 && Math.abs(A.res.el[p.id].I) > .01;
  const IDEA = {
    cond: 'Metals conduct well. Plastic, wood, rubber, glass and paper don\'t, so they are insulators. Pencil "lead" is graphite and conducts a little.',
    jobs: 'A bulb turns electrical energy into light and heat. A buzzer turns it into sound. A motor turns it into movement. An LED makes light and only lets current through one way.',
    ser: 'In a series circuit the same current flows through every part. Two bulbs share the voltage, so each is dimmer, and both are equally bright. Current isn\'t used up: it is the same all the way round.',
    par: 'In parallel, each branch gets the full voltage. Each bulb is about as bright as one alone, and one failing doesn\'t stop the others. The cell supplies more current in total, so it runs down faster. Houses are wired like this.',
    short: 'A path with almost no resistance straight across the cell lets a large current flow. The wire and cell get hot and the cell drains fast. With bigger batteries this can burn or start a fire.',
    mains: 'Mains electricity (230 V in the UK, Europe and India; 120 V in the USA) can kill. Children experiment only with small cells.',
  };

  /* ---------- the tester loop used in chapter 4 ---------- */
  const tester = () => stdLoop({ put: [{ t: 'gap', a: [4, 4], b: [3, 4] }] });
  const KIND = { yes: 'Lets it through', no: 'Stops it', little: 'A little' };
  const basket = (A, k, sub) => `<div class="bk bk-${k}"><h4>${KIND[k]}<small>${sub}</small></h4><div class="bk-items">${Object.keys(A.data.tested).filter(o => A.data.tested[o] === k).map(o => `<span title="${esc(OBJN[o])}">${CL.obj(o)}</span>`).join('')}</div></div>`;

  /* ---------- picture answers for the observation questions ---------- */
  const pics = {
    bulbs: (l1, l2, eq) => `<span class="qo-pic">${CL.mini('bulb', {}, { b: l1 })}${CL.mini('bulb', {}, { b: l2 })}${eq ? '<span class="eq">=</span>' : `<em>${l1 > l2 ? 'near +' : 'near -'}</em>`}</span>`,
    one: b => `<span class="qo-pic">${CL.mini('bulb', {}, { b })}</span>`,
    meters: same => `<span class="qo-pic">${[5, same ? 5 : 3, same ? 5 : 1].map(n => CL.mini('meter', {}, { n })).join('')}</span>`,
  };

  const ACTS = [
    /* ===================== Chapter 4: What lets electricity through? ===================== */
    {
      id: '4.1', title: 'Test it!',
      goal: 'Which things let electricity through? Test them in the gap.',
      why: "Metals let electricity through. They are conductors. Plastic, wood, rubber, glass and paper stop it. They are insulators. That's why wires have a plastic coat and plugs have plastic cases.",
      intro: 'Pick a thing from the drawer. Guess first, then test it in the gap.',
      start: tester, tray: {}, goalTypes: ['bulb'],
      init(A) { A.data.tested = {}; A.data.pending = null; A.data.busy = false; A.data.quiet = true; },
      objTray: A => Object.keys(OBJN).filter(o => !A.data.tested[o]).map(o => ({ id: o, name: OBJN[o], pic: CL.obj(o), sel: A.data.pending === o })),
      onObj(A, o) {
        if (A.data.busy) return;
        A.data.pending = o; A.refreshPanel(); A.refreshTray();
        A.say(`Will the ${OBJN[o].toLowerCase()} make the bulb light? Guess first!`, 'happy', 'think', 9000);
      },
      panel(A) {
        const n = Object.keys(A.data.tested).length, o = A.data.pending;
        const pred = o && !A.data.busy ? `<section class="pred"><div class="pred-o">${CL.obj(o)}<div><h3 class="pred-t">Will it light?</h3><p class="pred-s">${esc(OBJN[o])} in the gap</p></div></div><div class="pred-b"><button type="button" class="pb" data-do="guess:yes">${CL.mini('bulb', {}, { b: 1 })}<span>Yes</span></button><button type="button" class="pb" data-do="guess:no">${CL.mini('bulb', {})}<span>No</span></button></div><button type="button" class="pred-skip" data-do="guess:skip">Skip the guess</button></section>` : '';
        return `${pred}<div class="baskets">${basket(A, 'yes', 'conductor')}${basket(A, 'no', 'insulator')}${basket(A, 'little', 'pencil lead is graphite')}</div><p class="count">Tested <b>${n}</b> of 13.${n < 8 ? ` Test <b>${8 - n}</b> more for your star.` : n < 13 ? ' Test them all for a bonus star!' : ''}</p>`;
      },
      onDo(A, name, arg) {
        if (name !== 'guess' || !A.data.pending || A.data.busy) return;
        const o = A.data.pending; A.data.busy = true; A.refreshPanel();
        A.putInGap(o);
        A.after(1500, () => {
          const b = bright(A, one(A, 'bulb')), kind = b >= .3 ? 'yes' : b > .04 ? 'little' : 'no';
          const guessed = arg === 'skip' ? null : arg === 'yes';
          const right = guessed == null ? '' : guessed === (kind !== 'no') ? 'You guessed right! ' : 'Good guess! Now you know. ';
          const name = OBJN[o].toLowerCase();
          const fact = kind === 'yes' ? `The ${name} lets electricity through. It's a conductor.` : kind === 'little' ? "A little! Pencil 'lead' is really graphite. It lets a little through." : `The ${name} stops electricity. It's an insulator.`;
          A.data.tested[o] = kind; A.data.pending = null; A.data.busy = false;
          A.clearGap(); A.refreshPanel(); A.refreshTray(); A.refreshCounter();
          A.say(right + fact, kind === 'no' ? 'hint' : 'happy', kind === 'no' ? 'think' : 'wow', 7000);
        });
      },
      check: A => Object.keys(A.data.tested).length >= 8,
      bonus: { goal: 'Bonus star: test all 13 things.', check: A => Object.keys(A.data.tested).length >= 13, say: 'You tested everything. A real scientist!' },
      hints: [{ say: 'Pick a thing from the drawer. Guess, then watch the bulb.' }, { say: 'Metal things often let electricity through.' }, { say: 'Try the coin, the key or the foil next.' }],
      grown: { idea: IDEA.cond, wrong: 'Wires are just metal and the plastic is decoration: children often think the coat on a wire is only for colour. Plastic in the test gap stops the bulb (Osborne, 1983).', note: 'Guessing first is real science: predict, test, compare.', home: 'Make the same tester (cell, bulb, three clip wires and a gap) and test things from the kitchen drawer.' },
    },
    {
      id: '4.2', title: 'Paperclip switch',
      goal: 'Make your own switch from a paperclip! Put it in the gap. Swing the paperclip to turn the bulb on and off.',
      why: 'The metal paperclip is a conductor. When it touches both pins, the loop is complete.',
      start: () => stdLoop({ omit: [[[4, 4], [3, 4]]] }),
      tray: { pclip: 1 }, goalTypes: ['bulb'],
      init(A) { A.data.on = false; A.data.off = false; },
      onEvent(A, ev, info) {
        if (ev === 'place' && info.p.t === 'pclip') A.say('Now tap the paperclip to swing it across.', 'happy', 'happy');
        if (ev !== 'toggle' || info.p.t !== 'pclip') return;
        if (lit(A, .08)) A.data.on = true; else A.data.off = true;
        if (A.data.on && !A.data.off) A.say('On! Now swing it back to turn it off.', 'happy', 'wow');
        if (A.data.off && !A.data.on) A.say('Off. Swing it across to turn it on.', 'happy', 'happy');
      },
      check: A => A.data.on && A.data.off && A.of('pclip').length > 0,
      solution: [{ t: 'pclip', a: [3, 4], b: [4, 4], open: false }],
      hints: [{ say: 'Drag the paperclip switch into the gap.' }, { say: 'The gap is here.', rings: [[3, 4], [4, 4]] }, { say: 'Show me! It goes here. Then tap it.' }],
      grown: { idea: IDEA.cond, home: 'Make one: cardboard, 2 brass split pins and a paperclip. A grown-up makes the holes.' },
    },
    {
      id: '4.3', title: 'Mystery boxes',
      goal: "What's inside each box? Test it without opening it!",
      why: 'Scientists often find things out without looking inside. You used electricity to see what was hidden.',
      start: tester, tray: {}, goalTypes: ['bulb'],
      init(A) { A.data.boxes = shuffle(['wire', 'none', 'plastic', 'coin']).map((inside, i) => ({ label: 'ABCD'[i], inside, tested: null, opened: false })); A.data.quiet = true; A.data.busy = false; },
      panel(A) {
        return `<div class="boxes">${A.data.boxes.map((b, i) => `<div class="mbox${b.tested ? ' tested' : ''}"><div class="mbox-pic">${CL.box(b.opened, b.inside)}</div><div class="mbox-b"><b>Box ${b.label}</b>${b.tested ? `<span class="tag tag-${b.tested}">${b.tested === 'metal' ? 'Metal path inside!' : 'No metal path'}</span>` : '<span class="tag">Not tested</span>'}${b.opened ? `<small>${{ wire: 'A wire', none: 'Nothing!', plastic: 'A plastic strip', coin: 'A coin' }[b.inside]}</small>` : ''}</div><div class="mbox-a"><button type="button" class="mini-btn" data-do="test:${i}" ${A.data.busy ? 'disabled' : ''}>Test it</button><button type="button" class="mini-btn" data-do="open:${i}" ${b.tested && !b.opened ? '' : 'disabled'}>Open the lid</button></div></div>`).join('')}</div>`;
      },
      onDo(A, name, i) {
        const b = A.data.boxes[+i]; if (!b) return;
        if (name === 'test' && !A.data.busy) {
          A.data.busy = true; A.putInGap('box', b.inside); A.refreshPanel();
          A.after(1300, () => {
            b.tested = lit(A, .3) ? 'metal' : 'none'; A.data.busy = false; A.refreshPanel();
            A.say(b.tested === 'metal' ? `It lights! Box ${b.label} has a metal path inside.` : `No light. Box ${b.label} has no metal path inside.`, 'happy', b.tested === 'metal' ? 'wow' : 'think');
          });
        }
        if (name === 'open' && b.tested) {
          b.opened = true; A.refreshPanel(); CL.Sound.tick();
          const ok = (b.tested === 'metal') === (b.inside === 'wire' || b.inside === 'coin');
          A.say(ok ? `Look! ${{ wire: 'A wire', none: 'Nothing at all', plastic: 'A plastic strip', coin: 'A coin' }[b.inside]}. Your test was right.` : 'Hmm, a surprise!', 'happy', 'wow');
        }
      },
      check: A => A.data.boxes.every(b => b.tested && b.opened),
      hints: [{ say: 'Tap Test it on a box. Watch the bulb.' }, { say: 'If the bulb lights, there must be metal inside.' }, { say: 'Test all four boxes, then open them to check.' }],
      grown: { idea: IDEA.cond, note: 'Inside, in a random order: a wire, nothing, a plastic strip and a coin.', home: 'Hide a key or a plastic toy in an envelope with two foil strips. Test it without looking.' },
    },
    {
      id: '4.4', title: 'Pencil dimmer', big: true,
      goal: 'Slide the clip. Can you make the bulb bright, then dim, then bright again?',
      why: 'Graphite lets only a little electricity through. More pencil means more to squeeze through, so the bulb gets dimmer.',
      start: () => ids([cell([2, 3], [2, 2]), cell([2, 4], [2, 3]), W([2, 2], [2, 1]), ...chain([[2, 1], [3, 1], [4, 1], [5, 1], [5, 2]]), bulb([5, 2], [5, 3]), W([5, 3], [5, 4], 'k'), { t: 'pencil', a: [3, 4], b: [5, 4], units: 1 }, W([3, 4], [2, 4], 'k')]),
      tray: {}, goalTypes: ['bulb'],
      init(A) { A.data.swings = 0; A.data.dir = 1; A.data.ref = null; },
      counter: A => `Changes: ${Math.min(2, A.data.swings)} of 2.`,
      onEvent(A, ev) {
        if (ev !== 'solve') return;
        const d = A.data, b = bright(A, one(A, 'bulb'));
        if (d.ref == null) { d.ref = b; return; }
        if (d.dir > 0) { if (b > d.ref) d.ref = b; else if (d.ref - b >= .2) { d.swings++; d.dir = -1; d.ref = b; A.refreshCounter(); if (d.swings === 1) A.say('Dimmer! Now make it bright again.', 'happy', 'wow'); } }
        else { if (b < d.ref) d.ref = b; else if (b - d.ref >= .2) { d.swings++; d.dir = 1; d.ref = b; A.refreshCounter(); } }
      },
      check: A => A.data.swings >= 2,
      hints: [{ say: 'Drag the red clip along the pencil.' }, { say: 'Slide it all the way along. Then back again.', rings: [[4, 4]] }, { say: 'More pencil between the clips means a dimmer bulb.' }],
      grown: { idea: IDEA.cond, note: 'This is a variable resistor, like a dimmer switch. Real pencil lines vary a lot with the pencil and how thick the line is. Often a bulb barely glows; an LED or buzzer shows it better at home.', home: 'Shade a thick strip with a soft pencil (6B). Slide a clip wire along it with an LED in the loop.' },
    },

    /* ===================== Chapter 5: Making things happen ===================== */
    {
      id: '5.1', title: 'Buzz!',
      goal: 'Make the buzzer buzz.',
      why: 'Electricity can make sound too. Inside the buzzer, something wobbles very fast.',
      start: () => ids([cell([2, 3], [2, 2])]),
      tray: { wire: INF, buzzer: 1 }, goalTypes: ['buzzer'],
      onEvent(A, ev) { if (ev === 'success') A.setTray('switch', 1); },
      check: A => A.of('buzzer').some(z => A.works(z)),
      bonus: {
        goal: 'Bonus star: add the switch so you can turn the buzz off and on.',
        check: A => { const s = one(A, 'switch'), z = one(A, 'buzzer'); return s && z && A.works(z) && A.truth([s.id], z).join() === 'false,true'; },
        say: 'Now you can turn the buzz off and on!',
      },
      solution: [...chain([[2, 2], [3, 2], [4, 2]]), buzz([4, 2], [4, 3]), ...chain([[4, 3], [3, 3], [2, 3]], 'k')],
      hints: [{ say: 'Make a loop: cell, buzzer, and back to the cell.' }, { say: 'Start from these pegs.', ringsFromSolution: true }, { say: 'Show me! Put the parts where the faint ones are.' }],
      grown: { idea: IDEA.jobs, note: 'Many real buzzers only work one way round and may need more than 1.5 V. If a real buzzer won\'t sound, turn it round or add a cell.', home: 'List things at home that use cells, and what each one does: light, sound or movement.' },
    },
    {
      id: '5.2', title: 'Spin the fan',
      goal: 'Make the fan spin.',
      why: 'Electricity goes one way round the loop. Turn the cell round and it goes the other way, so the motor spins the other way.',
      start: () => ids([cell([2, 3], [2, 2])]),
      tray: { wire: INF, motor: 1 }, goalTypes: ['motor'],
      init(A) { A.data.dirs = new Set(); A.data.last = null; },
      onEvent(A, ev, info) {
        if (ev === 'turn') A.data.last = info.p.t;
        if (ev !== 'solve') return;
        const m = one(A, 'motor'); if (!m || !A.works(m)) return;
        const d = A.res.el[m.id].rev ? 'b' : 'f';
        if (A.data.dirs.has(d)) return;
        A.data.dirs.add(d);
        if (A.data.dirs.size === 1) { A.setGoal('Now make it spin the OTHER way.'); A.say('It spins! Now can you make it spin the other way?', 'happy', 'wow'); }
        else if (A.data.last === 'motor') A.say('Turning the motor round works too!', 'happy', 'wow');
      },
      check: A => A.data.dirs.size === 2 && A.of('motor').some(m => A.works(m)),
      solution: [...chain([[2, 2], [3, 2], [4, 2]]), motor([4, 2], [4, 3]), ...chain([[4, 3], [3, 3], [2, 3]], 'k')],
      hints: [{ say: 'Make a loop with the motor in it. Then turn something round.' }, { say: 'Tap the cell, then tap Turn round.' }, { say: 'Show me! Put the parts where the faint ones are.' }],
      grown: { idea: IDEA.jobs, wrong: 'Clashing currents: if electricity came out of both ends of the cell, turning the cell round would change nothing. The fan spins the other way, because the flow goes the other way round (Osborne, 1983).', note: 'Real motors draw less current when spinning freely. Here speed simply follows current.', home: 'Swap the cell round in a battery toy with a motor and watch which way it turns.' },
    },
    {
      id: '5.3', title: 'LED puzzle',
      goal: "Make the red LED light up. It's a tricky one!",
      why: 'An LED is a one-way light. The long leg goes towards plus. It also needs a bigger push than a bulb: 2 cells.',
      start: () => ids([cell([2, 3], [2, 2]), ...chain([[2, 2], [2, 1], [3, 1], [4, 1], [5, 1], [5, 2]]), led([5, 2], [5, 3]), ...chain([[5, 3], [5, 4], [4, 4], [3, 4], [2, 4], [2, 3]], 'k')]),
      tray: { cell: 1 }, goalTypes: ['led'],
      onEvent(A, ev) { if (ev === 'success') A.setTray('ledg', 1); },
      check: A => A.of('led').some(l => (l.col || 'r') === 'r' && A.works(l)),
      bonus: { goal: 'Bonus star: swap in the green LED and light it.', check: A => A.of('led').some(l => l.col === 'g' && A.works(l)), say: 'Green light!' },
      solution: [led([5, 3], [5, 2]), cell([2, 4], [2, 3])],
      hints: [{ say: 'LEDs only work one way round. Look at the long leg.' }, { say: 'Turn the LED round. Then think about the push.', rings: [[5, 2], [5, 3]] }, { say: 'Show me! Turn the LED round, and add a second cell here.' }],
      grown: { idea: IDEA.jobs, note: 'A red LED needs about 1.8 V, so one 1.5 V cell can\'t light it. Real LEDs also need a resistor or they can burn out. Here it\'s built in.', home: 'With a real LED, find the longer leg. It goes towards plus.' },
    },
    {
      id: '5.4', title: 'Sharing the push',
      goal: 'Put a bulb AND a buzzer in one loop. What happens to the bulb?',
      why: "The buzzer only lets a little electricity through. So the bulb gets less, and it's dim.",
      start: () => ids([cell([2, 3], [2, 2])]),
      tray: { wire: INF, bulb: 1, buzzer: 1 }, goalTypes: ['buzzer', 'bulb'],
      pre: A => { const b = one(A, 'bulb'), z = one(A, 'buzzer'); return b && z && A.works(z) && series(A, b, z); },
      onEvent(A, ev) {
        if (ev === 'solve' && !A.q && A.act.pre(A)) A.ask({ text: 'Is the bulb bright or dim?', opts: [{ label: 'Bright', pic: pics.one(1) }, { label: 'Dim', pic: pics.one(.25), right: true }], flash: () => A.of('bulb').map(b => b.id), say: 'Yes! It is dim. The buzzer takes most of the push.' });
      },
      check: A => A.act.pre(A) && A.data.answered,
      solution: [W([2, 2], [3, 2]), bulb([3, 2], [4, 2]), W([4, 2], [5, 2]), buzz([5, 2], [5, 3]), ...chain([[5, 3], [4, 3], [3, 3], [2, 3]], 'k')],
      hints: [{ say: 'Make one loop: cell, bulb, buzzer, and back to the cell.' }, { say: 'Build from these pegs.', ringsFromSolution: true }, { say: 'Show me! One loop with both parts.' }],
      grown: { idea: IDEA.ser, note: 'In series, the whole loop\'s resistance sets the current. The buzzer\'s high resistance limits it for everything.', home: 'Put a bulb and a buzzer in one real loop. Is the bulb dimmer than on its own?' },
    },
    {
      id: '5.5', title: 'Light, sound and movement',
      goal: 'Build a toy that lights up, buzzes AND spins, all at the same time.',
      why: 'Sharing one loop means sharing the push. More cells, or separate paths, give everyone enough.',

    }
    clearPrev() { this.L.prev.innerHTML = ''; }

    sparkle(xy) {

  <script>
/* Circuit Lab: special screens.
   sort:   the "Safe or dangerous?" card game (7.3)
   torch:  the dark bedroom reward for building a torch (8.1)
   steady: the steady-hand game view (8.4) */
'use strict';
window.CL = window.CL || {};

(function (CL) {
  const { ic, Sound } = CL;
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const reduced = () => window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  const shuffle = list => { const a = [...list]; for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  /* ---------- 7.3 Safe or dangerous? ---------- */
  function sort(A, host) {
    const cards = A.act.cards, order = shuffle(cards.map((_, i) => i));
    let sel = null, drag = null;
    host.innerHTML = `<div class="so-grid">${order.map(i => `<button type="button" class="card" data-i="${i}" aria-label="${esc(cards[i].label)}">${CL.scn(cards[i].k)}<span>${esc(cards[i].label)}</span></button>`).join('')}</div>
      <div class="so-bins"><div class="so-bin safe" data-bin="safe" role="button" tabindex="0" aria-label="Safe basket"><h3><i>${ic.check}</i>Safe</h3><div class="so-in"></div></div><div class="so-bin danger" data-bin="danger" role="button" tabindex="0" aria-label="Dangerous basket"><h3><i>${ic.x}</i>Dangerous</h3><div class="so-in"></div></div></div>`;
    const cardEl = i => host.querySelector(`.card[data-i="${i}"]`);
    const choose = i => { sel = sel === i ? null : i; host.querySelectorAll('.card').forEach(c => c.classList.toggle('sel', +c.dataset.i === sel)); if (sel != null) { Sound.tick(); A.say('Now tap a basket: safe, or dangerous?', 'happy', 'think', 4000); } };
    function put(i, bin) {
      const c = cards[i], el = cardEl(i); if (!el || A.data.sorted.has(i)) return;
      const ok = (bin === 'safe') === c.safe;
      sel = null; el.classList.remove('sel');
      if (ok) {
        A.data.sorted.add(i); Sound.ding();
        host.querySelector(`[data-bin="${bin}"] .so-in`).insertAdjacentHTML('beforeend', `<span class="so-chip" title="${esc(c.label)}">${CL.scn(c.k)}</span>`);
        el.outerHTML = `<div class="card gone" aria-hidden="true">Sorted</div>`;
        A.say(c.why, 'happy', 'happy', 6000);
        A.refreshCounter();
      } else {
        Sound.snap();
        el.classList.remove('bounce'); void el.offsetWidth; el.classList.add('bounce');
        A.say(c.why, 'gap', 'think', 7000);
      }
    }
    host.addEventListener('click', e => {
      const card = e.target.closest('.card[data-i]'); if (card && !drag) { choose(+card.dataset.i); return; }
      const bin = e.target.closest('[data-bin]'); if (bin && sel != null) put(sel, bin.dataset.bin);
    });
    host.addEventListener('keydown', e => { const bin = e.target.closest('[data-bin]'); if (bin && (e.key === 'Enter' || e.key === ' ') && sel != null) { e.preventDefault(); put(sel, bin.dataset.bin); } });

      const card = e.target.closest('.card[data-i]'); if (!card) return;

      const mv = ev => {
        const dx = ev.clientX - start.x, dy = ev.clientY - start.y;
        if (!start.moved && Math.hypot(dx, dy) > 8) { start.moved = true; drag = start; card.classList.add('dragging'); }
        if (start.moved) { card.style.transform = `translate(${dx}px, ${dy}px) rotate(-3deg)`; const t = document.elementFromPoint(ev.clientX, ev.clientY); host.querySelectorAll('.so-bin').forEach(b => b.classList.toggle('over', !!(t && t.closest('.so-bin') === b))); }
      };

        window.removeEventListener('pointermove', mv); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up);

        card.style.transform = ''; card.classList.remove('dragging');
        const t = document.elementFromPoint(ev.clientX, ev.clientY), bin = t && t.closest('[data-bin]');
        if (bin) put(start.i, bin.dataset.bin);
        setTimeout(() => { drag = null; }, 0);
      };
      window.addEventListener('pointermove', mv); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
    });
  }

  /* ---------- a full-screen overlay ---------- */
  function overlay(cls, html) {
    const o = document.createElement('div');
    o.className = 'scene ' + cls;
    o.setAttribute('role', 'dialog'); o.setAttribute('aria-modal', 'true');
    o.innerHTML = `<div class="scene-box">${html}<button type="button" class="scene-x" aria-label="Close">${ic.x}</button></div>`;
    document.body.appendChild(o);
    o.querySelector('.scene-x').focus({ preventScroll: true });
    return o;
  }

  /* ---------- 8.1 the dark bedroom ---------- */
  function torch() {
    const spot = CL.TEDDY_SPOTS[Math.floor(Math.random() * CL.TEDDY_SPOTS.length)];
    const o = overlay('torch-scene', `<svg viewBox="0 0 900 560" class="room" aria-label="A dark bedroom">${CL.BEDROOM}<g transform="translate(${spot[0]} ${spot[1]}) scale(1.1)">${CL.TEDDY}</g></svg><div class="dark"></div><p class="scene-msg" aria-live="polite">It's night. Move your torch beam to find Teddy!</p>`);
    const box = o.querySelector('.scene-box'), dark = o.querySelector('.dark'), msg = o.querySelector('.scene-msg');
    let found = false, near = 0, last = performance.now(), pos = [.5, .5];
    const close = () => o.remove();
    o.querySelector('.scene-x').addEventListener('click', close);
    const aim = (fx, fy) => {
      pos = [Math.max(0, Math.min(1, fx)), Math.max(0, Math.min(1, fy))];
      dark.style.setProperty('--x', (pos[0] * 100) + '%'); dark.style.setProperty('--y', (pos[1] * 100) + '%');

      const d = Math.hypot(pos[0] * 900 - spot[0], pos[1] * 560 - spot[1]);

    };

    box.addEventListener('pointermove', e => { const r = box.getBoundingClientRect(); aim((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); });
    box.addEventListener('pointerdown', e => { const r = box.getBoundingClientRect(); aim((e.clientX - r.left) / r.width, (e.clientY - r.top) / r.height); });
    o.addEventListener('keydown', e => {
      const mv = { ArrowLeft: [-.04, 0], ArrowRight: [.04, 0], ArrowUp: [0, -.05], ArrowDown: [0, .05] }[e.key];
      if (mv) { e.preventDefault(); aim(pos[0] + mv[0], pos[1] + mv[1]); }
      if (e.key === 'Escape') close();
    });
  }

  /* ---------- 8.4 the steady-hand game ---------- */
  function steady(A, onDone) {

      const b = document.createElement('button'); b.type = 'button'; b.className = 'nextbtn st-done'; b.textContent = 'Done';
      b.addEventListener('click', () => { close(); onDone(touches); });

      for (let i = Math.max(0, idx - 30); i <= Math.min(N, idx + 30); i++) { const dd = Math.hypot(p[0] - pts[i][0], p[1] - pts[i][1]); if (dd < bd) { bd = dd; best = i; } }

      holding = true; Sound.unlock(); e.preventDefault();

    svg.addEventListener('pointerup', release); svg.addEventListener('pointercancel', release);

    });
    draw();

  CL.Scenes = { sort, torch, steady };

  <script>
/* Circuit Lab: engine self-test (brief section 11.1).
   Runs on load when the page is opened from a file or localhost, or with ?test in the URL.
   Call runSelfTests() from the console at any time. */
'use strict';
window.CL = window.CL || {};

(function (CL) {
  const S = () => CL.Solver;
  let uid = 0;
  const mk = (t, a, b, extra = {}) => ({ id: 't' + (++uid), t, a, b, ...extra });

  /* A compact rectangular loop: elements on the first edges, wires on the rest.
     Direction runs clockwise, so a cell's plus end points the way current flows. */
  function loop(list) {
    const w = Math.max(1, Math.ceil(list.length / 2));
    const path = [];
    for (let c = 0; c <= w; c++) path.push([c, 0]);
    for (let c = w; c >= 0; c--) path.push([c, 1]);
    const parts = [];
    for (let i = 0; i < path.length; i++) {
      const a = path[i], b = path[(i + 1) % path.length];
      if (a[0] === b[0] && a[1] === b[1]) continue;
      const el = list[parts.length] || { t: 'wire' };
      const { flip, ...props } = el;
      parts.push(flip ? mk(el.t, b, a, props) : mk(el.t, a, b, props));
    }
    return parts;
  }
  const C = (o = {}) => ({ t: 'cell', ...o }), B = { t: 'bulb' }, BZ = { t: 'buzzer' }, MO = { t: 'motor' };
  const near = (x, y, tol) => Math.abs(x - y) <= tol;
  const finite = res => Object.values(res.el).every(s => Object.values(s).every(v => typeof v !== 'number' || Number.isFinite(v)));
  const of = (parts, t) => parts.filter(p => p.t === t);

  function runSelfTests(opts = {}) {
    const results = [];
    const T = (name, fn) => {
      let ok = false, info = '';
      try { const r = fn(); ok = r === true || (r && r.ok); info = r && r.info ? r.info : ''; }
      catch (e) { ok = false; info = e.message; }
      results.push({ name, ok, info });
    };
    const { solve, run, evalStates, working } = S();

    T('1 cell + 1 bulb: I about 0.28 A, brightness about 0.53', () => {
      const p = loop([C(), B]); const r = solve(p); const s = r.el[of(p, 'bulb')[0].id];
      return { ok: near(Math.abs(s.I), .28, .02) && near(s.b, .53, .03), info: `I=${s.I.toFixed(3)} b=${s.b.toFixed(3)}` };
    });
    T('2 cells + 1 bulb: brightness 1.0, not broken', () => {
      const p = loop([C(), C(), B]); const { res } = run(p); const b = of(p, 'bulb')[0]; const s = res.el[b.id];
      return { ok: near(s.b, 1, .001) && !b.broken && near(s.P, 1.43, .05), info: `P=${s.P.toFixed(2)}` };
    });
    T('3 cells + 1 bulb: bulb breaks', () => {
      const p = loop([C(), C(), C(), B]); const r0 = solve(p); const P = r0.el[of(p, 'bulb')[0].id].P; run(p);
      return { ok: of(p, 'bulb')[0].broken && near(P, 2.9, .1), info: `P=${P.toFixed(2)}` };
    });
    T('1 cell + 2 bulbs in series: each about 0.27, exactly equal', () => {
      const p = loop([C(), B, B]); const r = solve(p); const [a, b] = of(p, 'bulb').map(x => r.el[x.id].b);
      return { ok: near(a, .27, .02) && Math.abs(a - b) < 1e-9, info: `${a.toFixed(4)} ${b.toFixed(4)}` };
    });
    T('1 cell + 2 bulbs in parallel: each about 0.51', () => {
      const p = [mk('cell', [0, 1], [0, 0]), mk('wire', [0, 0], [1, 0]), mk('wire', [1, 0], [2, 0]), mk('bulb', [1, 0], [1, 1]), mk('bulb', [2, 0], [2, 1]), mk('wire', [1, 1], [0, 1]), mk('wire', [2, 1], [1, 1])];
      const r = solve(p); const bs = of(p, 'bulb').map(x => r.el[x.id].b);
      return { ok: bs.every(b => near(b, .51, .02)), info: bs.map(b => b.toFixed(3)).join(' ') };
    });
    T('1 cell + bulb + buzzer: buzzer sounds, bulb about 0.11', () => {
      const p = loop([C(), B, BZ]); const r = solve(p);
      const b = r.el[of(p, 'bulb')[0].id].b, z = r.el[of(p, 'buzzer')[0].id];
      return { ok: z.on && near(b, .11, .015), info: `b=${b.toFixed(3)}` };
    });
    T('1 cell + bulb + motor: motor spins, bulb about 0.30', () => {
      const p = loop([C(), B, MO]); const r = solve(p);
      const b = r.el[of(p, 'bulb')[0].id].b, m = r.el[of(p, 'motor')[0].id];
      return { ok: m.spin && near(b, .30, .02), info: `b=${b.toFixed(3)} speed=${m.speed.toFixed(2)}` };
    });
    /* Current runs clockwise, so a forward LED has its long leg (b) first: flip it. */
    const ledLoop = (n, rev) => loop([...Array(n)].map(() => C()).concat([{ t: 'led', col: 'r', flip: !rev }]));
    T('Red LED forward, 1 cell: off', () => { const p = ledLoop(1); const r = solve(p); return !r.el[of(p, 'led')[0].id].on; });
    T('Red LED forward, 2 cells: on, about 20 mA', () => {
      const p = ledLoop(2); const r = solve(p); const s = r.el[of(p, 'led')[0].id];
      return { ok: s.on && near(s.fwd, .02, .002), info: `${(s.fwd * 1000).toFixed(1)} mA` };
    });
    T('Red LED forward, 3 cells: breaks', () => { const p = ledLoop(3); run(p); return of(p, 'led')[0].broken; });
    T('LED reversed: off with 1, 2 or 3 cells', () => [1, 2, 3].every(n => { const p = ledLoop(n, true); const r = solve(p); return !r.el[of(p, 'led')[0].id].on; }));

    T('Remove any one wire from a working loop: current 0 everywhere', () => {
      const base = loop([C(), B]);
      return of(base, 'wire').every(w => { const p = base.filter(x => x !== w); const r = solve(p); return Object.values(r.el).every(s => Math.abs(s.I) < 1e-6); });
    });
    T('2 cells the same way double the push; facing each other give 0', () => {
      const p1 = loop([C(), B]), one = solve(p1);
      const two = loop([C(), C(), B]), face = loop([C(), C({ flip: true }), B]);
      const i1 = Math.abs(one.el[of(p1, 'bulb')[0].id].I), i2 = Math.abs(solve(two).el[of(two, 'bulb')[0].id].I), i0 = Math.abs(solve(face).el[of(face, 'bulb')[0].id].I);
      return { ok: i2 / i1 > 1.85 && i0 < 1e-9, info: `ratio=${(i2 / i1).toFixed(2)} facing=${i0.toExponential(1)}` };
    });
    T('3 cells + 2 bulbs in series: both lit, neither broken', () => {
      const p = loop([C(), C(), C(), B, B]); const { res } = run(p);
      return of(p, 'bulb').every(b => !b.broken && res.el[b.id].on);
    });
    T('A wire across the cell: short flag on, bulb dark', () => {
      const p = [mk('cell', [0, 1], [0, 0]), mk('wire', [0, 0], [1, 0]), mk('bulb', [1, 0], [1, 1]), mk('wire', [1, 1], [0, 1]), mk('wire', [0, 0], [0, 1])];
      const r = solve(p); return r.short && !r.el[of(p, 'bulb')[0].id].on && p.filter(x => x.t === 'wire' && r.el[x.id].hot).length >= 1;
    });
    T('Motor direction flips when the cell is turned round', () => {
      const a = loop([C(), MO]), b = loop([C({ flip: true }), MO]);
      return solve(a).el[of(a, 'motor')[0].id].rev !== solve(b).el[of(b, 'motor')[0].id].rev;
    });
    T('Flow meters: 3 in one loop read 5; parallel reads 5, 5 and 10', () => {
      const p = loop([C(), B, { t: 'meter' }, { t: 'meter' }, { t: 'meter' }]); const r = solve(p);
      const ns = of(p, 'meter').map(m => r.el[m.id].n);
      const q = [mk('cell', [0, 1], [0, 0]), mk('meter', [0, 0], [1, 0]), mk('wire', [1, 0], [2, 0]), mk('meter', [1, 0], [1, 1]), mk('bulb', [1, 1], [1, 2]), mk('meter', [2, 0], [2, 1]), mk('bulb', [2, 1], [2, 2]), mk('wire', [2, 2], [1, 2]), mk('wire', [1, 2], [0, 2]), mk('wire', [0, 2], [0, 1])];
      const rq = solve(q); const nq = of(q, 'meter').map(m => rq.el[m.id].n);
      return { ok: ns.every(n => n === 5) && nq[0] === 10 && nq[1] === 5 && nq[2] === 5, info: `${ns.join(',')} / ${nq.join(',')}` };
    });
    T('Parts placed but not connected: no NaN, no infinity', () => {
      const p = [mk('cell', [0, 0], [0, 1]), mk('bulb', [3, 3], [4, 3]), mk('motor', [6, 1], [6, 2]), mk('led', [2, 4], [3, 4])];
      return finite(solve(p));
    });
    T('Empty board, no cell, and two cells side by side: all solve', () => {
      const e = solve([]), nc = solve(loop([B, BZ]));
      const par = [mk('cell', [0, 1], [0, 0]), mk('cell', [1, 1], [1, 0]), mk('wire', [0, 0], [1, 0]), mk('wire', [0, 1], [1, 1]), mk('wire', [1, 0], [2, 0]), mk('bulb', [2, 0], [2, 1]), mk('wire', [2, 1], [1, 1])];
      const rp = solve(par);
      return finite(e) && finite(nc) && finite(rp) && rp.el[of(par, 'bulb')[0].id].on;
    });

    // 9. Switch puzzles (3.4 and 3.5). 8.6 and 8.7 arrive with the two-way switch in phase 3.
    const truth = (p, ids, goal) => evalStates(p, ids, (res, cp) => working(res, cp.find(x => x.id === goal.id))).map(r => r.val);
    T('evalStates: two switches in series make AND (3.4)', () => {
      const p = loop([C(), B, { t: 'switch' }, { t: 'switch' }]); const sw = of(p, 'switch').map(s => s.id);
      const t = truth(p, sw, of(p, 'bulb')[0]);

      const ids = of(q, 'button').map(s => s.id); const t = truth(q, ids, of(q, 'buzzer')[0]);

    });

    T('Test gap: metal conducts, plastic does not, pencil a little', () => {
      const b = o => { const p = loop([C(), B, { t: 'gap', obj: o }]); return solve(p).el[of(p, 'bulb')[0].id].b; };
      const coin = b('coin'), pl = b('pspoon'), pen = b('pencil');
      return { ok: coin > .45 && pl < 1e-3 && pen > .08 && pen < .3, info: `coin=${coin.toFixed(2)} plastic=${pl.toFixed(3)} pencil=${pen.toFixed(2)}` };
    });
    T('Pencil track: more pencil, dimmer bulb', () => {
      const bs = [1, 3, 5].map(u => { const p = [mk('cell', [0, 1], [0, 0]), mk('cell', [0, 2], [0, 1]), mk('wire', [0, 0], [1, 0]), mk('bulb', [1, 0], [1, 1]), mk('wire', [1, 1], [1, 2]), mk('pencil', [1, 2], [3, 2], { units: u }), mk('wire', [3, 2], [3, 3]), mk('wire', [3, 3], [0, 3]), mk('wire', [0, 3], [0, 2])]; return solve(p).el[of(p, 'bulb')[0].id].b; });
      return { ok: bs[0] > bs[1] && bs[1] > bs[2] && bs[0] - bs[2] >= .2, info: bs.map(x => x.toFixed(2)).join(' ') };
    });

      const build = id => CL.Acts.applySolution([], CL.Acts.byId(id).solution);
      T('evalStates: two-way switch chooses red or green (8.6), and a wrong build fails', () => {
        const a = CL.Acts.byId('8.6'), right = build('8.6'), wrong = build('8.6');
        const g = wrong.find(p => p.t === 'led' && p.col === 'g'); [g.a, g.b] = [g.b, g.a];

      });
      T('evalStates: stairs light changes from either switch (8.7), and a wrong build fails', () => {
        const a = CL.Acts.byId('8.7'), right = build('8.7');
        const wrong = right.filter(p => !(p.t === 'wire' && p.a[1] === 3 && p.b[1] === 3));

    // Every activity's "Show me" layout must really work when copied (brief 11.2).
    if (CL.Acts && CL.Acts.verifySolutions) {
      CL.Acts.verifySolutions().forEach(v => results.push({ name: `Show me layout works: ${v.id} ${v.title}`, ok: v.ok, info: v.info || '' }));
