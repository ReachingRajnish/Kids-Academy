    const rows = CHAPTERS.map(ch => {
      const acts = ACTS.filter(a => a.ch === ch.n), done = doneIn(ch.n), open = isOpen(ch.n);
      const toks = acts.map(a => {
        const s = Store.stars(a.id), n = (s.s ? 1 : 0) + (s.b ? 1 : 0), isNext = nx && nx.id === a.id;
        return `<button type="button" class="tok${s.s ? ' done' : ''}${isNext ? ' next' : ''}${open ? '' : ' lockd'}" data-act="${a.id}" aria-label="${a.id} ${esc(a.title)}${s.s ? ', done' : ''}${isNext ? ', next' : ''}${open ? '' : ', locked'}">
          <span class="tok-disc"><span class="tok-pic">${mini(...a.icon)}</span>${n ? `<span class="tok-st">${ic.star.repeat(n)}</span>` : ''}${a.big && !ch.big ? `<span class="tok-big" title="Big challenge">${ic.mountain}</span>` : ''}${isNext ? '<span class="tok-next">Next</span>' : ''}</span>
          <span class="tok-n">${a.id}</span><span class="tok-name">${esc(a.title)}</span></button>`;
      }).join('');
      const sub = ch.big ? `${ic.mountain}Big challenge` : `${done} of ${acts.length} done`;
      return `<section class="row${open ? '' : ' locked'}" aria-labelledby="ch${ch.n}"><div class="row-label"><span class="row-n">${ch.n}</span><span class="row-ic">${mini(...ch.icon)}</span><div><h2 id="ch${ch.n}">${esc(ch.name)}</h2><small>${sub}</small></div></div><div class="shelf">${toks}${open ? '' : `<p class="row-lock">${ic.lock}<span>Finish 3 in "${esc(chName(ch.n - 1))}" to open</span></p>`}</div></section>`;
    }).join('');
    root.innerHTML = `<div class="home">
      <header class="h-top"><div class="logo">${ic.logoBulb()}<h1>Circuit <span>Lab</span></h1></div>${jar(Store.total())}${soundBtn()}${adultBtn(false)}<button type="button" class="cta js-free">${ic.build}<span>Free build</span></button></header>
      ${msg ? `<p class="toast" role="status">${esc(msg)}</p>` : ''}
      <main class="rows">${rows}</main>
    </div>`;
    bindCommon(null);
    $('.js-free').addEventListener('click', () => { Sound.unlock(); Sound.tick(); startActivity('8.8'); });
    $$('.tok').forEach(t => t.addEventListener('click', () => {
      Sound.unlock();
      const a = Acts.byId(t.dataset.act);
      if (!isOpen(a.ch)) { showHome(`Finish 3 activities in "${chName(a.ch - 1)}" to open "${chName(a.ch)}". A grown-up can also unlock everything.`); return; }
      Sound.tick(); startActivity(a.id);
    }));
  }

  /* ================= activity session ================= */
  function makeSession(act) {
    const S = {
      act, parts: [], res: { el: {} }, data: {}, undo: [], trayMax: { ...act.tray }, armed: null, cursor: null,
      hintLevel: 0, diagRing: null, flashRings: null, status: 'play', hold: 0, bhold: 0, timers: [], msgUntil: 0, diagAt: 0,
      showFlow: Store.get('showFlow') !== false, dt: .1, goalText: act.goal, stroke: null, q: null,
      of: t => S.parts.filter(p => p.t === t),
      part: id => S.parts.find(p => p.id === id),
      works: p => Solver.working(S.res, p),
      goals: () => S.parts.filter(p => (act.goalTypes || []).includes(p.t)),
      say: (text, tone = 'happy', mood = 'happy', hold = 6000) => { setHelper(text, tone, mood); S.msgUntil = performance.now() + hold; },
      setGoal: text => { S.goalText = text; renderGoal(); },
      setTray: (k, n) => { S.trayMax[k] = n; renderTray(); },
      refreshCounter: () => renderGoal(),
      refreshPanel: () => renderPanel(),
      refreshTray: () => renderTray(),
      refreshEnd: () => renderEnd(),
      update: () => { resolve(); renderBoard(); },
      after: (ms, fn) => { S.timers.push(setTimeout(() => { if (A === S) fn(); }, ms)); },
      truth: (ids, goal) => Solver.evalStates(S.parts, ids, (r, cp) => Solver.working(r, cp.find(x => x.id === goal.id))).map(x => x.val),
      loadStage: i => {
        const st = act.stages[i]; S.parts = st.start(); S.undo = []; S.hintLevel = 0; S.diagRing = null;
        resolve(); renderBoard(); renderTray(); renderEnd(); renderGoal(); S.say(st.say, 'hint', 'happy', 8000);
      },
      loadParts: list => { pushUndo(); S.parts = list.map(p => ({ ...p, id: nid() })); A.board.select(null); changed('load'); },
      putInGap: (obj, inside) => { const g = S.of('gap')[0]; if (!g) return; g.obj = obj; g.inside = inside; Sound.click(); changed('gap'); },
      clearGap: () => { const g = S.of('gap')[0]; if (!g) return; g.obj = null; g.inside = null; changed('gap'); },
      ask: q => { S.q = q; renderEnd(); S.say(q.text, 'hint', 'think', 60000); },
      why: () => whyNot(),
      miniBoard: list => miniBoard(list),
      catWalk: () => catWalk(),
      startParts: () => act.stages ? act.stages[S.data.stage || 0].start() : act.start(),
    };
    return S;
  }
  const find = id => A.parts.find(p => p.id === id);
  const leftOf = k => { const max = A.trayMax[k] ?? 0; return max === Infinity ? Infinity : max - A.parts.filter(p => p.origin === 'tray' && (p.tk || p.t) === k).length; };
  const emit = (ev, info) => { try { if (A.act.onEvent) A.act.onEvent(A, ev, info || {}); } catch (e) { console.error(e); } };
  const solutionOf = () => { const a = A.act; return a.solutionFn ? a.solutionFn(A) : a.stages ? a.stages[A.data.stage || 0].solution : a.solution || []; };
  const decoOf = () => { const d = A.act.deco; return typeof d === 'function' ? d(A) : d || null; };

  function actHTML(act) {
    const sort = act.kind === 'sort';
    return `<div class="act${sort ? ' sorting' : ''}">
      <header class="tb">
        <button type="button" class="tb-back js-map" aria-label="Back to the map">${ic.map}<span>Map</span></button>
        <div class="tb-title"><span class="tb-num">${act.id}</span><h1 class="tb-name">${esc(act.title)}</h1>${act.big ? `<span class="tb-big">${ic.mountain}<span>Big challenge</span></span>` : ''}</div>
        <div class="tb-right">${jar(Store.total())}${soundBtn()}${adultBtn(false)}</div>
      </header>
      <section class="goal" aria-label="Your goal"><div class="goal-k">Your goal<span class="goal-done" hidden>${ic.check}Done!</span></div><p class="goal-t" aria-live="polite"></p><p class="goal-c" hidden></p>${act.pic ? `<div class="goal-pic">${CL.PIC[act.pic]}</div>` : ''}<div class="goal-row"><button type="button" class="read js-read">${ic.sound}<span>Read it to me</span></button><button type="button" class="goal-more" aria-label="Show the whole goal">${ic.chev}</button></div></section>
      <section class="helper tone-idle" aria-live="polite"><div class="fl">${flick(84)}</div><button type="button" class="bubble" title="Tap to hear it"><span class="bt"></span></button></section>
      ${sort ? '<div class="sortarea"></div>' : `<div class="leftcol"><div class="bwrap"><div class="bhost"></div></div>
      <footer class="tr"><div class="tray" role="toolbar" aria-label="Parts tray"></div><div class="tr-acts"><button type="button" class="js-undo">${ic.undo}<span>Undo</span></button><button type="button" class="js-restart">${ic.restart}<span>Start again</span></button><button type="button" class="flowbtn" aria-pressed="true" aria-label="Show the electricity">${ic.dots}<span>Electricity</span></button><div class="tr-bin bin-target" role="img" aria-label="Bin. Drag a part here to remove it.">${ic.bin}<span>Bin</span></div></div></footer></div>`}
      <section class="extra" aria-live="polite"></section>
      <section class="end" aria-live="polite"></section>
    </div>`;
  }

  function startActivity(id) {
    leave();
    const act = Acts.byId(id); if (!act) return showHome();
    A = makeSession(act);
    root.innerHTML = actHTML(act);
    bindCommon(act);
    if (act.kind === 'sort') {
      A.board = null;
      A.data.sorted = new Set();
      CL.Scenes.sort(A, $('.sortarea'));
      renderGoal(); renderEnd(); renderPanel();
      A.say('Drag each card into a basket. Or tap a card, then tap a basket.', 'happy', 'happy', 6000);
      bindActivity();
      if (Store.get('grown')) openGrown(act);
      loop = setInterval(tick, 100);
      return;
    }
    A.board = new BoardView($('.bhost'), hooks());
    if (!act.stages) A.parts = act.start();
    if (act.init) act.init(A);
    resolve(); renderAll();
    if (!act.stages) A.say(act.intro || 'Have a go! Tap Hint if you get stuck.', 'happy', 'happy', 5000);
    bindActivity();
    if (Store.get('grown')) openGrown(act);
    maybeLandscapeTip();
    loop = setInterval(tick, 100);
  }
  function leave() {
    if (loop) { clearInterval(loop); loop = null; }
    if (A) { A.timers.forEach(clearTimeout); A.left = true; A = null; }
    Sound.buzz(0); Sound.hum(0);
    try { speechSynthesis.cancel(); } catch (e) { /* none */ }
    $$('.drag-float, .flystar, .confetti, .scene').forEach(n => n.remove());
  }

  function bindActivity() {
    $('.js-map').addEventListener('click', () => showHome());
    $('.js-read').addEventListener('click', () => { Sound.unlock(); Sound.speak(A.goalText + (A.act.counter ? '. ' + A.act.counter(A) : '')); });
    $('.bubble').addEventListener('click', () => Sound.speak($('.bubble .bt').textContent));
    $('.goal').addEventListener('click', e => { if (compact() && !e.target.closest('.js-read')) $('.goal').classList.toggle('open'); });
    const onDo = e => {
      const b = e.target.closest('[data-do]'); if (b && !b.disabled && A) {
        const [name, arg] = b.dataset.do.split(':'); Sound.unlock();
        try { A.act.onDo && A.act.onDo(A, name, arg); } catch (err) { console.error(err); }
        return;
      }
      const q = e.target.closest('[data-ans]'); if (q && A && A.q) answer(+q.dataset.ans);
    };
    $('.extra').addEventListener('click', onDo);
    $('.end').addEventListener('click', onDo);
    if (!A.board) return;
    $('.js-undo').addEventListener('click', undo);
    $('.js-restart').addEventListener('click', restart);
    const fb = $('.flowbtn');
    const setFlow = () => { fb.setAttribute('aria-pressed', A.showFlow); fb.classList.toggle('off', !A.showFlow); };
    setFlow();
    fb.addEventListener('click', () => { A.showFlow = !A.showFlow; Store.set('showFlow', A.showFlow); setFlow(); renderBoard(); });
    A.board.svg.addEventListener('keydown', onBoardKey);
    A.board.svg.addEventListener('keyup', onBoardKeyUp);
  }

  /* ================= solving and drawing ================= */
  function resolveSounds() {
    let bz = 0, hm = 0;
    for (const p of A.parts) { const s = A.res.el[p.id] || {}; if (p.t === 'buzzer' && s.on) bz = Math.max(bz, s.loud); if (p.t === 'motor' && s.spin) hm = Math.max(hm, s.speed); }
    Sound.buzz(bz); Sound.hum(hm);
  }
  function resolve() {
    if (!A.board) return;
    const { res, broke } = Solver.run(A.parts);
    A.res = res; resolveSounds();
    if (broke.length) { Sound.pop(); emit('broke', { ids: broke }); }
    emit('solve');
  }
  function hintRings() {
    const h = A.act.hints && A.act.hints[1]; if (!h) return [];
    if (h.rings) return h.rings.map(peg => ({ peg, k: 'amber' }));
    if (h.ringsFromSolution) {
      const seen = new Set(), out = [];
      Acts.ghostsFor(A.parts, solutionOf()).forEach(p => Solver.pegsOf(p).forEach(q => { const k = key(q); if (!seen.has(k)) { seen.add(k); out.push({ peg: q, k: 'amber' }); } }));
      return out;
    }
    return [];
  }
  function ghosts() {
    const h = A.act.hints && A.act.hints[2];
    return Acts.ghostsFor(A.parts, (h && h.ghosts) || solutionOf());
  }
  function renderBoard() {
    if (!A || !A.board) return;
    const play = A.status === 'play';
    const rings = [...(play && A.hintLevel >= 2 ? hintRings() : []), ...(A.diagRing ? [A.diagRing] : []), ...(A.flashRings || [])];
    A.board.render(A.parts, A.res, { flow: A.showFlow, rings, ghosts: play && A.hintLevel >= 3 ? ghosts() : [], deco: decoOf() });
    if (A.cursor && A.armed) { const pl = cursorPlacement(); A.board.drawCursor({ ...A.armed, ...pl }, fit(pl, A.armed, null)); }
  }
  function renderAll() { renderGoal(); renderTray(); renderPanel(); renderEnd(); renderBoard(); }

  function renderGoal() {
    const g = $('.goal'); if (!g || !A) return;
    $('.goal-t', g).textContent = A.goalText;
    const c = $('.goal-c', g), txt = A.act.counter ? A.act.counter(A) : '';
    c.hidden = !txt; c.textContent = txt;
    g.classList.toggle('done', A.status === 'won');
    $('.goal-done', g).hidden = A.status !== 'won';
  }
  function setHelper(text, tone = 'happy', mood = 'happy') {
    const h = $('.helper'); if (!h) return;
    h.className = 'helper tone-' + tone;
    $('.fl', h).innerHTML = flick(84, mood);
    $('.bubble .bt', h).textContent = text;
  }
  function renderPanel() {
    const x = $('.extra'); if (!x || !A) return;
    let html = '';
    try { html = A.act.panel ? A.act.panel(A) : ''; } catch (e) { console.error(e); }
    x.innerHTML = html; x.hidden = !html;
  }

  function renderTray() {
    const tray = $('.tray'); if (!tray || !A) return;
    if (A.act.objTray) {
      const items = A.act.objTray(A);
      tray.innerHTML = items.length ? items.map(o => `<button type="button" class="ti obj${o.sel ? ' sel' : ''}" data-obj="${o.id}" aria-label="Test the ${esc(o.name)}"><span class="ti-pic">${o.pic}</span><span class="ti-name">${esc(o.name)}</span></button>`).join('') : '<p class="tray-note">You tested everything!</p>';
      $$('.ti', tray).forEach(b => b.addEventListener('click', () => { Sound.unlock(); Sound.tick(); A.act.onObj(A, b.dataset.obj); }));
      return;
    }
    const items = Object.keys(TRAY).filter(k => (A.trayMax[k] ?? 0) > 0);
    let html = items.map(k => {
      const left = leftOf(k), inf = left === Infinity, sp = specFor(k);
      return `<button type="button" class="ti${A.armed && A.armed.tk === k ? ' sel' : ''}${left <= 0 ? ' empty' : ''}" data-k="${k}" aria-label="${TRAY[k].name}${inf ? '' : `, ${left} left`}"><span class="ti-pic">${mini(sp.t, sp.t === 'wire' ? { c: 'r' } : sp)}</span><span class="ti-name">${TRAY[k].name}</span>${inf ? '' : `<span class="ti-n">${left}</span>`}</button>`;
    }).join('');
    if (!items.length) html = '<p class="tray-note">No new parts this time. Use the parts on the board.</p>';
    else if (A.trayMax.wire > 0 && items.length < 4) html += '<p class="tray-note">Or drag from peg to peg to draw a wire.</p>';
    tray.innerHTML = html;
    $$('.ti', tray).forEach(b => {
      const k = b.dataset.k;
      b.addEventListener('pointerdown', e => {
        if (leftOf(k) <= 0) { A.say(`No more ${plural(k)} in the tray.`, 'hint', 'think', 3000); return; }
        A.board.trayDown(specFor(k), e);
      });
      b.addEventListener('click', e => { if (e.detail === 0) armKeyboard(k); });
    });
  }

  function renderEnd() {
    const end = $('.end'); if (!end || !A) return;
    const act = A.act, got = Store.stars(act.id).s;
    let acts = [];
    try { acts = act.actions ? act.actions(A) : []; } catch (e) { acts = []; }
    const actBtns = acts.map(a => `<button type="button" class="actbtn${a.primary ? ' primary' : ''}" data-do="${a.id}">${esc(a.label)}</button>`).join('');
    if (A.status === 'won' && !A.keepPlaying) {
      const nx = ACTS[ACTS.indexOf(act) + 1];
      const b = act.bonus && !Store.stars(act.id).b;
      end.innerHTML = `${actBtns}<div class="mystar got">${ic.star}<span>${A.newStar ? 'Star won!' : 'You have this star.'}</span></div>
        ${b ? `<p class="bonus">${ic.star}<span>${esc(act.bonus.goal)}</span></p>` : ''}
        <button type="button" class="nextbtn js-next">${nx ? `Next: ${esc(nx.title)}` : 'Back to the map'}${ic.arrow}</button>
        <button type="button" class="keep js-keep">Keep playing</button>`;
      $('.js-next', end).addEventListener('click', goNext);
      $('.js-keep', end).addEventListener('click', () => {
        A.keepPlaying = true; renderEnd();
        const bonus = act.bonus && !Store.stars(act.id).b;
        A.say(bonus ? 'Keep building! Can you win the bonus star?' : 'Keep building! Try new things.', 'happy', 'happy');
        if (bonus) A.setGoal(act.bonus.goal);
      });
      if (!acts.length) $('.js-next', end).focus({ preventScroll: true });
      return;
    }
    if (A.status === 'play' && A.q && !A.q.done) {
      end.innerHTML = `<section class="q"><h3 class="q-t">${esc(A.q.text)}</h3><div class="q-opts">${A.q.opts.map((o, i) => `<button type="button" class="qo" data-ans="${i}">${o.pic || ''}<span>${esc(o.label)}</span></button>`).join('')}</div></section>`;
      return;
    }
    const lv = A.hintLevel;
    end.innerHTML = `${actBtns}<div class="hintrow"><button type="button" class="hint js-hint" ${A.status === 'won' ? 'disabled' : ''}>${ic.hint}<span>Hint</span><i class="lv" aria-label="Hint level ${lv} of 3">${[1, 2, 3].map(i => `<b class="${i <= lv ? 'on' : ''}"></b>`).join('')}</i></button>
      <div class="mystar${got ? ' got' : ''}">${ic.star}<span>${got ? (A.status === 'won' ? 'Star won!' : 'You have this star.') : 'Star for this one'}</span></div></div>
      ${A.status === 'won' && !act.free ? `<button type="button" class="keep js-next">Next activity${ic.arrow}</button>` : ''}`;
    const h = $('.js-hint', end); if (h) h.addEventListener('click', hint);
    const n = $('.js-next', end); if (n) n.addEventListener('click', goNext);
  }
  function goNext() {
    const nx = ACTS[ACTS.indexOf(A.act) + 1];
    if (!nx) return showHome('You have finished every activity. Try Free build!');
    if (!isOpen(nx.ch)) return showHome(`Finish 3 activities in "${chName(nx.ch - 1)}" to open "${chName(nx.ch)}".`);
    startActivity(nx.id);
  }
  function answer(i) {
    const q = A.q, o = q.opts[i]; if (!o || q.done) return;
    if (o.right) {
      q.done = true; A.data.answered = true; Sound.ding();
      A.say(q.say || 'Yes! Well spotted.', 'happy', 'wow', 8000); renderEnd();
    } else {
      A.say('Look again. Watch closely.', 'hint', 'think', 5000);
      A.flashRings = (q.flash ? q.flash() : []).map(id => ({ part: id, k: 'amber' }));
      renderBoard();
      A.after(2400, () => { A.flashRings = null; renderBoard(); });
    }
  }

  /* ================= changing the board ================= */
  function pushUndo() { A.undo.push(JSON.stringify(A.parts)); if (A.undo.length > 60) A.undo.shift(); }
  function changed(ev, info) {
    resolve(); emit(ev, info);
    A.diagRing = null; A.diagAt = performance.now() + 1300;
    renderBoard(); renderTray(); renderGoal();
  }
  const edgeOf = (a, b) => a[1] === b[1] ? { h: true, c: Math.min(a[0], b[0]), r: a[1] } : { h: false, c: a[0], r: Math.min(a[1], b[1]) };
  const blockedPegs = pegs => !!(A.act.blocked && A.act.blocked(pegs.filter(Array.isArray)));

  /* Can this part go here? null = free, 'swap' = one part is in the way, 'blocked' = no room. */
  function fit(pl, spec, ignore) {
    const cand = { ...spec, ...pl };
    if (blockedPegs(Solver.pegsOf(cand))) return 'blocked';
    if (cand.t === 'probe') return null;
    const over = A.parts.filter(p => p.id !== ignore && p.t !== 'hid' && Acts.overlaps(p, cand));
    if (!over.length) return null;
    if (over.length > 1 || over.some(p => p.fixed || SPAN[p.t]) || SPAN[cand.t]) return 'blocked';
    return 'swap';
  }
  /* Colour a new wire black if it starts on the minus side of a cell, red otherwise. */
  function wireColour(peg) {
    const minus = new Set(A.of('cell').map(c => key(c.a))), seen = new Set([key(peg)]), q = [key(peg)];
    while (q.length) {
      const k = q.pop(); if (minus.has(k)) return 'k';
      for (const w of A.of('wire')) for (const [x, y] of [[w.a, w.b], [w.b, w.a]]) if (key(x) === k && !seen.has(key(y))) { seen.add(key(y)); q.push(key(y)); }
    }
    return 'r';
  }
  const tipHome = a => { const [x, y] = CL.pg(...a); return [x + 36, y + 40]; };

  function drop(spec, pl, srcId) {
    if (!A) return;
    const subject = spec || find(srcId); if (!subject) return;
    const f = fit(pl, subject, srcId);
    if (f === 'blocked') { A.say('There is no room there.', 'hint', 'think', 2500); return; }
    const occ = f === 'swap' ? A.parts.find(p => p.id !== srcId && p.t !== 'hid' && Acts.overlaps(p, { ...subject, ...pl })) : null;
    if (srcId) {
      const p = find(srcId);
      if (JSON.stringify([p.a, p.b, p.c]) === JSON.stringify([pl.a, pl.b, pl.c])) return;
      pushUndo();
      if (occ && !SPAN[p.t] && p.t !== 'probe') Object.assign(occ, A.board.orient(edgeOf(p.a, p.b), A.board.prefOf(occ)));
      Object.assign(p, pl);
      if (p.t === 'probe') { p.b = null; p.tip = tipHome(p.a); }
      Sound.click(); A.board.select(null); changed('move', { p });
      return;
    }
    const k = spec.tk;
    if (leftOf(k) <= 0) { A.say(`No more ${plural(k)} in the tray.`, 'hint', 'think', 3000); return; }
    pushUndo();
    if (occ) A.parts = A.parts.filter(p => p !== occ);
    const p = { id: nid(), origin: 'tray', ...spec, ...pl };
    if (p.t === 'wire') { p.c = wireColour(pl.a); p.bend = 5; }
    if (p.t === 'probe') { p.b = null; p.tip = tipHome(p.a); p.c = A.of('probe').length % 2 ? 'k' : 'r'; }
    if (p.t === 'pencil') p.units = 3;
    A.parts.push(p);
    A.armed = null; A.cursor = null;
    Sound.click(); changed('place', { p });
    firstWireTip(p);
  }
  function remove(id) {
    const p = find(id); if (!p || p.fixed) return;
    pushUndo(); A.parts = A.parts.filter(x => x !== p);
    A.board.select(null); Sound.click(); changed('remove', { p });
  }
  function turn(id) {
    const p = find(id); if (!p || !POLAR[p.t]) return;
    pushUndo(); const a = p.a; p.a = p.b; p.b = a;
    Sound.click(); changed('turn', { p });
    A.board.select(id);
  }
  function tapPart(id) {
    const p = find(id); if (!p) return;

    ].join('');
    root.insertAdjacentHTML('beforeend', `<div class="scrim js-gclose"></div><aside class="gu" role="dialog" aria-modal="true" aria-labelledby="gu-h">
      <div class="gu-h"><div><h2 id="gu-h">For grown-ups</h2><p>${act ? `${act.id} ${esc(act.title)}` : 'Circuit Lab'}</p></div><button type="button" class="gu-x js-gclose" aria-label="Close">${ic.x}</button></div>
      <div class="gu-b">${body}
        <section class="gu-set"><h3>Settings</h3>
          <label class="gu-row" for="gu-unlock"><span>Unlock everything<small>Opens every chapter now.</small></span><input type="checkbox" id="gu-unlock" class="sw-input" ${Store.get('unlockAll') ? 'checked' : ''}><span class="tgl" aria-hidden="true"><i></i></span></label>
          <label class="gu-row" for="gu-sound"><span>Sound</span><input type="checkbox" id="gu-sound" class="sw-input" ${Store.get('sound') ? 'checked' : ''}><span class="tgl" aria-hidden="true"><i></i></span></label>
          <div class="gu-over"><span>Start over clears all stars and saved circuits.</span><button type="button" class="js-over">Start over</button></div>
        </section></div></aside>`);
    $$('.js-gclose').forEach(b => b.addEventListener('click', closeGrown));
    $('#gu-unlock').addEventListener('change', e => { Store.set('unlockAll', e.target.checked); if (!A) { closeGrown(); showHome(e.target.checked ? 'Every chapter is open.' : ''); } });
    $('#gu-sound').addEventListener('change', e => { Sound.unlock(); Store.set('sound', e.target.checked); Sound.setOn(e.target.checked); $$('.js-sound').forEach(b => { b.innerHTML = e.target.checked ? ic.sound : ic.mute; b.setAttribute('aria-pressed', e.target.checked); }); if (e.target.checked && A) resolveSounds(); });
    $('.js-over').addEventListener('click', () => {
      const box = $('.gu-over');
      box.innerHTML = '<span>Are you sure? All stars and saved circuits will be cleared.</span><div class="gu-over-b"><button type="button" class="js-no">No, keep them</button><button type="button" class="js-yes danger">Yes, start over</button></div>';
      $('.js-no', box).addEventListener('click', () => { closeGrown(); openGrown(act); });
      $('.js-yes', box).addEventListener('click', () => { Store.reset(); closeGrown(); Sound.setOn(Store.get('sound')); showHome('All stars cleared. Starting fresh!'); });
    });
    $('.gu-x').focus({ preventScroll: true });
  }
  function closeGrown() {
    $$('.gu, .scrim').forEach(n => n.remove());
    Store.set('grown', false);
    $$('.js-adult').forEach(b => { b.classList.remove('on'); b.setAttribute('aria-pressed', 'false'); });
  }

  /* ================= small things ================= */
  function maybeLandscapeTip() {
    if (Store.seen('landscape') || !(window.matchMedia && matchMedia('(orientation: portrait) and (max-width: 900px)').matches)) return;
    const act = $('.act'); if (!act) return;
    act.insertAdjacentHTML('afterbegin', `<div class="ltip" role="note">${ic.rot}<p>Turn your device sideways for a bigger board.</p><button type="button">OK</button></div>`);
    $('.ltip button').addEventListener('click', () => { Store.markSeen('landscape'); $('.ltip').remove(); });
  }

  /* ================= start ================= */
  function boot() {
    document.body.insertAdjacentHTML('afterbegin', CL.DEFS);
    CL.makeTextures();
    Sound.setOn(Store.get('sound'));
    document.addEventListener('pointerdown', () => Sound.unlock(), { once: true });
    const dev = location.protocol === 'file:' || /^(localhost|127\.)/.test(location.hostname) || /[?&]test\b/.test(location.search);
    if (dev && CL.runSelfTests) setTimeout(() => CL.runSelfTests(), 50);
    const m = location.hash.match(/^#a=([\d.]+)/);
    if (m && Acts.byId(m[1])) startActivity(m[1]); else showHome();
  }
  CL.App = { showHome, startActivity, get session() { return A; }, isOpen };
  boot();
})(window.CL);

</script>
</body>
</html>
