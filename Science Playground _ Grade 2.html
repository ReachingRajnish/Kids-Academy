<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Science Playground | Grade 2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme: light;
  --bg-top:#d9eefb; --bg-bottom:#eaf6ec;
  --surface:#ffffff; --surface-2:#f2f8fc; --surface-3:#e4eff7;
  --ink:#17324d; --ink-soft:#4b6378; --line:#d2e2ed;
  --sun:#ffb400;
  --earth:#1769b0; --physics:#b85a00; --chem:#a8287a; --bio:#1e7b3f;
  --earth-soft:#e1f0fc; --physics-soft:#fdeedd; --chem-soft:#fbe5f1; --bio-soft:#e0f3e5;
  --good:#1b8a4a; --warn:#b97400; --bad:#c9372d;
  --good-soft:#e2f5ea; --warn-soft:#fdf1d9; --bad-soft:#fde6e3;
  --shade:23,50,77;
  --stage-frame:#ffffff; --on-accent:#ffffff;
  --font-head:"Baloo 2","Trebuchet MS","Segoe UI",system-ui,sans-serif;
  --font-body:"Andika","Verdana","Segoe UI",system-ui,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --bg-top:#0b1a2e; --bg-bottom:#10243a;
    --surface:#14283f; --surface-2:#1a314c; --surface-3:#22405f;
    --ink:#eaf3fc; --ink-soft:#a9bfd4; --line:#2a4562;
    --earth:#5aaef0; --physics:#ffa53d; --chem:#f07cc0; --bio:#5fcf88;
    --earth-soft:#173452; --physics-soft:#3a2a14; --chem-soft:#3a1c30; --bio-soft:#173a26;
    --good:#5fcf88; --warn:#ffc04d; --bad:#ff8277;
    --good-soft:#173a26; --warn-soft:#3a2f14; --bad-soft:#3d1c1a;
    --shade:0,0,0;
    --stage-frame:#1f3956; --on-accent:#0b1a2e;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --bg-top:#0b1a2e; --bg-bottom:#10243a;
  --surface:#14283f; --surface-2:#1a314c; --surface-3:#22405f;
  --ink:#eaf3fc; --ink-soft:#a9bfd4; --line:#2a4562;
  --earth:#5aaef0; --physics:#ffa53d; --chem:#f07cc0; --bio:#5fcf88;
  --earth-soft:#173452; --physics-soft:#3a2a14; --chem-soft:#3a1c30; --bio-soft:#173a26;
  --good:#5fcf88; --warn:#ffc04d; --bad:#ff8277;
  --good-soft:#173a26; --warn-soft:#3a2f14; --bad-soft:#3d1c1a;
  --shade:0,0,0;
  --stage-frame:#1f3956; --on-accent:#0b1a2e;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%;-webkit-text-size-adjust:100%}
body{
  margin:0;min-height:100%;
  font-family:var(--font-body);font-size:17px;line-height:1.5;color:var(--ink);
  background:linear-gradient(180deg,var(--bg-top) 0%,var(--bg-bottom) 100%) no-repeat;
  background-size:100% 100vh;background-color:var(--bg-bottom);
  overflow-x:hidden;
}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3{font-family:var(--font-head);line-height:1.15;margin:0}
button{font:inherit;color:inherit}
img,svg,canvas{max-width:100%}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px;border-radius:10px}
.screen[hidden]{display:none!important}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- Home ---------- */
#home{max-width:1240px;margin:0 auto;padding:28px 20px 40px}
.home-head{display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:26px}
.brand{display:flex;align-items:center;gap:16px}
.brand svg{width:74px;height:74px;flex:none;filter:drop-shadow(0 6px 10px rgba(var(--shade),.18))}
.brand h1{font-size:clamp(2rem,4.2vw,2.9rem);font-weight:800;letter-spacing:-.01em}
.brand p{margin:2px 0 0;color:var(--ink-soft);font-size:1.05rem;max-width:46ch}
.head-tools{display:flex;align-items:center;gap:10px}
.star-total{display:flex;align-items:baseline;gap:6px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:6px 16px 6px 12px;font-family:var(--font-head);font-weight:700;font-size:1.15rem}
.star-total .of{color:var(--ink-soft);font-size:.95rem;font-weight:600}
.icon-btn{width:48px;height:48px;border-radius:50%;border:2px solid var(--line);background:var(--surface);font-size:1.35rem;cursor:pointer;display:grid;place-items:center;transition:transform .15s,border-color .15s}
.icon-btn:hover{border-color:var(--ink-soft);transform:scale(1.05)}

.topic-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}
@media (max-width:1020px){.topic-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.topic-grid{grid-template-columns:1fr}}
.tcard{
  --c:var(--earth);--c-soft:var(--earth-soft);
  position:relative;display:flex;flex-direction:column;text-align:left;cursor:pointer;
  background:var(--surface);border:0;border-radius:28px;padding:10px 10px 18px;
  box-shadow:0 2px 0 rgba(var(--shade),.06),0 14px 30px -12px color-mix(in srgb,var(--c) 45%,transparent);
  transition:transform .22s cubic-bezier(.2,.9,.3,1.3),box-shadow .22s;
  animation:cardIn .5s cubic-bezier(.2,.9,.3,1.2) both;
}
.tcard:hover{transform:translateY(-6px) rotate(-.4deg)}
.tcard:active{transform:translateY(-2px) scale(.99)}
.tcard[data-strand="physics"]{--c:var(--physics);--c-soft:var(--physics-soft)}
.tcard[data-strand="chem"]{--c:var(--chem);--c-soft:var(--chem-soft)}
.tcard[data-strand="bio"]{--c:var(--bio);--c-soft:var(--bio-soft)}
.tcard .window{position:relative;border-radius:20px;overflow:hidden;aspect-ratio:8/5;background:var(--surface-3)}
.tcard .window canvas,.tcard .window svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.tcard .play-hint{position:absolute;right:12px;bottom:12px;width:52px;height:52px;border-radius:50%;background:var(--c);color:var(--on-accent);display:grid;place-items:center;font-size:1.3rem;box-shadow:0 6px 16px rgba(0,0,0,.3);transition:transform .2s}
.tcard:hover .play-hint{transform:scale(1.12)}
.tcard .meta{padding:14px 10px 0;display:flex;flex-direction:column;gap:6px;flex:1}
.strand{display:inline-flex;align-items:center;gap:7px;font-family:var(--font-head);font-weight:700;font-size:.92rem;color:var(--c)}
.strand::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--c)}
.tcard h2{font-size:1.45rem;font-weight:800}
.tcard .q{margin:0;color:var(--ink-soft);font-size:1rem}
.tcard .stars{margin-top:auto;padding-top:8px;font-size:1.25rem;letter-spacing:2px}
.stars .off{filter:grayscale(1);opacity:.28}
@keyframes cardIn{from{opacity:0;transform:translateY(18px) scale(.97)}to{opacity:1;transform:none}}
.home-foot{margin-top:30px;display:flex;flex-wrap:wrap;gap:12px 20px;align-items:center;justify-content:space-between;color:var(--ink-soft);font-size:.92rem}
.link-btn{background:none;border:0;color:var(--ink-soft);text-decoration:underline;cursor:pointer;padding:6px}

/* ---------- Topic ---------- */
#topic{--accent:var(--earth);--accent-soft:var(--earth-soft);animation:fadeUp .35s ease both}
#topic[data-strand="physics"]{--accent:var(--physics);--accent-soft:var(--physics-soft)}
#topic[data-strand="chem"]{--accent:var(--chem);--accent-soft:var(--chem-soft)}
#topic[data-strand="bio"]{--accent:var(--bio);--accent-soft:var(--bio-soft)}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:2px solid var(--line);box-shadow:0 6px 20px -14px rgba(var(--shade),.4)}
.topbar-in{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:14px;padding:10px 18px}
.back-btn{display:inline-flex;align-items:center;gap:8px;height:50px;padding:0 18px 0 12px;border-radius:999px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--font-head);font-weight:700;font-size:1.05rem;cursor:pointer;transition:background .15s,border-color .15s,transform .15s;flex:none}
.back-btn:hover{border-color:var(--accent);transform:translateX(-2px)}
.back-btn svg{width:26px;height:26px}
.tb-title{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.tb-icon{font-size:2rem;width:52px;height:52px;border-radius:16px;background:var(--accent-soft);display:grid;place-items:center;flex:none}
.tb-strand{font-family:var(--font-head);font-weight:700;color:var(--accent);font-size:.9rem;line-height:1}
.tb-title h1{font-size:clamp(1.25rem,2.6vw,1.75rem);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-tools{display:flex;align-items:center;gap:10px;flex:none}
.star-pill{font-family:var(--font-head);font-weight:700;font-size:1.1rem;background:var(--surface-2);border:2px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.star-pill.bump{animation:bump .6s}
@keyframes bump{30%{transform:scale(1.25)}60%{transform:scale(.95)}}
@media (max-width:640px){
  .topbar-in{flex-wrap:wrap;gap:10px;padding:8px 12px}
  .back-btn span{display:none}.back-btn{padding:0 12px}
  .tb-title{order:3;flex-basis:100%}
  .tb-tools{margin-left:auto}
}

.t-layout{max-width:1320px;margin:0 auto;padding:18px;display:grid;grid-template-columns:minmax(0,1.62fr) minmax(310px,1fr);gap:18px;align-items:start}
@media (max-width:980px){.t-layout{grid-template-columns:minmax(0,1fr)}}
.t-main{display:flex;flex-direction:column;gap:20px;min-width:0;padding-top:6px}
.stage{position:relative;width:100%;aspect-ratio:8/5;border-radius:22px;overflow:hidden;background:#0d1b2a;box-shadow:0 0 0 6px var(--stage-frame),0 22px 40px -16px rgba(var(--shade),.55);container-type:inline-size;touch-action:none;user-select:none;-webkit-user-select:none}
.stage canvas,.stage > svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.stage .hint{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:rgba(10,20,35,.72);color:#fff;font-family:var(--font-head);font-weight:600;font-size:clamp(.8rem,2.2cqw,1rem);padding:6px 14px;border-radius:999px;pointer-events:none;white-space:nowrap;transition:opacity .4s}
.stage .hint.gone{opacity:0}
.stage .hint.bl{left:14px;top:auto;bottom:14px;transform:none}

.toast{position:absolute;left:50%;top:14px;transform:translate(-50%,-160%);opacity:0;background:#fff;color:#17324d;border-radius:18px;padding:10px 18px;font-family:var(--font-head);font-weight:700;font-size:clamp(.9rem,2.4cqw,1.1rem);box-shadow:0 10px 30px rgba(0,0,0,.35);display:flex;align-items:center;gap:10px;max-width:92%;transition:transform .45s cubic-bezier(.2,.9,.3,1.3);z-index:5;pointer-events:none}
.toast.show{transform:translate(-50%,0);opacity:1}
.toast .big{font-size:1.6em}

.controls{background:var(--surface);border-radius:22px;padding:14px;display:flex;flex-direction:column;gap:12px;border:2px solid var(--line)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.nowrap{flex-wrap:nowrap}
.ctl-label{font-family:var(--font-head);font-weight:700;color:var(--ink-soft);font-size:.98rem;margin-right:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:8px 16px;border-radius:14px;border:2px solid var(--line);background:var(--surface-2);font-family:var(--font-head);font-weight:700;font-size:1rem;cursor:pointer;transition:transform .12s,border-color .15s,background .15s;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.btn:hover{border-color:var(--accent)}
.btn:active{transform:scale(.96)}
.btn.on{background:var(--accent-soft);border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.btn.small{min-height:40px;padding:6px 12px;font-size:.92rem;border-radius:12px}
.btn .ic{font-size:1.25em;line-height:1}
.btn.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-5px)}40%,80%{transform:translateX(5px)}}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.pick{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:92px;flex:1;padding:8px 8px 7px;border-radius:16px;border:2px solid var(--line);background:var(--surface-2);cursor:pointer;font-family:var(--font-head);font-weight:700;font-size:.92rem;line-height:1.1;transition:transform .12s,border-color .15s,background .15s;touch-action:manipulation}
.pick canvas{width:100%;max-width:110px;height:auto;aspect-ratio:2/1;border-radius:10px;background:var(--surface)}
.pick .emo{font-size:2rem;line-height:1.1}
.pick:hover{border-color:var(--accent)}
.pick.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 25%,transparent)}
.pick:active{transform:scale(.96)}

input[type=range]{-webkit-appearance:none;appearance:none;flex:1;min-width:160px;height:34px;background:transparent;cursor:pointer;--fill:50%;--track:linear-gradient(90deg,var(--accent) var(--fill),var(--surface-3) var(--fill))}
input[type=range]::-webkit-slider-runnable-track{height:14px;border-radius:999px;background:var(--track);border:2px solid var(--line)}
input[type=range]::-moz-range-track{height:14px;border-radius:999px;background:var(--track);border:2px solid var(--line)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:32px;height:32px;margin-top:-11px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,.3)}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:#fff;border:4px solid var(--accent);box-shadow:0 3px 8px rgba(0,0,0,.3)}
.val-chip{font-family:var(--font-head);font-weight:800;font-size:1.15rem;background:var(--accent-soft);color:var(--ink);border-radius:12px;padding:6px 12px;min-width:112px;text-align:center;white-space:nowrap}

.t-side{display:flex;flex-direction:column;gap:14px;min-width:0}
.panel{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px}
.panel h2{font-size:1.15rem;font-weight:800;display:flex;align-items:center;gap:8px;margin-bottom:10px}
.panel h2 .count{margin-left:auto;font-size:.95rem;color:var(--ink-soft);font-weight:700}
.readout{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.ro{background:var(--surface-2);border-radius:14px;padding:8px 12px;display:flex;flex-direction:column;gap:1px;min-width:0}
.ro-l{font-size:.85rem;color:var(--ink-soft);display:flex;align-items:center;gap:6px}
.ro-v{font-family:var(--font-head);font-weight:800;font-size:1.08rem;line-height:1.2}
.ro.good .ro-v{color:var(--good)}.ro.warn .ro-v{color:var(--warn)}.ro.bad .ro-v{color:var(--bad)}
.explain{position:relative;margin-top:12px;background:var(--accent-soft);border-radius:16px;padding:12px 14px 12px 16px;font-size:1.05rem;line-height:1.55}
.explain p{margin:0}
.explain.flash{animation:flash .5s}
@keyframes flash{from{box-shadow:0 0 0 4px color-mix(in srgb,var(--accent) 45%,transparent)}to{box-shadow:0 0 0 0 transparent}}
.read-btn{margin-top:10px}
.missions{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.missions li{display:flex;align-items:flex-start;gap:10px;padding:9px 12px;border-radius:14px;background:var(--surface-2);font-size:1rem;line-height:1.35;transition:background .3s}
.missions li .st{font-size:1.35rem;line-height:1;flex:none;margin-top:1px}
.missions li .st.off{filter:grayscale(1);opacity:.35}
.missions li.done{background:var(--good-soft)}
.missions li.done .txt{text-decoration:line-through;text-decoration-color:color-mix(in srgb,var(--good) 60%,transparent);text-decoration-thickness:2px}
.missions li.pop .st{animation:starpop .7s}
@keyframes starpop{0%{transform:scale(.3) rotate(-60deg)}60%{transform:scale(1.6) rotate(15deg)}100%{transform:none}}
.words{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.word{background:var(--surface-2);border-radius:14px;padding:9px 12px;font-size:.93rem;line-height:1.35}
.word b{display:block;font-family:var(--font-head);font-size:1.02rem;color:var(--accent)}
@media (max-width:420px){.words,.readout{grid-template-columns:1fr}}
.note{font-size:.92rem;color:var(--ink-soft);margin:10px 0 0}
table.results{width:100%;border-collapse:separate;border-spacing:4px;font-size:.92rem}
table.results th{font-family:var(--font-head);font-weight:700;font-size:.88rem;color:var(--ink-soft);padding:2px}
table.results th.rowh{text-align:left;color:var(--ink);font-size:.92rem;white-space:nowrap}
table.results td{background:var(--surface-2);border-radius:10px;text-align:center;height:38px;font-size:1.2rem}
table.results td.new{animation:starpop .6s}
table.results td.q{color:var(--ink-soft);opacity:.5;font-size:1rem}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.88rem;color:var(--ink-soft);margin-top:8px}
.sort{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bin{background:var(--surface-2);border-radius:14px;padding:10px;min-height:96px}
.bin h3{font-size:.98rem;margin-bottom:6px}
.bin .tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{display:inline-flex;align-items:center;gap:5px;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:3px 10px 3px 6px;font-size:.9rem;font-family:var(--font-head);font-weight:700;animation:starpop .5s}
.tag canvas{width:26px;height:26px;border-radius:50%}
.space-wrap{display:flex;gap:12px;align-items:center}
.space-wrap canvas{width:46%;max-width:220px;aspect-ratio:13/10;border-radius:14px;flex:none;background:#081222}
.space-wrap p{margin:0;font-size:.95rem}
@media (max-width:420px){.space-wrap{flex-direction:column}.space-wrap canvas{width:100%}}

/* animals overlay (habitats) */
.layer{position:absolute;inset:0;pointer-events:none}
.animal{position:absolute;transform:translate(-50%,-82%);pointer-events:auto;cursor:grab;touch-action:none;display:flex;flex-direction:column;align-items:center;transition:left 1.6s ease-in,top .3s,opacity 1.2s ease-in}
.animal.dragging{transition:none;cursor:grabbing;z-index:4}
.animal .body{font-size:clamp(24px,5.4cqw,50px);line-height:1;width:1.5em;height:1.5em;display:grid;place-items:center;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55) 40%,rgba(255,255,255,0) 72%);position:relative}
.animal.baby .body{font-size:clamp(16px,3.3cqw,30px)}
.animal .ring{position:absolute;left:50%;bottom:-2px;transform:translateX(-50%);width:70%;height:12%;min-height:6px;border-radius:50%;background:rgba(0,0,0,.25)}
.animal.happy .ring{background:rgba(31,180,90,.75);box-shadow:0 0 12px rgba(31,200,90,.9)}
.animal.struggling .ring{background:rgba(240,170,20,.85);box-shadow:0 0 12px rgba(255,180,0,.9)}
.animal.leaving .ring{background:rgba(220,60,50,.85);box-shadow:0 0 12px rgba(255,60,50,.9)}
.animal.sel .body{outline:3px dashed rgba(255,255,255,.9);outline-offset:2px}
.animal.walking .body{animation:waddle .35s infinite alternate}
.animal .em{display:inline-block}.animal.flip .em{transform:scaleX(-1)}
@keyframes waddle{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-4px)}}
.animal.leaving .body{animation:worry 1s infinite}
@keyframes worry{50%{transform:translateY(-3px)}}
.bubble{position:absolute;bottom:100%;left:50%;transform:translate(-50%,-4px);background:#fff;color:#17324d;border-radius:12px;padding:4px 10px;font-family:var(--font-head);font-weight:700;font-size:clamp(10px,1.8cqw,15px);white-space:nowrap;box-shadow:0 4px 12px rgba(0,0,0,.25);pointer-events:none;opacity:0;transition:opacity .3s}
.bubble::after{content:"";position:absolute;left:50%;top:100%;transform:translateX(-50%);border:6px solid transparent;border-top-color:#fff}
.animal.talk .bubble{opacity:1}
.animal.edgeR .bubble{left:auto;right:0;transform:translate(0,-4px)}.animal.edgeR .bubble::after{left:auto;right:14px;transform:none}
.animal.edgeL .bubble{left:0;transform:translate(0,-4px)}.animal.edgeL .bubble::after{left:14px;transform:none}
.heart{position:absolute;left:50%;top:0;font-size:clamp(12px,2cqw,18px);pointer-events:none;animation:heartUp 1.6s ease-out forwards}
@keyframes heartUp{from{opacity:1;transform:translate(-50%,0) scale(.6)}to{opacity:0;transform:translate(-50%,-50px) scale(1.2)}}
.ghost{position:fixed;left:0;top:0;pointer-events:none;z-index:100;transform:translate(-50%,-50%);filter:drop-shadow(0 8px 14px rgba(0,0,0,.35))}

/* circuits */
#cBoard .slot{cursor:grab;outline:none}

#cBoard .slot.target .hit{fill:rgba(255,236,150,.16);stroke:#fff3a0;stroke-width:3;stroke-dasharray:8 7}
.bz.on{animation:bzz .05s infinite alternate}
@keyframes bzz{from{transform:translate(-1px,0)}to{transform:translate(1px,.6px)}}
.waves{opacity:0;transition:opacity .2s}.waves.on{opacity:1;animation:wv .45s infinite}
@keyframes wv{50%{opacity:.25}}
.gapAlert{stroke:#ff7a6b!important;animation:gp 1s infinite}
@keyframes gp{50%{opacity:.35}}
.ctray .pick svg{width:100%;max-width:110px;height:auto;border-radius:10px}
.ghost svg{display:block}
/* phones */
@media (max-width:560px){.stage .hint{white-space:normal;text-align:center;max-width:calc(100% - 24px)}.stage .hint.bl{text-align:left}
  .row.nowrap{flex-wrap:wrap}.row.nowrap input[type=range]{flex:1 1 100%;order:3;min-width:0}
  table.results{border-spacing:3px;font-size:.85rem}table.results th.rowh{white-space:normal;font-size:.85rem}table.results th{font-size:.78rem}
  .t-layout{padding:14px 12px}.controls{padding:12px}.panel{padding:14px}}
/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:60;overflow:hidden}
.spark{position:absolute;font-size:22px;animation:fly 1s cubic-bezier(.2,.7,.3,1) forwards}
@keyframes fly{to{transform:translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.4);opacity:0}}
.confetti{position:absolute;top:-20px;width:10px;height:16px;border-radius:3px;animation:fall 2.4s linear forwards}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--r))}}

  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

<script>
'use strict';
/* ================= Core helpers ================= */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = t => t * t * (3 - 2 * t);
const TAU = Math.PI * 2;
const REDUCED = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
function hexRgb(h) { if (h[0] === 'r') { const m = h.match(/[\d.]+/g).map(Number); return [m[0], m[1], m[2]]; } h = h.replace('#', ''); if (h.length === 3) h = h.split('').map(c => c + c).join(''); const n = parseInt(h, 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; }
function mix(a, b, t, al) { const A = hexRgb(a), B = hexRgb(b); t = clamp(t, 0, 1); const r = Math.round(lerp(A[0], B[0], t)), g = Math.round(lerp(A[1], B[1], t)), bl = Math.round(lerp(A[2], B[2], t)); return al == null ? `rgb(${r},${g},${bl})` : `rgba(${r},${g},${bl},${al})`; }
function rgba(h, a) { const A = hexRgb(h); return `rgba(${A[0]},${A[1]},${A[2]},${a})`; }
function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function rrect(ctx, x, y, w, h, r) { r = Math.max(0, Math.min(r, w / 2, h / 2)); ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r); ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath(); }
function ellipse(ctx, x, y, rx, ry, rot = 0) { ctx.beginPath(); ctx.ellipse(x, y, Math.max(0.1, rx), Math.max(0.1, ry), rot, 0, TAU); }
function arrow(ctx, x1, y1, x2, y2, color, w = 14, alpha = 1) {
  const a = Math.atan2(y2 - y1, x2 - x1), len = Math.hypot(x2 - x1, y2 - y1), hl = Math.min(w * 1.9, len * 0.6);
  ctx.save(); ctx.globalAlpha *= alpha; ctx.translate(x1, y1); ctx.rotate(a);
  ctx.shadowColor = 'rgba(0,0,0,.25)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 3;

  ctx.lineTo(len - hl, w * 0.78); ctx.lineTo(len - hl, w * 0.32); ctx.lineTo(0, w * 0.32); ctx.arc(0, 0, w * 0.32, Math.PI / 2, -Math.PI / 2); ctx.closePath(); ctx.fill();

  ctx.restore();
}
function label(ctx, text, x, y, { size = 15, bg = 'rgba(255,255,255,.92)', fg = '#17324d', pad = 7, align = 'center', r = 9 } = {}) {
  ctx.save(); ctx.font = `700 ${size}px ${FONT_HEAD}`; const w = ctx.measureText(text).width + pad * 2, h = size + pad * 1.2;
  let x0 = align === 'center' ? x - w / 2 : align === 'right' ? x - w : x;
  ctx.fillStyle = bg; ctx.shadowColor = 'rgba(0,0,0,.2)'; ctx.shadowBlur = 6; ctx.shadowOffsetY = 2; rrect(ctx, x0, y - h / 2, w, h, r); ctx.fill();
  ctx.shadowColor = 'transparent'; ctx.fillStyle = fg; ctx.textAlign = 'left'; ctx.textBaseline = 'middle'; ctx.fillText(text, x0 + pad, y + 1);
  ctx.restore();
}
const FONT_HEAD = '"Baloo 2","Trebuchet MS",sans-serif';
const FONT_BODY = '"Andika","Verdana",sans-serif';
const fmt = (n, d = 1) => (Math.round(n * 10 ** d) / 10 ** d).toFixed(d);

const Store = {
  get(k, d) { try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) { } }
};

/* ================= Sound (synthesised, no files) ================= */
const Sound = {
  ctx: null, master: null, on: Store.get('g2s-sound', true), buzz: null,
  init() {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return this.ctx; }
    try { const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return null; this.ctx = new AC(); this.master = this.ctx.createGain(); this.master.gain.value = this.on ? 0.9 : 0; this.master.connect(this.ctx.destination); } catch (e) { this.ctx = null; }
    return this.ctx;
  },
  setOn(v) { this.on = v; Store.set('g2s-sound', v); if (this.master) this.master.gain.setTargetAtTime(v ? 0.9 : 0, this.ctx.currentTime, 0.02); if (!v && window.speechSynthesis) speechSynthesis.cancel(); },
  tone(f, d, { type = 'sine', vol = 0.18, to = null, delay = 0, attack = 0.01 } = {}) {
    const c = this.init(); if (!c || !this.on) return; const t = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (to) o.frequency.exponentialRampToValueAtTime(to, t + d);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(vol, t + attack); g.gain.exponentialRampToValueAtTime(0.0001, t + d);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + d + 0.05);
  },
  noise(d, { vol = 0.2, freq = 1200, q = 1, delay = 0, type = 'bandpass' } = {}) {
    const c = this.init(); if (!c || !this.on) return; const t = c.currentTime + delay; const len = Math.max(1, Math.floor(c.sampleRate * d));
    const buf = c.createBuffer(1, len, c.sampleRate), data = buf.getChannelData(0); for (let i = 0; i < len; i++) data[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
    const s = c.createBufferSource(); s.buffer = buf; const f = c.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q; const g = c.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(this.master); s.start(t);
  },
  play(n) {
    switch (n) {
      case 'tap': this.tone(620, 0.07, { type: 'triangle', vol: 0.1 }); break;
      case 'select': this.tone(523, 0.07, { type: 'triangle', vol: 0.1 }); this.tone(784, 0.1, { type: 'triangle', vol: 0.1, delay: 0.05 }); break;
      case 'star': [523, 659, 784, 1047, 1319].forEach((f, i) => this.tone(f, 0.3, { type: 'triangle', vol: 0.12, delay: i * 0.07 })); break;
      case 'fanfare': [523, 659, 784, 659, 784, 1047].forEach((f, i) => this.tone(f, 0.28, { type: 'triangle', vol: 0.12, delay: i * 0.11 })); break;
      case 'snap': this.noise(0.22, { vol: 0.9, freq: 2600, q: 0.6 }); this.tone(160, 0.12, { type: 'square', vol: 0.06, to: 60 }); break;
      case 'crack': this.noise(0.08, { vol: 0.9, freq: 3200, q: 0.8 }); this.noise(0.3, { vol: 0.5, freq: 900, q: 0.8, delay: 0.04 }); break;
      case 'boing': this.tone(180, 0.5, { type: 'sine', vol: 0.18, to: 560 }); this.tone(360, 0.4, { type: 'triangle', vol: 0.05, to: 900 }); break;
      case 'twang': this.tone(240, 0.5, { type: 'triangle', vol: 0.14, to: 140 }); break;
      case 'squish': this.noise(0.28, { vol: 0.35, freq: 420, q: 1.5, type: 'lowpass' }); break;
      case 'pop': this.noise(0.1, { vol: 0.7, freq: 3200 }); this.tone(900, 0.08, { vol: 0.08, to: 200 }); break;
      case 'click': this.tone(1900, 0.03, { type: 'square', vol: 0.05 }); this.tone(1200, 0.03, { type: 'square', vol: 0.04, delay: 0.03 }); break;
      case 'strike': this.noise(0.35, { vol: 0.35, freq: 2400, q: 0.7 }); this.noise(0.6, { vol: 0.12, freq: 500, q: 0.5, delay: 0.15, type: 'lowpass' }); break;
      case 'oops': this.tone(330, 0.16, { vol: 0.1, to: 230 }); break;
      case 'chime': this.tone(1047, 0.5, { vol: 0.08 }); this.tone(1568, 0.6, { vol: 0.05, delay: 0.06 }); break;
      case 'drip': this.tone(1400, 0.1, { vol: 0.08, to: 520 }); break;
      case 'chirp': this.tone(1800, 0.08, { vol: 0.07, to: 2600 }); this.tone(2000, 0.08, { vol: 0.07, to: 2900, delay: 0.12 }); break;
      case 'whoosh': this.noise(0.45, { vol: 0.18, freq: 700, q: 0.5 }); break;

  buzzSet(level) {

document.addEventListener('pointerdown', () => Sound.init(), { once: true, capture: true });

/* ================= Read aloud ================= */
const Speech = {
  ok: 'speechSynthesis' in window,
  speak(html) {
    if (!this.ok) return;
    const tmp = document.createElement('div'); tmp.innerHTML = html;
    const text = tmp.textContent.replace(/[\p{Extended_Pictographic}\uFE0F\u200D\u2B05\u27A1\u2B06\u2B07]/gu, '').replace(/°C/g, ' degrees').replace(/\s+/g, ' ').trim();
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.rate = 0.9; u.pitch = 1.05; speechSynthesis.speak(u); } catch (e) { }
  },
  stop() { if (this.ok) try { speechSynthesis.cancel(); } catch (e) { } }
};

/* ================= Progress (stars) ================= */
const Progress = {
  data: Store.get('g2s-progress', {}),
  has(t, m) { return (this.data[t] || []).includes(m); },
  add(t, m) { if (this.has(t, m)) return false; (this.data[t] = this.data[t] || []).push(m); Store.set('g2s-progress', this.data); return true; },
  count(t) { const topic = TOPICS.find(x => x.id === t); return topic ? topic.missions.filter(m => this.has(t, m.id)).length : 0; },
  total() { return TOPICS.reduce((a, t) => a + this.count(t.id), 0); },
  reset() { this.data = {}; Store.set('g2s-progress', {}); }
};

/* ================= FX ================= */
const FX = {
  burst(x, y, n = 12, chars = ['⭐', '✨', '🌟']) {
    if (REDUCED) return; const fx = $('#fx');
    for (let i = 0; i < n; i++) {
      const s = document.createElement('span'); s.className = 'spark'; s.textContent = chars[i % chars.length];
      const a = Math.random() * TAU, d = 60 + Math.random() * 90;
      s.style.left = x + 'px'; s.style.top = y + 'px'; s.style.setProperty('--dx', Math.cos(a) * d + 'px'); s.style.setProperty('--dy', Math.sin(a) * d + 'px'); s.style.setProperty('--r', (Math.random() * 360 - 180) + 'deg');
      s.style.animationDelay = (Math.random() * 0.12) + 's'; fx.appendChild(s); setTimeout(() => s.remove(), 1400);
    }
  },
  confetti() {

      c.style.setProperty('--dx', (Math.random() * 160 - 80) + 'px'); c.style.setProperty('--r', (Math.random() * 900 - 450) + 'deg');
      c.style.animationDelay = Math.random() * 0.6 + 's'; c.style.animationDuration = 2 + Math.random() * 1.4 + 's'; fx.appendChild(c); setTimeout(() => c.remove(), 4200);
    }
  }
};

/* ================= Canvas helper ================= */
function makeCanvas(host, W, H, ariaLabel) {
  const c = document.createElement('canvas'); c.setAttribute('role', 'img'); if (ariaLabel) c.setAttribute('aria-label', ariaLabel);
  host.appendChild(c); const ctx = c.getContext('2d'); const obj = { canvas: c, ctx, W, H, k: 1 };
  const fit = () => {
    const r = c.getBoundingClientRect(); const dpr = Math.min(2, window.devicePixelRatio || 1);
    const pxW = Math.max(W * 0.5, Math.round((r.width || W) * dpr)); const k = pxW / W;
    c.width = pxW; c.height = Math.round(H * k); obj.k = k; ctx.setTransform(k, 0, 0, k, 0, 0); obj.dirty = true;
  };
  fit(); obj.fit = fit;
  if ('ResizeObserver' in window) { obj.ro = new ResizeObserver(() => fit()); obj.ro.observe(c); }
  obj.point = e => { const r = c.getBoundingClientRect(); return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height }; };
  obj.begin = () => { ctx.setTransform(obj.k, 0, 0, obj.k, 0, 0); ctx.clearRect(0, 0, W, H); };
  obj.destroy = () => { if (obj.ro) obj.ro.disconnect(); };
  return obj;
}
/* small thumbnail canvas drawn once */
function thumb(drawFn, w = 120, h = 60, bg) {
  const c = document.createElement('canvas'); const dpr = Math.min(2, window.devicePixelRatio || 1); c.width = w * dpr; c.height = h * dpr; c.style.aspectRatio = `${w}/${h}`;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr); if (bg) { ctx.fillStyle = bg; ctx.fillRect(0, 0, w, h); } drawFn(ctx, w, h); return c;
}

/* ================= Topics registry ================= */
const TOPICS = [];
function defineTopic(t) { TOPICS.push(t); }

/* ================= App / router ================= */
const App = { current: null, api: null, raf: 0, last: 0, timeAcc: 0 };
const elHome = $('#home'), elTopic = $('#topic'), elBody = $('#topicBody');

function topicShell(t) {
  return `<div class="t-layout">
    <div class="t-main">
      <div class="stage" id="stage"><div class="toast" id="toast" role="status"></div></div>

    </div>

        ${Speech.ok ? '<button class="btn small read-btn" id="readBtn" type="button"><span class="ic" aria-hidden="true">🗣️</span> Read it to me</button>' : ''}
      </section>

    </aside>
  </div>`;
}

function makeApi(t) {
  const stage = $('#stage'), toastEl = $('#toast'); let lastExplain = '', lastRead = '', toastTimer = 0;
  const api = {

    if (moist > 0.35 && e.T > 4 && snowK === 0) { const r = rng(9); ctx.strokeStyle = 'rgba(40,110,40,.45)'; ctx.lineWidth = 1.5; for (let i = 0; i < 60; i++) { const x = r() * W, y = HOR + 40 + r() * (H - HOR - 40); if (inPond({ x, y }, pd, 1.1)) continue; const hh = 4 + (y - HOR) / 28; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 2, y - hh); ctx.moveTo(x, y); ctx.lineTo(x + 2, y - hh); ctx.stroke(); if (i % 5 === 0) { ctx.fillStyle = ['#fff', '#ffd23f', '#f78fb3'][i % 3]; ellipse(ctx, x, y - hh, 2.5, 2.5); ctx.fill(); } } }
    list.forEach(p => { const s = 0.5 + (p.y - 282) / 200 * 0.75; if (desert) (p.i % 2 ? shrub(ctx, p.x, p.y, s) : cactus(ctx, p.x, p.y, s * 0.9)); else if (icy) pine(ctx, p.x, p.y, s * 1.2, e.T < 0); else if (e.R < 25) shrub(ctx, p.x, p.y, s, '#a3a85a'); else (p.i % 3 === 2 ? bush(ctx, p.x, p.y, s) : tree(ctx, p.x, p.y, s * 1.05)); });
    if (e.R > 55 && e.T >= 1) { const nR = Math.round((e.R - 55) * 3.5); ctx.strokeStyle = 'rgba(210,228,255,.65)'; ctx.lineWidth = 1.5; for (let i = 0; i < nR; i++) { const x = ((i * 97.3) % W + t * 60) % W, y = ((i * 211.7) % H + t * 560) % H; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - 4, y + 14); ctx.stroke(); } }
    if (e.T < 1 && e.R > 20) { const nS = Math.round(e.R * 1.4); ctx.fillStyle = 'rgba(255,255,255,.9)'; for (let i = 0; i < nS; i++) { const x = ((i * 83.1) % W + Math.sin(t + i) * 10 + t * 10) % W, y = ((i * 151.3) % H + t * 45) % H; ellipse(ctx, x, y, 2.2, 2.2); ctx.fill(); } }
    if (hot > 0.8 && moist < 0.2) { ctx.fillStyle = `rgba(255,200,120,${0.08 * hot})`; ctx.fillRect(0, 0, W, H); }
    return pd;
  }

  /* ---------- state / UI ---------- */
  let api, cv, st, layer, el = {}, hint, uid = 0, msg = null, msgT = 0, dragT = null, ghost = null;
  const missions = [
    { id: 'camel', text: 'Help a camel live happily in its habitat.', cheer: 'The camel has everything it needs!' },
    { id: 'fix', text: 'Change the habitat to help an animal that is struggling.', cheer: 'You changed the habitat and now the animal can survive!' },
    { id: 'babies', text: 'Watch an animal have babies.', cheer: 'Babies! Animals have offspring when their habitat suits them.' }
  ];
  const tempWord = T => T < 0 ? 'freezing' : T < 10 ? 'cold' : T < 20 ? 'mild' : T < 30 ? 'warm' : 'hot';
  const rainWord = R => R < 15 ? 'Almost none' : R < 35 ? 'A little' : R < 65 ? 'Some' : 'Lots';
  const plantWord = P => P < 15 ? 'Hardly any' : P < 40 ? 'A few' : P < 70 ? 'Quite a lot' : 'Lots';
  function habitatName(e, pd) { if (e.T < 2) return 'an icy land'; if (e.T >= 27 && e.R < 35) return 'a desert'; if (e.P >= 65) return 'a forest'; if (pd && e.R >= 55) return 'a pond habitat'; if (e.R < 30) return 'a dry grassland'; return 'a grassy meadow'; }
  function reasons(a, e, pd) {
    const sp = SPECIES[a.kind], r = [];
    if (e.T > sp.t[1]) r.push('hot'); if (e.T < sp.t[0]) r.push('cold');
    if (sp.r) { if (e.R < sp.r[0]) r.push('dry'); if (e.R > sp.r[1]) r.push('wet'); }
    if (sp.p) { if (e.P < sp.p[0]) r.push('fewplants'); if (e.P > sp.p[1]) r.push('manyplants'); }
    if (sp.pond) { if (!pd) r.push('nopond'); else if (pd.frozen) r.push('frozen'); }
    return r;
  }
  function statusOf(a) { const pd = pondOf(st.env), r = reasons(a, st.env, pd), sp = SPECIES[a.kind]; a.reasons = r; if (!r.length) return 'happy'; if (r.length === 1 && !(sp.water && r[0] === 'nopond')) return 'struggling'; return 'leaving'; }
  function pos(a) { a.el.style.left = (a.x / W * 100) + '%'; a.el.style.top = (a.y / H * 100) + '%'; a.el.style.zIndex = Math.round(a.y); }
  function toLogical(e) { const r = api.stage.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * W, y: (e.clientY - r.top) / r.height * H, inside: e.clientX >= r.left && e.clientX <= r.right && e.clientY >= r.top && e.clientY <= r.bottom }; }
  function settle(a) {
    const sp = SPECIES[a.kind], pd = pondOf(st.env);
    a.x = clamp(a.x, 24, W - 24); a.y = clamp(a.y, HOR + 46, H - 14);
    if (sp.water) { if (pd && !inPond(a, pd, 0.8)) { const ang = Math.random() * TAU, k = Math.random() * 0.5; a.x = pd.x + Math.cos(ang) * pd.rx * k; a.y = pd.y + Math.sin(ang) * pd.ry * k + 6; } }
    else if (!sp.swim && inPond(a, pd, 1.05)) { const ang = Math.atan2((a.y - pd.y) / pd.ry, (a.x - pd.x) / pd.rx); a.x = pd.x + Math.cos(ang) * pd.rx * 1.18; a.y = clamp(pd.y + Math.sin(ang) * pd.ry * 1.25 + 8, HOR + 46, H - 14); }
    pos(a);
  }
  function addAnimal(kind, x, y, extra = {}) {
    const sp = SPECIES[kind];
    if (sp.water && !pondOf(st.env)) { api.toast(`💧 There's no pond! ${sp.name}es need water. Add more rain first.`, 3200); Sound.play('oops'); return null; }
    if (!extra.baby && st.animals.filter(a => !a.baby && !a.gone).length >= 10) { api.toast('🧺 That\'s a lot of animals! Clear some first.'); return null; }
    const a = Object.assign({ id: ++uid, kind, x, y, status: null, happyT: 0, leaveT: 0, babies: 0, talkT: 0, heartT: 0 }, extra);
    const d = document.createElement('div'); d.className = 'animal' + (a.baby ? ' baby' : ''); d.innerHTML = `<span class="bubble"></span><span class="body"><span class="em">${a.egg ? '🥚' : sp.emo}</span></span><span class="ring"></span>`;
    d.setAttribute('role', 'button'); d.setAttribute('tabindex', '0'); d.setAttribute('aria-label', sp.name + (a.baby ? ' baby' : ''));
    layer.appendChild(d); a.el = d; st.animals.push(a); settle(a); attach(a); if (!a.baby) select(a); update(a, true); Sound.play(a.baby ? 'chirp' : 'pop'); if (hint) hint.hide(); return a;
  }
  function attach(a) {
    let dd = null; const d = a.el;
    d.addEventListener('pointerdown', e => { e.preventDefault(); e.stopPropagation(); select(a); if (a.gone) return; dd = { moved: false, sx: e.clientX, sy: e.clientY }; d.setPointerCapture(e.pointerId); d.classList.add('dragging'); });
    d.addEventListener('pointermove', e => { if (!dd) return; if (Math.hypot(e.clientX - dd.sx, e.clientY - dd.sy) > 5) dd.moved = true; const p = toLogical(e); a.x = clamp(p.x, 10, W - 10); a.y = clamp(p.y, HOR + 30, H - 10); pos(a); });
    const up = () => { if (!dd) return; d.classList.remove('dragging'); const moved = dd.moved; dd = null; if (moved) { settle(a); update(a, true); } else { a.talkT = 3; update(a, true); } };
    d.addEventListener('pointerup', up); d.addEventListener('pointercancel', up);
    d.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); select(a); a.talkT = 3; update(a, true); } });
  }
  function select(a) { st.sel = a.baby ? st.animals.find(x => x.id === a.parent) || a : a; st.animals.forEach(x => x.el.classList.toggle('sel', x === st.sel)); renderCard(); }
  function bubbleText(a) { if (a.egg) return 'Hatching soon...'; if (a.status === 'happy') return a.baby ? 'Hello!' : 'I love it here!'; const r = a.reasons || []; if (a.status === 'leaving') return r.length > 1 ? `${SAY[r[0]]} I must move.` : 'I must move!'; return SAY[r[0]] || 'Hmm...'; }
  function update(a, force) {
    const old = a.status, s = statusOf(a); a.status = s; const cls = 'animal' + (a.baby ? ' baby' : '') + ' ' + s + (st.sel === a ? ' sel' : '') + ((a.talkT > 0 || st.sel === a || (s !== 'happy' && !a.baby)) ? ' talk' : '') + (a.gone ? ' walking' : '') + (a.flip ? ' flip' : '') + (a.x > W - 150 ? ' edgeR' : a.x < 150 ? ' edgeL' : '');
    if (old !== s || force || a.el.className !== cls) { a.el.className = cls; a.el.querySelector('.bubble').textContent = bubbleText(a); if (old && old !== s && s === 'happy') { a.talkT = 2.5; heart(a); } if (s !== 'leaving') a.leaveT = 0; if (s !== 'happy') a.happyT = 0; }
    if (s === 'happy' && a.kind === 'camel') api.award('camel');
    return { old, s };
  }
  function heart(a) { const h = document.createElement('span'); h.className = 'heart'; h.textContent = '💚'; a.el.appendChild(h); setTimeout(() => h.remove(), 1700); }
  function leave(a, why) {
    if (a.gone) return; a.gone = true; const sp = SPECIES[a.kind];
    if (!a.baby) { msg = `The ${sp.name.toLowerCase()} can't live here because ${(a.reasons || []).map(r => LONG[r]).join(' and ')}. It is moving away to find a better habitat.`; msgT = 6; }

    else { const right = a.x > W / 2; a.flip = right; a.x = right ? W + 70 : -70; update(a, true); a.el.classList.add('walking'); pos(a); a.el.style.opacity = 0; }
    setTimeout(() => { a.el.remove(); st.animals = st.animals.filter(x => x !== a); if (st.sel === a) { st.sel = null; renderCard(); } }, 1700);
    st.animals.filter(x => x.parent === a.id).forEach(b => leave(b));
  }
  function spawnBaby(p) {
    const sp = SPECIES[p.kind], side = p.babies % 2 ? 1 : -1; p.babies++;
    const b = addAnimal(p.kind, p.x + side * 42, p.y + 10, { baby: true, parent: p.id, egg: sp.egg, hatchT: 0 }); if (!b) return;
    msg = `The ${sp.name.toLowerCase()}${sp.egg ? ' laid an egg' : ' had a baby'}! Animals have young (called <b>offspring</b>) when their habitat gives them food, water, shelter and the right temperature.`; msgT = 7;
    api.award('babies'); renderCard();
  }
  function envChanged() {
    const before = st.animals.filter(a => !a.baby && !a.gone).map(a => [a, a.status]); st.animals.forEach(a => { if (!a.gone) { if (SPECIES[a.kind].water || !SPECIES[a.kind].swim) settle(a); update(a); } });
    before.forEach(([a, s]) => { if (s && s !== 'happy' && a.status === 'happy') { api.award('fix'); msg = `Well done! Now the ${SPECIES[a.kind].name.toLowerCase()} has everything it needs to <b>survive</b>.`; msgT = 5; } });
    renderCard(); syncChips();
  }
  function setEnv(k, v) { st.env[k] = v; el[k].value = v; setFill(el[k]); envChanged(); }
  function syncChips() { el.Tv.textContent = `${st.env.T} °C`; el.Rv.textContent = rainWord(st.env.R); el.Pv.textContent = plantWord(st.env.P); $$('[data-pre]', api.controls).forEach(b => { const p = PRESETS[b.dataset.pre]; b.classList.toggle('on', p.T === st.env.T && p.R === st.env.R && p.P === st.env.P); }); }
  function renderCard() {
    const box = $('#hCard'); if (!box) return; const a = st.sel;
    if (!a || a.gone) { box.innerHTML = '<p class="note" style="margin:0">Tap an animal in the habitat to see what it needs.</p>'; return; }
    const sp = SPECIES[a.kind], r = a.reasons || [], ok = x => !r.includes(x);
    const rows = [['🌡️', 'Right temperature', ok('hot') && ok('cold'), r.includes('hot') ? 'Too hot' : r.includes('cold') ? 'Too cold' : 'Just right']];
    if (sp.r) rows.push(['💧', 'Right amount of water', ok('dry') && ok('wet'), r.includes('dry') ? 'Too dry' : r.includes('wet') ? 'Too wet' : 'Just right']);
    if (sp.p) rows.push(['🌿', 'Right amount of plants', ok('fewplants') && ok('manyplants'), r.includes('fewplants') ? 'Not enough' : r.includes('manyplants') ? 'Too many' : 'Just right']);
    if (sp.pond) rows.push(['🫧', 'A pond', ok('nopond') && ok('frozen'), r.includes('nopond') ? 'No pond' : r.includes('frozen') ? 'Frozen' : 'Yes']);
    const tone = a.status === 'happy' ? 'good' : a.status === 'struggling' ? 'warn' : 'bad', word = a.status === 'happy' ? 'Happy here' : a.status === 'struggling' ? 'Struggling' : 'Must move';
    const html = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:10px"><span style="font-size:2.6rem;line-height:1">${sp.emo}</span><div><div style="font-family:var(--font-head);font-weight:800;font-size:1.2rem">${sp.name}</div><div class="ro ${tone}" style="padding:2px 10px;display:inline-flex"><span class="ro-v" style="font-size:.95rem">${word}</span></div></div></div>
      <p style="margin:0 0 8px">Likes ${sp.likes}.</p><div style="display:flex;flex-direction:column;gap:6px">${rows.map(([i, n, good, v]) => `<div class="ro" style="flex-direction:row;align-items:center;gap:8px"><span aria-hidden="true">${i}</span><span style="flex:1">${n}</span><b style="color:var(--${good ? 'good' : 'bad'})">${good ? '✓' : '✗'} ${v}</b></div>`).join('')}</div>
      <p class="note"><b>Life cycle:</b> ${sp.cycle}.${a.babies ? ` Babies so far: ${a.babies}.` : ''}</p>`;
    if (box.dataset.h !== html) { box.dataset.h = html; box.innerHTML = html; }
  }
  function explainNow() {
    if (msgT > 0 && msg) return msg; const pd = pondOf(st.env), e = st.env, a = st.sel;
    if (a && !a.gone) { const sp = SPECIES[a.kind], n = sp.name.toLowerCase(); if (a.status === 'happy') return `The ${n} is <b>happy</b> here. It has the warmth, water and food it needs. A <b>habitat</b> is the place where an animal lives and finds everything it needs.`; if (a.status === 'struggling') return `The ${n} is <b>struggling</b> because ${LONG[a.reasons[0]]}. Try changing the habitat with the sliders, or drag it somewhere better.`; return `The ${n} can't survive here because ${a.reasons.map(r => LONG[r]).join(' and ')}. If nothing changes, it will have to move away.`; }
    return `This is ${habitatName(e, pd)}: ${tempWord(e.T)}, with ${rainWord(e.R).toLowerCase()} rain and ${plantWord(e.P).toLowerCase()} plants. Drag an animal in and see if it can live here.`;
  }
  function startTray(e, kind) {
    e.preventDefault(); Sound.init(); dragT = { kind, sx: e.clientX, sy: e.clientY, moved: false };
    const move = ev => { if (!dragT) return; if (!dragT.moved && Math.hypot(ev.clientX - dragT.sx, ev.clientY - dragT.sy) > 8) { dragT.moved = true; ghost = document.createElement('div'); ghost.className = 'ghost emo'; ghost.textContent = SPECIES[kind].emo; document.body.appendChild(ghost); } if (ghost) { ghost.style.left = ev.clientX + 'px'; ghost.style.top = ev.clientY + 'px'; } };
    const up = ev => { window.removeEventListener('pointermove', move); window.removeEventListener('pointerup', up); window.removeEventListener('pointercancel', up); if (ghost) { ghost.remove(); ghost = null; } const d = dragT; dragT = null; if (!d) return;
      if (d.moved) { const p = toLogical(ev); if (p.inside && ev.type !== 'pointercancel') addAnimal(kind, p.x, p.y + 20); }
      else { const pd = pondOf(st.env), sp = SPECIES[kind]; let best = null, bd = -1;
        for (let k = 0; k < 24; k++) { let x, y; if ((sp.water || sp.swim) && pd) { const ang = Math.random() * TAU, rr = Math.sqrt(Math.random()) * 0.75; x = pd.x + Math.cos(ang) * pd.rx * rr; y = pd.y + Math.sin(ang) * pd.ry * rr + 6; } else { x = 60 + Math.random() * 640; y = 330 + Math.random() * 140; if (inPond({ x, y }, pd, 1.3)) continue; }
          const dmin = st.animals.filter(o => !o.gone).reduce((m, o) => Math.min(m, Math.hypot(o.x - x, (o.y - y) * 1.6)), 999); if (dmin > bd) { bd = dmin; best = { x, y }; } }
        if (best) addAnimal(kind, best.x, best.y); } };
    window.addEventListener('pointermove', move); window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
  }

  return {
    id: 'habitats', title: 'Habitats and Life Cycles', icon: '🐸', strand: 'Biology', strandKey: 'bio',
    question: 'Why do animals live where they live?', missions,
    preview(ctx) { const e = PRESETS.pond; drawLand(ctx, e, 0); ctx.font = `72px ${EMOJI_FONT}`; ctx.textAlign = 'center'; [['🦆', 530, 420], ['🐸', 680, 452], ['🦌', 210, 430], ['🦉', 370, 470]].forEach(([m, x, y]) => ctx.fillText(m, x, y)); },
    mount(a) {
      api = a; uid = 0; msg = null; msgT = 0; st = { env: { ...PRESETS.desert }, animals: [], sel: null }; delete st.env.name; delete st.env.icon;
      cv = api.canvas(W, H, 'A landscape habitat. Animals can be dragged in.');
      layer = document.createElement('div'); layer.className = 'layer'; api.stage.insertBefore(layer, $('#toast'));
      hint = api.hint('👇 Drag an animal into the habitat', 'bl');
      const slider = (k, icon, labelTxt, min, max) => `<div class="row" style="gap:8px"><span class="ctl-label" style="min-width:118px"><span aria-hidden="true">${icon}</span> ${labelTxt}</span><input type="range" id="h${k}" min="${min}" max="${max}" step="1" aria-label="${labelTxt}"><div class="val-chip" id="h${k}v" style="min-width:120px"></div></div>`;
      api.controls.innerHTML = `

        ${slider('T', '🌡️', 'Temperature', -10, 45)}${slider('R', '🌧️', 'Rain', 0, 100)}${slider('P', '🌿', 'Plants', 0, 100)}
        <div class="row"><span class="ctl-label">Animals: drag one in, or tap it</span></div>
        <div class="seg">${Object.entries(SPECIES).map(([k, s]) => `<button class="pick" data-sp="${k}" type="button" style="touch-action:none;min-width:76px"><span class="emo" aria-hidden="true">${s.emo}</span>${s.name}</button>`).join('')}</div>
        <div class="row"><button class="btn small" id="hClear" type="button"><span class="ic">🧹</span>Clear animals</button></div>`;
      ['T', 'R', 'P'].forEach(k => { el[k] = $('#h' + k); el[k + 'v'] = $('#h' + k + 'v'); el[k].value = st.env[k]; setFill(el[k]); el[k].oninput = () => setEnv(k, +el[k].value); });
      $$('[data-pre]', api.controls).forEach(b => b.onclick = () => { const p = PRESETS[b.dataset.pre]; Sound.play('select'); ['T', 'R', 'P'].forEach(k => { st.env[k] = p[k]; el[k].value = p[k]; setFill(el[k]); }); envChanged(); });

      $$('[data-sp]', api.controls).forEach(b => b.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); const fake = { preventDefault() { }, clientX: 0, clientY: 0 }; startTray(fake, b.dataset.sp); window.dispatchEvent(new PointerEvent('pointerup', { clientX: 0, clientY: 0 })); } }));
      $('#hClear').onclick = () => { st.animals.forEach(x => x.el.remove()); st.animals = []; st.sel = null; renderCard(); Sound.play('whoosh'); };
      api.extra.innerHTML = `<section class="panel"><h2><span aria-hidden="true">🔍</span> Animal card</h2><div id="hCard"></div></section>` +
        wordsPanel('Words to know', [['Habitat', 'The place where an animal lives and finds food, water and shelter.'], ['Survive', 'To stay alive.'], ['Offspring', 'The babies or young of an animal.'], ['Life cycle', 'How an animal is born, grows up and has young of its own.']]);
      syncChips(); renderCard();
    },
    frame(dt, t) {
      cv.begin(); drawLand(cv.ctx, st.env, t); msgT -= dt;
      st.animals.slice().forEach(a => {
        if (a.gone) return; a.talkT = Math.max(0, a.talkT - dt); update(a);
        if (a.egg) { a.hatchT += dt; if (a.hatchT > 2.4) { a.egg = false; a.el.querySelector('.em').textContent = SPECIES[a.kind].emo; Sound.play('chirp'); update(a, true); } return; }
