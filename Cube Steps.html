<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cube Steps: learn to solve the Rubik’s Cube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EAF2FF; --surface:#FFFFFF; --ink:#1D2748; --muted:#56618A; --line:#C9D6EF;
  --mat:#D6E5FF; --dot:#B9CDF3; --accent:#2F6FE0;
  --sun:#FFD23F; --sun-edge:#D9A800; --key:#EAF2FF; --key-edge:#B7C5E3;
  --gap:clamp(6px, 1.2vmin, 14px);
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#10172B; --surface:#18213A; --ink:#EEF2FF; --muted:#A7B1CF; --line:#2B3757;
    --mat:#141D33; --dot:#25304D; --accent:#6E9BFF;
    --sun:#FFD23F; --sun-edge:#B58C00; --key:#222D4A; --key-edge:#0B1020;
    color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10172B; --surface:#18213A; --ink:#EEF2FF; --muted:#A7B1CF; --line:#2B3757;
  --mat:#141D33; --dot:#25304D; --accent:#6E9BFF;
  --sun:#FFD23F; --sun-edge:#B58C00; --key:#222D4A; --key-edge:#0B1020;
  color-scheme: dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%; scroll-padding-top:env(safe-area-inset-top,0px)}
body{
  height:100%; margin:0; overflow:hidden;
  background:var(--bg); color:var(--ink);
  font-family:"Nunito", ui-rounded, "Segoe UI", system-ui, sans-serif;
  font-size:clamp(14px, 0.85vw + 0.85vh, 17px); line-height:1.45;
  -webkit-text-size-adjust:100%;
}
h1,h2{font-family:"Baloo 2", "Nunito", ui-rounded, system-ui, sans-serif; line-height:1.05; margin:0}
button{font:inherit; color:inherit; cursor:pointer}
button:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
[hidden]{display:none !important}

/* The whole app is exactly one screen tall */
.app{
  height:100%; display:flex; flex-direction:column; gap:var(--gap);
  padding:var(--gap) max(var(--gap), env(safe-area-inset-right,0px)) var(--gap) max(var(--gap), env(safe-area-inset-left,0px));
}

/* Header: brand and lesson path share one row when there is room */
.top{display:flex; align-items:center; flex-wrap:wrap; gap:var(--gap) 20px; flex:none}
.brand{display:flex; align-items:center; gap:10px; flex:none}
.logo{width:clamp(30px, 4.5vmin, 42px); height:auto; flex:none}
.brand h1{font-size:clamp(20px, 1.4vw + 1.4vh, 32px); font-weight:800}
.brand p{margin:0; color:var(--muted); font-size:.85em}
.path{
  flex:1 1 480px; min-width:0; display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  justify-content:flex-end;
}
.path::-webkit-scrollbar{display:none}
.path button{
  flex:none; display:flex; align-items:center; gap:6px;
  background:var(--surface); border:2px solid var(--line); border-radius:12px;
  padding:4px 10px 4px 4px; font-weight:800; font-size:.85em; white-space:nowrap; min-height:38px;
}
.path .num{
  width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none;
  font-family:"Baloo 2",system-ui,sans-serif; font-size:16px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
}
.path button[aria-current="step"]{border-color:var(--ink)}
.path .tick{color:#23B05A; font-size:.9em}

/* Main area */
.layout{flex:1; min-height:0; display:grid; gap:var(--gap)}
/* Landscape: laptop, iPad sideways, phone sideways */
@media (min-aspect-ratio: 23/20){
  .layout{grid-template-columns:minmax(0,1fr) clamp(270px, 36vw, 470px); grid-template-rows:minmax(0,1fr)}
}
/* Portrait: phone, iPad upright */
@media (max-aspect-ratio: 23/20){
  .layout{grid-template-rows:minmax(160px,1fr) auto; grid-template-columns:minmax(0,1fr)}
  .panel{max-height:54vh; max-height:54dvh}
}

/* Upright screens that are not very tall: while the turn pad is open, the lesson text
   steps aside so the cube keeps its room. Moves and buttons stay. */
@media (max-aspect-ratio: 23/20) and (max-height: 960px){
  .layout.padopen .body, .layout.padopen .pager{display:none !important}
}

/* Stage */
.stage{
  container-type:inline-size; container-name:stage;
  display:flex; flex-direction:column;
  position:relative; min-height:0; border-radius:clamp(16px, 2.4vmin, 28px); overflow:hidden;
  background-color:var(--mat);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.7px);
  background-size:22px 22px;
}
.view{position:relative; flex:1 1 auto; min-height:0; touch-action:none}
.stage canvas{position:absolute; inset:0; width:100%; height:100%; display:block; cursor:grab}
.stage canvas.dragging{cursor:grabbing}
.bubble{
  position:absolute; left:10px; top:10px; display:flex; align-items:center; gap:10px;
  background:var(--surface); border:2px solid var(--line); border-radius:16px;
  padding:6px 14px 6px 6px; max-width:calc(100% - 20px); pointer-events:none;
}
.bubble .big{
  min-width:clamp(40px, 7vmin, 60px); height:clamp(40px, 7vmin, 60px); padding:0 6px; border-radius:12px;
  display:grid; place-items:center; font-family:"Baloo 2",system-ui,sans-serif; font-weight:800;
  font-size:clamp(22px, 4vmin, 34px); box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);
}
.bubble .arrow{display:flex; align-items:center; gap:4px; height:22px; color:var(--ink); font-weight:800; font-size:.9em}
.bubble .arrow svg{width:22px; height:22px}
.bubble .say{font-weight:800; line-height:1.2}

.dock{flex:none; display:flex; flex-direction:column; gap:8px; padding:0 10px 10px}
.toast{
  position:absolute; top:10px; left:50%; transform:translateX(-50%); width:max-content; max-width:calc(100% - 20px); text-align:center; font-size:.9em;
  background:var(--ink); color:var(--bg); font-weight:800; border-radius:14px; padding:8px 14px;
  transition:opacity .25s; pointer-events:none;
}
.toast.off{opacity:0}
.view.toasting .bubble{opacity:0}
.bubble{transition:opacity .2s}
.padbox{
  background:var(--surface); border:2px solid var(--line); border-radius:16px; padding:8px;
  display:grid; grid-template-columns:repeat(6,1fr); gap:6px; width:100%; max-width:560px; align-self:center;
}
@container stage (min-width: 700px){
  .padbox{grid-template-columns:repeat(12,1fr); max-width:820px}
}
/* Short screens (phones held sideways): one row of turns keeps the cube big */
@media (max-height: 520px){
  .padbox{grid-template-columns:repeat(12,1fr); padding:6px; gap:4px}
  .padbox button{height:34px; font-size:16px; border-radius:8px}
}
.padbox button{
  border:2px solid transparent; border-radius:10px; height:clamp(36px, 6vmin, 46px);
  font-family:"Baloo 2",system-ui,sans-serif; font-weight:800; font-size:clamp(17px, 3vmin, 21px);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);
}
.padbox button:active{transform:translateY(2px)}
.foot{display:flex; justify-content:space-between; align-items:center; gap:8px; min-height:38px}
.foot .hint{color:var(--muted); font-weight:700; font-size:.85em}
.foot .btns{display:flex; gap:6px; margin-left:auto}
.ghost{
  display:inline-flex; align-items:center; gap:6px;
  background:var(--surface); border:2px solid var(--line); border-radius:12px;
  padding:6px 12px; font-weight:800; font-size:.85em; min-height:38px; white-space:nowrap;
}
.ghost svg{width:18px; height:18px; flex:none}
.ghost[aria-pressed="true"]{border-color:var(--ink)}

/* Panel */
.panel{
  container-type:inline-size;
  min-height:0; display:flex; flex-direction:column; gap:var(--gap); overflow:hidden;
  background:var(--surface); border:2px solid var(--line); border-radius:clamp(16px, 2.4vmin, 28px);
  padding:clamp(12px, 2.2vmin, 26px);
}
.head{flex:none}
.cases{flex:none; display:flex; align-items:center; flex-wrap:wrap; gap:6px 10px}
.cases .q{font-weight:800; font-size:.85em; color:var(--muted)}
.caserow{display:flex; gap:6px}
.caserow button{
  display:flex; align-items:center; background:var(--surface); border:2px solid var(--line);
  border-radius:12px; padding:3px; min-height:38px;
}
.caserow .num{
  width:28px; height:28px; border-radius:8px; display:grid; place-items:center;
  font-family:"Baloo 2",system-ui,sans-serif; font-size:16px;
  background:var(--key); color:var(--ink); box-shadow:inset 0 -3px 0 var(--key-edge);
}
.caserow button[aria-pressed="true"]{border-color:var(--ink)}
@container (max-width: 340px){
  .cases .q{display:none}
  .caserow{gap:4px}
  .caserow button{padding:2px; min-height:34px}
  .caserow .num{width:26px; height:26px; font-size:15px}
}
.caserow button[aria-pressed="true"] .num{background:var(--sun); color:#1D2748; box-shadow:inset 0 -3px 0 var(--sun-edge)}
.stepno{margin:0 0 2px; color:var(--muted); font-weight:800; font-size:.85em}
.head h2{font-size:clamp(22px, 1.5vw + 1.6vh, 38px); font-weight:800}

.body{flex:1 1 auto; min-height:0; overflow:hidden}
.body > *{margin:0 0 .6em}
.body .goal{font-weight:800; font-size:1.06em}
.body .tip{
  padding:.5em .8em; border-radius:12px; font-weight:700;
  background:color-mix(in srgb, var(--sun) 22%, transparent); border-left:6px solid var(--sun);
}
.keys{display:grid; grid-template-columns:repeat(2, minmax(0,1fr)); gap:8px 12px}
.keys div{display:flex; align-items:center; gap:8px; font-weight:700; white-space:nowrap; min-width:0}
.keys b{
  border:2px solid transparent;
  width:28px; height:28px; border-radius:8px; display:grid; place-items:center; flex:none;
  font-family:"Baloo 2",system-ui,sans-serif; font-size:17px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);
}
/* Page mode: as many text pieces as fit, the rest on the next page */
.body.cards{overflow:auto}
.body.cards > :not(.on){display:none}
.pager{display:flex; align-items:center; justify-content:space-between; gap:8px; flex:none}
.pager button{
  width:40px; height:34px; flex:none; border-radius:10px; border:none; font-weight:800; font-size:18px;
  background:var(--key); box-shadow:inset 0 -3px 0 var(--key-edge);
}
.pager button:disabled{opacity:.35; cursor:default}
.dots{display:flex; gap:6px}
.dots span{width:9px; height:9px; border-radius:50%; background:var(--line)}
.dots span.on{background:var(--ink)}

.moves{flex:none; border-top:2px solid var(--line); padding-top:var(--gap)}
.mhead{display:flex; justify-content:space-between; align-items:baseline; gap:8px; font-weight:800; font-size:.85em; color:var(--muted); margin-bottom:6px}
.chips{display:flex; gap:clamp(3px, .8vmin, 6px)}
.chip{
  flex:0 1 46px; min-width:0; height:clamp(34px, 6vmin, 46px); border-radius:10px;
  display:grid; place-items:center; border:2px solid transparent;
  font-family:"Baloo 2",system-ui,sans-serif; font-weight:800; font-size:clamp(16px, 3vmin, 22px);
  box-shadow:inset 0 -4px 0 rgba(0,0,0,.2); transition:transform .15s, opacity .2s;
}
.chip.done{opacity:.35}
.chip.now{transform:translateY(-3px); border-color:var(--ink)}
#count{white-space:nowrap; flex:none}
.bar{display:flex; gap:3px; margin-top:8px; height:7px}
.bar span{flex:1; border-radius:4px; background:var(--line); overflow:hidden}
.bar i{display:block; height:100%; background:var(--accent); width:0}

.controls{display:flex; gap:6px; flex:none}
.key{
  flex:1 1 0; min-width:0; min-height:clamp(40px, 7vmin, 52px);
  border:none; border-radius:12px; padding:6px 8px; font-weight:800; white-space:nowrap;
  background:var(--key); color:var(--ink); box-shadow:inset 0 -4px 0 var(--key-edge);
  display:flex; align-items:center; justify-content:center; gap:6px;
}
.key:active{transform:translateY(2px); box-shadow:inset 0 -2px 0 var(--key-edge)}
.key.play{flex:1.6 1 0; background:var(--sun); color:#1D2748; box-shadow:inset 0 -5px 0 var(--sun-edge); font-size:1.08em}
.key:disabled{opacity:.4; cursor:not-allowed; transform:none}
.key .ic{display:inline-flex; width:20px; height:20px; flex:none}
.key .ic svg{width:100%; height:100%}
.key .spd{font-weight:800; font-variant-numeric:tabular-nums}
@container (max-width: 560px){
  .key .lbl{display:none}
  .key.play .lbl{display:inline}
}
@container (max-width: 340px){
  .key.play .lbl{display:none}
}
/* Free play has only 2 buttons, so their words always fit */
#freeControls .key .lbl{display:inline}

/* Small screens: drop extra words, keep every control */
@media (max-width: 1099px){ .brand p{display:none} }
@media (max-width: 1599px){
  .path button:not([aria-current="step"]){padding:4px}
  .path button:not([aria-current="step"]) .name{display:none}
  .path button:not([aria-current="step"]) .tick{display:none}
  .path button.done:not([aria-current="step"]) .num{outline:3px solid #23B05A; outline-offset:1px}
}
@media (max-width: 760px), (max-height: 520px){
  .path{justify-content:flex-start}
  .path{gap:3px}
  .path button, .path button[aria-current="step"]{padding:2px}
  .path button .name, .path button[aria-current="step"] .name{display:none}
  .path .num{width:26px; height:26px; font-size:15px}
  .path .tick{display:none}
  .path button.done .num{outline:3px solid #23B05A; outline-offset:1px}
  .path button{min-height:34px}
  .foot .hint{display:none}
}
@media (max-width: 380px){ .path .num{width:24px; height:24px} }
@media (max-width: 440px) and (max-aspect-ratio: 23/20){ .brand{display:none} .path{flex-basis:100%; justify-content:space-between} }
@media (max-aspect-ratio: 23/20) and (max-height: 700px){
  .stepno{display:none}
}
@media (max-height: 520px){
  .top{flex-wrap:nowrap}
  .brand h1{display:none}
  .stepno{display:none}
  .pager button{height:28px}
  .mhead{margin-bottom:3px}
  .bar{margin-top:5px}
}

.confetti{position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:20}
.confetti i{position:absolute; top:-20px; width:12px; height:12px; border-radius:3px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media (prefers-reduced-motion: reduce){ .chip, .toast{transition:none} }
</style>
</head>
<body>
<div class="app">

  <header class="top">
    <div class="brand">
      <svg class="logo" viewBox="0 0 44 44" aria-hidden="true">
        <rect x="1" y="1" width="42" height="42" rx="9" fill="#1D2748"/>
        <rect x="5" y="5" width="10" height="10" rx="2.5" fill="#FFD23F"/><rect x="17" y="5" width="10" height="10" rx="2.5" fill="#23B05A"/><rect x="29" y="5" width="10" height="10" rx="2.5" fill="#FF8A1F"/>
        <rect x="5" y="17" width="10" height="10" rx="2.5" fill="#E8384F"/><rect x="17" y="17" width="10" height="10" rx="2.5" fill="#FFFFFF"/><rect x="29" y="17" width="10" height="10" rx="2.5" fill="#2F6FE0"/>
        <rect x="5" y="29" width="10" height="10" rx="2.5" fill="#23B05A"/><rect x="17" y="29" width="10" height="10" rx="2.5" fill="#FFD23F"/><rect x="29" y="29" width="10" height="10" rx="2.5" fill="#E8384F"/>
      </svg>
      <div>
        <h1>Cube Steps</h1>
        <p>Solve the Rubik’s Cube one small step at a time.</p>
      </div>
    </div>
    <nav class="path" id="path" aria-label="Lessons"></nav>
  </header>

  <main class="layout" id="layout">
    <section class="stage" id="stage" aria-label="3D cube">
      <div class="view" id="view">
      <canvas id="cv" aria-label="A 3D Rubik’s Cube. Drag to spin it."></canvas>
      <div class="bubble" id="bubble" hidden aria-live="polite">
        <div class="big" id="bubbleBig">R</div>
        <div><div class="arrow" id="bubbleArrow"></div><div class="say" id="bubbleSay"></div></div>
      </div>
      <div class="toast off" id="toast" aria-live="polite"></div>
      </div>
      <div class="dock">
        <div class="padbox" id="padbox" hidden></div>
        <div class="foot">
          <span class="hint">Drag the cube to look around</span>
          <div class="btns">
            <button class="ghost" id="padToggle" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><g fill="currentColor"><rect x="3" y="3" width="5" height="5" rx="1.2"/><rect x="9.5" y="3" width="5" height="5" rx="1.2"/><rect x="16" y="3" width="5" height="5" rx="1.2"/><rect x="3" y="9.5" width="5" height="5" rx="1.2"/><rect x="9.5" y="9.5" width="5" height="5" rx="1.2"/><rect x="16" y="9.5" width="5" height="5" rx="1.2"/><rect x="3" y="16" width="5" height="5" rx="1.2"/><rect x="9.5" y="16" width="5" height="5" rx="1.2"/><rect x="16" y="16" width="5" height="5" rx="1.2"/></g></svg>Try turns</button>
            <button class="ghost" id="resetView"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="2.5" fill="currentColor"/></svg>Face me</button>
          </div>
        </div>
      </div>
    </section>

    <section class="panel" id="panel">
      <div class="head">
        <p class="stepno" id="stepno"></p>
        <h2 id="title"></h2>
      </div>
      <div class="cases" id="cases" hidden>
        <span class="q">Which looks like yours?</span>
        <div class="caserow" id="caserow" role="group" aria-label="Cases"></div>
      </div>
      <div class="body" id="body"></div>
      <div class="pager" id="pager" hidden>
        <button id="prevCard" aria-label="Previous tip">‹</button>
        <div class="dots" id="dots"></div>
        <button id="nextCard" aria-label="Next tip">›</button>
      </div>
      <div class="moves" id="moves">
        <div class="mhead"><span id="glabel"></span><span id="count"></span></div>
        <div class="chips" id="chips"></div>
        <div class="bar" id="bar"></div>
      </div>
      <div class="controls" id="controls">
        <button class="key" id="btnRestart" aria-label="Start over" title="Start over"><span class="ic" data-icon="restart"></span><span class="lbl">Start over</span></button>
        <button class="key" id="btnBack" aria-label="Back one move" title="Back one move (left arrow)"><span class="ic" data-icon="back"></span><span class="lbl">Back</span></button>
        <button class="key play" id="btnPlay" title="Play or pause (space)"><span class="ic" id="playIc" data-icon="play"></span><span class="lbl" id="playLbl">Play</span></button>
        <button class="key" id="btnNext" aria-label="Next move" title="Next move (right arrow)"><span class="lbl">Next</span><span class="ic" data-icon="next"></span></button>
        <button class="key" id="btnSpeed" aria-label="Change speed" title="Change speed"><span class="ic" data-icon="speed"></span><span class="spd" id="speedLbl">1×</span></button>
      </div>
      <div class="controls" id="freeControls" hidden>
        <button class="key play" id="btnScramble"><span class="ic" data-icon="mix"></span><span class="lbl">Mix it up</span></button>
        <button class="key" id="btnSolve"><span class="ic" data-icon="solved"></span><span class="lbl">Reset</span></button>
      </div>
    </section>
  </main>
</div>
<div class="confetti" id="confetti"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ---------- Colors and moves ---------- */
// Held with yellow on top, white on the bottom, green facing you.
const FACE_HEX = {U:0xFFD23F, D:0xFFFFFF, F:0x23B05A, B:0x2F6FE0, R:0xFF8A1F, L:0xE8384F};
const FACE_CSS = {U:"#FFD23F", D:"#FFFFFF", F:"#23B05A", B:"#2F6FE0", R:"#FF8A1F", L:"#E8384F"};
const FACE_TEXT = {U:"#1D2748", D:"#1D2748", F:"#FFFFFF", B:"#FFFFFF", R:"#1D2748", L:"#FFFFFF"};
const GRAY = 0x8B91A3;
// axis, layer, direction of a clockwise quarter turn seen from that face
const MOVE_DEF = {R:["x",1,-1], L:["x",-1,1], U:["y",1,-1], D:["y",-1,1], F:["z",1,-1], B:["z",-1,1], y:["y",null,-1]};

const SAY = {
  "R":["up","Right side turns up"],   "R'":["down","Right side turns down"],
  "L":["down","Left side turns down"],  "L'":["up","Left side turns up"],
  "U":["left","Top turns to the left"], "U'":["right","Top turns to the right"],
  "D":["right","Bottom turns to the right"], "D'":["left","Bottom turns to the left"],
  "F":["cw","Front turns like a clock"], "F'":["ccw","Front turns the other way"],
  "B":["left","Back turns: top row goes left"], "B'":["right","Back turns: top row goes right"],
  "y":["left","Turn the whole cube to the left"], "y'":["right","Turn the whole cube to the right"]
};
function sayFor(m){
  if (m.endsWith("2")) { const s = SAY[m[0]]; return [s[0], s[1] + ", two times", true]; }

function roundedSquare(s, r){
  const h = s/2, sh = new THREE.Shape();
  sh.moveTo(-h+r, -h); sh.lineTo(h-r, -h); sh.quadraticCurveTo(h, -h, h, -h+r);
  sh.lineTo(h, h-r); sh.quadraticCurveTo(h, h, h-r, h); sh.lineTo(-h+r, h);

function roundedPath(path, half, r){
  const h = half;
  path.moveTo(-h+r, -h); path.lineTo(h-r, -h); path.quadraticCurveTo(h, -h, h, -h+r);
  path.lineTo(h, h-r); path.quadraticCurveTo(h, h, h-r, h); path.lineTo(-h+r, h);
  path.quadraticCurveTo(-h, h, -h, h-r); path.lineTo(-h, -h+r); path.quadraticCurveTo(-h, -h, -h+r, -h);
  return path;
}
const RING_GEO = (() => {

const ringMat = new THREE.MeshBasicMaterial({color:0xFF2BD6, transparent:true, side:THREE.DoubleSide});

function setTargets(homes){

    if (!c) return;
    c.children.filter(ch => ch.userData && ch.userData.face).forEach(st => {
      const r = new THREE.Mesh(RING_GEO, ringMat);

const _m = new THREE.Matrix4();
function snap(c){
  c.position.set(Math.round(c.position.x), Math.round(c.position.y), Math.round(c.position.z));
  _m.makeRotationFromQuaternion(c.quaternion);
  const e = _m.elements;

}
function animateMove(m, ms){
  return new Promise(resolve => {
    const [axis, layer, dir] = MOVE_DEF[m[0]];
    let angle = dir * Math.PI / 2;
    if (m.endsWith("'")) angle = -angle;
    if (m.endsWith("2")) { angle *= 2; ms = ms * 1.5; }
    const pivot = new THREE.Object3D();
    cubeGroup.add(pivot);
    const moving = layer === null ? cubies.slice() : cubies.filter(c => Math.round(c.position[axis]) === layer);
    moving.forEach(c => pivot.attach(c));
    const finish = () => {
      pivot.rotation[axis] = angle;
      pivot.updateMatrixWorld(true);
      moving.forEach(c => { cubeGroup.attach(c); snap(c); });
      cubeGroup.remove(pivot);
      resolve();
    };
    if (!ms) { finish(); return; }
    const t0 = performance.now();
    const tick = now => {
      const t = Math.min(1, (now - t0) / ms);
      const e = t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
      pivot.rotation[axis] = angle * e;
      if (t < 1) requestAnimationFrame(tick); else finish();
    };
    requestAnimationFrame(tick);
  });
}
function isSolved(){
  return cubies.every(c => {
    if (c.userData.type === 1) return true;
    const h = c.userData.home, p = c.position, q = c.quaternion;
    return p.x === h.x && p.y === h.y && p.z === h.z && Math.abs(Math.abs(q.w) - 1) < 1e-6;
  });
}

/* The 3D view follows the size of its box, whatever the screen */
// The top band of the view is kept free for the move bubble and messages.
// The cube is sized to fit the rest, so nothing ever covers it.
const CUBE_RADIUS = 2.62; // covers the cube from any angle
function topBand(){
  const vmin = Math.min(innerWidth, innerHeight) / 100;
  const big = Math.max(40, Math.min(60, 7 * vmin));
  return Math.round(big + 30);
}
function resizeStage(){
  const W = view.clientWidth, H = view.clientHeight;
  if (!W || !H) return;
  renderer.setSize(W, H, false);
  camera.aspect = W / H;
  const band = topBand(), pad = 10;
  const freeH = Math.max(40, H - band - pad);
  const halfPx = Math.min(freeH, W - 2 * pad) / 2;
  const t = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  // pixels per world unit at distance d = H / (2 d t); solve so the cube fills halfPx
  camera.position.z = CUBE_RADIUS * H / (2 * t * halfPx);
  // move the picture down so its center is the center of the free area
  const shift = (band - pad) / 2;
  camera.setViewOffset(W, H, 0, -shift, W, H);
  camera.updateProjectionMatrix();
}
new ResizeObserver(resizeStage).observe(view);
resizeStage();
(function loop(now){
  ringMat.opacity = RM ? 1 : 0.55 + 0.45 * Math.sin((now || 0) / 170);

let pages = [];
function fitText(){
  const kids = [...els.body.children];

  kids.forEach(k => k.classList.add("on"));
  void els.body.offsetHeight;
  cardMode = els.body.scrollHeight > els.body.clientHeight + 2;
  if (!cardMode) { pages = [kids.map((_, i) => i)]; return; }
  // Show the pager first, then see how much room the text really has
  els.pager.hidden = false;
  void els.body.offsetHeight;
  const room = els.body.clientHeight;
  // A paragraph taller than the whole box is split into sentences, so no page overflows
  const splitTall = re => [...els.body.children].forEach(k => {
    if (k.tagName !== "P" || k.offsetHeight <= room) return;
    const pieces = [];
    k.childNodes.forEach(n => {
      if (n.nodeType === 1) pieces.push({bold:true, text:n.textContent.trim()});
      else n.textContent.split(re).forEach(t => { if (t.trim()) pieces.push({bold:false, text:t.trim()}); });
    });
    if (pieces.length < 2) return;
    pieces.forEach(pc => {
      const el = document.createElement("p");
      el.className = k.className;
      if (pc.bold) { const b = document.createElement("b"); b.textContent = pc.text; el.appendChild(b); }
      else el.textContent = pc.text;
      els.body.insertBefore(el, k);
    });

  });

  splitTall(/(?<=[,:])\s+/);     // then, on very small screens, by phrase

  pages = []; let page = [], used = 0, tallest = 0;
  kids2.forEach((k, i) => {
    const h = k.offsetHeight + gapPx;
    if (page.length && used + h > room) { pages.push(page); tallest = Math.max(tallest, used); page = []; used = 0; }
    page.push(i); used += h;
  });
  pages.push(page); tallest = Math.max(tallest, used);
  els.body.classList.add("cards");

  els.body.style.height = Math.min(Math.ceil(tallest), room) + "px";

}
function lessonFinished(){
  const last = current === LESSONS.length - 2;
  toast(last ? "🎉 Solved! Now try it on your cube." : "🎉 Step done! Now try it on your cube.", 5000);
  if (!done.has(current)) { done.add(current); saveDone(); renderPath(); }
  confetti();
}

els.play.addEventListener("click", play);
els.next.addEventListener("click", () => { if (!busy && !playing && !dirty && pos < flat.length) { toast(""); stepForward(); } });
els.back.addEventListener("click", stepBack);
els.restart.addEventListener("click", () => {
  playing = false;
  const go = () => busy ? setTimeout(go, 50) : (setupCube(), toast("Ready! Tap ▶ to watch."));
  go();
});
els.speed.addEventListener("click", () => {
  speedIdx = (speedIdx + 1) % SPEEDS.length;
  els.speedLbl.textContent = SPEEDS[speedIdx].lbl;
  els.speed.setAttribute("aria-label", "Speed: " + SPEEDS[speedIdx].name + ". Change speed");
  toast("Speed: " + SPEEDS[speedIdx].name, 1500);
});

/* Turn pad */
["R","R'","L","L'","U","U'","D","D'","F","F'","B","B'"].forEach(m => {
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = pretty(m);
  b.title = sayFor(m)[1];
  b.setAttribute("aria-label", sayFor(m)[1]);
  chipStyle(b, m);
  b.addEventListener("click", () => userMove(m));
  els.padbox.appendChild(b);
});
async function userMove(m){
  if (busy || playing) return;
  const L = LESSONS[current];
  if (!L.free && !dirty) {
    dirty = true; paintMoves(); updateButtons();
    toast("You turned the cube. Tap ↺ to watch again.", 5000);
  }
  showBubble(m);
  busy = true; updateButtons();
  await animateMove(m, Math.min(dur(), 450));
  busy = false; updateButtons();
  if (L.free && scrambled && isSolved()) {
    scrambled = false;
    toast("🏆 You solved it! You’re a real cuber now.", 6000);
    if (!done.has(current)) { done.add(current); saveDone(); renderPath(); }
    confetti();
  }
}
$("btnScramble").addEventListener("click", async () => {
  if (busy) return;
  const seq = [];
  let prev = "";
  while (seq.length < 20) {
    const f = "RLUDFB"[Math.floor(Math.random() * 6)];
    if (f === prev) continue;
    prev = f;
    seq.push(f + ["", "'", "2"][Math.floor(Math.random() * 3)]);
  }
  busy = true; updateButtons(); toast("Mixing…", 4000);
  for (const m of seq) { showBubble(m); await animateMove(m, reduceMotion ? 0 : 140); }
  busy = false; scrambled = true; updateButtons();
  toast("All mixed up! Start with step 1.");
});
$("btnSolve").addEventListener("click", () => {
  if (busy) return;
  resetCube(); scrambled = false; els.bubble.hidden = true;
  toast("Back to solved.");
});

/* Keyboard */
document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key.toUpperCase();
  if (k.length === 1 && "RLUDFB".includes(k)) { e.preventDefault(); userMove(k + (e.shiftKey ? "'" : "")); return; }
  if (/^[1-9]$/.test(e.key) && LESSONS[current].cases) { e.preventDefault(); selectCase(+e.key - 1); return; }
  if (LESSONS[current].free) return;
  if (e.key === " " && (e.target.tagName || "").toLowerCase() !== "button") { e.preventDefault(); play(); }
  if (e.key === "ArrowRight") { e.preventDefault(); els.next.click(); }
  if (e.key === "ArrowLeft") { e.preventDefault(); stepBack(); }
});

/* Re-fit the text whenever the screen size or orientation changes */
let fitTimer = 0;
new ResizeObserver(() => { clearTimeout(fitTimer); fitTimer = setTimeout(fitText, 120); }).observe($("layout"));
if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitText);

function confetti(){
  if (reduceMotion) return;
  const box = $("confetti");
  const cols = Object.values(FACE_CSS);
  for (let i = 0; i < 70; i++) {
    const p = document.createElement("i");
    p.style.left = Math.random() * 100 + "vw";
    p.style.background = cols[i % cols.length];
    p.style.animationDuration = (1.6 + Math.random() * 1.4) + "s";
    p.style.animationDelay = (Math.random() * 0.4) + "s";
    box.appendChild(p);
    setTimeout(() => p.remove(), 3600);
  }
}

loadLesson(0);
})();
</script>
</body>
</html>
