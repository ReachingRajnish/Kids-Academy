<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Word Detective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lilita+One&family=Nunito:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#DDEEFF; --dot:#C6E0FA; --surface:#FFFFFF; --ink:#26225C; --muted:#5F5B91;
  --tile:#FFD23F; --tile-edge:#E2A400; --tile-ink:#26225C;
  --slot:#BCD9F5; --slot-edge:#A3C6EA;
  --accent:#FF4F8B; --accent-ink:#FFFFFF; --teal:#0B8379;
  --good:#16A374; --bad:#E53E3E; --tape:rgba(255,210,63,.8);
  --lift:0 3px 0 rgba(38,34,92,.14);
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#17143D; --dot:#221E52; --surface:#2A255F; --ink:#F3F1FF; --muted:#ABA6E3;
    --tile:#FFD23F; --tile-edge:#B98600; --tile-ink:#26225C;
    --slot:#383178; --slot-edge:#2C2662;
    --accent:#FF6FA0; --accent-ink:#1B1640; --teal:#4FD1C5;
    --good:#2BC48F; --bad:#FF6B6B; --tape:rgba(255,210,63,.6);
    --lift:0 3px 0 rgba(0,0,0,.35);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#17143D; --dot:#221E52; --surface:#2A255F; --ink:#F3F1FF; --muted:#ABA6E3;
  --tile:#FFD23F; --tile-edge:#B98600; --tile-ink:#26225C;
  --slot:#383178; --slot-edge:#2C2662;
  --accent:#FF6FA0; --accent-ink:#1B1640; --teal:#4FD1C5;
  --good:#2BC48F; --bad:#FF6B6B; --tape:rgba(255,210,63,.6);
  --lift:0 3px 0 rgba(0,0,0,.35);
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
body{
  margin:0;min-height:100%;color:var(--ink);
  background-color:var(--bg);
  background-image:radial-gradient(var(--dot) 1.6px, transparent 1.7px);
  background-size:22px 22px;
  font-family:"Nunito",ui-rounded,"Arial Rounded MT Bold",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  font-size:17px;line-height:1.45;font-weight:600;
  -webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;
}
[hidden]{display:none!important}
button{font-family:inherit;color:inherit;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.emo{font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji","Twemoji Mozilla",sans-serif;font-style:normal;line-height:1}
.display{font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;font-weight:400}

.screen{max-width:480px;margin:0 auto;padding:10px 16px 28px}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.brand{display:flex;align-items:center;gap:8px;font-size:23px}
.stars{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-width:78px;background:var(--surface);border-radius:999px;padding:6px 14px 6px 10px;box-shadow:var(--lift);font-weight:800;font-variant-numeric:tabular-nums}

/* Home */
.hero{padding:22px 4px 4px;text-align:center}
.hero-board{display:inline-grid;grid-template-columns:repeat(2,54px);gap:9px;margin-bottom:16px}
.hero-board span{height:54px;display:grid;place-items:center;font-size:30px;background:#fff;border-radius:8px;box-shadow:0 6px 14px rgba(38,34,92,.16);transform:rotate(var(--t))}
.hero h1{font-size:clamp(36px,11vw,48px);line-height:1;margin:0 0 10px}
.lede{margin:0 auto;max-width:27ch;color:var(--muted)}
.count{margin:12px 0 0;font-weight:800;color:var(--teal)}
.tracks{display:grid;gap:14px;margin-top:22px}
.track{background:var(--surface);border-radius:22px;box-shadow:var(--lift);padding:4px 14px 10px}
.track-main{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:12px;width:100%;background:none;border:0;padding:10px 0 8px;text-align:left;cursor:pointer}
.badge{width:54px;height:54px;border-radius:16px;background:var(--bg);display:grid;place-items:center;font-size:32px}
.track-name{display:block;font-size:25px;line-height:1.1}
.track-sub{display:block;color:var(--muted);font-size:15px}
.track-go{background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:8px 18px;font-weight:800;font-size:16px;box-shadow:0 3px 0 rgba(0,0,0,.16)}
.track-foot{display:flex;align-items:center;gap:10px}
.bar{flex:1;height:10px;border-radius:99px;background:var(--slot);overflow:hidden}
.bar i{display:block;height:100%;background:var(--good);border-radius:inherit}
.track-count{font-size:14px;font-weight:800;color:var(--muted);font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:8px 2px;font-weight:800;color:var(--teal);font-size:14px;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.settings{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:24px}
.pill{background:var(--surface);border:0;border-radius:999px;padding:9px 15px;font-weight:800;font-size:15px;box-shadow:var(--lift);cursor:pointer}
.pill.warn{color:var(--bad)}
.foot-note{text-align:center;color:var(--muted);font-size:14px;margin:14px auto 0;max-width:34ch}

/* Play */
.icon-btn{width:46px;height:46px;flex:none;border-radius:14px;border:0;background:var(--surface);box-shadow:var(--lift);font-size:22px;display:grid;place-items:center;cursor:pointer;padding:0}
.level{flex:1;text-align:center;line-height:1.15}
.lv-name{display:block;font-size:21px}
.lv-num{display:block;font-size:13px;font-weight:800;color:var(--muted)}
.board{
  --w:min(calc(100vw - 44px),400px,max(180px,calc(100vh - 400px)));
  width:var(--w);margin:16px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:12px;
}
@supports (height:100dvh){
  .board{--w:min(calc(100vw - 44px),400px,max(180px,calc(100dvh - 400px)))}
}
.pic{
  position:relative;aspect-ratio:1/1;min-height:84px;background:#fff;border-radius:8px;
  box-shadow:0 2px 0 rgba(38,34,92,.10),0 10px 20px rgba(38,34,92,.14);
  display:grid;place-items:center;transform:rotate(var(--tilt));
  animation:deal .4s cubic-bezier(.2,.9,.3,1.25) both;
}
.pic .emo{font-size:calc(var(--w) * .2)}
.pic::before{content:"";position:absolute;top:-8px;left:50%;width:42%;height:17px;transform:translateX(-50%) rotate(-3deg);background:var(--tape);border-radius:2px}
.clue{min-height:24px;margin:14px 0 0;text-align:center;font-weight:800;color:var(--teal);font-size:16px}
.slots{
  --s:min(48px,calc((min(100vw,480px) - 32px - (var(--n) - 1) * 6px) / var(--n)));
  display:flex;justify-content:center;gap:6px;margin:6px auto 0;
}
.slot{width:var(--s);height:calc(var(--s) * 1.12);border:0;border-radius:12px;padding:0;background:var(--slot);box-shadow:inset 0 -4px 0 var(--slot-edge);font-size:calc(var(--s) * .6);display:grid;place-items:center;cursor:pointer;color:var(--tile-ink)}
.slot.filled{background:var(--tile);box-shadow:0 3px 0 var(--tile-edge)}
.slot.locked{background:var(--teal);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);cursor:default}
.slots.wrong{animation:shake .42s}
.slots.wrong .slot.filled:not(.locked){background:var(--bad);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.slots.right .slot{background:var(--good);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.2);animation:hop .5s both;animation-delay:var(--d)}
.bank{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:7px;width:min(100%,420px);margin:18px auto 0}
.tile{aspect-ratio:1/1;min-height:38px;max-height:58px;border:0;border-radius:12px;padding:0;background:var(--tile);color:var(--tile-ink);box-shadow:0 4px 0 var(--tile-edge);font-size:clamp(20px,6vw,28px);cursor:pointer;transition:transform .07s,box-shadow .07s}
.tile:active{transform:translateY(3px);box-shadow:0 1px 0 var(--tile-edge)}
.tile.used,.tile.removed{visibility:hidden}
.tools{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;width:min(100%,420px);margin:18px auto 0}
.tool{border:0;background:var(--surface);border-radius:16px;box-shadow:var(--lift);padding:8px 2px 7px;min-height:64px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;cursor:pointer}
.tool .emo{font-size:22px}
.tool .t{font-size:13px;font-weight:800;line-height:1}
.tool .c{font-size:11px;font-weight:800;color:var(--muted);line-height:1}
.tool:disabled{opacity:.4;cursor:default}

/* Sheets */
.overlay{position:fixed;inset:0;z-index:30;background:rgba(18,15,50,.55);display:flex;align-items:flex-end;justify-content:center;padding:16px 12px calc(14px + env(safe-area-inset-bottom,0px))}
@media (min-width:600px) and (min-height:640px){.overlay{align-items:center}}
.sheet{width:min(100%,440px);max-height:calc(100% - env(safe-area-inset-top,0px) - 8px);overflow:auto;background:var(--surface);border-radius:26px;padding:22px 20px 18px;box-shadow:0 24px 60px rgba(0,0,0,.35);animation:rise .32s cubic-bezier(.2,.9,.3,1.1) both}
.sheet h2{margin:6px 0 0;font-size:27px;line-height:1.1;text-align:center}
.big-emo{display:block;text-align:center;font-size:46px}
.win-word{font-size:clamp(36px,12vw,56px);letter-spacing:.06em;text-align:center;color:var(--good);margin:8px 0 2px;overflow-wrap:anywhere}
.win-q{text-align:center;color:var(--muted);margin:0 0 12px}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:8px;text-align:left;border:0;background:var(--bg);border-radius:14px;padding:8px 10px;min-height:50px;font-weight:700;font-size:14px;line-height:1.2;cursor:pointer}
.chip .emo{font-size:26px;flex:none}
.chip span:last-child::first-letter{text-transform:uppercase}
.gain{text-align:center;font-weight:800;margin:14px 0 12px}
.row{display:grid;grid-template-columns:auto 1fr;gap:10px}
.btn{border:0;border-radius:16px;padding:14px 18px;font-weight:800;font-size:17px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);box-shadow:0 4px 0 rgba(0,0,0,.18)}
.btn.ghost{background:var(--bg)}
.btn.wide{width:100%;margin-top:16px}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px}
.sheet-head h2{text-align:left;margin:0}
.sheet-sub{color:var(--muted);margin:6px 0 0}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;font-weight:800;color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:5px}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(50px,1fr));gap:7px;max-height:min(52vh,460px);overflow:auto;padding:4px 2px 2px;margin-top:12px}
.lv{height:46px;border:0;border-radius:12px;background:var(--bg);font-weight:800;font-size:15px;cursor:pointer;font-variant-numeric:tabular-nums}
.lv.solved{background:var(--good);color:#fff}
.lv.skipped{background:var(--tile);color:var(--tile-ink)}
.lv.current{background:var(--accent);color:var(--accent-ink)}
.lv:disabled{opacity:.35;cursor:default}
.center{text-align:center}
.center p{color:var(--muted);margin:10px 0 0}

#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);width:max-content;max-width:min(92vw,420px);background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:800;font-size:15px;text-align:center;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40}
#toast.show{opacity:1;transform:translate(-50%,0)}
#confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:35}
.bit{position:absolute;top:-40px;animation:fall 1.6s cubic-bezier(.3,.6,.5,1) forwards}

@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(var(--rot))}}
@keyframes deal{from{opacity:0;transform:translateY(14px) scale(.9)}to{opacity:1;transform:rotate(var(--tilt))}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes hop{0%,100%{transform:translateY(0)}40%{transform:translateY(-10px)}}
@keyframes rise{from{opacity:0;transform:translateY(30px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<section id="home" class="screen">
  <header class="topbar">
    <div class="brand display"><span class="emo">🔍</span>Word Detective</div>
    <div class="stars" title="Stars"><span class="emo">⭐</span><b id="starsHome">100</b></div>
  </header>
  <div class="hero">
    <div class="hero-board" aria-hidden="true">
      <span class="emo" style="--t:-4deg">🍎</span><span class="emo" style="--t:3deg">🚒</span>
      <span class="emo" style="--t:2deg">🍓</span><span class="emo" style="--t:-3deg">❤️</span>
    </div>
    <h1 class="display">Four pictures.<br>One word.</h1>
    <p class="lede">Look closely, work out what all four share, then spell it.</p>
    <p class="count" id="countLine"></p>
  </div>
  <div class="tracks" id="tracks"></div>
  <div class="settings">
    <button class="pill" id="soundBtn" type="button"></button>
    <button class="pill" id="voiceBtn" type="button"></button>
    <button class="pill warn" id="resetBtn" type="button">Reset progress</button>
  </div>
  <p class="foot-note">Progress saves on this device. Each solved puzzle earns stars to spend on hints.</p>
</section>

<section id="play" class="screen" hidden>
  <header class="topbar">
    <button class="icon-btn" id="backBtn" type="button" aria-label="Back to menu">⬅️</button>
    <div class="level" id="levelLabel"></div>
    <div class="stars" title="Stars"><span class="emo">⭐</span><b id="starsPlay">100</b></div>
  </header>
  <div class="board" id="board"></div>
  <div class="clue" id="clue" aria-live="polite"></div>
  <div class="slots display" id="slots"></div>
  <div class="bank display" id="bank"></div>
  <div class="tools">
    <button class="tool" id="hintBtn" type="button"><span class="emo">💡</span><span class="t">Letter</span><span class="c" id="hintCost">10 ⭐</span></button>
    <button class="tool" id="removeBtn" type="button"><span class="emo">🧹</span><span class="t">Remove</span><span class="c">15 ⭐</span></button>
    <button class="tool" id="clueBtn" type="button"><span class="emo">🗂️</span><span class="t">Clue</span><span class="c">free</span></button>
    <button class="tool" id="shuffleBtn" type="button"><span class="emo">🔀</span><span class="t">Shuffle</span><span class="c">free</span></button>
    <button class="tool" id="skipBtn" type="button"><span class="emo">⏭️</span><span class="t">Skip</span><span class="c">free</span></button>
  </div>
</section>

<div class="overlay" id="winOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="winTitle">
    <span class="big-emo emo">🎉</span>
    <h2 class="display" id="winTitle">You got it!</h2>
    <div class="win-word display" id="winWord"></div>
    <p class="win-q" id="winQ"></p>
    <div class="chips" id="winChips"></div>
    <p class="gain" id="winGain"></p>
    <div class="row">
      <button class="btn ghost" id="hearBtn" type="button">🔊 Hear it</button>
      <button class="btn primary" id="nextBtn" type="button">Next puzzle</button>
    </div>
  </div>
</div>

<div class="overlay" id="gridOverlay" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="gridTitle">
    <div class="sheet-head">
      <h2 class="display" id="gridTitle"></h2>
      <button class="icon-btn" id="gridClose" type="button" aria-label="Close">✖️</button>
    </div>
    <p class="sheet-sub" id="gridSub"></p>
    <div class="legend">
      <span><i style="background:var(--good)"></i>Solved</span>
      <span><i style="background:var(--tile)"></i>Skipped</span>
      <span><i style="background:var(--accent)"></i>Up next</span>
    </div>
    <div class="levels" id="levels"></div>
  </div>
</div>

<div class="overlay" id="doneOverlay" hidden>
  <div class="sheet center" role="dialog" aria-modal="true" aria-labelledby="doneTitle">
    <span class="big-emo emo">🏆</span>
    <h2 class="display" id="doneTitle"></h2>
    <p id="doneText"></p>
    <button class="btn primary wide" id="doneBtn" type="button">Back to menu</button>
  </div>
</div>

<div id="toast" role="status" aria-live="polite"></div>
<div id="confetti" aria-hidden="true"></div>

<script>

function hashStr(s){ var h = 2166136261 >>> 0; for (var i=0;i<s.length;i++){ h ^= s.charCodeAt(i); h = Math.imul(h,16777619) >>> 0; } return h; }
function mulberry(seed){ var a = seed >>> 0; return function(){ a = (a + 0x6D2B79F5) >>> 0; var t = a; t = Math.imul(t ^ (t>>>15), t|1); t ^= t + Math.imul(t ^ (t>>>7), t|61); return ((t ^ (t>>>14)) >>> 0) / 4294967296; }; }
function shuffled(arr, rand){ var a = arr.slice(); for (var i=a.length-1;i>0;i--){ var j = Math.floor(rand()*(i+1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }

var TRACKS = [
  { id:"easy",   name:"Easy",   badge:"🐣", desc:"3 or 4 letters",  min:3, max:4 },
  { id:"medium", name:"Medium", badge:"🦊", desc:"5 or 6 letters",  min:5, max:6 },
  { id:"hard",   name:"Hard",   badge:"🦉", desc:"7 to 10 letters", min:7, max:10 }
];
var LISTS = {};
TRACKS.forEach(function(t){
  var list = ALL.filter(function(p){ return p.w.length >= t.min && p.w.length <= t.max; })
                .sort(function(a,b){ return a.w < b.w ? -1 : a.w > b.w ? 1 : 0; });
  LISTS[t.id] = shuffled(list, mulberry(hashStr("word-detective-" + t.id)));
});
function trackById(id){ return TRACKS.filter(function(t){ return t.id === id; })[0]; }

/* Sound and voice */
var actx = null;
function tone(freq, dur, type, vol, delay){
  if (!S.sound) return;
  try {
    if (!actx){ var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; actx = new AC(); }
    if (actx.state === "suspended") actx.resume();
    var t = actx.currentTime + (delay || 0);
    var o = actx.createOscillator(), g = actx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.1, t + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + 0.03);
  } catch(e){}
}
var sfx = {
  tap:   function(){ tone(620, 0.06, "triangle", 0.08); },
  back:  function(){ tone(400, 0.06, "triangle", 0.07); },
  coin:  function(){ tone(988, 0.07, "square", 0.04); tone(1319, 0.12, "square", 0.04, 0.07); },
  wrong: function(){ tone(240, 0.16, "square", 0.04); tone(190, 0.22, "square", 0.04, 0.13); },
  win:   function(){ [523,659,784,1047].forEach(function(f,i){ tone(f, 0.18, "triangle", 0.1, i*0.09); }); }
};
function say(text){
  if (!S.voice || !text) return;
  try {
    if (!("speechSynthesis" in window)) return;
    window.speechSynthesis.cancel();
    var u = new SpeechSynthesisUtterance(text);
    u.rate = 0.85; u.pitch = 1.05; u.lang = "en-US";
    window.speechSynthesis.speak(u);
  } catch(e){}
}

function show(id){ ["home","play"].forEach(function(s){ $(s).hidden = (s !== id); }); window.scrollTo(0,0); }
function solvedIn(id){ return LISTS[id].reduce(function(n,p){ return n + (S.solved[p.w] ? 1 : 0); }, 0); }
function nextIndex(id){
  var L = LISTS[id], i;
  for (i=0;i<L.length;i++){ if (!S.solved[L[i].w] && !S.skipped[L[i].w]) return i; }
  for (i=0;i<L.length;i++){ if (!S.solved[L[i].w]) return i; }
  return -1;
}
function frontier(id){
  var L = LISTS[id];
  for (var i=0;i<L.length;i++){ if (!S.solved[L[i].w] && !S.skipped[L[i].w]) return i; }
  return L.length - 1;
}

/* Puzzle */
var FILL = "EEEEEAAAAIIIOOOUUTTTNNNSSSRRRLLLDDHHCCMMPPBBGGFFWYKV";
var TILTS = ["-2deg","1.6deg","1.2deg","-1.8deg"];
var HINT_COST = 10, REMOVE_COST = 15, FREE_WAIT = 30;
var cur = null;

function makeBank(w){
  var size = w.length <= 5 ? 12 : (w.length <= 8 ? 14 : 16);
  var r = mulberry(hashStr("bank-" + w));
  var t = w.split("");
  while (t.length < size) t.push(FILL[Math.floor(r() * FILL.length)]);
  return shuffled(t, r);
}

function openPuzzle(id, i){
  var p = LISTS[id][i];
  var tiles = makeBank(p.w), needed = [], claimed = {};
  p.w.split("").forEach(function(ch){
    for (var k=0;k<tiles.length;k++){ if (!claimed[k] && tiles[k] === ch){ claimed[k] = true; needed.push(k); return; } }
  });
  cur = {
    id:id, i:i, p:p, tiles:tiles, needed:needed, claimed:claimed,
    order: tiles.map(function(_,k){ return k; }),
    used: tiles.map(function(){ return false; }),
    removed: tiles.map(function(){ return false; }),
    slots: p.w.split("").map(function(){ return null; }),
    locked: p.w.split("").map(function(){ return false; }),
    clue:false, done:false, helped:false, since:Date.now()
  };
  var h = S.hints[p.w];
  if (h){
    (h.r || []).forEach(function(pos){ lockPos(pos); });
    if (h.x) applyRemove();
    if (h.c) cur.clue = true;
    if ((h.r && h.r.length) || h.x) cur.helped = true;
  }
  $("slots").className = "slots display";
  show("play");
  renderPlay(true);
}

function renderPlay(dealPics){
  var t = trackById(cur.id), L = LISTS[cur.id];
  $("levelLabel").innerHTML = '<span class="lv-name display">' + t.name + '</span><span class="lv-num">Puzzle ' + (cur.i+1) + ' of ' + fmt(L.length) + (S.solved[cur.p.w] && !cur.done ? ", solved before" : "") + '</span>';
  $("starsPlay").textContent = fmt(S.stars);
  if (dealPics){
    var board = $("board"); board.innerHTML = "";
    cur.p.e.forEach(function(e,k){
      var d = document.createElement("div");
      d.className = "pic";
      d.style.setProperty("--tilt", TILTS[k]);
      d.style.animationDelay = (k * 70) + "ms";
      d.innerHTML = '<span class="emo">' + e + '</span>';
      board.appendChild(d);
    });
  }
  $("clue").textContent = cur.clue ? "Group: " + CATS[cur.p.c] : "";
  renderSlots(); renderBank(); renderTools();
}

function renderSlots(){
  var el = $("slots");
  el.style.setProperty("--n", cur.p.w.length);
  el.innerHTML = "";
  cur.slots.forEach(function(k,pos){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "slot" + (k !== null ? " filled" : "") + (cur.locked[pos] ? " locked" : "");
    b.textContent = k !== null ? cur.tiles[k] : "";
    b.style.setProperty("--d", (pos * 45) + "ms");
    b.setAttribute("aria-label", k !== null ? "Letter " + cur.tiles[k] + ", tap to remove" : "Empty box " + (pos+1));
    b.onclick = function(){ unplace(pos); };
    el.appendChild(b);
  });
}

function renderBank(){
  var el = $("bank");
  el.style.setProperty("--cols", cur.tiles.length / 2);
  el.innerHTML = "";
  cur.order.forEach(function(k){
    var b = document.createElement("button");
    b.type = "button";
    b.className = "tile" + (cur.used[k] ? " used" : "") + (cur.removed[k] ? " removed" : "");
    b.textContent = cur.tiles[k];
    b.disabled = cur.used[k] || cur.removed[k];
    b.onclick = function(){ place(k); };
    el.appendChild(b);
  });
}

function hintState(){
  if (cur.done || cur.locked.indexOf(false) < 0) return { ok:false };
  if (S.stars >= HINT_COST) return { ok:true, free:false };
  var wait = Math.max(0, FREE_WAIT - Math.floor((Date.now() - cur.since) / 1000));
  return wait === 0 ? { ok:true, free:true } : { ok:false, wait:wait };
}

function renderTools(){
  var st = hintState(), c = $("hintCost");
  if (S.stars >= HINT_COST) c.textContent = HINT_COST + " ⭐";
  else if (st.ok) c.textContent = "free now";
  else if (st.wait) c.textContent = "free in " + st.wait + "s";
  else c.textContent = "";
  var h = S.hints[cur.p.w];
  $("hintBtn").disabled = cur.done || cur.locked.indexOf(false) < 0;
  $("removeBtn").disabled = cur.done || !!(h && h.x);
  $("clueBtn").disabled = cur.done || cur.clue;
  $("shuffleBtn").disabled = cur.done;
  $("skipBtn").disabled = cur.done;
}

function place(k){
  if (cur.done || cur.used[k] || cur.removed[k]) return;
  var pos = cur.slots.indexOf(null);
  if (pos < 0) return;
  $("slots").classList.remove("wrong");
  cur.slots[pos] = k; cur.used[k] = true;
  sfx.tap(); renderSlots(); renderBank();
  if (cur.slots.indexOf(null) < 0) check();
}

function unplace(pos){
  if (cur.done || cur.locked[pos]) return;
  var k = cur.slots[pos];
  if (k === null) return;
  $("slots").classList.remove("wrong");
  cur.slots[pos] = null; cur.used[k] = false;
  sfx.back(); renderSlots(); renderBank();
}

function check(){
  var guess = cur.slots.map(function(k){ return cur.tiles[k]; }).join("");
  if (guess === cur.p.w){ win(); return; }
  var el = $("slots");
  el.classList.remove("wrong"); void el.offsetWidth; el.classList.add("wrong");
  sfx.wrong();
  try { if (navigator.vibrate) navigator.vibrate(120); } catch(e){}
}

function returnUnlocked(){
  cur.slots.forEach(function(k,pos){ if (k !== null && !cur.locked[pos]){ cur.used[k] = false; cur.slots[pos] = null; } });
}
function lockPos(pos){
  returnUnlocked();
  var k = cur.needed[pos];
  cur.slots[pos] = k; cur.used[k] = true; cur.locked[pos] = true; cur.removed[k] = false;
}
function applyRemove(){
  returnUnlocked();
  cur.tiles.forEach(function(_,k){ if (!cur.claimed[k]) cur.removed[k] = true; });
}
function hintRec(){ return S.hints[cur.p.w] || (S.hints[cur.p.w] = {}); }

function doHint(){
  var st = hintState();
  if (!st.ok){
    if (st.wait) toast("A letter costs " + HINT_COST + " stars. You get one free in " + st.wait + " seconds.");
    return;
  }
  var pos = cur.locked.indexOf(false);
  if (st.free) cur.since = Date.now(); else S.stars -= HINT_COST;
  var h = hintRec(); h.r = (h.r || []).concat(pos);
  cur.helped = true;
  lockPos(pos); save(); sfx.coin(); renderPlay(false);
  if (cur.slots.indexOf(null) < 0) check();
}
function doRemove(){
  if (cur.done) return;
  if (S.stars < REMOVE_COST){ toast("Removing letters costs " + REMOVE_COST + " stars. Solve a puzzle to earn more."); return; }
  S.stars -= REMOVE_COST; hintRec().x = 1; cur.helped = true;
  applyRemove(); save(); sfx.coin(); renderPlay(false);
}
function doClue(){
  if (cur.done || cur.clue) return;
  cur.clue = true; hintRec().c = 1; save(); sfx.tap(); renderPlay(false);
}
function doShuffle(){
  if (cur.done) return;
  cur.order = shuffled(cur.order, Math.random); sfx.tap(); renderBank();
}
function doSkip(){
  if (cur.done) return;
  S.skipped[cur.p.w] = 1; save();
  var i = nextIndex(cur.id);
  if (i === cur.i){ toast("This is the last one left in " + trackById(cur.id).name + ". You can crack it!"); return; }
  sfx.back(); goNext();
}
function goNext(){
  var i = nextIndex(cur.id);
  if (i < 0){ trackDone(); return; }
  openPuzzle(cur.id, i);
}

var CHEERS = ["You got it!","Case cracked!","Brilliant work!","Super sleuth!","Nailed it!","Sharp eyes!"];
function win(){
  cur.done = true;
  var w = cur.p.w, first = !S.solved[w], gain = 0;
  if (first){ gain = 5 + (cur.helped ? 0 : 2); S.stars += gain; S.solved[w] = 1; }
  delete S.skipped[w]; delete S.hints[w];
  save();
  $("slots").classList.add("right");
  $("starsPlay").textContent = fmt(S.stars);
  renderTools();
  sfx.win(); confetti(); say(w.toLowerCase());
  setTimeout(function(){ showWin(gain, first); }, 700);
}
function showWin(gain, first){
  var w = cur.p.w;
  $("winTitle").textContent = CHEERS[Math.floor(Math.random() * CHEERS.length)];
  $("winWord").textContent = w;
  $("winQ").textContent = "How does each picture connect to \u201C" + w.toLowerCase() + "\u201D?";
  var chips = $("winChips"); chips.innerHTML = "";
  cur.p.e.forEach(function(e){
    var name = NAMES[e] || "";
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip";
    b.innerHTML = '<span class="emo">' + e + '</span><span>' + esc(name) + '</span>';
    b.onclick = function(){ say(name); };
    chips.appendChild(b);
  });
  $("winGain").textContent = first ? "+" + gain + " stars" + (gain > 5 ? ", including 2 for solving with no help" : "") : "You solved this one before, so no new stars.";
  $("winOverlay").hidden = false;
  $("nextBtn").focus();
}
function trackDone(){
  var t = trackById(cur.id);
  $("doneTitle").textContent = "Every " + t.name + " puzzle solved!";
  $("doneText").textContent = "That is " + fmt(LISTS[cur.id].length) + " words. Pick another level from the menu.";
  $("doneOverlay").hidden = false;
  $("doneBtn").focus();
}

/* Puzzle picker */
function openGrid(id){
  var t = trackById(id), L = LISTS[id], f = frontier(id);
  $("gridTitle").textContent = t.name + " puzzles";
  $("gridSub").textContent = solvedIn(id) + " of " + L.length + " solved. Tap a number to play it.";
  var g = $("levels"); g.innerHTML = "";
  var frag = document.createDocumentFragment();
  L.forEach(function(p,i){
    var b = document.createElement("button");
    var solved = !!S.solved[p.w], skipped = !!S.skipped[p.w];
    b.type = "button";
    b.className = "lv" + (solved ? " solved" : skipped ? " skipped" : i === f ? " current" : "");
    b.textContent = i + 1;
    b.disabled = !(solved || skipped || i <= f);
    b.setAttribute("aria-label", "Puzzle " + (i+1) + (solved ? ", solved" : skipped ? ", skipped" : ""));
    b.onclick = function(){ closeGrid(); openPuzzle(id, i); };
    frag.appendChild(b);
  });
  g.appendChild(frag);
  $("gridOverlay").hidden = false;
  setTimeout(function(){ var c = g.querySelector(".current"); if (c) g.scrollTop = c.offsetTop - g.clientHeight / 2; }, 0);
}
function closeGrid(){ $("gridOverlay").hidden = true; }

/* Little extras */
var toastTimer = null;
function toast(msg){
  var el = $("toast");
  el.textContent = msg; el.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function(){ el.classList.remove("show"); }, 2800);
}
var reduceMotion = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(){
  if (reduceMotion) return;
  var box = $("confetti"), bits = ["⭐","✨","🎉","🎈","💛","🔍"];
  for (var i=0;i<22;i++){
    var s = document.createElement("span");
    s.className = "bit emo";
    s.textContent = bits[i % bits.length];
    s.style.left = (Math.random() * 100) + "%";
    s.style.fontSize = (18 + Math.random() * 16) + "px";
    s.style.setProperty("--dx", (Math.random() * 120 - 60) + "px");
    s.style.setProperty("--rot", (Math.random() * 540 - 270) + "deg");
    s.style.animationDelay = (Math.random() * 0.25) + "s";
    box.appendChild(s);
    (function(node){ setTimeout(function(){ node.remove(); }, 2100); })(s);
  }
}

/* Wiring */
$("backBtn").onclick = function(){ sfx.back(); try { window.speechSynthesis && window.speechSynthesis.cancel(); } catch(e){} renderHome(); show("home"); };
$("hintBtn").onclick = doHint;
$("removeBtn").onclick = doRemove;
$("clueBtn").onclick = doClue;
$("shuffleBtn").onclick = doShuffle;
$("skipBtn").onclick = doSkip;
$("nextBtn").onclick = function(){ $("winOverlay").hidden = true; goNext(); };
$("hearBtn").onclick = function(){ say(cur.p.w.toLowerCase()); };
$("gridClose").onclick = closeGrid;
$("gridOverlay").addEventListener("click", function(e){ if (e.target === this) closeGrid(); });
$("doneBtn").onclick = function(){ $("doneOverlay").hidden = true; renderHome(); show("home"); };
$("soundBtn").onclick = function(){ S.sound = !S.sound; save(); renderHome(); sfx.tap(); };
$("voiceBtn").onclick = function(){ S.voice = !S.voice; save(); renderHome(); say("Read aloud is on"); };
$("resetBtn").onclick = function(){
  if (!resetArmed){
    resetArmed = true;
    $("resetBtn").textContent = "Tap again to erase everything";
    resetTimer = setTimeout(function(){ resetArmed = false; renderHome(); }, 3500);
    return;
  }
  clearTimeout(resetTimer); resetArmed = false;
  var keep = { sound:S.sound, voice:S.voice };
  S = Object.assign(fresh(), keep); save(); renderHome();
  toast("Progress erased. Fresh start with 100 stars.");
};

var tick = setInterval(function(){
  if (cur && !cur.done && !$("play").hidden && S.stars < HINT_COST) renderTools();
}, 1000);

document.addEventListener("keydown", function(e){
  if (e.key === "Escape" && !$("gridOverlay").hidden){ closeGrid(); return; }
  if ($("play").hidden || !cur || cur.done) return;
  if (!$("gridOverlay").hidden || !$("winOverlay").hidden || !$("doneOverlay").hidden) return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  if (/^[a-zA-Z]$/.test(e.key)){
    var ch = e.key.toUpperCase();
    var k = cur.order.filter(function(k){ return cur.tiles[k] === ch && !cur.used[k] && !cur.removed[k]; })[0];
    if (k !== undefined) place(k);
    e.preventDefault();
  } else if (e.key === "Backspace"){
    for (var pos = cur.slots.length - 1; pos >= 0; pos--){
      if (cur.slots[pos] !== null && !cur.locked[pos]){ unplace(pos); break; }
    }
    e.preventDefault();
  }
});

renderHome();
})();
</script>
</body>
