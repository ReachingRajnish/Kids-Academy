<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Draw with me</title>
<style>
:root {
  --mat: #1E4D47;
  --mat-line: rgba(255, 255, 255, 0.07);
  --mat-text: #F3F1E8;
  --mat-soft: #B9CFC9;
  --paper: #FFFFFF;
  --ink: #2A2A2A;
  --new: #F26B1D;
  --old: #A3A8AE;
  --ghost: #D3D6DA;
  --start: #1E9E62;
  --pencil: #FFC93C;
  --pencil-ink: #3B2A00;
  --chip: rgba(255, 255, 255, 0.10);
  --radius: 14px;
  --font: ui-rounded, "SF Pro Rounded", "Nunito", "Segoe UI", system-ui, -apple-system, sans-serif;
  color-scheme: light;
  box-sizing: border-box;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
@media (prefers-color-scheme: dark) {
  :root { --mat: #14332F; --paper: #F4F3EE; --chip: rgba(255, 255, 255, 0.08); color-scheme: dark; }
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
body {
  font-family: var(--font);
  color: var(--mat-text);
  background-color: var(--mat);
  background-image:
    linear-gradient(var(--mat-line) 1px, transparent 1px),
    linear-gradient(90deg, var(--mat-line) 1px, transparent 1px);
  background-size: 32px 32px;
  -webkit-text-size-adjust: 100%;
  -webkit-tap-highlight-color: transparent;
}
button { font: inherit; color: inherit; touch-action: manipulation; cursor: pointer; }
button:focus-visible, .card:focus-visible { outline: 3px solid var(--pencil); outline-offset: 3px; }
[hidden] { display: none !important; }

/* ---------- Home ---------- */
#home { max-width: 1180px; margin: 0 auto; padding: 28px 24px 48px; }
.home-head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px 24px; margin-bottom: 22px; }
.home-head h1 { font-size: clamp(34px, 5vw, 52px); line-height: 1; margin: 0; font-weight: 800; letter-spacing: -0.01em; }
.home-head p { margin: 10px 0 0; font-size: 18px; color: var(--mat-soft); }
.surprise {
  border: 0; border-radius: 999px; background: var(--pencil); color: var(--pencil-ink);
  font-weight: 700; font-size: 18px; padding: 14px 24px; min-height: 54px;
}
.surprise:active { transform: scale(0.97); }
.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 18px; scrollbar-width: none; }
.chip {
  flex: none; border: 0; border-radius: 999px; background: var(--chip); color: var(--mat-text);
  font-size: 17px; padding: 10px 18px; min-height: 46px;
}
.chip span { color: var(--mat-soft); margin-left: 4px; }
.chip[aria-pressed="true"] { background: var(--mat-text); color: var(--mat); }
.chip[aria-pressed="true"] span { color: var(--mat); opacity: 0.6; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 22px; }
.card {
  position: relative; background: var(--paper); color: var(--ink); border: 0; border-radius: 6px;
  padding: 10px 10px 12px; text-align: left; box-shadow: 0 2px 0 rgba(0, 0, 0, 0.18);
  transform: rotate(var(--tilt, 0deg)); transition: transform 0.15s ease;
}
.card:active { transform: rotate(0deg) scale(0.97); }
.card svg { display: block; width: 100%; aspect-ratio: 1; }
.card .name { display: block; font-size: 18px; font-weight: 700; margin-top: 4px; }
.card .meta { display: block; font-size: 14px; color: #6B7075; margin-top: 2px; }
.card .done {
  position: absolute; top: 8px; right: 8px; background: var(--start); color: #fff; font-size: 13px; font-weight: 700;
  border-radius: 999px; padding: 3px 9px;
}

/* ---------- Lesson ---------- */
#lesson { height: 100%; display: flex; flex-direction: column; padding: 14px 20px 18px; gap: 14px; }
.bar { display: flex; align-items: center; gap: 14px; min-height: 52px; }
.back {
  border: 0; background: var(--chip); border-radius: 999px; padding: 10px 18px 10px 14px; font-size: 17px; min-height: 48px;
  display: inline-flex; align-items: center; gap: 6px;
}
.bar h2 { margin: 0; font-size: 26px; font-weight: 800; flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.counter { font-size: 17px; color: var(--mat-soft); white-space: nowrap; }
.work { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) minmax(300px, 380px); gap: 24px; align-items: center; }
.stage-wrap { height: 100%; min-height: 0; display: flex; align-items: center; justify-content: center; }
.stage {
  height: 100%; max-height: 100%; max-width: 100%; aspect-ratio: 1; background: var(--paper); border-radius: 6px;
  box-shadow: 0 3px 0 rgba(0, 0, 0, 0.22); border: 0; padding: 0; display: block;
}
.stage svg { display: block; width: 100%; height: 100%; }
.panel { display: flex; flex-direction: column; gap: 18px; }
.pips { display: flex; flex-wrap: wrap; gap: 6px; }
.pip { width: 22px; height: 8px; border-radius: 4px; background: var(--chip); }
.pip.past { background: var(--mat-soft); }
.pip.now { background: var(--new); width: 34px; }
.say { font-size: clamp(24px, 2.6vw, 32px); line-height: 1.3; font-weight: 700; margin: 0; min-height: 3.9em; }
.sub { font-size: 17px; line-height: 1.45; color: var(--mat-soft); margin: -6px 0 0; }
.controls { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.btn {
  border: 0; border-radius: var(--radius); background: var(--chip); color: var(--mat-text); font-size: 19px; font-weight: 700;
  min-height: 62px; padding: 10px 12px; white-space: nowrap; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
}
.btn:disabled { opacity: 0.35; cursor: default; }
.btn:not(:disabled):active { transform: scale(0.97); }
.btn.primary { grid-column: 1 / -1; background: var(--pencil); color: var(--pencil-ink); font-size: 22px; min-height: 72px; }
.btn svg { width: 22px; height: 22px; flex: none; }
.speed { display: flex; align-items: center; gap: 8px; font-size: 16px; color: var(--mat-soft); }
.speed button { border: 0; background: var(--chip); border-radius: 999px; padding: 8px 14px; min-height: 40px; font-size: 16px; }
.speed button[aria-pressed="true"] { background: var(--mat-text); color: var(--mat); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 15px; color: var(--mat-soft); }
.legend i { display: inline-block; width: 18px; height: 4px; border-radius: 2px; vertical-align: middle; margin-right: 6px; }
.legend i.dash { background: repeating-linear-gradient(90deg, var(--mat-soft) 0 5px, transparent 5px 9px); }
.legend b { display: inline-block; width: 12px; height: 12px; border-radius: 50%; vertical-align: middle; margin-right: 6px; background: var(--start); }

@media (max-aspect-ratio: 1/1), (max-width: 760px) {
  #lesson { height: auto; min-height: 100%; }
  .work { grid-template-columns: 1fr; align-items: start; }
  .stage-wrap { height: auto; }
  .stage { width: min(100%, 58vh); height: auto; }
  .say { min-height: 0; }
}
@media (prefers-reduced-motion: no-preference) {
  .cheer { animation: cheer 0.6s ease-out; }
  @keyframes cheer { 0% { transform: scale(0.92) rotate(-2deg); } 60% { transform: scale(1.03) rotate(1deg); } 100% { transform: none; } }
}
</style>
</head>
<body>

<main id="home">
  <div class="home-head">
    <div>
      <h1>Draw with me</h1>
      <p>Pick a drawing. Grab a pencil and paper, and copy one step at a time.</p>
    </div>
    <button class="surprise" id="surprise">Surprise me</button>
  </div>
  <div class="chips" id="chips" role="toolbar" aria-label="Kinds of drawings"></div>
  <div class="grid" id="grid"></div>
</main>

<section id="lesson" hidden>
  <div class="bar">
    <button class="back" id="backHome" aria-label="Back to all drawings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
      All drawings
    </button>
    <h2 id="title"></h2>
    <span class="counter" id="counter"></span>
  </div>
  <div class="work">
    <div class="stage-wrap">
      <button class="stage" id="stage" aria-label="Watch this step again">
        <svg id="svg" viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <g id="layer"></g>
          <circle id="dot" r="9" style="fill: var(--start)" stroke="#fff" stroke-width="3" opacity="0"></circle>
        </svg>
      </button>
    </div>
    <div class="panel">
      <div class="pips" id="pips" aria-hidden="true"></div>
      <p class="say" id="say" aria-live="polite"></p>
      <p class="sub" id="sub"></p>
      <div class="controls">
        <button class="btn" id="prev">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 6l-6 6 6 6"/></svg>
          Back
        </button>
        <button class="btn" id="again">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 12a8 8 0 1 0 2.5-5.8"/><path d="M4 4v5h5"/></svg>
          <span id="againLabel">Watch again</span>
        </button>
        <button class="btn primary" id="next"></button>
      </div>
      <div class="speed" id="speedRow">
        Speed
        <button data-speed="1.8" aria-pressed="false">Slow</button>
        <button data-speed="1" aria-pressed="true">Normal</button>
        <button data-speed="0.55" aria-pressed="false">Fast</button>
      </div>
      <div class="legend" id="legend">
        <span><b></b>Start here</span>
        <span><i style="background: var(--new)"></i>Draw this now</span>
        <span><i style="background: var(--old)"></i>Already drawn</span>
        <span id="legendGuide"><i class="dash"></i>Light guide line</span>
      </div>
    </div>
  </div>
</section>

<script>
/* Shape helpers. Every shape is a path whose point order is the drawing order. */
const r1 = n => Math.round(n * 10) / 10;
const C = (cx, cy, r) => `M${cx} ${cy - r} A${r} ${r} 0 0 0 ${cx} ${cy + r} A${r} ${r} 0 0 0 ${cx} ${cy - r}`;
const E = (cx, cy, rx, ry) => `M${cx} ${cy - ry} A${rx} ${ry} 0 0 0 ${cx} ${cy + ry} A${rx} ${ry} 0 0 0 ${cx} ${cy - ry}`;
const L = (...p) => { let s = `M${p[0]} ${p[1]}`; for (let i = 2; i < p.length; i += 2) s += ` L${p[i]} ${p[i + 1]}`; return s; };
const Z = (...p) => L(...p) + ' Z';
const R = (x, y, w, h) => `M${x} ${y} L${x + w} ${y} L${x + w} ${y + h} L${x} ${y + h} Z`;
const RR = (x, y, w, h, r) => `M${x + r} ${y} L${x + w - r} ${y} Q${x + w} ${y} ${x + w} ${y + r} L${x + w} ${y + h - r} Q${x + w} ${y + h} ${x + w - r} ${y + h} L${x + r} ${y + h} Q${x} ${y + h} ${x} ${y + h - r} L${x} ${y + r} Q${x} ${y} ${x + r} ${y} Z`;
const dot = (cx, cy, r) => ({ d: C(cx, cy, r), f: 1 });
const fill = d => ({ d, f: 1 });
const rays = (cx, cy, a, b, n, off = 0) => {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = (off + i * 360 / n - 90) * Math.PI / 180;
    out.push(L(r1(cx + a * Math.cos(t)), r1(cy + a * Math.sin(t)), r1(cx + b * Math.cos(t)), r1(cy + b * Math.sin(t))));
  }
  return out;
};
const zig = (cx, cy, ro, ri, n) => {
  const p = [];
  for (let i = 0; i < n * 2; i++) {
    const t = (i * 180 / n - 90) * Math.PI / 180, r = i % 2 ? ri : ro;
    p.push(r1(cx + r * Math.cos(t)), r1(cy + r * Math.sin(t)));
  }
  return Z(...p);
};
const bumpy = (cx, cy, r, n) => {
  const pt = (a, rr) => { const t = (a - 90) * Math.PI / 180; return [r1(cx + rr * Math.cos(t)), r1(cy + rr * Math.sin(t))]; };
  let [x, y] = pt(0, r); let s = `M${x} ${y}`;
  for (let i = 1; i <= n; i++) {
    const a0 = -(i - 1) * 360 / n, a1 = -i * 360 / n;
    const [qx, qy] = pt((a0 + a1) / 2, r * 1.32); const [ex, ey] = pt(a1, r);
    s += ` Q${qx} ${qy} ${ex} ${ey}`;
  }
  return s;
};
const spiral = (cx, cy, rmax, turns) => {
  const p = [], steps = turns * 36;
  for (let i = 0; i <= steps; i++) {
    const t = i / steps, a = -t * turns * 2 * Math.PI, r = rmax * t;
    p.push(r1(cx + r * Math.cos(a)), r1(cy + r * Math.sin(a)));
  }
  return L(...p);
};
const cloud = (cx, cy, s = 1) => {
  const P = (x, y) => `${r1(cx + x * s)} ${r1(cy + y * s)}`;
  return `M${P(-40, 15)} Q${P(-58, 15)} ${P(-52, -2)} Q${P(-48, -22)} ${P(-26, -16)} Q${P(-16, -38)} ${P(4, -28)} Q${P(26, -40)} ${P(36, -16)} Q${P(58, -14)} ${P(52, 6)} Q${P(52, 15)} ${P(40, 15)} Z`;
};
const drop = (x, y) => `M${x} ${y} Q${x + 7} ${y + 13} ${x} ${y + 16} Q${x - 7} ${y + 13} ${x} ${y}`;
const waves = (x0, x1, y, w = 40, h = 12) => {
  let s = `M${x0} ${y} Q${x0 + w / 4} ${y - h} ${x0 + w / 2} ${y}`;
  for (let x = x0 + w / 2; x < x1 - 1; x += w / 2) s += ` T${x + w / 2} ${y}`;
  return s;
};
const petals = (cx, cy, d, r, n) => {
  const out = [];
  for (let i = 0; i < n; i++) {
    const t = (i * 360 / n - 90) * Math.PI / 180;
    out.push(C(r1(cx + d * Math.cos(t)), r1(cy + d * Math.sin(t)), r));
  }
  return out;
};

/* Lessons. lv: 1 easy, 2 medium, 3 challenge. Each step: t = what to do, s = shapes. */
const LESSONS = [
  // ---------------- Animals ----------------
  { id: 'cat', n: 'Cat', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a big circle for the head.', s: [C(200, 150, 70)] },
    { t: 'Add two pointy triangle ears on top.', s: [L(142, 112, 150, 45, 190, 82), L(258, 112, 250, 45, 210, 82)] },
    { t: 'Two dots for the eyes.', s: [dot(175, 140, 7), dot(225, 140, 7)] },
    { t: 'A small upside-down triangle nose, then a mouth like a "w".', s: [Z(192, 163, 208, 163, 200, 173), 'M200 173 Q194 188 182 184', 'M200 173 Q206 188 218 184'] },
    { t: 'Two whiskers on each side.', s: [L(165, 168, 110, 158), L(165, 178, 110, 186), L(235, 168, 290, 158), L(235, 178, 290, 186)] },
    { t: 'Draw a tall oval under the head for the body.', s: [E(200, 300, 60, 80)] },
    { t: 'Two small ovals at the bottom for paws.', s: [E(175, 372, 20, 10), E(225, 372, 20, 10)] },
    { t: 'Finish with a curly tail.', s: ['M258 330 Q330 320 320 255 Q316 232 298 238'] },
  ]},
  { id: 'dog', n: 'Puppy', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a circle for the head.', s: [C(200, 160, 70)] },
    { t: 'Add two floppy ears hanging down the sides.', s: ['M145 115 C105 120 100 200 125 212 C140 218 146 190 140 160', 'M255 115 C295 120 300 200 275 212 C260 218 254 190 260 160'] },
    { t: 'Two dots for eyes.', s: [dot(175, 148, 8), dot(225, 148, 8)] },
    { t: 'An oval for the snout, and a dark oval nose at the top of it.', s: [E(200, 192, 32, 24), fill(E(200, 180, 12, 8))] },
    { t: 'A line down from the nose, a smile, and a little tongue.', s: [L(200, 188, 200, 200), 'M200 200 Q190 210 182 204', 'M200 200 Q210 210 218 204', 'M194 206 Q194 222 200 222 Q206 222 206 206'] },
    { t: 'An oval body under the head.', s: [E(200, 302, 55, 70)] },
    { t: 'Two oval paws at the bottom.', s: [E(170, 368, 20, 10), E(230, 368, 20, 10)] },
    { t: 'A happy wagging tail.', s: ['M252 300 Q292 282 286 245'] },

  { id: 'fish', n: 'Fish', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a wide oval for the body.', s: [E(185, 200, 100, 60)] },
    { t: 'Add a triangle tail on the right.', s: [Z(282, 200, 345, 150, 345, 250)] },
    { t: 'A circle eye with a dot inside.', s: [C(130, 185, 12), dot(133, 186, 5)] },
    { t: 'A small smile, and a curved line for the gill.', s: ['M88 212 Q98 218 108 211', 'M158 160 Q138 200 158 240'] },
    { t: 'A fin on top and a small fin at the bottom.', s: ['M170 142 Q195 100 232 148', 'M215 256 Q238 292 258 244'] },
    { t: 'Draw little "u" shapes for scales.', s: ['M190 185 Q200 197 210 185', 'M218 205 Q228 217 238 205', 'M190 222 Q200 234 210 222', 'M232 176 Q242 188 252 176'] },
    { t: 'Three bubbles, getting smaller as they go up.', s: [C(60, 150, 9), C(45, 115, 6), C(62, 86, 4)] },
  ]},
  { id: 'bird', n: 'Bird', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a wide oval for the body.', s: [E(185, 240, 95, 65)] },
    { t: 'A circle for the head, up on the right.', s: [C(255, 165, 45)] },
    { t: 'A triangle beak and a dot eye.', s: [Z(298, 158, 336, 172, 298, 184), dot(268, 155, 7)] },
    { t: 'A leaf shape for the wing.', s: ['M140 228 Q185 188 232 230 Q190 252 140 228'] },
    { t: 'A pointy tail on the left.', s: [L(92, 232, 40, 205, 55, 245, 95, 256)] },
    { t: 'Two thin legs with little feet.', s: [L(170, 302, 166, 346), L(205, 302, 209, 346), L(152, 350, 166, 346, 178, 352), L(196, 352, 209, 346, 222, 351)] },
    { t: 'A branch for it to sit on.', s: ['M50 354 L350 354'] },
  ]},
  { id: 'owl', n: 'Owl', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a big tall oval for the body.', s: [E(200, 230, 90, 120)] },
    { t: 'Two pointy feather tufts on top.', s: [L(140, 145, 130, 95, 170, 124), L(260, 145, 270, 95, 230, 124)] },
    { t: 'Two big circle eyes.', s: [C(165, 175, 30), C(235, 175, 30)] },
    { t: 'Dark pupils and a small triangle beak.', s: [dot(170, 178, 12), dot(230, 178, 12), Z(190, 205, 210, 205, 200, 228)] },
    { t: 'A circle belly with little "u" feathers.', s: [E(200, 288, 55, 52), 'M178 268 Q185 278 192 268', 'M208 268 Q215 278 222 268', 'M193 290 Q200 300 207 290', 'M178 310 Q185 320 192 310', 'M208 310 Q215 320 222 310'] },
    { t: 'A curved wing on each side.', s: ['M112 210 Q95 280 140 322', 'M288 210 Q305 280 260 322'] },
    { t: 'Little claws and a branch.', s: [L(166, 362, 175, 348, 184, 362), L(216, 362, 225, 348, 234, 362), L(80, 364, 320, 364)] },
  ]},
  { id: 'rabbit', n: 'Bunny', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a circle for the head.', s: [C(200, 190, 60)] },
    { t: 'Two long ovals for ears.', s: [E(170, 95, 18, 55), E(230, 95, 18, 55)] },
    { t: 'A thinner oval inside each ear.', s: [E(170, 100, 8, 36), E(230, 100, 8, 36)] },
    { t: 'Dot eyes and a little triangle nose.', s: [dot(178, 180, 7), dot(222, 180, 7), Z(192, 198, 208, 198, 200, 208)] },
    { t: 'A mouth and two whiskers on each side.', s: ['M200 208 Q193 221 184 217', 'M200 208 Q207 221 216 217', L(170, 203, 125, 196), L(170, 211, 125, 220), L(230, 203, 275, 196), L(230, 211, 275, 220)] },
    { t: 'A round body under the head.', s: [E(200, 312, 70, 65)] },
    { t: 'Two big oval feet and a fluffy round tail.', s: [E(160, 372, 28, 12), E(240, 372, 28, 12), C(278, 320, 14)] },
  ]},
  { id: 'turtle', n: 'Turtle', c: 'Animals', lv: 1, steps: [
    { t: 'Draw a half circle, like a hill, for the shell.', s: ['M100 260 A100 100 0 0 1 300 260 Z'] },
    { t: 'A thin band along the bottom of the shell.', s: [Z(90, 260, 310, 260, 304, 276, 96, 276)] },
    { t: 'A six-sided shape in the middle of the shell.', s: [Z(175, 200, 225, 200, 245, 228, 225, 255, 175, 255, 155, 228)] },
    { t: 'Lines from its corners out to the edge.', s: [L(175, 200, 155, 172), L(225, 200, 245, 172), L(155, 228, 104, 238), L(245, 228, 296, 238)] },
    { t: 'A circle head with an eye and a smile.', s: [C(330, 240, 28), dot(338, 232, 5), 'M328 252 Q340 260 352 250'] },
    { t: 'Two short legs.', s: ['M120 276 L120 300 Q135 312 150 300 L150 276', 'M250 276 L250 300 Q265 312 280 300 L280 276'] },
    { t: 'A tiny pointy tail.', s: [L(96, 266, 68, 274, 96, 272)] },

  { id: 'elephant', n: 'Elephant', c: 'Animals', lv: 2, steps: [
    { t: 'Draw a big wide oval for the body.', s: [E(215, 230, 110, 75)] },
    { t: 'A circle for the head on the left.', s: [C(110, 185, 55)] },
    { t: 'A big floppy ear on the head.', s: ['M120 150 Q178 138 176 200 Q172 252 126 236'] },
    { t: 'A long curly trunk going down.', s: ['M66 210 Q52 280 74 322 Q86 334 94 320 Q80 285 96 232'] },
    { t: 'A dot eye and a small tusk.', s: [dot(95, 172, 6), 'M98 236 Q112 256 132 248'] },
    { t: 'Four thick legs.', s: [R(135, 290, 32, 60), R(180, 295, 32, 55), R(248, 295, 32, 55), R(290, 285, 30, 65)] },
    { t: 'A thin tail with a tuft at the end.', s: ['M325 225 Q346 250 340 276', L(340, 276, 333, 292), L(340, 276, 349, 290)] },

/* Extra helpers for the second batch */
const G = d => ({ d, g: 1 });
const limb = (x1, y1, x2, y2, w) => {
  const cx = (x1 + x2) / 2, cy = (y1 + y2) / 2, len = Math.hypot(x2 - x1, y2 - y1);
  const rx = r1(len / 2 + w * 0.25), ry = r1(w / 2), a = Math.atan2(y2 - y1, x2 - x1);
  const deg = r1(a * 180 / Math.PI), c = Math.cos(a), s = Math.sin(a);
  const p1 = `${r1(cx - rx * c)} ${r1(cy - rx * s)}`, p2 = `${r1(cx + rx * c)} ${r1(cy + rx * s)}`;
  return `M${p1} A${rx} ${ry} ${deg} 0 0 ${p2} A${rx} ${ry} ${deg} 0 0 ${p1}`;
};
const coil = (x0, x1, y, b, n) => {
  const T = 2 * Math.PI * n, a = (x1 - x0 - 2 * b) / T, p = [], steps = n * 40;
  for (let i = 0; i <= steps; i++) {
    const t = T * i / steps;
    p.push(r1(x0 + b + a * t - b * Math.sin(t)), r1(y - b * Math.cos(t)));
  }
  return L(...p);
};
const flame = (x, y) => `M${x} ${y} Q${x - 9} ${y - 12} ${x} ${y - 28} Q${x + 9} ${y - 12} ${x} ${y}`;
const star = (cx, cy, r) => zig(cx, cy, r, r * 0.42, 5);
const plus = (x, y, s = 10) => [L(x - s, y, x + s, y), L(x, y - s, x, y + s)];

    { t: 'Ropes to the ground.', s: [L(122, 240, 60, 330), L(278, 240, 340, 330)] },
    { t: 'The ground.', s: [L(30, 320, 370, 320)] },
    { t: 'A campfire.', s: [L(320, 372, 352, 356), L(320, 356, 352, 372), 'M336 356 Q322 340 336 320 Q350 340 336 356'] },
  ]},
  { id: 'chest', n: 'Treasure chest', c: 'Things', lv: 2, steps: [
    { t: 'Draw a box.', s: [R(90, 200, 220, 130)] },
    { t: 'A curved lid on top.', s: ['M90 200 L90 160 Q200 100 310 160 L310 200'] },
    { t: 'Two straps down the box.', s: [R(125, 200, 20, 130), R(255, 200, 20, 130)] },
    { t: 'A lock with a keyhole.', s: [R(185, 188, 30, 35), dot(200, 202, 4), L(200, 202, 200, 214)] },
    { t: 'Gold coins on the ground.', s: [E(100, 342, 14, 6), E(126, 350, 14, 6), E(320, 345, 14, 6)] },
    { t: 'Sparkles.', s: [...plus(90, 120), ...plus(320, 110)] },
  ]},
  { id: 'anchor', n: 'Anchor', c: 'Things', lv: 2, steps: [
    { t: 'Draw a ring at the top.', s: [C(200, 70, 22)] },
    { t: 'A long rectangle down from the ring.', s: [R(190, 92, 20, 230)] },
    { t: 'A bar across near the top.', s: [RR(140, 130, 120, 16, 8)] },
    { t: 'A big curve at the bottom.', s: ['M90 250 Q110 340 200 345 Q290 340 310 250'] },
    { t: 'Pointy tips on both ends.', s: [L(90, 250, 72, 272, 105, 275), L(310, 250, 328, 272, 295, 275)] },
    { t: 'A rope through the ring.', s: ['M178 70 Q120 120 150 200 Q175 260 140 300'] },
  ]},
  { id: 'trophy', n: 'Trophy', c: 'Things', lv: 1, steps: [
    { t: 'Draw a cup: flat on top, round at the bottom.', s: ['M130 80 L270 80 Q270 210 200 220 Q130 210 130 80 Z'] },
    { t: 'Two handles.', s: ['M132 100 Q80 100 85 140 Q90 170 140 170', 'M268 100 Q320 100 315 140 Q310 170 260 170'] },
    { t: 'A short stem.', s: [R(188, 220, 24, 50)] },
    { t: 'A base in two steps.', s: [R(150, 270, 100, 25), R(135, 295, 130, 30)] },
    { t: 'A star on the cup.', s: [star(200, 140, 30)] },
  ]},
  { id: 'balloons', n: 'Balloons', c: 'Things', lv: 1, steps: [

    { t: 'One on the right.', s: [E(250, 130, 45, 58)] },
    { t: 'One in the middle, a bit lower.', s: [E(200, 190, 45, 58)] },
    { t: 'Little knots at the bottom.', s: [Z(150, 198, 143, 208, 157, 208), Z(250, 188, 243, 198, 257, 198), Z(200, 248, 193, 258, 207, 258)] },
    { t: 'Strings that meet at the bottom.', s: ['M150 208 Q160 280 200 360', 'M250 198 Q240 280 200 360', 'M200 258 Q190 310 200 360'] },
    { t: 'A bow where they meet.', s: [Z(200, 360, 182, 350, 182, 370), Z(200, 360, 218, 350, 218, 370)] },
    { t: 'Shiny spots.', s: ['M126 116 Q129 100 141 95', 'M226 106 Q229 90 241 85', 'M176 166 Q179 150 191 145'] },
  ]},
  { id: 'soccer', n: 'Soccer ball', c: 'Things', lv: 2, steps: [
    { t: 'Draw a big circle.', s: [C(200, 200, 120)] },
    { t: 'A dark five-sided shape in the middle.', s: [fill(Z(200, 160, 238, 188, 224, 232, 176, 232, 162, 188))] },
    { t: 'A line from each corner out toward the edge.', s: [L(200, 160, 200, 95), L(238, 188, 300, 168), L(224, 232, 262, 290), L(176, 232, 138, 290), L(162, 188, 100, 168)] },
    { t: 'Split each line into two, like a "Y".', s: [L(200, 95, 155, 89), L(200, 95, 245, 89), L(300, 168, 292, 123), L(300, 168, 320, 208), L(262, 290, 302, 264), L(262, 290, 229, 316), L(138, 290, 171, 316), L(138, 290, 98, 264), L(100, 168, 80, 208), L(100, 168, 108, 123)] },
  ]},
  { id: 'basketball', n: 'Basketball', c: 'Things', lv: 1, steps: [
    { t: 'Draw a big circle.', s: [C(200, 200, 110)] },
    { t: 'A line down and a line across.', s: [L(200, 90, 200, 310), L(90, 200, 310, 200)] },
    { t: 'Two curved lines on the sides.', s: ['M125 120 Q170 200 125 280', 'M275 120 Q230 200 275 280'] },
    { t: 'Lines to show it bouncing.', s: [L(40, 120, 70, 130), L(35, 160, 65, 165), L(150, 340, 250, 340)] },

];

LESSONS.push(...LESSONS2);

</script>
<script>
(function () {
  'use strict';
  var NS = 'http://www.w3.org/2000/svg';
  var CATS = ['All', 'Skills', 'Characters', 'Animals', 'Vehicles', 'Space', 'Nature', 'Food', 'Things', 'Fantasy'];
  var LEVEL = { 1: 'Easy', 2: 'Medium', 3: 'Challenge' };
  var TILT = ['-1.2deg', '0.8deg', '-0.4deg', '1.1deg', '-0.9deg', '0.5deg'];
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var state = { filter: 'All', lesson: null, step: 0, speed: 1, runId: 0 };
  var $ = function (id) { return document.getElementById(id); };

  /* ---------- Saved progress (stays on this device only) ---------- */
  function loadDone() {
    try { return JSON.parse(localStorage.getItem('drawwithme.done') || '[]'); } catch (e) { return []; }
  }
  function saveDone(id) {
    var d = loadDone();
    if (d.indexOf(id) === -1) d.push(id);
    try { localStorage.setItem('drawwithme.done', JSON.stringify(d)); } catch (e) { /* storage blocked: fine */ }
  }
  function loadSpeed() {
    try { var v = parseFloat(localStorage.getItem('drawwithme.speed')); return v > 0 ? v : 1; } catch (e) { return 1; }
  }
  function saveSpeed(v) { try { localStorage.setItem('drawwithme.speed', String(v)); } catch (e) {} }

  /* ---------- Shapes ---------- */
  function shapeD(sh) { return typeof sh === 'string' ? sh : sh.d; }
  function isFill(sh) { return typeof sh === 'object' && !!sh.f; }
  function isGuide(sh) { return typeof sh === 'object' && !!sh.g; }
  function allShapes(lesson) {
    var out = [];
    lesson.steps.forEach(function (st) { st.s.forEach(function (sh) { if (!isGuide(sh)) out.push(sh); }); });
    return out;
  }
  function hasGuides(lesson) {
    return lesson.steps.some(function (st) { return st.s.some(isGuide); });
  }
  function pathMarkup(shapes, color, width) {
    return shapes.map(function (sh) {
      return '<path d="' + shapeD(sh) + '" stroke="' + color + '" stroke-width="' + width + '" fill="' + (isFill(sh) ? color : 'none') + '"/>';
    }).join('');
  }
  function addPath(sh, color, width) {
    var p = document.createElementNS(NS, 'path');
    p.setAttribute('d', shapeD(sh));
    p.style.stroke = color;
    p.style.fill = isFill(sh) ? color : 'none';
    p.setAttribute('stroke-width', isGuide(sh) ? Math.min(width, 2.5) : width);
    if (isGuide(sh)) p.style.strokeDasharray = '7 9';
    $('layer').appendChild(p);
    return p;
  }

  /* ---------- Home ---------- */
  function renderChips() {
    var html = CATS.map(function (c) {
      var n = c === 'All' ? LESSONS.length : LESSONS.filter(function (l) { return l.c === c; }).length;
      return '<button class="chip" data-cat="' + c + '" aria-pressed="' + (state.filter === c) + '">' + c + '<span>' + n + '</span></button>';
    }).join('');
    $('chips').innerHTML = html;
  }
  function renderGrid() {
    var done = loadDone();
    var list = LESSONS.filter(function (l) { return state.filter === 'All' || l.c === state.filter; });
    $('grid').innerHTML = list.map(function (l, i) {
      return '<button class="card" data-id="' + l.id + '" style="--tilt:' + TILT[i % TILT.length] + '" aria-label="' + l.n + ', ' + LEVEL[l.lv] + ', ' + l.steps.length + ' steps">' +
        (done.indexOf(l.id) > -1 ? '<span class="done">Done</span>' : '') +
        '<svg viewBox="0 0 400 400" fill="none" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + pathMarkup(allShapes(l), '#2A2A2A', 6) + '</svg>' +
        '<span class="name">' + l.n + '</span>' +
        '<span class="meta">' + LEVEL[l.lv] + ', ' + l.steps.length + ' steps</span>' +
        '</button>';
    }).join('');
  }
  function showHome() {
    state.runId++;
    $('lesson').hidden = true;
    $('home').hidden = false;
    renderChips();
    renderGrid();
    window.scrollTo(0, 0);
  }

  /* ---------- Lesson ---------- */
  function openLesson(id) {
    var l = LESSONS.filter(function (x) { return x.id === id; })[0];
    if (!l) return;
    state.lesson = l;
    state.step = 0;
    $('home').hidden = true;
    $('lesson').hidden = false;
    $('title').textContent = l.n;
    window.scrollTo(0, 0);
    renderStep();
  }

  function renderPips() {
    var n = state.lesson.steps.length, html = '';
    for (var i = 1; i <= n; i++) {
      html += '<span class="pip ' + (i < state.step || state.step > n ? 'past' : i === state.step ? 'now' : '') + '"></span>';
    }
    $('pips').innerHTML = html;
  }

  function renderStep() {
    var l = state.lesson, n = l.steps.length, s = state.step;
    var id = ++state.runId;
    var layer = $('layer');
    layer.innerHTML = '';
    $('dot').setAttribute('opacity', '0');
    $('stage').classList.remove('cheer');
    renderPips();

    var intro = s === 0, finish = s > n;
    $('prev').disabled = intro;
    $('speedRow').hidden = intro || finish;
    $('legend').hidden = intro || finish;
    $('legendGuide').hidden = !hasGuides(l);
    $('again').hidden = intro;
    $('againLabel').textContent = finish ? 'Draw it again' : 'Watch again';

    if (intro) {
      $('counter').textContent = n + ' steps';
      allShapes(l).forEach(function (sh) { addPath(sh, 'var(--ghost)', 3); });
      $('say').textContent = 'This is what you will draw.';
      $('sub').textContent = 'Get a pencil and paper. Draw lightly at first, so mistakes are easy to rub out.';
      $('next').textContent = 'Start';
      return;
    }
    if (finish) {
      $('counter').textContent = 'Finished';
      allShapes(l).forEach(function (sh) { addPath(sh, 'var(--ink)', 3.5); });
      void $('stage').offsetWidth;
      $('stage').classList.add('cheer');
      var nm = l.n.toLowerCase();
      $('say').textContent = 'You drew ' + (/^[aeiou]/.test(nm) ? 'an ' : 'a ') + nm + '!';
      $('sub').textContent = 'Now go over your best lines darker, and color it in if you like.';
      $('next').textContent = 'Pick another drawing';
      saveDone(l.id);
      return;
    }

    $('counter').textContent = 'Step ' + s + ' of ' + n;
    $('say').textContent = l.steps[s - 1].t;
    $('sub').textContent = s === 1 ? 'Watch the orange line, then draw it on your paper. Tap the picture to watch again.' : '';
    $('next').textContent = s === n ? 'Finish' : 'Next step';

    var lastErase = -1;
    for (var j = 0; j < s; j++) { if (l.steps[j].erase) lastErase = j; }
    for (var i = 0; i < s - 1; i++) {
      l.steps[i].s.forEach(function (sh) {
        if (isGuide(sh) && lastErase > i) return;
        addPath(sh, 'var(--old)', 3);
      });
    }
    var shapes = l.steps[s - 1].s;
    var els = shapes.map(function (sh) { return addPath(sh, 'var(--new)', 4.5); });
    if (reduceMotion) return;

    els.forEach(function (el, k) {
      var len = el.getTotalLength();
      el.style.strokeDasharray = len + ' ' + len;
      el.style.strokeDashoffset = len;
      if (isFill(shapes[k])) el.style.fill = 'none';
    });
    animate(id, els, shapes, 0);
  }

  function animate(id, els, shapes, i) {
    var dot = $('dot');
    if (id !== state.runId) return;
    if (i >= els.length) { dot.setAttribute('opacity', '0'); return; }
    var el = els[i], len = el.getTotalLength(), p0 = el.getPointAtLength(0);
    dot.setAttribute('cx', p0.x);
    dot.setAttribute('cy', p0.y);
    dot.setAttribute('opacity', '1');
    var pause = (i === 0 ? 650 : 380) * state.speed;
    setTimeout(function () {
      if (id !== state.runId) return;
      var start = null, dur = Math.max(420, len * 6.5) * state.speed;
      function frame(now) {
        if (id !== state.runId) return;
        if (start === null) start = now;
        var k = Math.min(1, (now - start) / dur);
        el.style.strokeDashoffset = len * (1 - k);
        var q = el.getPointAtLength(len * k);
        dot.setAttribute('cx', q.x);
        dot.setAttribute('cy', q.y);
        if (k < 1) { requestAnimationFrame(frame); return; }
        el.style.strokeDasharray = isGuide(shapes[i]) ? '7 9' : '';
        el.style.strokeDashoffset = '';
        if (isFill(shapes[i])) el.style.fill = 'var(--new)';
        setTimeout(function () { animate(id, els, shapes, i + 1); }, 220 * state.speed);
      }
      requestAnimationFrame(frame);
    }, pause);
  }

  function go(delta) {
    var n = state.lesson.steps.length;
    state.step = Math.max(0, Math.min(n + 1, state.step + delta));
    renderStep();
  }

  /* ---------- Events ---------- */
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('.chip');
    if (!b) return;
    state.filter = b.getAttribute('data-cat');
    renderChips();
    renderGrid();
  });
  $('grid').addEventListener('click', function (e) {
    var c = e.target.closest('.card');
    if (c) openLesson(c.getAttribute('data-id'));
  });
  $('surprise').addEventListener('click', function () {
    var done = loadDone();
    var pool = LESSONS.filter(function (l) { return done.indexOf(l.id) === -1; });
    if (!pool.length) pool = LESSONS;
    openLesson(pool[Math.floor(Math.random() * pool.length)].id);
  });
  $('backHome').addEventListener('click', showHome);
  $('prev').addEventListener('click', function () { go(-1); });
  $('next').addEventListener('click', function () {
    if (state.step > state.lesson.steps.length) { showHome(); return; }
    go(1);
  });
  $('again').addEventListener('click', function () {
    if (state.step > state.lesson.steps.length) { state.step = 1; }
    renderStep();
  });
  $('stage').addEventListener('click', function () {
    var n = state.lesson.steps.length;
    if (state.step >= 1 && state.step <= n) renderStep();
  });
  $('speedRow').addEventListener('click', function (e) {
    var b = e.target.closest('button[data-speed]');
    if (!b) return;
    setSpeed(parseFloat(b.getAttribute('data-speed')));
    renderStep();
  });
  function setSpeed(v) {
    state.speed = v;
    saveSpeed(v);
    Array.prototype.forEach.call(document.querySelectorAll('#speedRow button'), function (x) {
      x.setAttribute('aria-pressed', String(parseFloat(x.getAttribute('data-speed')) === v));
    });
  }
  document.addEventListener('keydown', function (e) {
    if ($('lesson').hidden) return;
    if (e.key === 'ArrowRight' || e.key === 'Enter') { e.preventDefault(); $('next').click(); }
    else if (e.key === 'ArrowLeft') { e.preventDefault(); if (!$('prev').disabled) go(-1); }
    else if (e.key === ' ') { e.preventDefault(); $('again').click(); }
    else if (e.key === 'Escape') { showHome(); }
  });

  setSpeed(loadSpeed());
  showHome();
})();
</script>
